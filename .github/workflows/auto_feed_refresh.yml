name: Auto-Feed Live Refresh

# Holt die von auto_feed_discovery.yml akzeptierten Feeds regelmaessig neu.
# Der Report Generator triggert diesen Workflow stuendlich; der 02:15-UTC-Cron
# bleibt als unabhaengiger Fallback. Wichtig: Dieser Workflow schreibt NICHT in
# seen_db. Er erzeugt einen separaten SQLite-Snapshot mit (entry, feed), damit
# Combined die ORIGINALEN Feed-Namen und damit today_count/Admission-Semantik
# beibehaelt. Proxy/Bot/Crawler/Scanner-Feeds bleiben bei update_bot_detector.

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: netshield-auto-feed-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Restore vorherigen Auto-Feed Snapshot
        id: restore_auto_snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/auto_feed_daily.sqlite3
          key: netshield-auto-feed-daily-v1-${{ github.run_id }}
          restore-keys: |
            netshield-auto-feed-daily-v1-

      - name: defusedxml sicherstellen
        run: |
          pip install --quiet --disable-pip-version-check --break-system-packages defusedxml==0.7.1 2>/dev/null \
            || pip install --quiet --disable-pip-version-check defusedxml==0.7.1

      - name: Auto-Feeds laden und Snapshot bauen
        id: refresh
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 << 'PY'
          import hashlib
          import json
          import os
          import sqlite3
          import sys
          import time
          import tempfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          sys.path.insert(0, "scripts")
          from netshield_common import (
              fetch_url,
              is_bot_detector_feed_name,
              is_in_fp_set,
              is_whitelisted,
              load_fp_set,
              load_whitelist,
              parse_feed_entries,
              validate_auto_feeds,
              write_text_atomic,
          )

          REGISTRY = "state/auto_discovered_feeds.json"
          SNAPSHOT = "state/auto_feed_daily.sqlite3"
          NEXT = "state/auto_feed_daily.next.sqlite3"
          OUT_FILE = "auto_feed_blacklist_ipv4.txt"  # nur Kompatibilitaet/Einblick; Combined liest SQLite
          REPORT = "reports/auto_feed_blacklist_report.md"
          MAX_WORKERS = 12
          MIN_UNIQUE = 50_000
          MIN_FEED_SUCCESS_RATIO = 0.50

          load_whitelist()
          load_fp_set()

          if not os.path.exists(REGISTRY):
              raise RuntimeError(f"{REGISTRY} fehlt - kein sicherer Refresh moeglich")
          registry_bytes = open(REGISTRY, "rb").read()
          registry_sha = hashlib.sha256(registry_bytes).hexdigest()
          data = json.loads(registry_bytes.decode("utf-8"))
          feeds, rejected = validate_auto_feeds(data)
          if rejected:
              print(f"WARN: {rejected} Registry-Eintraege wegen Schema/URL verworfen")

          selected = []
          proxy_excluded = []
          iblock_excluded = []
          for f in feeds:
              name = f["name"]
              if "iblocklist" in name.lower():
                  iblock_excluded.append(name)
                  continue
              if is_bot_detector_feed_name(name, f.get("file", "")):
                  proxy_excluded.append(name)
                  continue
              selected.append(f)
          if not selected:
              raise RuntimeError("0 verwertbare Auto-Feeds nach Filterung")

          os.makedirs("state", exist_ok=True)
          os.makedirs("reports", exist_ok=True)
          try:
              os.remove(NEXT)
          except FileNotFoundError:
              pass

          new = sqlite3.connect(NEXT)
          new.execute("PRAGMA journal_mode=TRUNCATE")
          new.execute("PRAGMA synchronous=NORMAL")
          new.execute("PRAGMA temp_store=FILE")
          new.execute("CREATE TABLE hits(entry TEXT NOT NULL, feed TEXT NOT NULL, PRIMARY KEY(entry,feed)) WITHOUT ROWID")
          new.execute("CREATE TABLE meta(key TEXT PRIMARY KEY, value TEXT NOT NULL) WITHOUT ROWID")
          new.execute("CREATE TABLE feed_stats(feed TEXT PRIMARY KEY, entries INTEGER NOT NULL, status TEXT NOT NULL) WITHOUT ROWID")

          prev_attached = False
          if os.path.exists(SNAPSHOT):
              try:
                  chk = sqlite3.connect(f"file:{SNAPSHOT}?mode=ro", uri=True)
                  q = chk.execute("PRAGMA quick_check").fetchone()
                  has_hits = chk.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='hits'").fetchone()
                  chk.close()
                  if q and q[0] == "ok" and has_hits:
                      new.execute("ATTACH DATABASE ? AS prev", (os.path.abspath(SNAPSHOT),))
                      prev_attached = True
                      print("Vorheriger Auto-Feed Snapshot gueltig - Fehlerfeeds werden daraus konservativ erhalten")
                  else:
                      print("WARN: vorheriger Auto-Feed Snapshot ungueltig - kein Feed-Fallback")
              except Exception as e:
                  print(f"WARN: vorheriger Snapshot nicht nutzbar: {e}")

          def fetch_one(feed):
              name, url = feed["name"], feed["url"]
              text = fetch_url(url, timeout=22, retries=2, user_agent="NETSHIELD/3.0")
              if text is None:
                  return name, None, "fetch_failed"
              entries = parse_feed_entries(text, source_hint=url, use_protected_check=True)
              entries = {e for e in entries if not is_in_fp_set(e) and not is_whitelisted(e)}
              if not entries:
                  return name, None, "zero_entries"
              return name, entries, "ok"

          results = {}
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as ex:
              futs = {ex.submit(fetch_one, f): f["name"] for f in selected}
              for fut in as_completed(futs):
                  name = futs[fut]
                  try:
                      n, entries, status = fut.result()
                  except Exception as e:
                      n, entries, status = name, None, f"exception:{type(e).__name__}"
                  results[n] = (entries, status)
                  if entries is not None:
                      print(f"OK  {n}: {len(entries):,} Eintraege")
                  else:
                      print(f"WARN {n}: {status}")

          ok_feeds = 0
          fallback_feeds = 0
          failed_without_fallback = []
          for f in selected:
              name = f["name"]
              entries, status = results.get(name, (None, "missing_result"))
              if entries is not None:
                  new.executemany("INSERT OR IGNORE INTO hits(entry,feed) VALUES (?,?)", ((e, name) for e in entries))
                  new.execute("INSERT OR REPLACE INTO feed_stats(feed,entries,status) VALUES (?,?,?)", (name, len(entries), "ok"))
                  ok_feeds += 1
              elif prev_attached:
                  try:
                      cnt = new.execute("SELECT COUNT(*) FROM prev.hits WHERE feed=?", (name,)).fetchone()[0]
                  except sqlite3.Error:
                      cnt = 0
                  if cnt:
                      new.execute("INSERT OR IGNORE INTO hits(entry,feed) SELECT entry,feed FROM prev.hits WHERE feed=?", (name,))
                      new.execute("INSERT OR REPLACE INTO feed_stats(feed,entries,status) VALUES (?,?,?)", (name, cnt, "fallback_previous"))
                      fallback_feeds += 1
                      continue
                  failed_without_fallback.append(name)
                  new.execute("INSERT OR REPLACE INTO feed_stats(feed,entries,status) VALUES (?,?,?)", (name, 0, status))
              else:
                  failed_without_fallback.append(name)
                  new.execute("INSERT OR REPLACE INTO feed_stats(feed,entries,status) VALUES (?,?,?)", (name, 0, status))

          new.commit()
          hit_count = new.execute("SELECT COUNT(*) FROM hits").fetchone()[0]
          unique_count = new.execute("SELECT COUNT(DISTINCT entry) FROM hits").fetchone()[0]
          active_feed_count = new.execute("SELECT COUNT(DISTINCT feed) FROM hits").fetchone()[0]
          success_ratio = ok_feeds / max(1, len(selected))

          if unique_count < MIN_UNIQUE:
              raise RuntimeError(f"Leerungsschutz: nur {unique_count:,} eindeutige Eintraege (<{MIN_UNIQUE:,})")
          if success_ratio < MIN_FEED_SUCCESS_RATIO and not prev_attached:
              raise RuntimeError(f"Zu wenige erfolgreiche Feeds: {ok_feeds}/{len(selected)} ({success_ratio:.1%})")

          now_epoch = int(time.time())
          now_berlin = datetime.now(timezone.utc).astimezone(ZoneInfo("Europe/Berlin"))
          meta = {
              "generated_at_epoch": str(now_epoch),
              "generated_at": now_berlin.isoformat(),
              "registry_sha256": registry_sha,
              "selected_feeds": str(len(selected)),
              "successful_feeds": str(ok_feeds),
              "fallback_feeds": str(fallback_feeds),
              "active_feed_count": str(active_feed_count),
              "hit_count": str(hit_count),
              "unique_count": str(unique_count),
              "format_version": "1",
          }
          new.executemany("INSERT OR REPLACE INTO meta(key,value) VALUES (?,?)", meta.items())
          new.commit()

          # Delta gegen vorherigen Snapshot ohne Millionen-Eintraege in Python zu materialisieren.
          added = removed = None
          if prev_attached:
              try:
                  added = new.execute("SELECT COUNT(*) FROM (SELECT entry FROM hits EXCEPT SELECT entry FROM prev.hits)").fetchone()[0]
                  removed = new.execute("SELECT COUNT(*) FROM (SELECT entry FROM prev.hits EXCEPT SELECT entry FROM hits)").fetchone()[0]
              except sqlite3.Error as e:
                  print(f"WARN: Delta gegen vorherigen Snapshot nicht berechenbar: {e}")
              new.execute("DETACH DATABASE prev")
          new.close()

          os.replace(NEXT, SNAPSHOT)

          # Sichtbare Kompatibilitaetsliste. Combined liest diese Datei NICHT mehr als Feed,
          # damit 5 Auto-Feeds auch weiterhin als 5 Feed-Treffer zaehlen.
          ro = sqlite3.connect(f"file:{SNAPSHOT}?mode=ro", uri=True)
          _out_dir = os.path.dirname(OUT_FILE) or "."
          with tempfile.NamedTemporaryFile("w", encoding="utf-8", newline="\n",
                                           dir=_out_dir, prefix=".auto_feed_",
                                           suffix=".tmp", delete=False) as out:
              tmp = out.name
              out.write("# NETSHIELD Auto-Feed Blacklist (Kompatibilitaetsansicht)\n")
              out.write(f"# Aktualisiert: {now_berlin.strftime('%Y-%m-%d %H:%M %Z')} (Europe/Berlin)\n")
              out.write(f"# Eindeutige Eintraege: {unique_count} | Feed-Treffer: {hit_count} | Quellen: {active_feed_count}\n")
              out.write("# HINWEIS: Combined nutzt state/auto_feed_daily.sqlite3 aus separatem Actions Cache, nicht diese aggregierte Datei.\n\n")
              for (entry,) in ro.execute("SELECT DISTINCT entry FROM hits ORDER BY entry"):
                  out.write(entry + "\n")
              out.flush()
              os.fsync(out.fileno())
          ro.close()
          os.replace(tmp, OUT_FILE)

          lines = [
              "# Auto-Feed Live Refresh – Report", "",
              f"**Aktualisiert:** {now_berlin.strftime('%Y-%m-%d %H:%M %Z')} (Europe/Berlin)", "",
              "| Metrik | Wert |", "|---|---:|",
              f"| Registry-Feeds ausgewaehlt | {len(selected):,} |",
              f"| Erfolgreich frisch geladen | {ok_feeds:,} |",
              f"| Aus vorherigem Snapshot erhalten | {fallback_feeds:,} |",
              f"| Ohne Daten/Fallback | {len(failed_without_fallback):,} |",
              f"| Proxy/Bot/Scanner ausgeschlossen | {len(proxy_excluded):,} |",
              f"| I-BlockList ausgeschlossen | {len(iblock_excluded):,} |",
              f"| Feed-Treffer (IP/CIDR × Feed) | {hit_count:,} |",
              f"| Eindeutige IP/CIDR-Eintraege | {unique_count:,} |",
              f"| Neu ggü. vorherigem Snapshot | {('n/a' if added is None else f'{added:,}')} |",
              f"| Entfernt ggü. vorherigem Snapshot | {('n/a' if removed is None else f'{removed:,}')} |",
              "",
              "**Semantik:** Der Snapshot behaelt jeden originalen Feed-Namen. Eine IP in fünf Auto-Feeds wird in Combined weiterhin als fünf Feed-Treffer verarbeitet.",
              "",
          ]
          if failed_without_fallback:
              lines += ["## Feeds ohne aktuelle oder vorherige Daten", "", ", ".join(f"`{x}`" for x in sorted(failed_without_fallback)), ""]
          write_text_atomic(REPORT, "\n".join(lines))
          print(f"Snapshot fertig: {unique_count:,} unique / {hit_count:,} Hits / {active_feed_count} Feeds")
          PY

      - name: Validiere Auto-Feed Snapshot
        if: steps.refresh.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import sqlite3, time
          p='state/auto_feed_daily.sqlite3'
          c=sqlite3.connect(f'file:{p}?mode=ro', uri=True)
          q=c.execute('PRAGMA quick_check').fetchone()
          n=c.execute('SELECT COUNT(*) FROM hits').fetchone()[0]
          u=c.execute('SELECT COUNT(DISTINCT entry) FROM hits').fetchone()[0]
          ts=int(c.execute("SELECT value FROM meta WHERE key='generated_at_epoch'").fetchone()[0])
          c.close()
          assert q and q[0]=='ok', q
          assert n >= 50000 and u >= 50000, (n,u)
          assert 0 <= time.time()-ts <= 3600, time.time()-ts
          print(f'Auto-Feed Snapshot validiert: {u:,} unique / {n:,} Feed-Treffer')
          PY

      - name: Save Auto-Feed Snapshot Cache
        if: steps.refresh.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/auto_feed_daily.sqlite3
          key: netshield-auto-feed-daily-v1-${{ github.run_id }}

      - name: Commit Report und Kompatibilitaetsliste
        if: steps.refresh.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auto_feed_blacklist_ipv4.txt reports/auto_feed_blacklist_report.md
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git commit -m "Auto-Feed Live Refresh: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git stash --include-untracked 2>/dev/null || true
            if git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              git stash pop 2>/dev/null || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Push erfolgreich (Versuch $attempt)"
                exit 0
              fi
            else
              git stash pop 2>/dev/null || true
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 3))
          done
          echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
          exit 1
