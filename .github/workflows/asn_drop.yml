name: ASN-DROP

# Taeglich: Spamhaus ASN-DROP (kriminelle / Bulletproof-Netzbetreiber) holen,
# ueber ipverse/as-ip-blocks in IP-Netze aufloesen und als
# asn_drop_ipv4.txt / asn_drop_ipv6.txt / asn_drop_asns.txt committen.
# ipverse aktualisiert gegen ~02:30 UTC, daher Lauf danach.
# Zweiter Cron-Slot als Backup, falls GitHub den ersten verwirft.
on:
  schedule:
    - cron: '15 4 * * *'
    - cron: '15 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: none
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  asn-drop:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: ASN-DROP holen und aufloesen
        run: |
          mkdir -p asn
          python3 -I scripts/asn_drop_build.py asn

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Umzug in den Unterordner asn/: alte Dateien im Hauptverzeichnis entfernen (idempotent)
          git rm -q --ignore-unmatch asn_drop_ipv4.txt asn_drop_ipv6.txt asn_drop_asns.txt
          git add asn/asn_drop_ipv4.txt asn/asn_drop_ipv6.txt asn/asn_drop_asns.txt
          # Nur committen, wenn sich ausser der Zeitstempel-Zeile etwas geaendert hat
          if git diff --staged --quiet || [ -z "$(git diff --staged --no-renames -U0 | grep -E '^[+-][^#+-]')" ]; then
            echo "Keine inhaltlichen Aenderungen"
            git reset -q
            exit 0
          fi
          git commit -m "ASN-DROP: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}" && git rebase -X theirs "origin/${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && { echo "Push erfolgreich (Versuch $attempt)"; exit 0; }
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
          exit 1
