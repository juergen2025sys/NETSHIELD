name: Sefinek Trusted-IPs Whitelist Sync

on:
  schedule:
    # Taeglich 09:12 UTC – bewusst abseits der bestehenden Slot-Cluster
    # (honigtopf :15, netshield_report_generator :30, update_combined
    # :07/:27/:47, watchdog_honigtopf :07/:22/:37/:52, watchdog_combined
    # */15). Kein bekannter Konflikt mit einem anderen Workflow.
    - cron: '12 9 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sefinek-whitelist-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Fetch + Merge Sefinek Trusted-IPs Whitelist
        run: |
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import write_json_atomic, write_text_atomic

          import urllib.request
          import urllib.error
          import ipaddress
          import json
          import os
          import sys
          import time
          from datetime import datetime, timezone

          now     = datetime.now(timezone.utc)
          now_str = now.strftime("%Y-%m-%d %H:%M UTC")

          # Quelle: sefinek/trusted-ips-whitelist (GitHub, aktiv gepflegt).
          # Enthaelt bekannte "sichere" IPs/CIDRs (Crawler, CDNs, Cloud-Provider
          # etc.), die NIE geblockt werden sollen. Anderer Zweck/anderes Repo
          # als das bereits genutzte sefinek/Malicious-IP-Addresses (Blacklist).
          SOURCE_URL     = "https://raw.githubusercontent.com/sefinek/trusted-ips-whitelist/refs/heads/main/lists/all-safe-ips.txt"
          CACHE_FILE     = "state/sefinek_whitelist_cache.json"
          REPORT_FILE    = "reports/sefinek_whitelist_sync_report.md"
          WHITELIST_FILE = ".github/workflows/whitelist.json"

          def fetch(url, retries=3):
              for attempt in range(1, retries + 1):
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "NETSHIELD-SefinekWhitelistSync/1.0",
                      "Accept":     "text/plain",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          raw = r.read()
                          print(f"  HTTP {r.status} | bytes={len(raw)}")
                          return raw.decode("utf-8", errors="replace")
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504) and attempt < retries:
                          wait_s = 2 ** attempt
                          print(f"  HTTP {e.code} - Retry in {wait_s}s ({attempt}/{retries})")
                          time.sleep(wait_s)
                          continue
                      print(f"  HTTP {e.code}: {e.reason}")
                      return None
                  except Exception as e:
                      if attempt < retries:
                          wait_s = 2 ** attempt
                          print(f"  FEHLER: {e} - Retry in {wait_s}s ({attempt}/{retries})")
                          time.sleep(wait_s)
                          continue
                      print(f"  FEHLER: {e}")
                      return None

          def is_valid_entry(line):
              # Akzeptiert einzelne IPv4/IPv6-Adressen UND CIDR-Netze - exakt
              # dieselbe Validierung wie load_whitelist() in netshield_common.py
              # (ipaddress.ip_network mit strict=False), damit nichts gemerged
              # wird, was load_whitelist() beim naechsten Lauf ohnehin verwerfen
              # wuerde.
              try:
                  ipaddress.ip_network(line, strict=False)
                  return True
              except ValueError:
                  return False

          # ── 1) Abrufen ──────────────────────────────────────────────────
          print(f"[1/4] Abruf {SOURCE_URL} ...")
          text = fetch(SOURCE_URL)
          if not text:
              print("FEHLER: Kein Response-Text erhalten - Abbruch")
              sys.exit(1)

          raw_lines = [l.strip() for l in text.splitlines()]
          raw_lines = [l for l in raw_lines if l and not l.startswith("#")]
          print(f"  -> {len(raw_lines)} Rohzeilen")

          # ── 2) Validieren ───────────────────────────────────────────────
          print("\n[2/4] Validieren...")
          sefinek_new = sorted(set(l for l in raw_lines if is_valid_entry(l)))
          invalid     = len(raw_lines) - len(sefinek_new)
          if invalid:
              print(f"  Ungueltige/nicht-parsbare Zeilen verworfen: {invalid}")
          print(f"  -> {len(sefinek_new)} gueltige Eintraege")

          # ── Leerungsschutz ──────────────────────────────────────────────
          # Screenshot-Referenz (05.07.2026): ~16985 Zeilen. Bricht der Fetch
          # ab oder liefert die Quelle nur noch einen Bruchteil, wird NICHTS
          # committet - weder Cache noch whitelist.json aendern sich.
          MIN_ENTRIES = 5000
          if len(sefinek_new) < MIN_ENTRIES:
              msg = f"Nur {len(sefinek_new)} gueltige Eintraege (< {MIN_ENTRIES}) - Abbruch, keine Aenderung"
              print(f"::warning file=sync_sefinek_whitelist.yml::{msg}")
              print(f"WARNUNG: {msg}")
              sys.exit(1)

          # ── 3) Reversibles Merge in whitelist.json ────────────────────────
          # Provenienz-Problem: Ohne Tracking wuerde ein reines Additiv-Merge
          # IPs fuer immer whitelisten, auch wenn sefinek sie spaeter wieder
          # entfernt (z.B. IP-Range neu zugewiesen) - Sicherheitsrisiko bei
          # einer "nie blocken"-Liste. Loesung: Cache-Datei speichert den
          # sefinek-Snapshot des LETZTEN Laufs (sefinek_old). Alles in der
          # aktuellen whitelist.json, das NICHT in sefinek_old stand, gilt als
          # manuell/anderweitig gepflegt und wird nie angetastet. Die neue
          # whitelist.json = manuell_gepflegt ∪ sefinek_new.
          print("\n[3/4] Merge in whitelist.json...")

          sefinek_old = set()
          if os.path.exists(CACHE_FILE):
              try:
                  with open(CACHE_FILE, encoding="utf-8") as f:
                      sefinek_old = set(json.load(f).get("entries", []))
              except Exception as e:
                  print(f"  WARNUNG: Cache nicht lesbar ({e}) - behandle als leer (Erstlauf-Fallback)")

          with open(WHITELIST_FILE, encoding="utf-8") as f:
              current_whitelist = json.load(f)
          current_entries = set(current_whitelist.get("entries", []))

          manual_entries  = current_entries - sefinek_old
          sefinek_added   = set(sefinek_new) - current_entries
          sefinek_removed = sefinek_old - set(sefinek_new)
          # ...aber nur entfernen, was tatsaechlich noch dem letzten sefinek-
          # Snapshot zugeordnet war UND aktuell in whitelist.json steht:
          sefinek_removed &= current_entries

          merged_entries = sorted(manual_entries | set(sefinek_new))

          print(f"  Aktuell in whitelist.json:       {len(current_entries)}")
          print(f"  Davon manuell/anderweitig:       {len(manual_entries)}")
          print(f"  Sefinek zuvor (Cache):            {len(sefinek_old)}")
          print(f"  Sefinek neu (Fetch):              {len(sefinek_new)}")
          print(f"  + Neu von sefinek hinzugefuegt:   {len(sefinek_added)}")
          print(f"  - Von sefinek entfernt (stale):   {len(sefinek_removed)}")
          print(f"  = whitelist.json nach Merge:      {len(merged_entries)}")

          # Sicherheitsnetz: load_whitelist() in netshield_common.py verlangt
          # min_entries=50 - das pruefen wir hier vorab, damit ein fehlerhafter
          # Merge nicht erst beim naechsten Aufruf eines der 9+ Workflows,
          # die load_whitelist()/is_whitelisted() nutzen, auffliegt.
          MIN_WHITELIST_ENTRIES = 50
          if len(merged_entries) < MIN_WHITELIST_ENTRIES:
              msg = (f"Merge-Ergebnis nur {len(merged_entries)} Eintraege "
                     f"(< {MIN_WHITELIST_ENTRIES}) - load_whitelist() wuerde "
                     f"das ablehnen. Abbruch, keine Aenderung.")
              print(f"::error ::{msg}")
              sys.exit(1)

          current_whitelist["_description"] = (
              f"NETSHIELD Whitelist – IPs/CIDRs die NIE auf die Blacklist kommen. "
              f"{len(merged_entries)} Eintraege gesamt "
              f"({len(manual_entries)} manuell/anderweitig kuratiert, "
              f"{len(sefinek_new)} automatisch synchronisiert von "
              f"sefinek/trusted-ips-whitelist, Stand {now_str})."
          )
          current_whitelist["entries"] = merged_entries

          write_json_atomic(WHITELIST_FILE, current_whitelist, indent=2)
          print(f"  {WHITELIST_FILE} geschrieben: {len(merged_entries)} Eintraege")

          # ── 4) Cache + Report schreiben ────────────────────────────────────
          print("\n[4/4] Cache + Report schreiben...")
          write_json_atomic(CACHE_FILE, {
              "_description": "Snapshot des zuletzt erfolgreich gefetchten "
                               "sefinek/trusted-ips-whitelist-Feeds. Dient als "
                               "Provenienz-Referenz fuer den naechsten Sync-Lauf "
                               "(sync_sefinek_whitelist.yml), damit von sefinek "
                               "entfernte IPs auch bei uns wieder aus "
                               "whitelist.json entfernt werden koennen, ohne "
                               "manuell gepflegte Eintraege zu beruehren.",
              "source":  SOURCE_URL,
              "updated": now_str,
              "count":   len(sefinek_new),
              "entries": sefinek_new,
          }, indent=None, separators=(",", ":"))
          print(f"  {CACHE_FILE}: {len(sefinek_new)} Eintraege geschrieben")

          report_lines = [
              "# Sefinek Trusted-IPs Whitelist Sync - Report",
              f"**Aktualisiert:** {now_str}  ",
              f"**Quelle:** [{SOURCE_URL}]({SOURCE_URL})  ",
              "",
              "---",
              "| Metrik | Wert |",
              "|---|---:|",
              f"| Rohzeilen (Fetch) | **{len(raw_lines):,}** |",
              f"| Ungueltig verworfen | **{invalid:,}** |",
              f"| Sefinek-Eintraege (neu) | **{len(sefinek_new):,}** |",
              f"| + neu hinzugefuegt | **+{len(sefinek_added):,}** |",
              f"| - als stale entfernt | **-{len(sefinek_removed):,}** |",
              f"| Manuell/anderweitig (unberuehrt) | **{len(manual_entries):,}** |",
              f"| **whitelist.json gesamt (nach Merge)** | **{len(merged_entries):,}** |",
              "",
              "---",
              "> whitelist.json wird direkt gemerged (additiv + reversibel ueber",
              "> Provenienz-Tracking im Cache). Manuell gepflegte Eintraege",
              "> werden dabei nie angetastet, nur der sefinek-Anteil wird bei",
              "> jedem Lauf 1:1 auf den aktuellen Feed-Stand gebracht.",
              f"\n---\n*Generiert: {now_str}*",
          ]
          write_text_atomic(REPORT_FILE, "\n".join(report_lines))
          print(f"  {REPORT_FILE} geschrieben")
          print(f"\nFERTIG: whitelist.json hat jetzt {len(merged_entries)} Eintraege")
          EOF

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/whitelist.json state/sefinek_whitelist_cache.json reports/sefinek_whitelist_sync_report.md
          if git diff --staged --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "Sefinek Whitelist Sync: $(date -u '+%Y-%m-%d %H:%M') UTC"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs .github/workflows/whitelist.json state/sefinek_whitelist_cache.json reports/sefinek_whitelist_sync_report.md 2>/dev/null || true
                git add .github/workflows/whitelist.json state/sefinek_whitelist_cache.json reports/sefinek_whitelist_sync_report.md 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi
