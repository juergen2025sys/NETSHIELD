name: IP-Ablauf

# ============================================================================
# FIX 2026-08-23 (Nutzerwunsch "alles in einer Datei"): Zusammengeführt aus
# den vorherigen Dateien seen_db_expiry_forecast.yml und
# ip_ablauf_verifikation.yml. Bewusst weiterhin ZWEI GETRENNTE JOBS mit
# eigenem Zeitplan statt einem gemeinsamen Lauf - Grund: unterschiedliche
# Kosten und Taktung waeren sonst nicht vereinbar:
#   - "prognose" braucht das komplette seen_db.json (~9,3 Mio. Eintraege,
#     Cache/Release-Backup-Restore) - das 8x/Tag zu laden waere unnoetig
#     teuer, woechentlich reicht fuer eine Vorschau voellig.
#   - "verifikation" braucht NUR die paar bereits committeten Kleindateien
#     (keine seen_db.json noetig) und soll bewusst haeufig laufen (alle 3h),
#     damit ein Rueckfall (siehe unten) schnell auffaellt - auf woechentlich
#     runterzubremsen wuerde genau den Zweck des Checks untergraben.
# Ein gemeinsamer Job/Trigger haette also entweder unnoetige Kosten (Job 1
# 8x/Tag) oder verzoegerte Fehlererkennung (Job 2 nur 1x/Woche) bedeutet -
# stattdessen: eine Datei, zwei Jobs, jeder mit seinem eigenen Rhythmus.
#
# ── Job "prognose" ──────────────────────────────────────────────────────
# Liest seen_db.json und erstellt eine Prognose, wie viele IPs in den
# naechsten Zeitfenstern aus der Blockliste fallen:
#   - "active"-Eintraege (last = echtes Datum): 180-Tage-Expiry
#     (EXPIRY_DAYS in update_combined_blacklist.yml)
#   - "watchlist"-Eintraege (last = Sentinel "2000-01-01", first-basiert):
#     30-Tage-Expiry (WATCHLIST_EXPIRY_DAYS in update_combined_blacklist.yml)
# Reine Lesepruefung - schreibt NICHTS in seen_db.json selbst, nur einen
# Report. Beantwortet Fragen wie "wieviele IPs verlieren am 4.9. ihre
# Bestaetigung" datenbasiert statt aus Vermutung.
#
# ── Job "verifikation" ──────────────────────────────────────────────────
# Prueft, ob der FIX CHURN-WATCHLIST / FIX CHURN-ACTIVE in
# update_combined_blacklist.yml tatsaechlich haelt, was er verspricht: IPs,
# die einmal ohne Zweitbestaetigung abgelaufen sind (und deshalb in
# state/watchlist_expired_history.json bzw. state/active_expired_history.json
# mit ihrem eingefrorenen first/last-Datum stehen), duerfen NIE WIEDER in
# einer aktuellen Output-Datei auftauchen. Genau DAS war der Bug vor dem Fix
# (Loeschung -> Wiederauftauchen Stunden spaeter mit zurueckgesetzter Uhr).
# Schreibt reports/ip_ablauf_verifikation_report.md + reports/ip_ablauf_
# verifikation_report.zip (fester Pfad, ueberschreibt sich selbst - siehe
# Kommentare im Job) sowie state/ip_ablauf_verifikation_verlauf.json als
# 30-Tage-Zyklus-Zeitreihe (Reset alle 30 Tage, kein endloses Wachstum).
# ============================================================================

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'    # woechentlich Montags 06:30 UTC - Job "prognose"
    - cron: '55 */3 * * *'  # alle 3h, 55min nach Combined - Job "verifikation"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # JOB 1: Prognose (vorher seen_db_expiry_forecast.yml)
  # ══════════════════════════════════════════════════════════════════════
  prognose:
    # Laeuft bei manuellem Dispatch IMMER, per Cron NUR beim woechentlichen
    # Slot - sonst wuerde dieser teure Job auch bei jedem 3h-Verifikations-
    # Trigger unnoetig mitlaufen.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DIAGNOSE 5 (2026-08-23, Nutzerwunsch "was fehlt noch zur Diagnose"):
    # issues:write ergaenzt - analog zum Job "verifikation", fuer den
    # Alarm-Mechanismus weiter unten (deckt sowohl fehlendes seen_db.json/
    # Cache/Backup als auch die Ledger-Konsistenzpruefung ab).
    permissions:
      contents: write
      issues: write
    concurrency:
      group: netshield-seen-db-writers
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Restore seen_db Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: seen_db.json
          key: netshield-seen-db-v2-${{ github.run_id }}
          restore-keys: |
            netshield-seen-db-v2-
            netshield-seen-db-v1-
            netshield-seen-db-

      - name: Restore seen_db Backup from GitHub Release (falls Cache leer)
        if: hashFiles('seen_db.json') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p state
          if gh release download seen-db-backup \
              --repo "${{ github.repository }}" \
              --pattern "seen_db_backup.json.gz.part*" \
              --dir state/ 2>/dev/null; then
            COUNT=$(ls state/seen_db_backup.json.gz.part* 2>/dev/null | wc -l | tr -d ' ')
            echo "seen_db Backup von Release geladen: ${COUNT} Part(s)"
            cat state/seen_db_backup.json.gz.part* > state/seen_db_backup.json.gz
            gzip -dc state/seen_db_backup.json.gz > seen_db.json
            echo "seen_db.json aus Release-Backup entpackt: $(du -h seen_db.json | cut -f1)"
          else
            echo "::error::Weder Cache noch Release-Backup verfuegbar - kein seen_db.json zum Auswerten."
            exit 1
          fi

      - name: Expiry-Prognose erstellen
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 << 'EOF'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from netshield_common import write_text_atomic
          from datetime import datetime, timezone, timedelta, date
          from zoneinfo import ZoneInfo

          DB_FILE     = "seen_db.json"
          REPORT_FILE = "reports/ip_ablauf.md"
          # Werte aus update_combined_blacklist.yml uebernommen (dort die
          # tatsaechliche Quelle der Wahrheit - hier nur gespiegelt, damit
          # die Prognose exakt zu deren Ablauflogik passt).
          EXPIRY_DAYS           = 180
          WATCHLIST_EXPIRY_DAYS = 30
          now = datetime.now(timezone.utc)
          now_str = (
              now.astimezone(ZoneInfo("Europe/Berlin"))
              .strftime("%Y-%m-%d %H:%M %Z") + " (Europe/Berlin)"
          )
          today = now.date()

          if not os.path.exists(DB_FILE):
              msg = "seen_db.json nicht vorhanden - kein Cache/Release-Backup verfuegbar."
              print(f"::error::{msg}")
              write_text_atomic(REPORT_FILE,
                  f"# Seen-DB Expiry Forecast\n\n*{msg}*\n\n*Lauf: {now_str}*\n")
              sys.exit(1)

          # ── Leerungsschutz / Groessen-Sanity ────────────────────────────
          # Gleicher 5-GiB-Cap wie in update_combined_blacklist.yml
          # (_SEENDB_LIMIT) - Schutz gegen korrupte/boesartige Datei.
          MIN_ENTRIES = 100_000
          _SEENDB_LIMIT = 5 * 1024 * 1024 * 1024
          _dsize = os.path.getsize(DB_FILE)
          if _dsize > _SEENDB_LIMIT:
              msg = (f"seen_db.json zu gross: {_dsize/1024/1024:.1f} MB - "
                     f"moegliche Korruption, breche ab.")
              print(f"::error::{msg}")
              write_text_atomic(REPORT_FILE,
                  f"# Seen-DB Expiry Forecast\n\n*{msg}*\n\n*Lauf: {now_str}*\n")
              sys.exit(1)

          print(f"Lade {DB_FILE} ({_dsize/1024/1024:.1f} MB)...")
          with open(DB_FILE) as f:
              db = json.load(f)
          print(f"{len(db):,} IPs geladen")

          if len(db) < MIN_ENTRIES:
              print(f"::warning::Nur {len(db)} Eintraege (< {MIN_ENTRIES}) - "
                    f"seen_db wirkt unvollstaendig. Report wird trotzdem "
                    f"erstellt, aber mit Vorsicht zu interpretieren.")

          # DIAGNOSE 3 (2026-08-23, Nutzerwunsch "was fehlt noch zur
          # Diagnose"): Tiefe Ledger-Konsistenzpruefung. Der Job "verifikation"
          # (alle 3h) prueft nur die Output-Dateien gegen die Ablauf-Listen -
          # ein guter, schneller Rueckfall-Detektor, aber er sieht nicht die
          # rohe seen_db.json selbst. Hier, wo wir seen_db ohnehin geladen
          # haben, koennen wir direkt auf Datenbank-Ebene pruefen: Steht eine
          # Ablauf-Listen-IP noch/wieder in seen_db, aber NICHT mit dem
          # eingefrorenen Datum? Das waere ein noch frueheres Warnsignal -
          # der Fix waere schon auf DB-Ebene umgangen worden, BEVOR es
          # ueberhaupt in einer Output-Datei sichtbar wird.
          ledger_bugs = []
          for _ledger_datei, _ledger_label in [
              ("state/watchlist_expired_history.json", "Watchlist"),
              ("state/active_expired_history.json", "Active"),
          ]:
              if not os.path.exists(_ledger_datei):
                  continue
              try:
                  with open(_ledger_datei) as f:
                      _ledger_eintraege = json.load(f).get("entries", {})
              except Exception as e:
                  print(f"WARNUNG: {_ledger_datei} nicht lesbar fuer Konsistenzpruefung: {e}")
                  continue
              for _ip, _frozen_datum in _ledger_eintraege.items():
                  _entry = db.get(_ip)
                  if _entry is None or not isinstance(_entry, dict):
                      continue  # nicht in seen_db - genau wie erwartet, kein Bug
                  _entry_last = _entry.get("last", "2000-01-01")
                  if _ledger_label == "Watchlist":
                      # Erwartung: wenn ueberhaupt in db, dann NUR mit last=
                      # Sentinel UND first=exakt dem eingefrorenen Datum
                      # (sofortiger Re-Expiry im selben Lauf haette den
                      # Eintrag laengst wieder entfernt - bleibt er trotzdem
                      # drin mit einem ANDEREN first, wurde der Freeze
                      # umgangen).
                      if _entry_last == "2000-01-01" and _entry.get("first") != _frozen_datum:
                          ledger_bugs.append(
                              f"{_ip} (Watchlist-Ledger, eingefroren auf first={_frozen_datum}): "
                              f"steht in seen_db mit first={_entry.get('first')} - "
                              f"Freeze wurde umgangen"
                          )
                  else:  # Active
                      # Erwartung: bleibt entweder ganz draussen, oder mit
                      # last=exakt dem eingefrorenen Datum (Freeze wirkt),
                      # oder mit einem NEUEREN last-Datum durch echte
                      # Zweitbestaetigung (legitime Promotion, kein Bug -
                      # laesst sich von hier aus nicht von einem Bug
                      # unterscheiden, siehe Kommentar unten). Ein Rueckfall
                      # auf last=Sentinel (Watchlist-Pfad) waere aber in
                      # jedem Fall unplausibel und wird gemeldet.
                      if _entry_last == "2000-01-01":
                          ledger_bugs.append(
                              f"{_ip} (Active-Ledger, eingefroren auf last={_frozen_datum}): "
                              f"steht in seen_db auf dem Watchlist-Pfad (last=Sentinel) - "
                              f"unplausibler Pfadwechsel"
                          )
          if ledger_bugs:
              print(f"::error ::{len(ledger_bugs)} Ledger-Konsistenz-Problem(e) gefunden "
                    f"(Freeze auf DB-Ebene umgangen)")
          else:
              print("Ledger-Konsistenzpruefung: keine Probleme gefunden")

          # ── Buckets fuer aktive Eintraege (last = echtes Datum) ─────────
          # Zeitfenster: bereits ueberfaellig (Bug-Indikator, sollte 0 sein -
          # Cleanup-Pass in update_combined_blacklist.yml raeumt das auf),
          # 0-7 / 8-14 / 15-30 / 31-60 / 61-90 / 91-180 Tage bis Ablauf,
          # sowie "kein Ablauf in Sicht" (>180 Tage, kann bei falscher
          # Datenlage theoretisch vorkommen, praktisch nicht bei korrektem
          # last<=heute).
          buckets_active = {
              "bereits ueberfaellig (Cleanup-Pass sollte das entfernen)": 0,
              "0-7 Tage": 0, "8-14 Tage": 0, "15-30 Tage": 0,
              "31-60 Tage": 0, "61-90 Tage": 0, "91-180 Tage": 0,
          }
          # Watchlist-Eintraege (last=Sentinel, first-basiert, 30-Tage-Fenster)
          buckets_watch = {
              "bereits ueberfaellig": 0,
              "0-3 Tage": 0, "4-7 Tage": 0, "8-14 Tage": 0, "15-30 Tage": 0,
          }
          corrupt = 0
          active_total = 0
          watch_total = 0
          # Fuer die konkrete "was passiert am Datum X"-Frage: Zaehler pro
          # Ablaufdatum, damit Ausreisser-Tage (z.B. durch einen einmaligen
          # Massenimport) sichtbar werden statt nur in groben Buckets zu
          # verschwinden.
          per_expiry_date = {}
          # Analoge Tages-Aufschluesselung fuer den Watchlist-Pfad. Zweck:
          # der Anti-Churn-Fix in update_combined_blacklist.yml (eingefrorene
          # first/last-Daten, siehe state/watchlist_expired_history.json)
          # wirkt sich HIER zuerst sichtbar aus, weil das Watchlist-Fenster
          # (30 Tage) viel kuerzer ist als das Active-Fenster (180 Tage). Mit
          # den exakten Tagen laesst sich Tag fuer Tag pruefen, ob die
          # vorhergesagten Abgaenge auch WIRKLICH nicht mehr zurueckkommen
          # (siehe dazu auch Job "verifikation" unten in dieser Datei, der
          # die Rueckkehr aktiv prueft - diese Tabelle hier liefert nur die
          # Erwartung/Prognose dazu).
          per_expiry_date_watch = {}

          def _bucket_days(days_left, buckets, edges):
              if days_left < 0:
                  return list(buckets.keys())[0]
              for i, edge in enumerate(edges):
                  if days_left <= edge:
                      return list(buckets.keys())[i + 1]
              return list(buckets.keys())[-1]

          ACTIVE_EDGES = [7, 14, 30, 60, 90, 180]
          WATCH_EDGES  = [3, 7, 14, 30]

          for ip, entry in db.items():
              try:
                  if not isinstance(entry, dict):
                      corrupt += 1
                      continue
                  last_str = entry.get("last", "2000-01-01")
                  if last_str == "2000-01-01":
                      # Watchlist-Pfad: first-basiert, 30 Tage
                      first_str = entry.get("first", last_str)
                      try:
                          first_dt = datetime.strptime(first_str, "%Y-%m-%d").date()
                      except Exception:
                          corrupt += 1
                          continue
                      expiry_date = first_dt + timedelta(days=WATCHLIST_EXPIRY_DAYS)
                      days_left = (expiry_date - today).days
                      watch_total += 1
                      buckets_watch[_bucket_days(days_left, buckets_watch, WATCH_EDGES)] += 1
                      # Watchlist-Fenster ist mit 30 Tagen ohnehin kurz - anders
                      # als beim Active-Pfad (60 von 180 Tagen) wird hier das
                      # GESAMTE Fenster tagesgenau erfasst, keine Kappung noetig.
                      if 0 <= days_left <= WATCHLIST_EXPIRY_DAYS:
                          key = expiry_date.isoformat()
                          per_expiry_date_watch[key] = per_expiry_date_watch.get(key, 0) + 1
                  else:
                      try:
                          last_dt = datetime.strptime(last_str, "%Y-%m-%d").date()
                      except Exception:
                          corrupt += 1
                          continue
                      expiry_date = last_dt + timedelta(days=EXPIRY_DAYS)
                      days_left = (expiry_date - today).days
                      active_total += 1
                      buckets_active[_bucket_days(days_left, buckets_active, ACTIVE_EDGES)] += 1
                      # Nur nahe Ablauftermine (<=60 Tage) einzeln zaehlen -
                      # weiter in der Zukunft liegende Tage sind fuer eine
                      # konkrete Tages-Prognose noch nicht relevant und
                      # wuerden die Tabelle nur aufblaehen.
                      if 0 <= days_left <= 60:
                          key = expiry_date.isoformat()
                          per_expiry_date[key] = per_expiry_date.get(key, 0) + 1
              except Exception:
                  corrupt += 1
                  continue

          if corrupt:
              print(f"WARN: {corrupt} korrupte/unlesbare Eintraege uebersprungen")
          print(f"Aktive Eintraege: {active_total:,} | Watchlist-Eintraege: {watch_total:,}")

          # ── Report bauen ──────────────────────────────────────────────
          lines = [
              "# Seen-DB Expiry Forecast",
              "",
              f"Lauf: {now_str}",
              f"Gesamt: {len(db):,} IPs in seen_db.json "
              f"({active_total:,} aktiv/180-Tage-Pfad, {watch_total:,} Watchlist/30-Tage-Pfad"
              + (f", {corrupt} korrupt uebersprungen" if corrupt else "") + ")",
              "",
              "## Aktive IPs (180-Tage-Fenster) – wann faellt die Bestaetigung aus?",
              "",
              "| Zeitfenster | Anzahl IPs |",
              "|---|---:|",
          ]
          for k, v in buckets_active.items():
              lines.append(f"| {k} | {v:,} |")

          lines += [
              "",
              "## Watchlist-IPs (30-Tage-Fenster) – wann faellt die Erstsichtung aus?",
              "",
              "| Zeitfenster | Anzahl IPs |",
              "|---|---:|",
          ]
          for k, v in buckets_watch.items():
              lines.append(f"| {k} | {v:,} |")

          if per_expiry_date_watch:
              lines += [
                  "",
                  "## Konkrete Ablauftermine, Watchlist-IPs, naechste 30 Tage",
                  "",
                  "Tagesgenau, im Gegensatz zu den groben Zeitfenstern oben - "
                  "damit sich der Anti-Churn-Fix (eingefrorene first-Daten bei "
                  "erneutem Auftauchen, siehe state/watchlist_expired_history.json) "
                  "konkret nachvollziehen laesst: Faellt die IP-Zahl an einem "
                  "vorhergesagten Tag tatsaechlich, und bleibt sie danach unten "
                  "(pruefbar zusaetzlich mit dem Job \"verifikation\" in dieser "
                  "Datei, der aktiv auf Rueckkehrer prueft)?",
                  "",
                  "| Datum | Anzahl IPs, die an diesem Tag ihre Erstsichtungs-Frist verlieren |",
                  "|---|---:|",
              ]
              for d in sorted(per_expiry_date_watch.keys()):
                  lines.append(f"| {d} | {per_expiry_date_watch[d]:,} |")

          if per_expiry_date:
              lines += [
                  "",
                  "## Konkrete Ablauftermine, aktive IPs, naechste 60 Tage",
                  "",
                  "Zeigt einzelne Tage mit ueberdurchschnittlich vielen "
                  "gleichzeitig ablaufenden IPs (z.B. durch einen "
                  "einmaligen Massenimport an einem bestimmten Tag vor "
                  "180 Tagen).",
                  "",
                  "| Datum | Anzahl IPs, die an diesem Tag ihre Bestaetigung verlieren |",
                  "|---|---:|",
              ]
              for d in sorted(per_expiry_date.keys()):
                  lines.append(f"| {d} | {per_expiry_date[d]:,} |")

          # DIAGNOSE 3: Ergebnis der tiefen Ledger-Konsistenzpruefung von
          # oben. Anders als der schnelle 3h-Rueckfall-Check in "verifikation"
          # (der nur Output-Dateien sieht) prueft dies gegen die rohe
          # seen_db.json selbst - laeuft aber nur woechentlich mit, da nur
          # dieser Job vollen seen_db-Zugriff hat.
          lines += [
              "",
              "## Ledger-Konsistenz (gegen aktuelle seen_db geprüft)",
              "",
          ]
          if ledger_bugs:
              lines.append(
                  f"❌ **{len(ledger_bugs)} Inkonsistenz(en) gefunden** - der Anti-Churn-Freeze "
                  f"wurde auf Datenbank-Ebene umgangen (frueher/schwerwiegender als ein "
                  f"Rueckfall in einer Output-Datei):"
              )
              lines.append("")
              for _bug in ledger_bugs:
                  lines.append(f"- {_bug}")
          else:
              lines.append(
                  f"✅ Keine Inkonsistenzen - alle Ablauf-Listen-IPs, die noch/wieder in "
                  f"seen_db stehen, haben das erwartete eingefrorene Datum "
                  f"(oder eine plausible echte Neubestätigung)."
              )
              lines.append("")
              lines.append(
                  "*Hinweis: Fuer den Active-Pfad kann eine legitime Zweitbestaetigung "
                  "(2+ HQ-Feed-Familien) nicht von einem Bug unterschieden werden, daher "
                  "wird dort nur der eindeutig unplausible Fall (Rueckfall auf den "
                  "Watchlist-Pfad) geprueft.*"
              )

          write_text_atomic(REPORT_FILE, "\n".join(lines) + "\n")
          print(f"\nReport geschrieben: {REPORT_FILE}")

          if ledger_bugs:
              sys.exit(1)  # Job rot markieren, wenn der Freeze umgangen wurde
          EOF

      - name: Commit and Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ip_ablauf.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Seen-DB Expiry Forecast: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs reports/ip_ablauf.md 2>/dev/null || true
                git add reports/ip_ablauf.md 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi

      - name: Prognose-Alarm (GitHub Issue) öffnen/aktualisieren
        # DIAGNOSE 5 (2026-08-23, Nutzerwunsch "was fehlt noch zur
        # Diagnose"): analog zum Alarm-Mechanismus im Job "verifikation" -
        # deckt beide Fehlerursachen dieses Jobs ab: (a) weder Cache noch
        # Release-Backup fuer seen_db.json verfuegbar, (b) Ledger-
        # Konsistenzpruefung hat eine Umgehung des Freeze gefunden. Anders
        # als beim Job "verifikation" gibt es hier keine strukturierte
        # Detail-Datei (die zwei Fehlerursachen sind zu unterschiedlich fuer
        # ein gemeinsames Format) - der Issue-Body verweist stattdessen auf
        # das Workflow-Log dieses Laufs und den (falls vorhanden) Report.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 IP-Ablauf: Prognose-Job fehlgeschlagen"
          BODY="Der Job \"prognose\" (Seen-DB Expiry Forecast) ist fehlgeschlagen.

          Moegliche Ursachen: seen_db.json weder aus Cache noch aus dem Release-Backup ladbar, ODER die Ledger-Konsistenzpruefung hat eine Umgehung des Anti-Churn-Freeze gefunden (Details im Log oder in reports/ip_ablauf.md, Sektion \"Ledger-Konsistenz\").

          Lauf: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')
          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "Bestehendes Alarm-Issue #$EXISTING gefunden - kommentiere statt neu zu erstellen."
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            echo "Kein offenes Alarm-Issue gefunden - erstelle neues."
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: Prognose-Alarm schließen, falls behoben
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 IP-Ablauf: Prognose-Job fehlgeschlagen"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "Offenes Alarm-Issue #$EXISTING gefunden - aktueller Lauf war erfolgreich, schließe."
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "✅ Behoben: Lauf vom $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z') war erfolgreich. Issue wird automatisch geschlossen."
            gh issue close "$EXISTING" --repo "${{ github.repository }}"
          else
            echo "Kein offenes Alarm-Issue vorhanden - nichts zu tun."
          fi

  # ══════════════════════════════════════════════════════════════════════
  # JOB 2: Verifikation (vorher ip_ablauf_verifikation.yml)
  # ══════════════════════════════════════════════════════════════════════
  verifikation:
    # Laeuft bei manuellem Dispatch IMMER, per Cron NUR beim 3h-Slot.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '55 */3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # FIX 2026-08-23 (Nutzerwunsch "Meldung waere recht"): issues:write nur
    # fuer diesen Job ueberschrieben (Workflow-Level hat nur contents:write) -
    # noetig fuer den automatischen Rueckfall-Alarm als GitHub Issue weiter
    # unten. Der Job "prognose" braucht das nicht, bekommt also weiterhin nur
    # das Workflow-Level-Permission-Set.
    # FIX 2026-08-23 (Nutzerwunsch "Log vom combined-Lauf mit in die ZIP"):
    # actions:read ergaenzt - noetig fuer "gh run list"/"gh run view" auf
    # update_combined_blacklist.yml (einen ANDEREN Workflow), siehe Step
    # "Combined-Blacklist Run-Log holen" unten.
    permissions:
      contents: write
      issues: write
      actions: read
    concurrency:
      group: netshield-ip-ablauf-verifikation
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Combined-Blacklist Run-Log holen
        # FIX 2026-08-23 (Nutzerwunsch "run an dem tag des ip rückgang [...]
        # in der anderen zip speichern"): Konsolenausgabe des neuesten
        # erfolgreichen update_combined_blacklist.yml-Laufs abrufen, damit
        # man am Tag eines auffaelligen seen_db-Rueckgangs direkt nachsehen
        # kann, was in DIESEM Lauf tatsaechlich passiert ist (Cleanup-Pass-
        # Zahlen, Ledger-Eintraege, etc.) - ohne selbst in der Actions-UI
        # danach suchen zu muessen.
        # continue-on-error: true - das Log ist ein Komfort-Extra, kein
        # kritischer Bestandteil der eigentlichen Rueckfall-Pruefung unten.
        # Schlaegt der Log-Abruf fehl (z.B. API-Rate-Limit, Log bereits
        # abgelaufen/geloescht), soll das NICHT den ganzen Job rot machen.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RUN_ID=$(gh run list --repo "${{ github.repository }}" \
            --workflow=update_combined_blacklist.yml --status=success --limit=1 \
            --json databaseId --jq '.[0].databaseId')
          if [ -n "$LATEST_RUN_ID" ] && [ "$LATEST_RUN_ID" != "null" ]; then
            echo "Neuester erfolgreicher combined-Run: #$LATEST_RUN_ID"
            if gh run view "$LATEST_RUN_ID" --repo "${{ github.repository }}" \
                --log > combined_run_full.log 2>/dev/null; then
              # Groessenbegrenzung: combined kann bis zu 90min laufen und
              # druckt regelmaessige Fortschrittszeilen (Update-/Cleanup-
              # Loop bei ~9 Mio. IPs) - das Rohlog kann mehrere MB gross
              # werden. Passt nicht zur "kleine ZIP"-Philosophie der
              # anderen Ledger-/Report-Dateien hier. Letzte 2000 Zeilen
              # reichen fuer die interessanten Teile (Cleanup-Pass-
              # Zusammenfassung, Fehler/Warnungen stehen meist am Ende).
              tail -n 2000 combined_run_full.log > combined_run.log
              rm -f combined_run_full.log
              echo "combined_run.log geschrieben ($(wc -l < combined_run.log) Zeilen, "
              echo "  Run #$LATEST_RUN_ID, $(du -h combined_run.log | cut -f1))"
            else
              echo "WARNUNG: Log-Download fuer Run #$LATEST_RUN_ID fehlgeschlagen "
              echo "  (evtl. bereits abgelaufen/geloescht) - wird ausgelassen"
            fi
          else
            echo "WARNUNG: Kein erfolgreicher update_combined_blacklist.yml-Run gefunden"
          fi

          # DIAGNOSE 4 (2026-08-23, Nutzerwunsch "was kann man noch
          # einbauen"): Erfolgsquote der letzten N combined-Läufe. Der
          # Staleness-Check weiter unten (im Python-Step) prueft nur, ob
          # der NEUESTE Stand frisch genug ist - ein System, das z.B. 3 von
          # 8 Laeufen verliert, aber der letzte zufaellig durchkam, saehe
          # dort "gesund" aus. Diese Quote deckt genau das ab.
          RELIABILITY_N=16
          gh run list --repo "${{ github.repository }}" \
            --workflow=update_combined_blacklist.yml --limit=$RELIABILITY_N \
            --json conclusion,createdAt > combined_reliability.json 2>/dev/null \
            || echo "[]" > combined_reliability.json
          echo "combined_reliability.json geschrieben ($(python3 -c "import json; print(len(json.load(open('combined_reliability.json'))))") Läufe)"

      - name: Wiederauftauch-Prüfung + Bericht erstellen
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 << 'EOF'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from netshield_common import write_json_atomic, write_text_atomic
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          REPORT_FILE  = "reports/ip_ablauf_verifikation_report.md"
          VERLAUF_FILE = "state/ip_ablauf_verifikation_verlauf.json"

          now = datetime.now(timezone.utc)
          now_str = (
              now.astimezone(ZoneInfo("Europe/Berlin"))
              .strftime("%Y-%m-%d %H:%M %Z") + " (Europe/Berlin)"
          )

          # ── Ablauf-Listen laden: "diese IPs muessen fuer immer draussen bleiben" ──
          ABLAUFLISTEN = {
              "Watchlist (30-Tage-Pfad)": "state/watchlist_expired_history.json",
              "Active (180-Tage-Pfad)":   "state/active_expired_history.json",
          }
          eingefrorene_ips = set()
          listen_groessen = {}
          # DIAGNOSE 4 (2026-08-23): einzelne Sets pro Liste behalten (nicht
          # nur die vereinigte Menge), um eine Ueberschneidung zu erkennen -
          # siehe Check weiter unten.
          listen_ips = {}
          for label, pfad in ABLAUFLISTEN.items():
              if os.path.exists(pfad):
                  try:
                      with open(pfad) as f:
                          daten = json.load(f)
                      eintraege = daten.get("entries", {})
                      listen_groessen[label] = len(eintraege)
                      listen_ips[label] = set(eintraege.keys())
                      eingefrorene_ips.update(eintraege.keys())
                  except Exception as e:
                      listen_groessen[label] = None
                      listen_ips[label] = set()
                      print(f"WARNUNG: {pfad} nicht lesbar: {e}")
              else:
                  listen_groessen[label] = 0
                  listen_ips[label] = set()
                  print(f"{pfad} existiert noch nicht (normal vor dem ersten Ablauf-Ereignis)")

          # DIAGNOSE 4: Ueberschneidung zwischen den beiden Ablauf-Listen.
          # Sollte laut Logik NIE passieren (eine IP ist zu jedem Zeitpunkt
          # entweder auf dem Watchlist- ODER dem Active-Pfad, "last" ist
          # entweder Sentinel oder echtes Datum, nie beides) - waere ein
          # direkter Hinweis auf einen Logikfehler in update_combined_
          # blacklist.yml, wenn hier doch mal was auftaucht.
          _wl_label, _act_label = "Watchlist (30-Tage-Pfad)", "Active (180-Tage-Pfad)"
          # DIAGNOSE: zentrale Sammelstelle fuer alles, was Alarm ausloesen
          # soll (Job-Exit-Code + GitHub-Issue). Ersetzt die vorher einzelne
          # "if rueckfaelle:"-Bedingung, damit weitere Diagnose-Checks (siehe
          # unten: Ledger-Ueberschneidung, Staleness) denselben Alarm-Pfad
          # nutzen koennen, statt jeweils eigene Exit-Bedingungen zu bauen.
          diagnose_probleme = []

          ledger_ueberschneidung = listen_ips.get(_wl_label, set()) & listen_ips.get(_act_label, set())
          if ledger_ueberschneidung:
              print(f"::error ::LOGIKFEHLER: {len(ledger_ueberschneidung)} IP(s) stehen "
                    f"gleichzeitig in BEIDEN Ablauf-Listen (sollte unmoeglich sein): "
                    f"{sorted(ledger_ueberschneidung)[:10]}")
              diagnose_probleme.append(
                  f"❌ **Logikfehler:** {len(ledger_ueberschneidung)} IP(s) stehen gleichzeitig "
                  f"in BEIDEN Ablauf-Listen (sollte laut Design unmöglich sein): "
                  f"{', '.join(sorted(ledger_ueberschneidung)[:10])}"
                  + (", ..." if len(ledger_ueberschneidung) > 10 else "")
              )

          print(f"Insgesamt {len(eingefrorene_ips)} eindeutige, dauerhaft eingefrorene IPs in beiden Ablauf-Listen")

          # ── Alle aktuellen Output-Dateien einlesen und gegen die Ablauf-Listen pruefen ──
          OUTPUT_DATEIEN = [
              "active_blacklist_ipv4.txt",
              "combined_threat_blacklist_ipv4_part1.txt",
              "combined_threat_blacklist_ipv4_part2.txt",
              "blacklist_confidence40_ipv4_part1.txt",
              "blacklist_confidence40_ipv4_part2.txt",
              "watchlist_confidence25to39_ipv4.txt",
              "bot_detector_blacklist_ipv4.txt",
              "honeypot_ips.txt",
              "honigtopf_ips.txt",
              "tweetfeed_ips.txt",
              "cve_exploit_ips.txt",
              "reputation_blacklist.txt",
          ]

          rueckfaelle = {}
          alle_rueckfall_ips = set()
          geprueft_dateien = []
          if eingefrorene_ips:
              for fname in OUTPUT_DATEIEN:
                  if not os.path.exists(fname):
                      continue
                  geprueft_dateien.append(fname)
                  try:
                      with open(fname) as f:
                          datei_ips = {
                              zeile.strip() for zeile in f
                              if zeile.strip() and not zeile.startswith("#")
                          }
                  except Exception as e:
                      print(f"WARNUNG: {fname} nicht lesbar: {e}")
                      continue
                  treffer = datei_ips & eingefrorene_ips
                  if treffer:
                      rueckfaelle[fname] = sorted(treffer)
                      alle_rueckfall_ips.update(treffer)

          if rueckfaelle:
              print(f"::error ::RÜCKFALL gefunden: {len(alle_rueckfall_ips)} eingefrorene IP(s) "
                    f"stehen trotzdem in aktuellen Output-Dateien - Fix greift nicht wie erwartet")
              diagnose_probleme.append(
                  f"❌ **Rückfall:** {len(alle_rueckfall_ips)} eingefrorene IP(s) stehen "
                  f"trotzdem in aktuellen Output-Dateien - der Anti-Churn-Fix greift hier "
                  f"NICHT wie erwartet."
              )
          else:
              print(f"OK: keine der {len(eingefrorene_ips)} eingefrorenen IPs taucht in "
                    f"{len(geprueft_dateien)} geprueften Output-Dateien auf")

          # ── seen_db-Gesamtzahl (Trend) ──────────────────────────────────
          gesamt_ips_jetzt = None
          meta_alter_stunden = None
          cleanup_stats = None
          if os.path.exists("state/seen_db_meta.json"):
              try:
                  with open("state/seen_db_meta.json") as f:
                      _meta = json.load(f)
                  gesamt_ips_jetzt = _meta.get("total_ips")
                  # FIX 2026-08-23 (Nutzerwunsch "wieviel ips entfernt wurden
                  # das ich nicht manuell pruefen muss"): Cleanup-Statistik
                  # aus dem letzten combined-Lauf direkt uebernehmen - siehe
                  # cleanup_stats.json/meta["cleanup"] in update_combined_
                  # blacklist.yml. Ersetzt das manuelle Log-Durchsuchen nach
                  # der Zeile "Abgelaufen (...): N IPs entfernt".
                  cleanup_stats = _meta.get("cleanup")
                  # DIAGNOSE 2 (2026-08-23, Nutzerwunsch "was fehlt noch zur
                  # Diagnose"): Staleness-Check. "0 Rückfälle"/"Ledger wächst
                  # nicht" kann auch bedeuten: update_combined_blacklist.yml
                  # laeuft seit Stunden gar nicht mehr (Fehler, Quota,
                  # Cache-Problem) - dann passiert einfach nichts mehr, und
                  # dieser Job meldet faelschlich Ruhe statt Stillstand.
                  # updated_utc_iso wurde extra dafuer ergaenzt (siehe FIX
                  # dort - "updated" allein laesst sich wegen CEST/CET nicht
                  # robust zurueckparsen).
                  _updated_iso = _meta.get("updated_utc_iso")
                  if _updated_iso:
                      _meta_zeit = datetime.fromisoformat(_updated_iso)
                      if _meta_zeit.tzinfo is None:
                          _meta_zeit = _meta_zeit.replace(tzinfo=timezone.utc)
                      meta_alter_stunden = (now - _meta_zeit).total_seconds() / 3600
                  else:
                      print("WARNUNG: state/seen_db_meta.json hat kein 'updated_utc_iso' "
                          "(alter Stand vor diesem Fix?) - Staleness-Check uebersprungen")
              except Exception as e:
                  print(f"WARNUNG: state/seen_db_meta.json nicht lesbar: {e}")

          if cleanup_stats:
              cleanup_text = (
                  f"{cleanup_stats.get('expired_removed', 0):,} IPs durch Ablauf entfernt, "
                  f"{cleanup_stats.get('neu_angelegt', 0):,} neue IPs hinzugekommen"
              )
              _extra = []
              if cleanup_stats.get("wl_cleanup_count"):
                  _extra.append(f"{cleanup_stats['wl_cleanup_count']:,} Whitelist-Bereinigung")
              if cleanup_stats.get("protected_removed_runtime"):
                  _extra.append(f"{cleanup_stats['protected_removed_runtime']:,} geschützt entfernt")
              if cleanup_stats.get("cidr_aggr_removed"):
                  _extra.append(f"{cleanup_stats['cidr_aggr_removed']:,} CIDR-Aggregate")
              if _extra:
                  cleanup_text += " (zusätzlich: " + ", ".join(_extra) + ")"
          else:
              cleanup_text = "n/a (kein combined-Lauf mit Cleanup-Statistik gefunden)"

          # DIAGNOSE 4: Erfolgsquote der letzten N combined-Läufe auswerten.
          # Kommt aus combined_reliability.json (siehe Step "Combined-
          # Blacklist Run-Log holen" oben, gh run list mit conclusion+
          # createdAt fuer die letzten RELIABILITY_N Laeufe).
          reliability_text = "n/a (keine Lauf-Historie abrufbar)"
          reliability_auffaellig = False
          if os.path.exists("combined_reliability.json"):
              try:
                  with open("combined_reliability.json") as f:
                      _runs = json.load(f)
                  if _runs:
                      _total = len(_runs)
                      _success = sum(1 for r in _runs if r.get("conclusion") == "success")
                      _quote = _success / _total * 100
                      _aeltester = min((r["createdAt"] for r in _runs), default=None)
                      _neuester = max((r["createdAt"] for r in _runs), default=None)
                      reliability_text = f"{_success}/{_total} erfolgreich ({_quote:.0f}%)"
                      if _aeltester and _neuester:
                          reliability_text += f", Zeitraum {_aeltester[:16]} bis {_neuester[:16]} UTC"
                      # Schwelle bewusst grosszuegig (75%) - combined hat
                      # bekannte, dokumentierte Skip-Faelle (Idempotenz-
                      # Guard bei ueberlappenden Laeufen, siehe watchdog_
                      # combined.yml) die NICHT als echtes Problem zaehlen,
                      # nur echte "failure"-Conclusions fliessen hier ein.
                      if _quote < 75:
                          reliability_auffaellig = True
                          diagnose_probleme.append(
                              f"⚠️ **Niedrige combined-Erfolgsquote:** nur {reliability_text} "
                              f"in den letzten {_total} Läufen (Schwelle: 75%) - auch wenn der "
                              f"neueste Stand frisch wirkt, lief das System zuletzt nicht "
                              f"zuverlässig."
                          )
              except Exception as e:
                  print(f"WARNUNG: combined_reliability.json nicht auswertbar: {e}")

          # combined laeuft alle 3h - 6h Schwelle = 2 verpasste Laeufe in
          # Folge, konservativ genug um normale Verzoegerungen (langsamer
          # Lauf, kurzer Retry) nicht faelschlich zu melden.
          STALE_SCHWELLE_STUNDEN = 6
          ist_stale = meta_alter_stunden is not None and meta_alter_stunden > STALE_SCHWELLE_STUNDEN
          if ist_stale:
              print(f"::warning ::seen_db_meta.json ist {meta_alter_stunden:.1f}h alt "
                    f"(> {STALE_SCHWELLE_STUNDEN}h) - update_combined_blacklist.yml "
                    f"laeuft moeglicherweise nicht mehr planmaessig")
              diagnose_probleme.append(
                  f"⚠️ **Veraltete Daten:** `state/seen_db_meta.json` ist "
                  f"{meta_alter_stunden:.1f}h alt (Schwelle: {STALE_SCHWELLE_STUNDEN}h). "
                  f"`update_combined_blacklist.yml` (Cron alle 3h) läuft möglicherweise "
                  f"nicht mehr planmäßig - alle Aussagen dieses Berichts basieren auf "
                  f"diesem veralteten Stand."
              )

          # ── Zeitreihe fortschreiben ──────────────────────────────────────
          # Kein endloses Sliding-Window: echter 30-Tage-Zyklus. Sobald seit
          # "zyklus_start" 30 Tage vergangen sind, wird die Historie KOMPLETT
          # geleert und neu begonnen - die ZIP faengt dann wieder bei 0 an,
          # statt nur alte Eintraege am Rand abzuschneiden. Grund: jeder Lauf
          # committet die ZIP als neuen Binaer-Blob in die Git-Historie
          # (siehe repo_size_check.yml/history_fresh_start.yml-Kontext) - ein
          # sauberer periodischer Reset der INHALTLICHEN Groesse ist der
          # Gegenpart dazu auf Daten-Ebene.
          ZYKLUS_TAGE = 30
          today = now.date()
          verlauf = []
          zyklus_start_str = today.isoformat()
          # Bewusst VOR einem moeglichen Zyklus-Reset gesichert: der
          # Kurzfrist-Vergleich ("seit letztem Lauf") soll auch am
          # Reset-Tag selbst noch funktionieren, waehrend der Zyklus-Start-
          # Vergleich an diesem einen Tag bewusst neu bei sich selbst
          # beginnt (siehe Trend-Berechnung weiter unten).
          _letzter_lauf_ueberhaupt = None
          if os.path.exists(VERLAUF_FILE):
              try:
                  with open(VERLAUF_FILE) as f:
                      _alt = json.load(f)
                  verlauf = _alt.get("laeufe", [])
                  _letzter_lauf_ueberhaupt = verlauf[-1] if verlauf else None
                  zyklus_start_str = _alt.get("zyklus_start", today.isoformat())
                  zyklus_start = datetime.strptime(zyklus_start_str, "%Y-%m-%d").date()
                  _alter_tage = (today - zyklus_start).days
                  if _alter_tage >= ZYKLUS_TAGE:
                      print(f"Zyklus abgelaufen ({_alter_tage} >= {ZYKLUS_TAGE} Tage seit "
                            f"{zyklus_start_str}) - Historie wird komplett zurueckgesetzt")
                      verlauf = []
                      zyklus_start_str = today.isoformat()
              except Exception as e:
                  print(f"WARNUNG: {VERLAUF_FILE} nicht lesbar, starte neue Historie: {e}")
                  verlauf = []
                  zyklus_start_str = today.isoformat()

          # FIX 2026-08-23 (Nutzerwunsch "einbauen ob die seen_db zurueck-
          # gegangen sind"): Vergleichswerte VOR dem Anhaengen des aktuellen
          # Laufs sichern - sonst wuerde sich der neue Eintrag mit sich
          # selbst vergleichen. Zwei Referenzpunkte:
          #   - "seit letztem Lauf" (kurzfristig, 3h-Delta)
          #   - "seit Zyklus-Start" (der aussagekraeftigere Wert - zeigt den
          #     Effekt ueber den vollen laufenden 30-Tage-Beobachtungs-
          #     zeitraum, nicht nur zwischen zwei Laeufen)
          _erster_lauf_zyklus = verlauf[0] if verlauf else None

          # DIAGNOSE 1 (2026-08-23, Nutzerwunsch "was fehlt noch zur
          # Diagnose"): Sanity-Schwelle fuer den Trend. Bisher wurde JEDER
          # Rueckgang unterschiedslos als 📉 "gut" dargestellt - aber ein
          # Cache-Problem, ein fehlgeschlagener Restore oder ein Bug, der
          # versehentlich zu viel loescht, saehe genauso aus. Bewusst NUR
          # als sichtbare Markierung, NICHT als Alarm/Exit-Code-Ausloeser:
          # wir haben am ersten Tag bereits einen echten, legitimen Cluster
          # von ~7% Tagesrueckgang gesehen, und die Prognose zeigt fuer
          # einzelne Tage (z.B. 12.10.) bis zu ~17% - eine harte Alarm-
          # Schwelle wuerde also bei GENAU den erwarteten grossen Clustern
          # faelschlich anschlagen, die dieser Fix ja ermoeglichen soll.
          # Die Schwelle hier dient nur dazu, ungewoehnlich grosse Aus-
          # schlaege sichtbar zu machen, damit man sie GEZIELT gegen
          # reports/ip_ablauf.md (die Cluster-Prognose) pruefen kann - nicht
          # um automatisch "gut" von "schlecht" zu unterscheiden, das kann
          # dieser Check aus den Zahlen allein nicht zuverlaessig leisten.
          TREND_AUFFAELLIG_PROZENT = 20

          def _delta_text(jetzt, frueher, sanity_check=False):
              if jetzt is None or frueher is None:
                  return None, "n/a (kein Vergleichswert)", False
              delta = jetzt - frueher
              auffaellig = (
                  sanity_check and frueher > 0
                  and abs(delta) / frueher * 100 >= TREND_AUFFAELLIG_PROZENT
              )
              _praefix = "🔍 " if auffaellig else ""
              if delta < 0:
                  txt = f"{_praefix}📉 -{abs(delta):,} (Rückgang)"
              elif delta > 0:
                  txt = f"{_praefix}📈 +{delta:,} (Anstieg)"
              else:
                  txt = "➡️ unverändert"
              if auffaellig:
                  txt += (f" - ungewöhnlich groß (≥{TREND_AUFFAELLIG_PROZENT}% seit letztem "
                          f"Lauf), bitte gegen reports/ip_ablauf.md prüfen ob ein bekannter "
                          f"Cluster das erklärt")
              return delta, txt, auffaellig

          # sanity_check=True NUR fuer "seit letztem Lauf" (3h-Fenster,
          # einzelner Ausreisser gut erkennbar) - NICHT fuer "seit Zyklus-
          # Start" (30-Tage-Fenster, wo sich viele kleine UND grosse Cluster
          # normal aufsummieren und ein hoher kumulierter Wert fuer sich
          # genommen nichts Verdaechtiges bedeutet).
          _delta_letzter, _delta_letzter_txt, _letzter_auffaellig = _delta_text(
              gesamt_ips_jetzt,
              _letzter_lauf_ueberhaupt.get("gesamt_ips_seen_db") if _letzter_lauf_ueberhaupt else None,
              sanity_check=True,
          )
          _delta_zyklus, _delta_zyklus_txt, _ = _delta_text(
              gesamt_ips_jetzt,
              _erster_lauf_zyklus.get("gesamt_ips_seen_db") if _erster_lauf_zyklus else None,
          )
          print(f"seen_db-Trend seit letztem Lauf: {_delta_letzter_txt} | "
                f"seit Zyklus-Start: {_delta_zyklus_txt}")

          verlauf.append({
              "zeitpunkt":               now_str,
              "gesamt_ips_seen_db":      gesamt_ips_jetzt,
              "watchlist_liste_groesse": listen_groessen.get("Watchlist (30-Tage-Pfad)"),
              "active_liste_groesse":    listen_groessen.get("Active (180-Tage-Pfad)"),
              "rueckfall_ip_anzahl":     len(alle_rueckfall_ips),
              # FIX 2026-08-23 (Nutzerwunsch "kommen ja neue ips hinzu"): mit
              # in den Verlauf aufnehmen, damit sich daraus eine grobe
              # Tagessumme bilden laesst (siehe neu_angelegt_24h unten).
              "neu_angelegt":            (cleanup_stats or {}).get("neu_angelegt"),
              "expired_removed":         (cleanup_stats or {}).get("expired_removed"),
          })
          # Grobe 24h-Summe: letzte 8 Laeufe (alle 3h = 1 Tag), NACH dem
          # Anhaengen des aktuellen Laufs, damit dieser mitzaehlt. Nur ein
          # Naeherungswert - liefert "n/a" statt einer falschen Zahl, wenn
          # einzelne Laeufe in dem Fenster keine cleanup-Daten hatten
          # (z.B. vor diesem Fix, oder ein combined-Lauf ohne Backup-Guard-
          # Durchlauf).
          _letzte_8 = verlauf[-8:]
          _fenster_label = "~24h" if len(_letzte_8) == 8 else f"{len(_letzte_8)} Lauf(e), noch keine 24h Historie seit Zyklus-Start"
          _neu_24h_werte = [l.get("neu_angelegt") for l in _letzte_8 if l.get("neu_angelegt") is not None]
          _entfernt_24h_werte = [l.get("expired_removed") for l in _letzte_8 if l.get("expired_removed") is not None]
          if len(_neu_24h_werte) == len(_letzte_8) and len(_letzte_8) > 0:
              neu_24h_text = f"{sum(_neu_24h_werte):,} (Summe letzte {len(_letzte_8)} Läufe / {_fenster_label})"
          else:
              neu_24h_text = f"n/a ({len(_neu_24h_werte)}/{len(_letzte_8)} Läufe im Fenster mit Daten)"
          if len(_entfernt_24h_werte) == len(_letzte_8) and len(_letzte_8) > 0:
              entfernt_24h_text = f"{sum(_entfernt_24h_werte):,} (Summe letzte {len(_letzte_8)} Läufe / {_fenster_label})"
          else:
              entfernt_24h_text = f"n/a ({len(_entfernt_24h_werte)}/{len(_letzte_8)} Läufe im Fenster mit Daten)"
          # Sicherheitsnetz GEGEN den Zyklus-Reset (nicht statt ihm): falls der
          # Cron aus irgendeinem Grund viel oefter als alle 3h laeuft, waechst
          # die Datei innerhalb eines Zyklus trotzdem nicht unbegrenzt.
          # 300 statt der theoretischen 240 (8/Tag * 30 Tage) als Puffer nach
          # oben, damit der Zyklus-Reset selbst der normale Beendigungsweg
          # bleibt, nicht dieses Sicherheitsnetz.
          SICHERHEITS_MAX_LAEUFE = 300
          verlauf = verlauf[-SICHERHEITS_MAX_LAEUFE:]
          write_json_atomic(VERLAUF_FILE, {
              "updated": now_str,
              "zyklus_start": zyklus_start_str,
              "laeufe": verlauf,
          }, indent=2)

          # ── Bericht ────────────────────────────────────────────────────
          zeilen = [
              "# IP-Ablauf-Verifikationsbericht",
              "",
              f"Lauf: {now_str}",
              "",
              "Prueft, ob IPs, die einmal ohne Zweitbestaetigung abgelaufen sind "
              "(FIX CHURN-WATCHLIST / FIX CHURN-ACTIVE), tatsaechlich dauerhaft "
              "draussen bleiben statt Stunden spaeter mit zurueckgesetzter Uhr "
              "wieder aufzutauchen.",
              "",
              "## Größe der Ablauf-Listen (aktuell eingefrorene IPs)",
              "",
              "| Liste | Anzahl |",
              "|---|---:|",
          ]
          for label, anzahl in listen_groessen.items():
              zeilen.append(f"| {label} | {anzahl if anzahl is not None else 'Fehler'} |")

          # DIAGNOSE: zentrale Uebersicht ueber ALLE gesammelten Probleme
          # (Rueckfall, Ledger-Ueberschneidung, veraltete Daten) an einer
          # Stelle - Details zu jedem einzelnen Punkt stehen weiterhin in
          # den jeweils eigenen Sektionen weiter unten.
          zeilen += ["", "## Diagnose-Status", ""]
          if diagnose_probleme:
              zeilen.append(f"❌ **{len(diagnose_probleme)} Problem(e) erkannt:**")
              zeilen.append("")
              for _p in diagnose_probleme:
                  zeilen.append(f"- {_p}")
          else:
              zeilen.append("✅ Keine Probleme erkannt (Rückfälle, Ledger-Konsistenz, Datenaktualität).")

          zeilen += ["", "## Wiederauftauch-Prüfung", ""]
          if not eingefrorene_ips:
              zeilen.append(
                  "ℹ️ Noch keine IPs in den Ablauf-Listen - entweder ist der Fix noch nicht "
                  "lange genug aktiv, oder es ist noch keine IP ohne Zweitbestaetigung "
                  "abgelaufen. Keine Pruefung moeglich, bis der erste Ablauf passiert "
                  "ist (siehe reports/ip_ablauf.md fuer die naechsten "
                  "Ablauftermine, z.B. 2026-09-04)."
              )
          elif rueckfaelle:
              zeilen.append(
                  f"❌ **{len(alle_rueckfall_ips)} IP(s) gefunden, die laut Ablauf-Liste "
                  f"dauerhaft draussen sein sollten, aber trotzdem in einer aktuellen "
                  f"Output-Datei stehen - der Fix greift hier NICHT wie erwartet:**"
              )
              zeilen.append("")
              zeilen.append("| Datei | Anzahl Rückfälle | Beispiele |")
              zeilen.append("|---|---:|---|")
              for fname, ips in rueckfaelle.items():
                  beispiele = ", ".join(ips[:5]) + (", ..." if len(ips) > 5 else "")
                  zeilen.append(f"| {fname} | {len(ips)} | {beispiele} |")
          else:
              zeilen.append(
                  f"✅ 0 Rückfälle - keine der {len(eingefrorene_ips):,} eingefrorenen IPs "
                  f"taucht in {len(geprueft_dateien)} geprueften Output-Dateien auf. "
                  f"Der Fix haelt."
              )

          zeilen += [
              "",
              "## seen_db-Trend",
              "",
              f"- Seit letztem Lauf: {_delta_letzter_txt}"
              + (f" (jetzt {gesamt_ips_jetzt:,} IPs)" if gesamt_ips_jetzt is not None else ""),
              f"- Seit Zyklus-Start ({zyklus_start_str}): {_delta_zyklus_txt}",
              f"- Letzter combined-Cleanup-Pass: {cleanup_text}",
              f"- Neue IPs (Summe letzter Läufe): {neu_24h_text}",
              f"- Entfernte IPs (Summe letzter Läufe): {entfernt_24h_text}",
              f"- Erfolgsquote letzte 16 combined-Läufe: "
              + ("🔍 " if reliability_auffaellig else "") + reliability_text,
              "",
              "## Verlauf (letzte 20 Läufe)",
              "",
              "| Zeitpunkt | seen_db gesamt | Watchlist-Liste | Active-Liste | Rückfälle |",
              "|---|---:|---:|---:|---:|",
          ]
          for lauf in verlauf[-20:]:
              _gesamt = f"{lauf['gesamt_ips_seen_db']:,}" if lauf.get("gesamt_ips_seen_db") is not None else "-"
              _wl     = lauf.get("watchlist_liste_groesse")
              _act    = lauf.get("active_liste_groesse")
              zeilen.append(
                  f"| {lauf['zeitpunkt']} | {_gesamt} | "
                  f"{_wl if _wl is not None else '-'} | "
                  f"{_act if _act is not None else '-'} | "
                  f"{lauf.get('rueckfall_ip_anzahl', 0)} |"
              )

          write_text_atomic(REPORT_FILE, "\n".join(zeilen) + "\n")
          print(f"{REPORT_FILE} geschrieben")

          # ── Statusdatei: IMMER geschrieben (OK oder Alarm), damit man den
          # Zustand direkt aus der ZIP lesen kann, ohne den ganzen Bericht
          # zu oeffnen. FIX 2026-08-23 (Nutzerwunsch "in der zip soll auch
          # eine Meldung rein, Alarm es funktioniert nicht oder sonst was").
          # Wird auch als Body fuer den GitHub-Issue-Alarm-Step unten
          # wiederverwendet. Nutzt jetzt diagnose_probleme statt nur
          # rueckfaelle, damit Ledger-Ueberschneidung und Staleness genauso
          # zuverlaessig alarmieren wie ein Rueckfall-Fund.
          STATUS_FILE = "status.md"
          _trend_zeilen = [
              "",
              "**seen_db-Trend:**",
              f"- seit letztem Lauf: {_delta_letzter_txt}"
              + (f" (jetzt {gesamt_ips_jetzt:,})" if gesamt_ips_jetzt is not None else ""),
              f"- seit Zyklus-Start ({zyklus_start_str}): {_delta_zyklus_txt}",
              f"- letzter combined-Cleanup-Pass: {cleanup_text}",
              f"- neue IPs (Summe letzter Läufe): {neu_24h_text}",
              f"- entfernte IPs (Summe letzter Läufe): {entfernt_24h_text}",
              f"- Erfolgsquote letzte 16 combined-Läufe: "
              + ("🔍 " if reliability_auffaellig else "") + reliability_text,
          ]
          if diagnose_probleme:
              _status_zeilen = [
                  "# ❌ ALARM",
                  "",
                  f"**{len(diagnose_probleme)} Problem(e) erkannt:**",
                  "",
              ] + [f"- {p}" for p in diagnose_probleme] + [
                  "",
                  f"Lauf: {now_str}",
              ] + _trend_zeilen
              if rueckfaelle:
                  _status_zeilen += [
                      "",
                      "| Datei | Anzahl Rückfälle | Beispiele |",
                      "|---|---:|---|",
                  ]
                  for fname, ips in rueckfaelle.items():
                      beispiele = ", ".join(ips[:5]) + (", ..." if len(ips) > 5 else "")
                      _status_zeilen.append(f"| {fname} | {len(ips)} | {beispiele} |")
              _status_zeilen += [
                  "",
                  f"Voller Bericht: `{REPORT_FILE}` bzw. `reports/ip_ablauf_verifikation_report.zip` im Repo.",
              ]
          else:
              _status_zeilen = [
                  "# ✅ OK",
                  "",
                  f"0 Rückfälle - keine der {len(eingefrorene_ips):,} eingefrorenen IPs "
                  f"taucht in {len(geprueft_dateien)} geprueften Output-Dateien auf. "
                  f"Der Fix hält. Keine Ledger-Überschneidung, keine veralteten Daten.",
                  "",
                  f"Lauf: {now_str}",
              ] + _trend_zeilen
          write_text_atomic(STATUS_FILE, "\n".join(_status_zeilen) + "\n")
          print(f"{STATUS_FILE} geschrieben ({'ALARM' if diagnose_probleme else 'OK'})")

          # ── Report-ZIP: fester Pfad im Repo, ueberschreibt sich selbst ──
          # Ein per-Run-Artifact (siehe Upload-Step weiter unten) ist NICHT
          # "immer aktuell" - jeder Lauf erzeugt ein neues, eigenes Artifact,
          # das nach retention-days verfaellt und nur ueber die jeweilige
          # Run-Seite auffindbar ist. Wer nur alle paar Tage reinschaut,
          # muesste sich sonst den richtigen Run raussuchen. Deshalb
          # zusaetzlich an einem FESTEN Pfad im Repo, der bei JEDEM Lauf
          # ueberschrieben wird - ein Download-Link, immer aktuell, keine
          # Suche noetig. Enthaelt (via VERLAUF_FILE) die laufende 30-Tage-
          # Zyklus-Historie (siehe Zyklus-Reset-Logik oben) - startet alle
          # 30 Tage bewusst wieder bei 0, statt endlos weiterzuwachsen.
          import zipfile
          ZIP_FILE = "reports/ip_ablauf_verifikation_report.zip"
          ZIP_INHALT = [
              STATUS_FILE,
              REPORT_FILE,
              VERLAUF_FILE,
              "state/watchlist_expired_history.json",
              "state/active_expired_history.json",
              # FIX 2026-08-23 (Nutzerwunsch "alles Erfasste an einer Stelle"):
              # Prognose-Bericht aus dem Job "prognose" (derselben Datei,
              # anderer Job/Zeitplan) mit reinpacken. Kein Zusatzaufwand
              # noetig - "Checkout Repository" oben holt bei JEDEM
              # verifikation-Lauf ohnehin den zuletzt committeten Stand
              # dieser Datei mit, unabhaengig davon wie lange der letzte
              # woechentliche prognose-Lauf her ist. Kann beim allerersten
              # Lauf ueberhaupt (vor dem ersten prognose-Durchlauf) noch
              # fehlen - der existierende Existenz-Check unten faengt das ab.
              "reports/ip_ablauf.md",
              # FIX 2026-08-23 (Nutzerwunsch "run [...] in der anderen zip
              # speichern"): Log des neuesten combined-Laufs, siehe Step
              # "Combined-Blacklist Run-Log holen" oben. Existenz-Check
              # faengt sowohl den Fall "Log-Abruf fehlgeschlagen" als auch
              # "combined lief noch nie" ab.
              "combined_run.log",
          ]
          with zipfile.ZipFile(ZIP_FILE, "w", zipfile.ZIP_DEFLATED) as zf:
              for pfad in ZIP_INHALT:
                  if os.path.exists(pfad):
                      zf.write(pfad, arcname=os.path.basename(pfad))
                  else:
                      print(f"WARNUNG: {pfad} existiert nicht, wird nicht ins ZIP aufgenommen")
          _tage_im_zyklus = (today - datetime.strptime(zyklus_start_str, "%Y-%m-%d").date()).days
          print(f"{ZIP_FILE} geschrieben ({os.path.getsize(ZIP_FILE) / 1024:.1f} KB, "
                f"{len(verlauf)} Läufe seit Zyklus-Start {zyklus_start_str} "
                f"({_tage_im_zyklus}/{ZYKLUS_TAGE} Tage))")

          if diagnose_probleme:
              sys.exit(1)  # Job rot markieren, wenn irgendein Diagnose-Problem gefunden wurde
          EOF

      - name: Report-ZIP zusätzlich als Run-Artifact hochladen
        # if: always() - auch bei gefundenen Rueckfaellen (Job-Exit-Code 1
        # oben) soll das ZIP zum Download verfuegbar sein, gerade DANN ist
        # es fuer die Fehlersuche am wichtigsten.
        # WICHTIG: Das ist NUR eine Kopie dieses einen Laufs, 30 Tage gueltig.
        # Fuer den "immer aktuellen" Stand siehe reports/ip_ablauf_
        # verifikation_report.zip im Repo (wird unten mitcommittet).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ip-ablauf-verifikation-report-${{ github.run_id }}
          path: reports/ip_ablauf_verifikation_report.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Commit and Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ip_ablauf_verifikation_report.md \
            reports/ip_ablauf_verifikation_report.zip \
            state/ip_ablauf_verifikation_verlauf.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "IP-Ablauf-Verifikation: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            for attempt in 1 2 3; do
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs reports/ip_ablauf_verifikation_report.md \
                  reports/ip_ablauf_verifikation_report.zip \
                  state/ip_ablauf_verifikation_verlauf.json 2>/dev/null || true
                git add reports/ip_ablauf_verifikation_report.md \
                  reports/ip_ablauf_verifikation_report.zip \
                  state/ip_ablauf_verifikation_verlauf.json 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 3 Versuchen fehlgeschlagen"
            exit 1
          fi

      - name: Rückfall-Alarm (GitHub Issue) öffnen/aktualisieren
        # FIX 2026-08-23 (Nutzerwunsch "Meldung waere recht"): failure()
        # prueft den Status ALLER vorherigen Steps im Job - da nur der
        # Python-Step oben ueberhaupt fehlschlagen kann (Commit/Zip-Upload
        # laufen mit if:always() und schlagen bei einem reinen Rueckfall-
        # Fund selbst nicht fehl), zeigt failure() hier zuverlaessig genau
        # den Rueckfall-Fall an - unabhaengig davon, dass diese Steps hier
        # NACH dem "immer laufenden" Commit-Step stehen.
        # Sucht per REST-Liste (nicht gh-Suchindex, der verzoegert sein
        # kann) nach einem bereits offenen Issue mit exakt diesem Titel -
        # kommentiert es dann nur, statt bei jedem 3h-Lauf ein neues Issue
        # aufzumachen (kein Spam bei anhaltendem Problem).
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 IP-Ablauf: Rückfall erkannt"
          if [ ! -f status.md ]; then
            echo "WARNUNG: status.md fehlt (unerwarteter anderer Fehler?) - generischer Alarmtext."
            echo "Ein Rückfall wurde erkannt, aber die Detail-Datei fehlt. Siehe Workflow-Log dieses Laufs für Details." > status.md
          fi
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "Bestehendes Alarm-Issue #$EXISTING gefunden - kommentiere statt neu zu erstellen."
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file status.md
          else
            echo "Kein offenes Alarm-Issue gefunden - erstelle neues."
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file status.md
          fi

      - name: Rückfall-Alarm schließen, falls behoben
        # success() ist hier nur dann true, wenn der Python-Step (der
        # einzige Step, der bei einem Rueckfall fehlschlaegt) tatsaechlich
        # 0 Rueckfaelle gemeldet hat - unabhaengig vom Status der dazwischen
        # liegenden if:always()-Steps.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 IP-Ablauf: Rückfall erkannt"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "Offenes Alarm-Issue #$EXISTING gefunden - aktueller Lauf zeigt 0 Rückfälle, schließe."
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "✅ Behoben: Lauf vom $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z') zeigt 0 Rückfälle. Issue wird automatisch geschlossen."
            gh issue close "$EXISTING" --repo "${{ github.repository }}"
          else
            echo "Kein offenes Alarm-Issue vorhanden - nichts zu tun."
          fi
