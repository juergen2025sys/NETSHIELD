name: SniffCat Fetch (Artifact only)

# Nur manueller Start – bewusst KEIN "schedule:"-Trigger.
on:
  workflow_dispatch:
    inputs:
      confidence_min:
        description: 'confidenceMin-Parameter fuer die SniffCat-API (30-100)'
        required: false
        default: '50'
      retention_days:
        description: 'Wie lange das Artifact aufbewahrt wird (Tage)'
        required: false
        default: '7'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Nur Lesezugriff: dieser Workflow committet NICHTS ins Repo, das
# Ergebnis geht ausschliesslich als Actions-Artifact raus (nur fuer
# Personen mit Zugriff auf den Actions-Run/das Repo sichtbar/ladbar,
# nicht als Datei im Repo-Verlauf).
permissions:
  contents: read
  actions: read
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: sniffcat-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sniffcat-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # persist-credentials: false, weil dieser Workflow nichts zurueck-
      # pusht – im Unterschied zum bestehenden honeypot_monitor.yml wird
      # hier kein Commit/Push-Step benoetigt.
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch SniffCat IPs
        env:
          SNIFFCAT_TOKEN: ${{ secrets.SNIFFCAT_TOKEN }}
          SNIFFCAT_TOKEN_2: ${{ secrets.SNIFFCAT_TOKEN_2 }}
          SNIFFCAT_TOKEN_3: ${{ secrets.SNIFFCAT_TOKEN_3 }}
          SNIFFCAT_TOKEN_4: ${{ secrets.SNIFFCAT_TOKEN_4 }}
          CONFIDENCE_MIN: ${{ inputs.confidence_min }}
        run: |
          python3 -u << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          # Wiederverwendung der bereits im Repo vorhandenen, produktiv
          # genutzten Hilfsfunktionen (siehe honeypot_monitor.yml) statt
          # Parsing/Filterlogik neu zu erfinden.
          from netshield_common import (
              load_whitelist, load_fp_set, is_in_fp_set, is_whitelisted,
              parse_entries, sort_ips, write_text_atomic, fetch_url,
          )

          import urllib.request, urllib.error, os, time
          from datetime import datetime, timezone

          load_whitelist()
          load_fp_set()

          now = datetime.now(timezone.utc)
          now_str_utc = now.strftime("%Y-%m-%d %H:%M UTC")

          # ── fetch() 1:1 aus honeypot_monitor.yml uebernommen ───────────
          # (Key-Rotation ueber die 4 SNIFFCAT_TOKEN-Secrets bei 401/403/
          # 429/5xx – siehe dortige ausfuehrliche Kommentare zum Verhalten.)
          def fetch(url, timeout=30, retries=3, headers=None, total_timeout=None):
              if not headers:
                  return fetch_url(url, timeout=timeout, retries=retries,
                                    user_agent="NETSHIELD-SniffCatFetch/1.0",
                                    total_timeout=total_timeout)
              candidates = headers if isinstance(headers, list) else [headers]
              candidates = [c for c in candidates if all(c.values())]
              if not candidates:
                  return None
              last_fail_code = None
              for cand_idx, cand_headers in enumerate(candidates, start=1):
                  req_hdrs = {"User-Agent": "NETSHIELD-SniffCatFetch/1.0"}
                  req_hdrs.update(cand_headers)
                  for attempt in range(1, retries + 1):
                      try:
                          req = urllib.request.Request(url, headers=req_hdrs)
                          with urllib.request.urlopen(req, timeout=timeout) as r:
                              if cand_idx > 1:
                                  print(f"  {url}: Key #{cand_idx} erfolgreich "
                                        f"(Failover nach Key #{cand_idx - 1})")
                              return r.read().decode("utf-8", errors="ignore")
                      except urllib.error.HTTPError as e:
                          if e.code in (401, 403):
                              last_fail_code = e.code
                              nxt = ("naechster Key" if cand_idx < len(candidates)
                                     else "kein weiterer Key konfiguriert")
                              print(f"  HTTP {e.code} {url} (Key #{cand_idx}) – {nxt}")
                              break
                          if e.code in (429, 500, 502, 503, 504):
                              if attempt < retries:
                                  print(f"  HTTP {e.code} {url} – Retry {attempt}/{retries}")
                                  time.sleep(2 ** attempt)
                                  continue
                              last_fail_code = e.code
                              nxt = ("naechster Key" if cand_idx < len(candidates)
                                     else "kein weiterer Key konfiguriert")
                              print(f"  HTTP {e.code} {url} (Key #{cand_idx}, "
                                    f"Retries erschoepft) – {nxt}")
                              break
                          print(f"  FEHLER HTTP {e.code} {url}")
                          return None
                      except Exception as e:
                          if attempt < retries:
                              time.sleep(2 ** attempt)
                          else:
                              print(f"  FEHLER {url} (nach {retries} Versuchen): {e}")
              if last_fail_code is not None:
                  print(f"  FEHLER HTTP {last_fail_code} {url} – "
                        f"alle {len(candidates)} Key(s) fehlgeschlagen")
              return None

          confidence_min = os.environ.get("CONFIDENCE_MIN", "50").strip() or "50"
          SNIFFCAT_URL = (
              f"https://api.sniffcat.com/api/v1/blacklist"
              f"?confidenceMin={confidence_min}&ipVersion=4&limit=100000"
          )

          AUTH_HEADERS = [
              {"X-Secret-Token": os.environ.get("SNIFFCAT_TOKEN", "")},
              {"X-Secret-Token": os.environ.get("SNIFFCAT_TOKEN_2", "")},
              {"X-Secret-Token": os.environ.get("SNIFFCAT_TOKEN_3", "")},
              {"X-Secret-Token": os.environ.get("SNIFFCAT_TOKEN_4", "")},
          ]
          if not any(all(c.values()) for c in AUTH_HEADERS):
              print("::error ::Kein SNIFFCAT_TOKEN(_2/_3/_4)-Secret gesetzt – Abbruch")
              raise SystemExit(1)

          text = fetch(SNIFFCAT_URL, headers=AUTH_HEADERS, total_timeout=60, retries=2)
          if text is None:
              print("::error ::SniffCat nicht erreichbar/authentifizierbar – Abbruch")
              raise SystemExit(1)

          ips = parse_entries(text, use_protected_check=True)
          # FP- und Whitelist-Filter, analog honeypot_monitor.yml.
          fp_removed = {ip for ip in ips if is_in_fp_set(ip)}
          ips -= fp_removed
          wl_removed = {ip for ip in ips if is_whitelisted(ip)}
          ips -= wl_removed
          final_ips = sort_ips(ips)

          print(f"SniffCat: {len(final_ips)} IPs "
                f"({len(fp_removed)} FP-gefiltert, {len(wl_removed)} whitelist-gefiltert)")

          if not final_ips:
              print("::warning ::0 IPs aus SniffCat geparst – kein Artifact-Inhalt")

          # WICHTIG: Datei wird bewusst NICHT im Repo-Arbeitsverzeichnis
          # committet/gepusht – sie existiert nur im Runner-Dateisystem und
          # geht ausschliesslich ueber actions/upload-artifact raus (siehe
          # naechster Step). Kein "git add/commit/push" in diesem Workflow.
          write_text_atomic(
              "sniffcat_ips.txt",
              "\n".join([
                  "# SniffCat Honeypot IP Blacklist",
                  f"# Abgerufen: {now_str_utc}",
                  f"# confidenceMin={confidence_min} | Gesamt: {len(final_ips)}",
                  "",
                  *final_ips,
              ]) + "\n",
          )
          print("sniffcat_ips.txt geschrieben (lokal, wird als Artifact hochgeladen)")
          EOF

      - name: Upload als Artifact (kein Repo-Commit)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sniffcat-ips-${{ github.run_id }}
          path: sniffcat_ips.txt
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: error
