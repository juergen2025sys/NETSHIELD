# Action updates require human review, including Patch/Minor changes.
# A cooldown delays updates but does not establish that new code is safe.
name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Guard gegen haengende Runs (Default: 360min)
    timeout-minutes: 10

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Request review for Patch/Minor (kein Automerge)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr comment "$PR_URL" --body "Action-Update: Bitte den neuen Commit und die Aenderungen vor dem Merge manuell pruefen. Patch-/Minor-Version und Cooldown ersetzen keine Sicherheitspruefung. Automatischer Merge wird von diesem Workflow nicht aktiviert."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Major-Update markieren (kein Automerge)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "Major-Version-Update - kein automatischer Merge. Bitte manuell pruefen, ob sich mit der neuen Major-Version etwas Grundlegendes an der Action geaendert hat, bevor gemergt wird. (Der konfigurierte Cooldown ersetzt keine manuelle Sicherheitspruefung.)"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
