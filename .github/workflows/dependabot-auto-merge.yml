# FIX SUPPLY-CHAIN-COOLDOWN-AUTOMERGE (2026-09-03, Security-Review): Vorherige
# Iteration hatte Auto-Merge komplett deaktiviert, weil ein reines Semver-Gate
# (nur Major manuell) NICHT vor einer Action schuetzt, die absichtlich als
# unauffaelliger Patch/Minor-Bump getarnt kompromittiert wird - genau dieses
# Muster wurde beim "keyv"-npm-Wurm (Aug 2026) beobachtet.
# Die eigentliche Verteidigung dagegen sitzt jetzt in ../dependabot.yml
# (cooldown: default-days: 2): Dependabot legt einen PR erst an, wenn die
# Action-Version mindestens 2 Tage alt ist - kompromittierte Releases werden
# in der Praxis meist innerhalb weniger Stunden erkannt und zurueckgezogen
# (axios ~3h, TanStack ~1.5h). Ein PR, den dieser Workflow ueberhaupt zu
# sehen bekommt, hat dieses Fenster also schon unbeschadet ueberstanden. Patch/Minor darf deshalb wieder automatisch
# gemergt werden. Major bleibt zusaetzlich manuell (groessere Code-Aenderung
# pro Bump, unabhaengig vom Cooldown ein sinnvoller Extra-Blick).
name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# WICHTIG (2026-08-18): "contents: read reicht" war FALSCH – der GraphQL-
# Mutation mergePullRequest (genutzt von "gh pr merge --auto") braucht
# contents: write, nicht nur pull-requests: write. Mit nur contents: read
# schlug der automerge-Job fehl: "GraphQL: Resource not accessible by
# integration (mergePullRequest)" (Run 87225542137, PR #31).
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Guard gegen haengende Runs (Default: 360min)
    timeout-minutes: 10

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Patch/Minor (cooldown-geschuetzt)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Major-Update markieren (kein Automerge)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "Major-Version-Update - kein automatischer Merge. Bitte manuell pruefen, ob sich mit der neuen Major-Version etwas Grundlegendes an der Action geaendert hat, bevor gemergt wird. (Der 7-Tage-Cooldown in dependabot.yml gilt auch hier, ist bei einer groesseren Aenderung aber kein Ersatz fuer einen kurzen manuellen Blick.)"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
