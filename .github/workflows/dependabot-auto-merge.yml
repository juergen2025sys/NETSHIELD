name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# WICHTIG (2026-08-18): "contents: read reicht" war FALSCH – der GraphQL-
# Mutation mergePullRequest (genutzt von "gh pr merge --auto") braucht
# contents: write, nicht nur pull-requests: write. Mit nur contents: read
# schlug der automerge-Job fehl: "GraphQL: Resource not accessible by
# integration (mergePullRequest)" (Run 87225542137, PR #31).
# Quelle: docs.github.com/.../troubleshooting-dependabot-on-github-actions
# ("By default ... GITHUB_TOKEN ... read-only ... permissions key ...
# increase the access") + community.github.com Diskussionen zu
# mergePullRequest & contents:write.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Guard gegen haengende Runs (Default: 360min)
    timeout-minutes: 10

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
