name: TEST Ledger-Release-Roundtrip

# ══════════════════════════════════════════════════════════════════
# Zweck: Prueft die Ledger-Schreib-, Upload-, Download- und Lesekette
# unter ECHTEN GitHub-Actions-Bedingungen - also genau den Teil, der
# sich lokal nicht nachstellen laesst (gh release upload, Tokens,
# Asset-Handling). Alles andere (Kompression, Split, JSON-Roundtrip)
# ist bereits lokal geprueft und wird hier nur mitverifiziert.
#
# Getestet werden konkret:
#   1. Schreiben mit separators=(",",":") + numerisch sortierten IPs
#      (FIX LEDGER-SIZE 2026-08-28)
#   2. gzip -9 + split -b 95M  (identische Befehle wie im Original)
#   3. gh release upload --clobber + Draft-Toggle
#   4. gh release download mit demselben --pattern
#   5. Beide Lesepfade: Python gzip.GzipFile (in-memory, BytesIO) und
#      cat | gunzip (wie in ip_ablauf.yml)
#   6. Bug-19-Szenario: nur EIN Ledger geaendert -> das Glob-Muster des
#      unveraenderten darf den Step nicht mit Exit-Code 2 abreissen
#   7. Rueckwaertskompatibilitaet: ein mit gzip -6 und indent=2
#      geschriebenes Alt-Asset muss weiterhin lesbar sein
#
# SICHERHEIT: Der Test benutzt ein EIGENES Release ("test-ledger-
# roundtrip") und eigene Dateinamen unter state/TEST_*. Das echte
# "anti-churn-ledger-backup"-Release und die echten Ledger-Dateien
# werden nie angefasst. Am Ende wird das Test-Release wieder geloescht
# (abschaltbar per Input).
#
# Rein manuell ausloesbar - kein Schedule, kein Push-Trigger.
# ══════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      eintraege:
        description: "Anzahl Test-Eintraege im Probe-Ledger"
        required: false
        default: "200000"
      aufraeumen:
        description: "Test-Release am Ende wieder loeschen"
        type: boolean
        required: false
        default: true

permissions:
  contents: write   # fuer gh release create/upload/delete

concurrency:
  group: test-ledger-roundtrip
  cancel-in-progress: false

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEST_TAG: test-ledger-roundtrip
      ANZAHL: ${{ inputs.eintraege }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sicherheitscheck - echtes Ledger-Release darf nicht das Ziel sein
        run: |
          set -euo pipefail
          if [ "$TEST_TAG" = "anti-churn-ledger-backup" ]; then
            echo "::error ::TEST_TAG zeigt auf das ECHTE Ledger-Release - Abbruch."
            exit 1
          fi
          echo "Ziel-Release: $TEST_TAG (nicht das produktive anti-churn-ledger-backup)"

      - name: Probe-Ledger erzeugen (neue Schreiblogik)
        run: |
          set -euo pipefail
          mkdir -p state
          python3 << 'EOF'
          import json, os, random, ipaddress, socket, struct, sys
          sys.path.insert(0, "scripts")
          from netshield_common import write_json_atomic

          # _ip_sort_key: woertlich wie in update_combined_blacklist.yml
          def _ip_sort_key(e):
              try:
                  return (struct.unpack('!I', socket.inet_aton(e.split('/')[0]))[0], e)
              except (OSError, AttributeError, TypeError, ValueError):
                  return (0xFFFFFFFF, repr(e))

          n = int(os.environ.get("ANZAHL", "200000"))
          random.seed(20260828)
          eintraege = {}
          while len(eintraege) < n:
              ip = str(ipaddress.IPv4Address(random.randint(0x01000000, 0xDFFFFFFF)))
              eintraege[ip] = {"first": "2026-05-14", "eingefroren_am": "2026-08-20"}

          # Ein paar Alt-Format-Eintraege (reine Datums-Strings aus der Zeit
          # vor Bug 17) einmischen - die muessen den Roundtrip ueberstehen.
          for k in list(eintraege)[:50]:
              eintraege[k] = "2026-04-01"

          # Exakt die Schreiblogik aus update_combined_blacklist.yml
          write_json_atomic("state/TEST_watchlist_expired_history_upload.json", {
              "updated": "TEST-Lauf",
              "count":   len(eintraege),
              "entries": {k: eintraege[k] for k in sorted(eintraege, key=_ip_sort_key)},
          }, separators=(",", ":"))

          # Referenz fuer den spaeteren Vergleich
          write_json_atomic("referenz.json", eintraege, separators=(",", ":"))
          print(f"Probe-Ledger: {len(eintraege)} Eintraege "
                f"({os.path.getsize('state/TEST_watchlist_expired_history_upload.json')/1024**2:.2f} MB roh)")

          # Sortierung verifizieren
          with open("state/TEST_watchlist_expired_history_upload.json") as f:
              geschrieben = json.load(f)["entries"]
          assert list(geschrieben) == sorted(eintraege, key=_ip_sort_key), "Sortierung falsch"
          print("Sortierung: OK")
          EOF

      - name: Komprimieren und splitten (identische Befehle wie im Original)
        run: |
          set -euo pipefail
          LEDGER_NAME=TEST_watchlist_expired_history
          rm -f "state/${LEDGER_NAME}.json.gz" state/${LEDGER_NAME}.json.gz.part*
          gzip -9 -c "state/${LEDGER_NAME}_upload.json" > "state/${LEDGER_NAME}.json.gz.tmp"
          split -b 95M -d -a 3 "state/${LEDGER_NAME}.json.gz.tmp" "state/${LEDGER_NAME}.json.gz.part"
          rm -f "state/${LEDGER_NAME}.json.gz.tmp"
          PART_COUNT=$(ls state/${LEDGER_NAME}.json.gz.part* 2>/dev/null | wc -l | tr -d ' ')
          GROESSE=$(du -ch state/${LEDGER_NAME}.json.gz.part* | tail -1 | awk '{print $1}')
          echo "komprimiert: ${PART_COUNT} Part(s), ${GROESSE}"
          # Vergleichsdatei im ALTEN Format fuer den Rueckwaertskompatibi-
          # litaets-Test und den Groessenvergleich weiter unten.
          # WICHTIG: Sie muss aus der UNSORTIERTEN Referenz gebaut werden
          # (referenz.json steht in Einfuegereihenfolge), nicht aus der
          # bereits sortierten Upload-Datei. Sonst steckt die Sortierung -
          # der groesste Einzelgewinn - in BEIDEN Dateien und der
          # Groessenvergleich untertreibt die tatsaechliche Ersparnis
          # massiv (gemessen: 9% statt 28%).
          python3 -c "
          import json
          eintraege = json.load(open('referenz.json'))
          json.dump({'updated': 'TEST-Lauf', 'count': len(eintraege),
                     'entries': eintraege},
                    open('state/TEST_alt_format.json','w'), indent=2)
          "
          gzip -6 -c state/TEST_alt_format.json > state/TEST_alt_expired_history.json.gz.part000
          rm -f state/TEST_alt_format.json
          echo "Alt-Format-Vergleichsdatei erzeugt (unsortiert, indent=2, gzip -6)"

      - name: Bug-19-Szenario - nur EIN Ledger geaendert
        run: |
          set -euo pipefail
          # Im Original wird ALLE_PARTS nur noch aus den TATSAECHLICH
          # geaenderten Ledgern gebaut. Hier bewusst nur "watchlist"
          # geaendert, "active" existiert gar nicht - der Step darf
          # trotzdem nicht abbrechen (Bug 19: ls lieferte Exit-Code 2,
          # was unter bash -e die ganze Zuweisung abriss).
          GEAENDERTE_LEDGER=" TEST_watchlist_expired_history TEST_alt_expired_history"
          ALLE_PARTS=""
          for LEDGER_NAME in $GEAENDERTE_LEDGER; do
            ALLE_PARTS="${ALLE_PARTS} $(ls state/${LEDGER_NAME}.json.gz.part* 2>/dev/null)"
          done
          echo "ALLE_PARTS =${ALLE_PARTS}"
          if [ -z "${ALLE_PARTS// /}" ]; then
            echo "::error ::ALLE_PARTS ist leer - Glob-Aufbau fehlerhaft"
            exit 1
          fi
          echo "$ALLE_PARTS" > /tmp/alle_parts.txt
          echo "Bug-19-Muster: kein Abbruch, Parts korrekt gesammelt"

      - name: Upload ins Test-Release (create/upload --clobber, Draft-Toggle)
        run: |
          set -euo pipefail
          ALLE_PARTS=$(cat /tmp/alle_parts.txt)
          if gh release view "$TEST_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TEST_TAG" $ALLE_PARTS --repo "${{ github.repository }}" --clobber
            gh release edit "$TEST_TAG" --repo "${{ github.repository }}" --draft=false 2>/dev/null || true
            echo "Test-Release aktualisiert"
          else
            gh release create "$TEST_TAG" $ALLE_PARTS --repo "${{ github.repository }}" \
              --title "TEST Ledger-Roundtrip" \
              --notes "Automatischer Testlauf des Ledger-Release-Roundtrips. Wird nach dem Test geloescht. KEINE produktiven Daten."
            echo "Test-Release angelegt"
          fi
          # Draft-Toggle wie im Original (frischt den Anzeige-Zeitstempel auf)
          if gh release edit "$TEST_TAG" --repo "${{ github.repository }}" --draft=true 2>/dev/null; then
            if gh release edit "$TEST_TAG" --repo "${{ github.repository }}" --draft=false 2>/dev/null; then
              echo "Draft-Toggle: OK"
            else
              echo "::error ::Draft-Toggle haengengeblieben - Release ist noch Draft"
              exit 1
            fi
          else
            echo "Draft-Toggle uebersprungen (draft=true fehlgeschlagen)"
          fi
          echo "--- Assets im Test-Release ---"
          gh release view "$TEST_TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'

      - name: Lokale Dateien loeschen (Download muss echt sein)
        run: |
          set -euo pipefail
          rm -f state/TEST_*.json state/TEST_*.json.gz.part*
          echo "Lokal verbleibend:"
          ls -la state/ | grep TEST || echo "  (nichts) - korrekt"

      - name: Download aus dem Test-Release (gleiches --pattern wie im Original)
        run: |
          set -euo pipefail
          mkdir -p state
          if gh release download "$TEST_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "*_expired_history.json.gz.part*" \
              --dir state/; then
            WL_COUNT=$(ls state/TEST_watchlist_expired_history.json.gz.part* 2>/dev/null | wc -l | tr -d ' ')
            echo "heruntergeladen: ${WL_COUNT} Watchlist-Part(s)"
          else
            echo "::error ::Download fehlgeschlagen"
            exit 1
          fi

      - name: Lesepfad A - Python gzip.GzipFile in-memory
        run: |
          set -euo pipefail
          python3 << 'EOF'
          import glob, gzip, io, json, sys

          # Woertlich die Funktion aus update_combined_blacklist.yml
          def _lade_ledger_von_release(_glob_muster):
              _teile = sorted(glob.glob(_glob_muster))
              if not _teile:
                  return {}, 0
              _puffer = io.BytesIO()
              for _teil in _teile:
                  with open(_teil, "rb") as _tf:
                      while True:
                          _chunk = _tf.read(1024 * 1024)
                          if not _chunk:
                              break
                          _puffer.write(_chunk)
              _puffer.seek(0)
              with gzip.GzipFile(fileobj=_puffer, mode="rb") as _gz:
                  _daten = json.loads(_gz.read().decode("utf-8"))
              return dict(_daten.get("entries", {})), len(_teile)

          gelesen, parts = _lade_ledger_von_release(
              "state/TEST_watchlist_expired_history.json.gz.part*")
          referenz = json.load(open("referenz.json"))

          print(f"gelesen: {len(gelesen)} Eintraege aus {parts} Part(s)")
          if gelesen != referenz:
              fehlend = set(referenz) - set(gelesen)
              extra   = set(gelesen) - set(referenz)
              print(f"::error ::Roundtrip NICHT identisch. "
                    f"fehlend={len(fehlend)} zusaetzlich={len(extra)}")
              sys.exit(1)
          print("Lesepfad A: Roundtrip identisch - OK")

          # Alt-/Neuformat-Normalisierung wie im Workflow
          norm = {ip: (w if isinstance(w, dict) else {"first": w, "eingefroren_am": w})
                  for ip, w in gelesen.items()}
          alt = sum(1 for w in gelesen.values() if not isinstance(w, dict))
          assert all(isinstance(v, dict) for v in norm.values())
          print(f"Alt-Format-Eintraege korrekt normalisiert: {alt}")
          EOF

      - name: Lesepfad B - cat | gunzip (wie in ip_ablauf.yml)
        run: |
          set -euo pipefail
          cat state/TEST_watchlist_expired_history.json.gz.part* | gunzip > /tmp/wieder.json
          python3 << 'EOF'
          import json, sys
          daten = json.load(open("/tmp/wieder.json"))
          eintraege = daten.get("entries", {})
          referenz  = json.load(open("referenz.json"))
          ips = set(eintraege.keys())
          print(f"gelesen: {len(ips)} IPs")
          if ips != set(referenz):
              print("::error ::IP-Menge weicht ab")
              sys.exit(1)
          # Wertzugriff wie im prognose-Job
          treffer = 0
          for _ip, _e in eintraege.items():
              _d = _e.get("first") if isinstance(_e, dict) else _e
              if _d:
                  treffer += 1
          if treffer != len(referenz):
              print(f"::error ::Nur {treffer} von {len(referenz)} Datumswerten lesbar")
              sys.exit(1)
          print("Lesepfad B: alle IPs und Datumswerte lesbar - OK")
          EOF

      - name: Rueckwaertskompatibilitaet - Alt-Format-Asset lesen
        run: |
          set -euo pipefail
          python3 << 'EOF'
          import glob, gzip, io, json, sys
          teile = sorted(glob.glob("state/TEST_alt_expired_history.json.gz.part*"))
          if not teile:
              print("::error ::Alt-Format-Asset nicht heruntergeladen")
              sys.exit(1)
          puffer = io.BytesIO()
          for t in teile:
              puffer.write(open(t, "rb").read())
          puffer.seek(0)
          with gzip.GzipFile(fileobj=puffer, mode="rb") as gz:
              daten = json.loads(gz.read().decode("utf-8"))
          referenz = json.load(open("referenz.json"))
          if dict(daten.get("entries", {})) != referenz:
              print("::error ::Alt-Format (indent=2, gzip -6) nicht korrekt lesbar")
              sys.exit(1)
          print(f"Alt-Format-Asset (indent=2, gzip -6): {len(referenz)} Eintraege - OK")
          EOF

      - name: Groessenvergleich alt vs. neu
        run: |
          set -euo pipefail
          NEU=$(cat state/TEST_watchlist_expired_history.json.gz.part* | wc -c)
          ALT=$(cat state/TEST_alt_expired_history.json.gz.part* | wc -c)
          python3 -c "
          neu, alt = $NEU, $ALT
          print(f'alt (indent=2, gzip -6): {alt/1024**2:6.2f} MB')
          print(f'neu (kompakt, gzip -9) : {neu/1024**2:6.2f} MB')
          print(f'Ersparnis              : {100-100*neu/alt:5.1f} %')
          "

      - name: Test-Release aufraeumen
        if: always() && inputs.aufraeumen
        run: |
          set +e
          gh release delete "$TEST_TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null \
            && echo "Test-Release geloescht" \
            || echo "Test-Release konnte nicht geloescht werden (evtl. nie angelegt) - bitte ggf. manuell pruefen"
          rm -f state/TEST_* referenz.json
          exit 0

      - name: Ergebnis
        if: success()
        run: |
          echo "=================================================="
          echo " Ledger-Release-Roundtrip vollstaendig bestanden"
          echo "=================================================="
          echo " - Schreiben (kompakt + sortiert)      OK"
          echo " - gzip -9 + split                     OK"
          echo " - Bug-19-Glob-Muster                  OK"
          echo " - Release-Upload + Draft-Toggle       OK"
          echo " - Release-Download                    OK"
          echo " - Lesepfad A (Python, in-memory)      OK"
          echo " - Lesepfad B (cat | gunzip)           OK"
          echo " - Alt-Format-Kompatibilitaet          OK"
