          # Auth-pflichtige Feeds: name -> LISTE von HTTP-Header-Dicts, in
          # Prioritaets-Reihenfolge (Primaer-Key zuerst, dann Failover-Keys).
          # FIX KEY-ROTATION (2026-07-25): Zweiter Key pro Feed fuer nahtlose
          # Rotation: solange der Primaer-Key gueltig ist, wird ausschliesslich
          # er benutzt (keine Doppel-Last auf dem Provider). Liefert der
          # Primaer-Key HTTP 401/403 (z.B. nach Ablauf/Widerruf beim Provider),
          # greift fetch() automatisch auf den Zweit-Key zurueck – kein
          # Feed-Ausfall waehrend des Rotations-Fensters, in dem man den alten
          # Key beim Provider deaktiviert und den neuen als _2-Secret eintraegt.
          # Ist ein Kandidat leer (Secret nicht gesetzt), wird er von fetch()
          # automatisch rausgefiltert. Sind ALLE Kandidaten eines Feeds leer,
          # wird der Feed in der Schleife unten uebersprungen statt 401 zu
          # erzeugen (unveraendertes Verhalten ggue. vorher).
          AUTH_HEADERS = {
              "sniffcat": [
                  {"X-Secret-Token": os.environ.get("SNIFFCAT_TOKEN", "")},
                  {"X-Secret-Token": os.environ.get("SNIFFCAT_TOKEN_2", "")},
                  {"X-Secret-Token": os.environ.get("SNIFFCAT_TOKEN_3", "")},
                  {"X-Secret-Token": os.environ.get("SNIFFCAT_TOKEN_4", "")},
              ],
              "reportedip": [
                  {"X-Key": os.environ.get("REPORTEDIP_KEY", "")},
                  {"X-Key": os.environ.get("REPORTEDIP_KEY_2", "")},
              ],
          }

          all_ips = set()
          stats   = {}
          feed_ip_sets = {}   # FRESHNESS: pro Feed die IP-Menge behalten (nicht
                               # nur die Anzahl), um Aenderungen zwischen Laeufen
                               # per Hash zu erkennen (siehe Freshness-Block unten).
          # FIX JB-DIAG: Transport-Fehler von leerem Feed trennen.
          # Vorher kollabierten beide Faelle auf stats[name]=0 und wurden im
          # Report identisch als ❌ 0 gerendert – man sah nicht, ob der Feed
          # nicht erreichbar war (None) oder erreichbar-aber-leer (0 geparst).
          # Genau dieser Unterschied war bei jamesbrine die Debugging-Huerde.
          fetch_failed = set()   # text is None (DNS/403/Timeout/gzip-bomb-Abbruch)
          skipped      = set()   # bewusst uebersprungen (fehlendes Auth-Secret)

          for name, url in HONEYPOT_SOURCES.items():
              # FIX AUTH: Auth-pflichtige Feeds ohne gueltigen Token ueberspringen.
              # auth ist jetzt eine Liste von Kandidaten-Dicts (Key-Rotation) –
              # nur skippen wenn KEIN Kandidat einen gesetzten Wert hat.
              auth = AUTH_HEADERS.get(name)
              if auth is not None and not any(all(c.values()) for c in auth):
                  missing = sorted({k for c in auth for k, v in c.items() if not v})
                  print(f"  SKIP {name}: Auth-Header fehlt ({', '.join(missing)}) – "
                        f"GitHub-Secret nicht gesetzt")
                  stats[name] = 0
                  skipped.add(name)
                  continue
              if name in LARGE_SOURCES:
                  text = fetch_large(url)
              else:
                  text = fetch(url, headers=auth)
              if text is None:
                  # Transport-Fehler: fetch_url hat den konkreten HTTP-Code /
                  # die Ursache bereits oben geloggt (z.B. "FEHLER HTTP 403").
                  stats[name] = 0
                  fetch_failed.add(name)
                  print(f"  {name}: FETCH FEHLGESCHLAGEN (None) – Feed nicht "
                        f"erreichbar/abgewiesen, siehe HTTP-Fehler oben")
                  print(f"::warning ::Honeypot-Feed {name} nicht erreichbar "
                        f"(fetch=None) – {url}")
                  continue
              # FIX BUG-WL7: use_protected_check=True → Whitelist-IPs
              # werden bereits beim Parsen herausgefiltert.
              ips = parse_entries(text, use_protected_check=True)
              all_ips.update(ips)
              stats[name] = len(ips)
              feed_ip_sets[name] = ips
              print(f"  {name}: {len(ips)} IPs ({len(text)} bytes geladen)")
              # Erreichbar-aber-0 ist ebenfalls verdaechtig (Format-Wechsel,
              # Challenge-HTML statt CSV): als Warnung sichtbar machen, ohne
              # es als Transport-Fehler zu zaehlen.
              if not ips:
                  head = text.lstrip()[:120].replace("\n", " ")
                  print(f"  WARNUNG {name}: 0 IPs aus {len(text)} bytes geparst – "
                        f"moeglicher Format-Wechsel. Anfang: {head!r}")
                  print(f"::warning ::Honeypot-Feed {name} lieferte Daten aber "
                        f"0 gueltige IPs – Format pruefen")

          # ══════════════════════════════════════════════════════════════════
          # ThreatFox Export (authentifiziert) – Sonderfall, ERGAENZT 2026-07-25
          #
          # Laeuft NICHT ueber die generische HONEYPOT_SOURCES-Schleife oben,
          # weil zwei Dinge nicht ins bestehende Muster passen:
          #   1. Auth erfolgt ueber einen in die URL eingebetteten Key
          #      (threatfox-api.abuse.ch/v2/files/exports/{KEY}/full.csv.zip),
          #      nicht ueber einen HTTP-Header wie bei AUTH_HEADERS/sniffcat.
          #   2. Die Antwort ist ein binaeres ZIP, nicht Text - fetch()/
          #      fetch_large() (und darunter fetch_url() aus netshield_common)
          #      dekodieren IMMER als UTF-8-Text, was ein ZIP korrumpieren
          #      wuerde. Deshalb eigener binaersicherer Download hier.
          #
          # WICHTIG (Architektur-Entscheidung 2026-07-25): threatfox_ioc
          # (elliotwutingfeng-Mirror) und threatfox_direct (unauth. recent-CSV)
          # wurden im GLEICHEN Zug aus update_combined_blacklist.yml SOURCES
          # entfernt. Vorher waeren ThreatFox-IPs dreifach gezaehlt worden
          # (2x dort + 1x hier als LOCAL_FEED honeypot_ips.txt, HQ=True) -
          # genau das Duplikat-Problem, vor dem der HONEYPOT_SOURCES-Kommentar
          # oben warnt. Jetzt gibt es nur noch DIESE eine ThreatFox-Quelle im
          # gesamten Repo, dafuer mit dem vollen 6-Monats-Datenbestand statt
          # der vorherigen ~2-Wochen-Fenster.
          #
          # full.csv.zip enthaelt ALLE IOC-Typen gemischt (ip:port, domain,
          # url, hash) - Filterung auf ioc_type=ip:port erfolgt unten nach
          # dem Entpacken. Header-basiertes Spalten-Mapping statt fester
          # Positionen, weil sich das Schema zwischen ThreatFox-Exportarten
          # unterscheiden kann (verifiziert 2026-07-24).
          # FIX KEY-ROTATION (2026-07-25): analog zu AUTH_HEADERS oben, aber
          # der ThreatFox-Key steckt in der URL statt in einem Header ->
          # eigene Kandidaten-Liste statt Header-Dict. Reihenfolge = Prioritaet
          # (Primaer-Key zuerst), leere/nicht gesetzte Keys werden gefiltert.
          THREATFOX_AUTH_KEY   = os.environ.get("THREATFOX_AUTH_KEY", "").strip()
          THREATFOX_AUTH_KEY_2 = os.environ.get("THREATFOX_AUTH_KEY_2", "").strip()
          THREATFOX_KEYS = [k for k in (THREATFOX_AUTH_KEY, THREATFOX_AUTH_KEY_2) if k]
          if not THREATFOX_KEYS:
              print("  SKIP threatfox_export: THREATFOX_AUTH_KEY nicht gesetzt – "
                    "GitHub-Secret fehlt")
              stats["threatfox_export"] = 0
              skipped.add("threatfox_export")
          else:
              import zipfile
              TF_READ_LIMIT = 150 * 1024 * 1024  # 150 MB Sicherheitsgrenze

              def _tf_fetch_binary(keys, retries=3, timeout=60):
                  # Kandidaten der Reihe nach versuchen. Bei 401/403 (Key
                  # ungueltig/rotiert) sofort zum naechsten Key wechseln statt
                  # denselben ungueltigen Key erneut zu retryen.
                  last_auth_fail_code = None
                  for key_idx, key in enumerate(keys, start=1):
                      url = (f"https://threatfox-api.abuse.ch/v2/files/exports/"
                             f"{key}/full.csv.zip")
                      for attempt in range(1, retries + 1):
                          req = urllib.request.Request(
                              url, headers={"User-Agent": "NETSHIELD-HoneypotMonitor-ThreatFox/1.0"}
                          )
                          try:
                              with urllib.request.urlopen(req, timeout=timeout) as r:
                                  data = r.read(TF_READ_LIMIT + 1)
                                  if len(data) > TF_READ_LIMIT:
                                      print(f"  FEHLER threatfox_export: Antwort > "
                                            f"{TF_READ_LIMIT} bytes – Abbruch")
                                      return None
                                  if key_idx > 1:
                                      print(f"  threatfox_export: Key #{key_idx} erfolgreich "
                                            f"(Failover nach Key #{key_idx - 1})")
                                  return data
                          except urllib.error.HTTPError as e:
                              if e.code in (401, 403):
                                  last_auth_fail_code = e.code
                                  nxt = ("naechster Key" if key_idx < len(keys)
                                         else "kein weiterer Key konfiguriert")
                                  print(f"  HTTP {e.code} threatfox_export "
                                        f"(Key #{key_idx}) – {nxt}")
                                  break
                              print(f"  HTTP {e.code} threatfox_export "
                                    f"(Key #{key_idx}, Versuch {attempt}/{retries})")
                              if attempt < retries:
                                  time.sleep(2 ** attempt)
                                  continue
                              break
                          except Exception as e:
                              if attempt < retries:
                                  time.sleep(2 ** attempt)
                              else:
                                  print(f"  FEHLER threatfox_export (Key #{key_idx}, "
                                        f"nach {retries} Versuchen): {e}")
                  if last_auth_fail_code is not None:
                      print(f"  FEHLER HTTP {last_auth_fail_code} threatfox_export – "
                            f"alle {len(keys)} Key(s) fehlgeschlagen")
                  return None

              tf_raw = _tf_fetch_binary(THREATFOX_KEYS)
              if tf_raw is None:
                  stats["threatfox_export"] = 0
                  fetch_failed.add("threatfox_export")
                  print("  threatfox_export: FETCH FEHLGESCHLAGEN (None)")
                  print("::warning ::Honeypot-Feed threatfox_export nicht "
                        "erreichbar (fetch=None)")
              else:
                  try:
                      tf_zf = zipfile.ZipFile(__import__("io").BytesIO(tf_raw))
                      tf_csv_names = [n for n in tf_zf.namelist() if n.lower().endswith(".csv")]
                      if not tf_csv_names:
                          raise ValueError(f"keine .csv im ZIP: {tf_zf.namelist()}")
                      with tf_zf.open(tf_csv_names[0]) as f:
                          tf_text = f.read().decode("utf-8", errors="ignore")
                  except Exception as e:
                      stats["threatfox_export"] = 0
                      fetch_failed.add("threatfox_export")
                      print(f"  threatfox_export: ZIP/Entpacken fehlgeschlagen: {e}")
                      print("::warning ::Honeypot-Feed threatfox_export lieferte "
                            "kein gueltiges ZIP – Auth-Key pruefen")
                      tf_text = None

                  if tf_text is not None:
                      tf_lines = tf_text.splitlines()
                      # Header dynamisch finden (Kommentarzeile "# \"first_seen_utc\",...")
                      tf_col_index = {}
                      for ln in tf_lines:
                          stripped = ln.lstrip("#").strip()
                          if stripped.startswith('"first_seen_utc"'):
                              tf_header_row = next(csv.reader([stripped], skipinitialspace=True))
                              tf_col_index = {n.strip(): i for i, n in enumerate(tf_header_row)}
                              break

                      if "ioc_value" not in tf_col_index or "ioc_type" not in tf_col_index:
                          stats["threatfox_export"] = 0
                          fetch_failed.add("threatfox_export")
                          print(f"  threatfox_export: Header mit 'ioc_value'/"
                                f"'ioc_type' nicht gefunden – Schema unerwartet")
                          print("::warning ::Honeypot-Feed threatfox_export – "
                                "unerwartetes CSV-Schema")
                      else:
                          tf_idx_value = tf_col_index["ioc_value"]
                          tf_idx_type = tf_col_index["ioc_type"]
                          tf_data_lines = [ln for ln in tf_lines if ln.startswith('"')]
                          tf_reader = csv.reader(tf_data_lines, skipinitialspace=True)

                          tf_ips = set()
                          for row in tf_reader:
                              if len(row) <= max(tf_idx_value, tf_idx_type):
                                  continue
                              if row[tf_idx_type].strip() != "ip:port":
                                  continue
                              ip = row[tf_idx_value].strip().rsplit(":", 1)[0].strip()
                              # is_valid_public_ipv4() → importiert aus netshield_common
                              if is_valid_public_ipv4(ip):
                                  tf_ips.add(ip)

                          all_ips.update(tf_ips)
                          stats["threatfox_export"] = len(tf_ips)
                          feed_ip_sets["threatfox_export"] = tf_ips
                          print(f"  threatfox_export: {len(tf_ips)} IPs "
                                f"({len(tf_raw)} bytes ZIP, {len(tf_text)} bytes CSV)")
                          if not tf_ips:
                              print("  WARNUNG threatfox_export: 0 IPs geparst – "
                                    "moeglicher Format-Wechsel")
                              print("::warning ::Honeypot-Feed threatfox_export "
                                    "lieferte Daten aber 0 gueltige IPs")

          # ══════════════════════════════════════════════════════════════════
          # URLhaus Export (authentifiziert) – Sonderfall, ERGAENZT 2026-07-25,
          # analog zu threatfox_export.
          #
          # Laeuft NICHT ueber die generische HONEYPOT_SOURCES-Schleife oben,
          # aus denselben Gruenden wie threatfox_export: Auth erfolgt ueber
          # einen in die URL eingebetteten Key statt ueber einen HTTP-Header.
          # Anders als bei ThreatFox ist die Antwort hier aber ein reines CSV
          # (kein ZIP) - kein binaersicherer Download noetig.
          #
          # URL-Muster (offizielle abuse.ch-Doku, verifiziert):
          #   https://urlhaus-api.abuse.ch/v2/files/exports/{KEY}/recent.csv
          #
          # KEY-WIEDERVERWENDUNG: ThreatFox, URLhaus und MalwareBazaar teilen
          # sich denselben abuse.ch-Account/Auth-Key (verifiziert). Es wird
          # deshalb bewusst KEIN eigenes URLHAUS_AUTH_KEY-Secret angelegt,
          # sondern THREATFOX_KEYS (oben bereits eingelesen und gefiltert)
          # wiederverwendet.
          #
          # SCHEMA VERIFIZIERT (2026-07-25, echter API-Abruf):
          #   id,dateadded,url,url_status,last_online,threat,tags,urlhaus_link,reporter
          # KEINE eigene IP/Host-Spalte vorhanden - IP wird wie beim
          # bisherigen LOCAL_FEED-Eintrag "urlhaus_ips" (Plain-Text-Liste in
          # update_combined_blacklist.yml) per Regex aus der 'url'-Spalte
          # (Index 2) extrahiert, dort wo der Hostname selbst eine rohe IP
          # ist. Liefert daher inhaltlich AEHNLICHE, nicht zwangslaeufig MEHR
          # extrahierbare IPs als der bisherige Feed - nur mit mehr Metadaten
          # (Tags, Reporter, Status, Zeitfenster). Vor produktivem Verlass auf
          # "liefert mehr IPs" bitte stats["urlhaus_export"] gegen die
          # aktuelle urlhaus_ips-Zahl in update_combined_blacklist.yml
          # vergleichen.
          URLHAUS_KEYS = THREATFOX_KEYS  # gleicher Account/Key, siehe oben
          if not URLHAUS_KEYS:
              print("  SKIP urlhaus_export: kein Auth-Key gesetzt "
                    "(THREATFOX_AUTH_KEY/_2 fehlen)")
              stats["urlhaus_export"] = 0
              skipped.add("urlhaus_export")
          else:
              def _uh_fetch_csv(keys, retries=3, timeout=60):
                  # Kandidaten der Reihe nach versuchen, analog zu
                  # _tf_fetch_binary oben (401/403 = naechster Key,
                  # 5xx/429 = Retry mit Backoff).
                  last_fail_code = None
                  for key_idx, key in enumerate(keys, start=1):
                      url = (f"https://urlhaus-api.abuse.ch/v2/files/exports/"
                             f"{key}/recent.csv")
                      for attempt in range(1, retries + 1):
                          req = urllib.request.Request(
                              url, headers={"User-Agent": "NETSHIELD-HoneypotMonitor-URLhaus/1.0"}
                          )
                          try:
                              with urllib.request.urlopen(req, timeout=timeout) as r:
                                  data = r.read().decode("utf-8", errors="ignore")
                                  if key_idx > 1:
                                      print(f"  urlhaus_export: Key #{key_idx} erfolgreich "
                                            f"(Failover nach Key #{key_idx - 1})")
                                  return data
                          except urllib.error.HTTPError as e:
                              if e.code in (401, 403):
                                  last_fail_code = e.code
                                  nxt = ("naechster Key" if key_idx < len(keys)
                                         else "kein weiterer Key konfiguriert")
                                  print(f"  HTTP {e.code} urlhaus_export "
                                        f"(Key #{key_idx}) – {nxt}")
                                  break
                              if e.code in (429, 500, 502, 503, 504):
                                  if attempt < retries:
                                      print(f"  HTTP {e.code} urlhaus_export – "
                                            f"Retry {attempt}/{retries}")
                                      time.sleep(2 ** attempt)
                                      continue
                                  break
                              print(f"  HTTP {e.code} urlhaus_export (Key #{key_idx}) – "
                                    f"kein Retry fuer diesen Statuscode")
                              break
                          except Exception as e:
                              if attempt < retries:
                                  time.sleep(2 ** attempt)
                              else:
                                  print(f"  FEHLER urlhaus_export (Key #{key_idx}, "
                                        f"nach {retries} Versuchen): {e}")
                  if last_fail_code is not None:
                      print(f"  FEHLER HTTP {last_fail_code} urlhaus_export – "
                            f"alle {len(keys)} Key(s) fehlgeschlagen")
                  return None

              uh_text = _uh_fetch_csv(URLHAUS_KEYS)
              if uh_text is None:
                  stats["urlhaus_export"] = 0
                  fetch_failed.add("urlhaus_export")
                  print("  urlhaus_export: FETCH FEHLGESCHLAGEN (None)")
                  print("::warning ::Honeypot-Feed urlhaus_export nicht "
                        "erreichbar (fetch=None)")
              else:
                  # Kommentar-/Leerzeilen ueberspringen; Header-Zeile (falls
                  # mitgeliefert, Spalte 0 == "id") wird beim Parsen erkannt
                  # und uebersprungen statt fest vorausgesetzt.
                  uh_data_lines = [ln for ln in uh_text.splitlines()
                                    if ln.strip() and not ln.startswith("#")]
                  uh_ips = set()
                  for row in csv.reader(uh_data_lines, skipinitialspace=True):
                      if not row or row[0].strip().lower() == "id":
                          continue
                      if len(row) < 3:
                          continue
                      # Spalte 2 = "url" (verifiziertes Schema, siehe oben).
                      # is_valid_public_ipv4() → importiert aus netshield_common
                      m = IPV4_RE.search(row[2])
                      if m and is_valid_public_ipv4(m.group(0)):
                          uh_ips.add(m.group(0))

                  all_ips.update(uh_ips)
                  stats["urlhaus_export"] = len(uh_ips)
                  feed_ip_sets["urlhaus_export"] = uh_ips
                  print(f"  urlhaus_export: {len(uh_ips)} IPs "
                        f"({len(uh_data_lines)} Zeilen, {len(uh_text)} bytes CSV)")
                  if not uh_ips:
                      print("  WARNUNG urlhaus_export: 0 IPs geparst – "
                            "moeglicher Format-Wechsel")
                      print("::warning ::Honeypot-Feed urlhaus_export "
                            "lieferte Daten aber 0 gueltige IPs")

          # ══════════════════════════════════════════════════════════════════
          # CriminalIP C2-Daily-Feed – Sonderfall, ERGAENZT 2026-07-25
          #
          # Laeuft NICHT ueber die generische HONEYPOT_SOURCES-Schleife oben,
          # weil die URL TAGESDATUM-basiert ist (.../main/YYYY-MM-DD.csv) -
          # es gibt KEINEN fixen "latest.csv"-Alias (verifiziert: 404).
          # Offizielles GitHub-Repo des kommerziellen CTI-Anbieters Criminal
          # IP (AI Spera, Korea) - taeglich 50 IPs mit C2-Tag (z.B.
          # c2_meshagent) oder Honeypot-Treffer als kostenloser Auszug aus
          # dem vollen C2_TI-Datensatz. Kein Auth noetig (oeffentliches Repo).
          #
          # Overlap-Audit (2026-07-25, 7-Tage-Sample 19.-25.07., 97 unique
          # IPs gegen den bestehenden combined_threat_blacklist_ipv4-
          # Bestand): nur 12 Treffer (~12%) -> ~88% Netto-neue IPs. Deutlich
          # hoeherer Neuheitswert als die meisten anderen non-HQ-Quellen im
          # Repo, trotz kleiner Menge (50 IPs/Tag).
          #
          # Timing-Fallback: der taegliche Commit bei criminalip/C2-Daily-Feed
          # kann je nach deren Zeitzone erst nach diesem Lauf erfolgen. Wird
          # die heutige Datei (UTC-Datum) noch nicht gefunden (404), wird
          # automatisch die gestrige Datei versucht, um nicht bei jedem Lauf
          # ins Leere zu laufen.
          CIP_BASE = "https://raw.githubusercontent.com/criminalip/C2-Daily-Feed/main"
          from datetime import timedelta

          def _cip_fetch_for_date(d):
              url = f"{CIP_BASE}/{d.strftime('%Y-%m-%d')}.csv"
              return fetch(url), url

          cip_text, cip_url = _cip_fetch_for_date(now)
          if cip_text is None:
              cip_text, cip_url = _cip_fetch_for_date(now - timedelta(days=1))

          if cip_text is None:
              stats["criminalip_c2"] = 0
              fetch_failed.add("criminalip_c2")
              print("  criminalip_c2: FETCH FEHLGESCHLAGEN (None) – weder "
                    "heutige noch gestrige Tagesdatei erreichbar")
              print("::warning ::Honeypot-Feed criminalip_c2 nicht erreichbar "
                    "(fetch=None)")
          else:
              cip_reader = csv.reader(cip_text.splitlines())
              cip_header = next(cip_reader, None)
              cip_ips = set()
              if cip_header and "IP" in cip_header[0]:
                  # erste Spalte ist die IP (verifiziert: "IP,Target C2,
                  # OpenPorts,Score(Inbound/Outbound),Country,Scan Time")
                  for row in cip_reader:
                      if not row:
                          continue
                      ip = row[0].strip()
                      # is_valid_public_ipv4() → importiert aus netshield_common
                      if is_valid_public_ipv4(ip):
                          cip_ips.add(ip)

                  all_ips.update(cip_ips)
                  stats["criminalip_c2"] = len(cip_ips)
                  feed_ip_sets["criminalip_c2"] = cip_ips
                  print(f"  criminalip_c2: {len(cip_ips)} IPs "
                        f"({len(cip_text)} bytes, {cip_url})")
                  if not cip_ips:
                      print("  WARNUNG criminalip_c2: 0 IPs geparst – "
                            "moeglicher Format-Wechsel")
                      print("::warning ::Honeypot-Feed criminalip_c2 lieferte "
                            "Daten aber 0 gueltige IPs")
              else:
                  stats["criminalip_c2"] = 0
                  fetch_failed.add("criminalip_c2")
                  print(f"  criminalip_c2: unerwarteter CSV-Header "
                        f"{cip_header!r} – Schema pruefen")
                  print("::warning ::Honeypot-Feed criminalip_c2 – "
                        "unerwartetes CSV-Schema")

          # ══════════════════════════════════════════════════════════════════
          # FRESHNESS-TRACKING – ERGAENZT 2026-07-25
          #
          # Bisher zeigte der Report nur "Feed erreichbar, N IPs" (✅/⚠️/❌).
          # Ein Feed kann aber tot/eingefroren sein und trotzdem bei jedem
          # Lauf dieselben N IPs zurueckliefern -> waere weiterhin ✅, obwohl
          # er keine neuen Daten mehr liefert. Hier wird pro Feed ein Hash
          # der IP-Menge ueber Laeufe hinweg verglichen: bleibt der Hash
          # ueber mehrere Laeufe identisch, gilt der Feed als "eingefroren"
          # (unabhaengig davon ob die Anzahl > 0 ist).
          #
          # Persistiert in state/honeypot_feed_freshness.json:
          #   {name: {"hash": sha256, "unchanged_runs": N,
          #           "last_changed_utc": iso, "last_changed_local": iso,
          #           "ips": [sortierte IP-Liste dieses Feeds]}}
          # unchanged_runs zaehlt aufeinanderfolgende Laeufe MIT identischem
          # Hash. Bei jeder Aenderung wird der Counter auf 0 zurueckgesetzt
          # und last_changed_utc/last_changed_local aktualisiert. Cron laeuft
          # 4x/Tag (05/11/17/23 UTC) -> unchanged_runs=12 entspricht ca. 3
          # Tagen, 28 ca. 7 Tagen.
          #
          # Feeds ohne erfolgreichen Fetch in diesem Lauf (fetch_failed/
          # skipped) werden NICHT aktualisiert - ihr alter Freshness-Stand
          # bleibt unveraendert stehen, bis der Feed wieder erreichbar ist.
          #
          # FIX PER-FEED-NEU (2026-07-25): das Feld "ips" wurde NEU ergaenzt,
          # um pro Feed die echte Anzahl neu hinzugekommener IPs auszuweisen
          # (nicht nur den globalen Gesamt-Delta ueber alle Feeds). Dafuer
          # muss die komplette IP-Liste jedes Feeds persistiert werden (nicht
          # nur ein Hash) -> state/honeypot_feed_freshness.json waechst dadurch
          # spuerbar (aktuell insgesamt mehrere Zehntausend IPs ueber alle
          # Feeds), Git-Commits werden entsprechend groesser. Bewusste
          # Entscheidung fuer exakte Zahlen statt eines leichtgewichtigen,
          # aber ungenauen Netto-Deltas (Zu-/Abgang koennten sich sonst
          # gegenseitig verdecken).
          import hashlib

          FRESHNESS_FILE = "state/honeypot_feed_freshness.json"
          freshness = {}
          if os.path.exists(FRESHNESS_FILE):
              try:
                  with open(FRESHNESS_FILE) as f:
                      freshness = json.load(f)
              except (json.JSONDecodeError, OSError) as e:
                  print(f"WARNUNG: {FRESHNESS_FILE} nicht lesbar ({e}) – starte leer")
                  freshness = {}

          feed_new_counts     = {}  # name -> Anzahl in diesem Lauf NEU hinzugekommener IPs
          feed_removed_counts = {}  # name -> Anzahl gegenueber letztem Lauf entfernter IPs

          for name, ip_set in feed_ip_sets.items():
              ip_hash = hashlib.sha256(
                  "\n".join(sorted(ip_set)).encode("utf-8")
              ).hexdigest()
              old = freshness.get(name, {})
              old_ips = set(old.get("ips", []))
              feed_new_counts[name]     = len(ip_set - old_ips)
              feed_removed_counts[name] = len(old_ips - ip_set)
              if old.get("hash") == ip_hash:
                  unchanged_runs      = old.get("unchanged_runs", 0) + 1
                  last_changed_utc    = old.get("last_changed_utc", now_str_utc)
                  last_changed_local  = old.get("last_changed_local", now_str)
              else:
                  unchanged_runs      = 0
                  last_changed_utc    = now_str_utc
                  last_changed_local  = now_str
              freshness[name] = {
                  "hash": ip_hash,
                  "unchanged_runs": unchanged_runs,
                  "last_changed_utc": last_changed_utc,
                  "last_changed_local": last_changed_local,
                  "ips": sorted(ip_set),
              }

          # FIX FRESHNESS-SIZE-GUARD: state/honeypot_feed_freshness.json
          # speichert pro Feed die komplette aktuelle IP-Liste (fuer exakte
          # Neu/Entfernt-Zahlen im Report, siehe FIX PER-FEED-NEU oben) und
          # waechst dadurch mit der Groesse der Feeds selbst - unabhaengig
          # von der Laufzahl. Bei grossen Feeds (ipinsights, tn3w_ipblocklist
          # etc.) kann das Richtung GitHubs hartem 100-MB-Push-Limit laufen;
          # ueberschreitet EINE Datei 100 MB, lehnt GitHub den KOMPLETTEN
          # Push ab (nicht nur diese Datei) - honeypot_ips.txt und der
          # Report waeren dann ebenfalls blockiert. Einfacher Schutz statt
          # komplexerer Speicher-Umstellung: Groesse vor dem Schreiben
          # pruefen, bei Ueberschreiten der Schwelle leeren statt schreiben.
          # Konsequenz eines Resets: alle Feeds verlieren ihren
          # unchanged_runs-Zaehler (🔴 EINGEFROREN-Erkennung startet neu bei
          # 0, braucht wieder 12-28 Laeufe) - akzeptierter Trade-off fuer
          # Einfachheit gegenueber z.B. Actions-Cache-Auslagerung.
          FRESHNESS_MAX_BYTES = 90 * 1024 * 1024  # 90 MB
          _freshness_json = json.dumps(freshness, indent=2, sort_keys=True)
          _freshness_size = len(_freshness_json.encode("utf-8"))
          if _freshness_size > FRESHNESS_MAX_BYTES:
              _size_mb = _freshness_size / 1024 / 1024
              msg = (f"{FRESHNESS_FILE} waere {_size_mb:.1f} MB "
                     f"(> {FRESHNESS_MAX_BYTES // 1024 // 1024} MB Schwelle) - "
                     f"geleert statt geschrieben, um GitHubs 100-MB-Push-Limit "
                     f"nicht zu riskieren. Freshness-Tracking (unchanged_runs/"
                     f"last_changed) startet fuer alle Feeds neu bei 0.")
              print(f"::warning file=honeypot_monitor.yml::{msg}")
              print(f"WARNUNG: {msg}")
              freshness = {}
              _freshness_json = "{}"

          write_text_atomic(FRESHNESS_FILE, _freshness_json)
          print(f"{FRESHNESS_FILE} aktualisiert ({len(freshness)} Feeds, "
                f"{len(_freshness_json.encode('utf-8')) / 1024 / 1024:.1f} MB)")

          HONEYPOT_FILE = "honeypot_ips.txt"
          existing = set()
          if os.path.exists(HONEYPOT_FILE):
              with open(HONEYPOT_FILE) as f:
                  existing = {l.strip() for l in f if l.strip() and not l.startswith("#")}

          # FIX BUG#3: FP- und Whitelist-Filter VOR der Delta-Berechnung anwenden.
          # Vorher wurden new_ips/removed_ips vor dem Filtern berechnet → Report
          # zeigte überhöhte +neu/-entfernt-Zahlen (gefilterte IPs zählten als "neu").
          # FP-Filter: IPs aus state/false_positives_set.json entfernen
          fp_removed = {ip for ip in all_ips if is_in_fp_set(ip)}
          if fp_removed:
              all_ips -= fp_removed
              print(f"FP-Filter: {len(fp_removed)} IPs entfernt")
          # FIX BUG-WL7: Whitelist-Filter – analog zum FP-Filter (defense-in-depth).
          wl_removed = {ip for ip in all_ips if is_whitelisted(ip)}
          if wl_removed:
              all_ips -= wl_removed
              print(f"Whitelist-Filter: {len(wl_removed)} IPs entfernt")

          # Delta NACH allen Filtern berechnen → korrekte Report-Statistik
          new_ips     = all_ips - existing
          removed_ips = existing - all_ips
          final_ips   = sorted(all_ips, key=lambda e: (tuple(int(x) for x in e.split('/')[0].split('.')), e))

          # Report immer zuerst schreiben
          lines = ["# Honeypot Monitor – Report", f"**Aktualisiert:** {now_str}\n", "---",
                   "| Quelle | IPs | Neu | Frische |", "|---|---|---|---|"]
          for n, c in stats.items():
              # FIX JB-DIAG: drei Zustaende statt zwei.
              #   ✅ erreichbar mit IPs | ⚠️ erreichbar aber 0 / uebersprungen
              #   | ❌ nicht erreichbar (Transport-Fehler)
              if c > 0:
                  mark = "✅"
              elif n in fetch_failed:
                  mark = "❌"
              else:
                  mark = "⚠️"

              # NEU-Spalte: exakter Mengenvergleich (aktuelle IPs dieses Feeds
              # ./. IPs desselben Feeds aus dem letzten erfolgreichen Lauf,
              # siehe FIX PER-FEED-NEU oben). Nur befuellt, wenn der Feed
              # DIESEN Lauf erfolgreich geladen wurde.
              if n not in feed_ip_sets:
                  neu_str = "–"
              else:
                  neu_str = f"+{feed_new_counts.get(n, 0)}"

              # FRESHNESS-Spalte: nur befuellt wenn der Feed DIESEN Lauf
              # erfolgreich geladen wurde (n in feed_ip_sets). Schwellwerte
              # bei 4 Laeufen/Tag: <12 = ~<3 Tage, <28 = ~<7 Tage, sonst mehr.
              # Zeitstempel in deutscher Lokalzeit (Europe/Berlin, CET/CEST),
              # NICHT UTC – siehe last_changed_local oben.
              if n not in feed_ip_sets:
                  fresh = "–"
              else:
                  ur = freshness.get(n, {}).get("unchanged_runs", 0)
                  lc = freshness.get(n, {}).get("last_changed_local", now_str)
                  if ur == 0:
                      fresh = f"🟢 neu ({lc})"
                  elif ur < 12:
                      fresh = f"🟢 aktuell (seit {lc})"
                  elif ur < 28:
                      fresh = f"🟡 traege (seit {lc}, {ur} Laeufe unveraendert)"
                  else:
                      fresh = f"🔴 EINGEFROREN (seit {lc}, {ur} Laeufe unveraendert)"

              lines.append(f"| {mark} `{n}` | {c} | {neu_str} | {fresh} |")
          lines += ["", "---", f"| Metrik | Wert |", "|---|---|",
                    f"| Gesamt Honeypot-IPs | **{len(final_ips)}** |",
                    f"| Neu | **+{len(new_ips)}** |", f"| Entfernt | **-{len(removed_ips)}** |",
                    f"\n---\n*Generiert: {now_str}*"]

          write_text_atomic("reports/honeypot_report.md", "\n".join(lines))
          print("reports/honeypot_report.md geschrieben")

          # ── Leerungsschutz ────────────────────────────────────────────────
          # FIX LS3: sys.exit(1) statt sys.exit(0) + GitHub Warning Annotation.
          MIN_ENTRIES = 500
          if len(final_ips) < MIN_ENTRIES:
              msg = f"Nur {len(final_ips)} IPs (< {MIN_ENTRIES}) – behalte bestehende honeypot_ips.txt"
              print(f"::warning file=honeypot_monitor.yml::{msg}")
              print(f"WARNUNG: {msg}")
              sys.exit(1)

          # FIX ATOMIC: write_ip_list statt open("w") – Crash-sicher.
          write_ip_list(
              HONEYPOT_FILE,
              final_ips,
              header_lines=[
                  "NETSHIELD Honeypot IP Blocklist",
                  f"Aktualisiert: {now_str}",
                  f"Quellen: {len(HONEYPOT_SOURCES)} | Gesamt: {len(final_ips)} | +{len(new_ips)} neu | -{len(removed_ips)} entfernt",
              ],
          )

          print(f"Fertig: {len(final_ips)} Honeypot-IPs")
          EOF

      - name: Commit
        if: always()  # FIX: auch bei Leerungsschutz-Exit den Report committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # FIX SUBDIR-MIGRATION: alte Root-Version entfernen, sobald dieser
          # Workflow die neue reports///logs/-Version committet (atomar im
          # selben Commit). Idempotent: --ignore-unmatch nach 1. Lauf.
          git rm -q --ignore-unmatch honeypot_report.md 2>/dev/null || true
          git add honeypot_ips.txt reports/honeypot_report.md state/honeypot_feed_freshness.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Honeypot Monitor: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs honeypot_ips.txt reports/honeypot_report.md state/honeypot_feed_freshness.json 2>/dev/null || true
                git add honeypot_ips.txt reports/honeypot_report.md state/honeypot_feed_freshness.json 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi
