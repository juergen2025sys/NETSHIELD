name: ThreatFox Export Downloader (Test)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: none
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  threatfox-export-downloader:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Fetch ThreatFox Export (ip-port/recent) und IPs extrahieren
        run: |
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import fetch_url, write_ip_list

          import csv
          import ipaddress
          from datetime import datetime, timezone

          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          # Test-Endpunkt: offizieller abuse.ch-CSV-Export, kein Auth-Key noetig.
          # Format (Kopfzeile mit '#' auskommentiert):
          # "first_seen_utc","ioc_id","ioc_value","ioc_type","threat_type",
          # "fk_malware","malware_alias","malware_printable","last_seen_utc",
          # "confidence_level","is_compromised","reference","tags",
          # "anonymous","reporter"
          # ioc_value hat bei ioc_type=ip:port die Form "1.2.3.4:PORT".
          URL = "https://threatfox.abuse.ch/export/csv/ip-port/recent/"

          print(f"[1/3] Abruf {URL} ...")
          text = fetch_url(URL, timeout=30, retries=3)
          if not text:
              print("FEHLER: Kein Response-Text erhalten - Abbruch")
              sys.exit(1)
          print(f"  -> {len(text)} Zeichen erhalten")

          # ── 2) CSV parsen, IP aus ioc_value (ip:port) extrahieren ──────────
          print("\n[2/3] CSV parsen + IPs extrahieren...")

          def is_valid_public_ipv4(ip):
              try:
                  obj = ipaddress.ip_address(ip)
              except ValueError:
                  return False
              return (
                  obj.version == 4
                  and not obj.is_private
                  and not obj.is_loopback
                  and not obj.is_multicast
                  and not obj.is_reserved
                  and not obj.is_link_local
                  and not obj.is_unspecified
              )

          # Nur echte Datenzeilen: beginnen mit '"' (Kommentare/Header-Zeilen
          # starten mit '#'). csv.reader uebernimmt das Quoting/Kommas korrekt.
          data_lines = [ln for ln in text.splitlines() if ln.startswith('"')]
          # FIX: ThreatFox-CSV hat ein Leerzeichen nach jedem Komma
          # (z.B. "a", "b", "c") - ohne skipinitialspace parst csv.reader
          # das fuehrende Leerzeichen als Teil des Feldes und die
          # Anfuehrungszeichen werden NICHT als Quoting erkannt (Feld
          # bleibt dann literal ' "wert"' statt 'wert'). Verifiziert an
          # echten ThreatFox-Exportdaten (2026-07-24).
          reader = csv.reader(data_lines, skipinitialspace=True)

          ips = set()
          row_count = 0
          skipped_malformed = 0
          skipped_invalid_ip = 0

          for row in reader:
              row_count += 1
              # Header-Zeile ("first_seen_utc", "ioc_id", ...) ueberspringen.
              if row and row[0].strip() == "first_seen_utc":
                  continue
              if len(row) < 4:
                  skipped_malformed += 1
                  continue
              ioc_value = row[2].strip()
              ioc_type = row[3].strip()
              if ioc_type != "ip:port":
                  continue
              ip = ioc_value.rsplit(":", 1)[0].strip()
              if is_valid_public_ipv4(ip):
                  ips.add(ip)
              else:
                  skipped_invalid_ip += 1

          print(f"  Zeilen gelesen: {row_count}")
          print(f"  Malformed (< 4 Spalten): {skipped_malformed}")
          print(f"  Ungueltige/private IPs verworfen: {skipped_invalid_ip}")
          print(f"  Eindeutige oeffentliche IPs: {len(ips)}")

          # ── 3) Datei schreiben (Test - keine Whitelist/FP-Filterung) ──────
          print("\n[3/3] threatfox_export_ips.txt schreiben...")

          final_ips = write_ip_list(
              "threatfox_export_ips.txt",
              ips,
              header_lines=[
                  "NETSHIELD ThreatFox Export IPs (TEST - ungefiltert)",
                  f"Aktualisiert: {now_str}",
                  "Quelle: threatfox.abuse.ch/export/csv/ip-port/recent/",
                  "WARNUNG: Test-Workflow. KEINE Whitelist-/FP-Filterung,",
                  "KEINE Anbindung an update_combined_blacklist.yml.",
                  f"Gesamt: {len(ips)} IPs",
              ],
          )

          print(f"  threatfox_export_ips.txt: {len(final_ips)} IPs geschrieben")
          print(f"\nFERTIG: {len(final_ips)} IPs")
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threatfox_export_ips.txt
          if git diff --staged --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "ThreatFox Export Downloader (Test): $(date -u '+%Y-%m-%d %H:%M') UTC"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs threatfox_export_ips.txt 2>/dev/null || true
                git add threatfox_export_ips.txt 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi
