name: ThreatFox Export Downloader (Test)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: none
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  threatfox-export-downloader:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Auth-Key defensiv maskieren
        # Zusaetzlich zur automatischen GitHub-Actions-Maskierung von
        # secrets.* explizit re-maskieren, weil der Key unten Teil einer
        # URL wird (URLs in Fehlermeldungen/Redirects werden von manchen
        # Tools/Loggern abweichend behandelt als reine env-Werte).
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: echo "::add-mask::$THREATFOX_AUTH_KEY"

      - name: Fetch ThreatFox Full Export (authentifiziert) und IPs extrahieren
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
        run: |
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import write_ip_list

          import csv
          import io
          import ipaddress
          import os
          import sys
          import time
          import urllib.request
          import urllib.error
          import zipfile
          from datetime import datetime, timezone

          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          AUTH_KEY = os.environ.get("THREATFOX_AUTH_KEY", "").strip()
          if not AUTH_KEY:
              print("FEHLER: THREATFOX_AUTH_KEY nicht gesetzt - Abbruch")
              sys.exit(1)

          # WICHTIG (verifiziert 2026-07-24): die "recent"-Endpunkte (auch
          # die get_iocs-API!) liefern laut abuse.ch-Doku NUR die letzten
          # Tage (get_iocs sogar nur max. 7 Tage - waere WENIGER als das
          # bisherige unauthentifizierte "recent"-CSV). Die komplette,
          # nicht-abgelaufene Datenbasis (bis 6 Monate, Expiry-Policy seit
          # 2025-05-01) gibt es nur ueber den authentifizierten Datei-Export
          # full.csv.zip. Dieser enthaelt ALLE IOC-Typen gemischt (ip:port,
          # domain, url, hash) - Filterung auf ioc_type=ip:port erfolgt
          # unten nach dem Entpacken.
          HOST = "threatfox-api.abuse.ch"
          URL = f"https://{HOST}/v2/files/exports/{AUTH_KEY}/full.csv.zip"

          # fetch_url() aus netshield_common ist NICHT nutzbar - es dekodiert
          # die Antwort immer als UTF-8-Text (data.decode("utf-8", ...)),
          # was ein binaeres ZIP korrumpieren wuerde. Daher eigener,
          # binaersicherer Download hier (Domain ist hartkodiert/vertrauens-
          # wuerdig, kein user-kontrollierter Input -> kein SSRF-Risiko wie
          # bei generischen Feed-URLs).
          READ_LIMIT = 150 * 1024 * 1024  # 150 MB Sicherheitsgrenze

          def fetch_binary(url, retries=3, timeout=60):
              for attempt in range(1, retries + 1):
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "NETSHIELD-ThreatFoxExport/1.0"}
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          data = r.read(READ_LIMIT + 1)
                          if len(data) > READ_LIMIT:
                              print(f"  FEHLER: Antwort > {READ_LIMIT} bytes - Abbruch")
                              return None
                          return data
                  except urllib.error.HTTPError as e:
                      print(f"  HTTP {e.code} (Versuch {attempt}/{retries})")
                      if e.code in (401, 403):
                          print("  Auth-Key vermutlich ungueltig/abgelaufen - kein Retry")
                          return None
                      if attempt < retries:
                          time.sleep(2 ** attempt)
                          continue
                      return None
                  except Exception as e:
                      print(f"  FEHLER (Versuch {attempt}/{retries}): {type(e).__name__}")
                      if attempt < retries:
                          time.sleep(2 ** attempt)
                          continue
                      return None
              return None

          print("[1/4] Lade full.csv.zip (authentifizierter ThreatFox-Export)...")
          raw = fetch_binary(URL)
          if raw is None:
              print("FEHLER: Download fehlgeschlagen - Abbruch")
              sys.exit(1)
          print(f"  -> {len(raw)} Bytes (ZIP) erhalten")

          print("\n[2/4] ZIP entpacken...")
          try:
              zf = zipfile.ZipFile(io.BytesIO(raw))
          except zipfile.BadZipFile:
              print("FEHLER: Antwort ist kein gueltiges ZIP - vermutlich ungueltiger "
                    "Auth-Key oder eine HTML-Fehlerseite statt der Datei")
              sys.exit(1)

          csv_names = [n for n in zf.namelist() if n.lower().endswith(".csv")]
          if not csv_names:
              print(f"FEHLER: Keine .csv-Datei im ZIP gefunden. Inhalt: {zf.namelist()}")
              sys.exit(1)
          csv_name = csv_names[0]
          print(f"  Datei im ZIP: {csv_name} ({len(csv_names)} CSV-Datei(en) gefunden)")

          with zf.open(csv_name) as f:
              text = f.read().decode("utf-8", errors="ignore")
          print(f"  -> {len(text)} Zeichen CSV-Text")

          print("\n[3/4] CSV parsen (Header-basiert, nur ioc_type == ip:port)...")

          lines = text.splitlines()

          # Header dynamisch finden statt Spaltenpositionen hart zu
          # verdrahten: die Header-Zeile ist bei ThreatFox-Exports eine
          # Kommentarzeile ("# \"first_seen_utc\",...") - Schema kann sich
          # zwischen recent/full-Export unterscheiden (z.B. is_compromised
          # nicht bei allen IOC-Typen vorhanden), daher robuste Index-Map
          # statt row[2]/row[3] anzunehmen.
          col_index = {}
          for ln in lines:
              stripped = ln.lstrip("#").strip()
              if stripped.startswith('"first_seen_utc"'):
                  header_row = next(csv.reader([stripped], skipinitialspace=True))
                  col_index = {name.strip(): i for i, name in enumerate(header_row)}
                  break

          if "ioc_value" not in col_index or "ioc_type" not in col_index:
              print(f"FEHLER: Header mit 'ioc_value'/'ioc_type' nicht gefunden - "
                    f"Schema unerwartet. Gefundene Spalten: {list(col_index)}")
              sys.exit(1)

          idx_value = col_index["ioc_value"]
          idx_type = col_index["ioc_type"]
          print(f"  Header erkannt: {len(col_index)} Spalten "
                f"(ioc_value=Spalte {idx_value}, ioc_type=Spalte {idx_type})")

          def is_valid_public_ipv4(ip):
              try:
                  obj = ipaddress.ip_address(ip)
              except ValueError:
                  return False
              return (
                  obj.version == 4
                  and not obj.is_private
                  and not obj.is_loopback
                  and not obj.is_multicast
                  and not obj.is_reserved
                  and not obj.is_link_local
                  and not obj.is_unspecified
              )

          # Datenzeilen: beginnen mit '"' (Kommentar-/Header-Zeilen mit '#').
          data_lines = [ln for ln in lines if ln.startswith('"')]
          reader = csv.reader(data_lines, skipinitialspace=True)

          ips = set()
          row_count = 0
          type_counts = {}
          skipped_malformed = 0
          skipped_invalid_ip = 0

          for row in reader:
              row_count += 1
              if len(row) <= max(idx_value, idx_type):
                  skipped_malformed += 1
                  continue
              ioc_type = row[idx_type].strip()
              type_counts[ioc_type] = type_counts.get(ioc_type, 0) + 1
              if ioc_type != "ip:port":
                  continue
              ioc_value = row[idx_value].strip()
              ip = ioc_value.rsplit(":", 1)[0].strip()
              if is_valid_public_ipv4(ip):
                  ips.add(ip)
              else:
                  skipped_invalid_ip += 1

          print(f"  Zeilen gesamt: {row_count}")
          print(f"  IOC-Typen im Export: "
                f"{dict(sorted(type_counts.items(), key=lambda kv: -kv[1]))}")
          print(f"  Malformed (zu wenig Spalten): {skipped_malformed}")
          print(f"  ip:port-Zeilen mit ungueltiger/privater IP verworfen: "
                f"{skipped_invalid_ip}")
          print(f"  Eindeutige oeffentliche IPs (ip:port): {len(ips)}")

          print("\n[4/4] threatfox_export_ips.txt schreiben...")

          final_ips = write_ip_list(
              "threatfox_export_ips.txt",
              ips,
              header_lines=[
                  "NETSHIELD ThreatFox Export IPs (TEST - ungefiltert)",
                  f"Aktualisiert: {now_str}",
                  "Quelle: threatfox-api.abuse.ch/v2/files/exports/AUTH-KEY/full.csv.zip",
                  "Authentifizierter Export: komplette nicht-abgelaufene Datenbasis",
                  "(bis zu 6 Monate), gefiltert auf ioc_type=ip:port.",
                  "WARNUNG: Test-Workflow. KEINE Whitelist-/FP-Filterung,",
                  "KEINE Anbindung an update_combined_blacklist.yml.",
                  f"Gesamt: {len(ips)} IPs",
              ],
          )

          print(f"  threatfox_export_ips.txt: {len(final_ips)} IPs geschrieben")
          print(f"\nFERTIG: {len(final_ips)} IPs")
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threatfox_export_ips.txt
          if git diff --staged --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "ThreatFox Export Downloader (Test): $(date -u '+%Y-%m-%d %H:%M') UTC"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs threatfox_export_ips.txt 2>/dev/null || true
                git add threatfox_export_ips.txt 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi
