name: ipinsights.io Neuzugaenge (taeglich, angereichert)

# ============================================================================
# Laedt taeglich https://ipinsights.io/downloads/blocklist.txt (dieselbe
# oeffentliche Liste wie der "ipinsights"-Eintrag in honeypot_monitor.yml),
# ermittelt die seit dem letzten Lauf NEU hinzugekommenen IPs, und reichert
# NUR diese (typischerweise wenige hundert, nicht die vollen 600k+) per
# Bulk-Lookup-API an. Report-Spalten angelehnt an das Live-Dashboard-Panel
# von ipinsights.io: IP, Country, Category, Threat-Score.
#
# WICHTIG (verifizieren vor Produktivbetrieb):
#   - Secret IPINSIGHTS_API_KEY muss im Repo hinterlegt sein.
#   - "First seen" im Report ist NICHT das ipinsights.io-eigene First-Seen
#     (das liefert die dokumentierte API nicht), sondern das Datum, an dem
#     WIR die IP zum ersten Mal in unserem taeglichen Diff gesehen haben -
#     bewusst nicht erfunden, siehe Chat-Verlauf.
#   - Das exakte JSON-Schema der /api/v1/bulk-lookup-ANTWORT ist in der
#     offiziellen Doku nicht dokumentiert. Ein erster Testlauf zeigte:
#     Records enthalten "ip", aber threat_assessment/blacklists/country_name
#     wie im Einzel-Lookup-Schema waren NICHT auffindbar (alle Felder "?").
#     Debug-Logging unten zeigt beim naechsten Lauf die rohe Struktur eines
#     Records - danach muss extract_fields() ggf. an das echte Schema
#     angepasst werden.
#   - FIX 2026-08-08: HTTP 405 auf https://ipinsights.io/api/v1/bulk-lookup
#     (Apex-Domain) beobachtet - Code versucht deshalb zuerst www.
# ============================================================================

on:
  schedule:
    - cron: '30 4 * * *'  # 04:30 UTC, einmal taeglich
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netshield-seen-db-writers
  cancel-in-progress: false
  queue: max

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Neue IPs ermitteln und anreichern
        env:
          IPINSIGHTS_API_KEY: ${{ secrets.IPINSIGHTS_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 << 'EOF'
          import json, os, sys, time, urllib.request, urllib.error
          sys.path.insert(0, "scripts")
          from netshield_common import write_json_atomic, write_ip_list, write_text_atomic, is_valid_public_ipv4
          from datetime import datetime, timezone

          API_KEY = os.environ.get("IPINSIGHTS_API_KEY", "").strip()
          if not API_KEY:
              print("::error::IPINSIGHTS_API_KEY nicht gesetzt - Secret in Repo-Settings hinterlegen.")
              sys.exit(1)

          BLOCKLIST_URL   = "https://ipinsights.io/downloads/blocklist.txt"
          SNAPSHOT_FILE   = "state/ipinsights_last_snapshot.txt"
          FIRST_SEEN_FILE = "state/ipinsights_first_seen.json"
          REPORT_FILE     = "reports/ipinsights_daily_report.md"
          BATCH_SIZE      = 100
          MAX_LOOKUPS_PER_RUN = 500  # Sicherheitsdeckel, normal weit weniger noetig
          now = datetime.now(timezone.utc)
          now_str = now.strftime("%Y-%m-%d %H:%M UTC")
          today_str = now.strftime("%Y-%m-%d")

          # ── Aktuelle ipinsights.io-Liste laden ──────────────────────────
          req = urllib.request.Request(
              BLOCKLIST_URL, headers={"User-Agent": "NETSHIELD-ipinsights-report/1.0"}
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode("utf-8", errors="ignore")
          except Exception as e:
              print(f"::error::Blockliste konnte nicht geladen werden: {e}")
              sys.exit(1)

          current_ips = sorted({
              line.strip() for line in raw.splitlines()
              if line.strip() and not line.strip().startswith("#")
          })
          # FIX 2026-08-08 (Performance-Bug, 14-Minuten-Hang beobachtet):
          # current_ips ist eine sortierte LISTE (fuer Ausgabe/Iteration).
          # "ip in current_ips" ist bei einer Liste O(n) - in einer Schleife
          # ueber bis zu 608k first_seen-Eintraege ergab das O(n^2), also
          # potenziell hunderte Milliarden Vergleiche. current_ips_set als
          # separates Set fuer alle Membership-Checks (O(1) pro Check).
          current_ips_set = set(current_ips)
          print(f"{len(current_ips)} IPs aktuell in ipinsights.io-Blockliste")

          # ── Letzten Snapshot laden (Stand von gestern) ─────────────────
          os.makedirs("state", exist_ok=True)
          os.makedirs("reports", exist_ok=True)
          previous_ips = set()
          if os.path.exists(SNAPSHOT_FILE):
              with open(SNAPSHOT_FILE) as f:
                  previous_ips = {
                      line.strip() for line in f
                      if line.strip() and not line.strip().startswith("#")
                  }
              print(f"{len(previous_ips)} IPs im letzten Snapshot")
          else:
              print("Kein vorheriger Snapshot - erster Lauf, alle aktuellen IPs gelten als neu.")

          new_ips = sorted(current_ips_set - previous_ips)
          print(f"{len(new_ips)} neue IPs seit letztem Lauf")

          # FIX 2026-08-08: ipinsights.io's eigene blocklist.txt enthaelt
          # offenbar auch reservierte/private Adressen (z.B. 0.0.0.0/8) -
          # die Bulk-Lookup-API lehnt diese mit success:false/error_type
          # "private_ip" ab (verifiziert im Log). Vorfilterung mit
          # derselben is_valid_public_ipv4()-Funktion wie im Rest des Repos
          # spart Quota (keine sinnlosen Anfragen) und verhindert leere
          # Report-Zeilen fuer nie-enrichbare Adressen.
          reserved_skipped = [ip for ip in new_ips if not is_valid_public_ipv4(ip)]
          new_ips = [ip for ip in new_ips if is_valid_public_ipv4(ip)]
          if reserved_skipped:
              print(f"{len(reserved_skipped)} reservierte/private IPs uebersprungen "
                    f"(z.B. {reserved_skipped[0]}) - nie enrichbar, keine API-Anfrage noetig.")

          truncated = len(new_ips) > MAX_LOOKUPS_PER_RUN
          lookups_today = new_ips[:MAX_LOOKUPS_PER_RUN]
          if truncated:
              print(f"::warning::{len(new_ips) - MAX_LOOKUPS_PER_RUN} IPs ueberschreiten "
                    f"MAX_LOOKUPS_PER_RUN ({MAX_LOOKUPS_PER_RUN}) - werden naechsten Lauf nachgeholt.")

          # ── first_seen-Tracking (unser eigenes, ehrliches "First seen") ─
          first_seen = {}
          if os.path.exists(FIRST_SEEN_FILE):
              try:
                  with open(FIRST_SEEN_FILE) as f:
                      first_seen = json.load(f)
                  if not isinstance(first_seen, dict):
                      first_seen = {}
              except Exception:
                  first_seen = {}
          for ip in new_ips:
              if ip not in first_seen:
                  first_seen[ip] = today_str
          # Eintraege fuer IPs, die nicht mehr in current_ips sind, aufraeumen
          first_seen = {ip: d for ip, d in first_seen.items() if ip in current_ips_set}
          write_json_atomic(FIRST_SEEN_FILE, first_seen, separators=(",", ":"), sort_keys=True)

          # ── Snapshot fuer den naechsten Lauf aktualisieren ──────────────
          write_ip_list(
              SNAPSHOT_FILE,
              current_ips,
              presorted=True,
              header_lines=[
                  "ipinsights.io - letzter Snapshot fuer Neuzugangs-Diff",
                  f"Aktualisiert: {now_str}",
                  f"Eintraege: {len(current_ips)}",
              ],
          )

          if not lookups_today:
              print("Keine neuen IPs zu pruefen.")

          # ── Bulk-Lookup ───────────────────────────────────────────────
          def bulk_lookup(ip_batch):
              body = json.dumps({"ips": ip_batch}).encode()
              # www zuerst (matcht den Rest der Doku), Apex als Fallback -
              # siehe FIX-Kommentar im Datei-Header (HTTP 405 auf Apex).
              urls_to_try = [
                  "https://www.ipinsights.io/api/v1/bulk-lookup",
                  "https://ipinsights.io/api/v1/bulk-lookup",
              ]
              last_err = None
              for url in urls_to_try:
                  req = urllib.request.Request(
                      url, data=body, method="POST",
                      headers={"X-API-Key": API_KEY, "Content-Type": "application/json"},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          raw_resp = r.read().decode("utf-8", errors="ignore")
                      return json.loads(raw_resp)
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8", errors="ignore")[:300]
                      last_err = f"HTTP {e.code}: {err_body}"
                      if e.code == 405 and url != urls_to_try[-1]:
                          continue
                      break
                  except Exception as e:
                      last_err = str(e)
                      break
              print(f"::warning::Bulk-Lookup Fehler (alle URL-Varianten): {last_err}")
              return None

          def extract_records(raw_response):
              """Defensiv gegen unbekanntes/undokumentiertes Response-Format."""
              if raw_response is None:
                  return []
              candidates = None
              if isinstance(raw_response, list):
                  candidates = raw_response
              elif isinstance(raw_response, dict):
                  for key in ("data", "results", "ips", "lookups"):
                      val = raw_response.get(key)
                      if isinstance(val, list):
                          candidates = val
                          break
                  if candidates is None and raw_response.get("ip"):
                      candidates = [raw_response]
              if candidates is None:
                  print("::warning::Unbekanntes Bulk-Lookup-Antwortformat - rohe Antwort (gekuerzt):")
                  print(json.dumps(raw_response)[:500])
                  return []
              return [c for c in candidates if isinstance(c, dict) and c.get("ip")]

          def extract_fields(rec):
              """Zieht Country/Category/Score/Payload-Hinweis robust aus
              verschiedenen moeglichen Feld-Layouts (verschachtelt wie
              /lookup ODER flach - Bulk-Schema ist undokumentiert, siehe
              Datei-Header). Gibt (country, category, score, payload)
              zurueck, '?' bei Unbekanntem."""
              # Country: verschachtelt (lookup-Schema) oder flach
              country = (rec.get("country_name") or rec.get("country_code")
                         or rec.get("country") or "?")
              # Score: verschachtelt unter threat_assessment ODER flach
              ta = rec.get("threat_assessment")
              if isinstance(ta, dict) and ta.get("score") is not None:
                  score = ta["score"]
              elif rec.get("threat_score") is not None:
                  score = rec["threat_score"]
              elif rec.get("score") is not None:
                  score = rec["score"]
              else:
                  score = "?"
              # Category: aus blacklists[].category, oder flachem "category"
              category = "?"
              bl = rec.get("blacklists")
              if isinstance(bl, list) and bl:
                  cats = sorted({b.get("category", "") for b in bl
                                 if isinstance(b, dict) and b.get("category")})
                  if cats:
                      category = ", ".join(cats)
              if category == "?" and rec.get("category"):
                  category = rec["category"]
              # Payload/AI-Agent-Hinweis: aus ai_agent_assessment.signals[].family
              # (siehe /api/v1/lookup-Doku: family kann "payload" sein, z.B.
              # "explanatory_sql_comment" bei SQL-Injection-Versuchen) - ODER
              # aus threat_assessment.reasons, falls dort ein Payload-artiger
              # Grund (SQL/XSS/Exploit) auftaucht. Beide Layouts unverifiziert
              # fuer bulk-lookup, siehe DEBUG-Logging.
              payload = "-"
              ai = rec.get("ai_agent_assessment")
              if isinstance(ai, dict):
                  signals = ai.get("signals", []) or []
                  families = sorted({s.get("family", "") for s in signals
                                      if isinstance(s, dict) and s.get("family")})
                  if "payload" in families:
                      payload = "⚠️ payload (AI-Agent)"
                  elif families:
                      payload = ", ".join(families)
              if payload == "-" and isinstance(ta, dict):
                  reasons = ta.get("reasons", []) or []
                  payload_kw = ("sql", "xss", "injection", "exploit", "payload", "rce")
                  hits = [r for r in reasons if isinstance(r, str)
                          and any(kw in r.lower() for kw in payload_kw)]
                  if hits:
                      payload = "⚠️ " + "; ".join(hits[:2])
              return country, category, score, payload

          all_records = []
          rejected_records = {}  # ip -> message, bei success:false
          batch_failed_ips = []
          _success_schema_logged = False
          _rejected_schema_logged = False
          for i in range(0, len(lookups_today), BATCH_SIZE):
              batch = lookups_today[i:i + BATCH_SIZE]
              print(f"Bulk-Lookup Batch {i // BATCH_SIZE + 1}: {len(batch)} IPs...")
              resp = bulk_lookup(batch)
              if resp is None:
                  batch_failed_ips.extend(batch)
                  if i + BATCH_SIZE < len(lookups_today):
                      time.sleep(2)
                  continue
              records = extract_records(resp)
              # FIX 2026-08-08: "success": false-Records (z.B. error_type
              # "private_ip") NICHT als angereichert zaehlen - eigener
              # Bucket mit der Ablehnungs-Message fuer den Report.
              # FIX 2026-08-08 (2): Debug-Logging in success/rejected
              # getrennt, je EINMAL pro Lauf. Vorher wurde nur der
              # allerERSTE Record des Laufs geloggt - war das zufaellig
              # eine Ablehnung (wie im ersten echten Testlauf: 0.x.x.x-IPs
              # im ersten Batch), haben wir das Erfolgs-Schema NIE gesehen,
              # selbst wenn spaetere Batches echte Treffer enthielten.
              for rec in records:
                  if rec.get("success") is False:
                      rejected_records[rec["ip"]] = rec.get("message", rec.get("error_type", "abgelehnt"))
                      if not _rejected_schema_logged:
                          print("DEBUG erster ABGELEHNTER Record (rohe Struktur):")
                          print(json.dumps(rec, indent=2)[:2000])
                          _rejected_schema_logged = True
                  else:
                      all_records.append(rec)
                      if not _success_schema_logged:
                          print("DEBUG erster ERFOLGREICHER Record (rohe Struktur, zur Schema-Klaerung):")
                          print(json.dumps(rec, indent=2)[:2000])
                          print(f"DEBUG verfuegbare Top-Level-Keys: {sorted(rec.keys())}")
                          _success_schema_logged = True
              if i + BATCH_SIZE < len(lookups_today):
                  time.sleep(2)

          print(f"{len(all_records)} von {len(lookups_today)} IPs erfolgreich angereichert"
                + (f", {len(rejected_records)} von API abgelehnt" if rejected_records else "")
                + (f", {len(batch_failed_ips)} durch Batch-Fehler uebersprungen (naechsten Lauf erneut)" if batch_failed_ips else ""))

          # ── Report bauen ──────────────────────────────────────────────
          lines = [
              "# ipinsights.io Neuzugaenge",
              "",
              f"Lauf: {now_str}",
              f"Quelle: {BLOCKLIST_URL} ({len(current_ips)} IPs gesamt)",
              f"Neue IPs seit letztem Lauf: {len(new_ips)}"
              + (f" (davon {len(lookups_today)} geprueft, Rest naechsten Lauf)" if truncated else ""),
              "",
          ]

          if lookups_today:
              lines.append("| IP | Country | Category | Threat-Score | Payload/AI-Agent | First seen (bei uns) |")
              lines.append("|---|---|---|---|---|---|")
              enriched_by_ip = {r["ip"]: r for r in all_records}
              def _sort_key(ip):
                  rec = enriched_by_ip.get(ip)
                  if rec is None:
                      return -1
                  _, _, score, _ = extract_fields(rec)
                  return score if isinstance(score, (int, float)) else -1
              for ip in sorted(lookups_today, key=_sort_key, reverse=True):
                  if ip in rejected_records:
                      continue  # separat unten gelistet, nicht in der Haupttabelle
                  rec = enriched_by_ip.get(ip)
                  if rec is None:
                      status = "batch-fehler" if ip in batch_failed_ips else "kein ergebnis"
                      lines.append(f"| {ip} | ? | ? | ? ({status}) | ? | {first_seen.get(ip, '?')} |")
                      continue
                  country, category, score, payload = extract_fields(rec)
                  lines.append(f"| {ip} | {country} | {category} | {score} | {payload} | {first_seen.get(ip, '?')} |")
          else:
              lines.append("_Keine neuen IPs in diesem Lauf._")

          if rejected_records:
              lines.append("")
              lines.append(f"**Von der API abgelehnt ({len(rejected_records)}):**")
              # Nach Ablehnungsgrund gruppieren statt jede IP einzeln aufzulisten
              from collections import defaultdict
              by_reason = defaultdict(list)
              for ip, reason in rejected_records.items():
                  by_reason[reason].append(ip)
              for reason, ips in sorted(by_reason.items(), key=lambda x: -len(x[1])):
                  sample = ", ".join(sorted(ips)[:5])
                  more = f" +{len(ips) - 5} weitere" if len(ips) > 5 else ""
                  lines.append(f"- {reason} ({len(ips)}): {sample}{more}")

          write_text_atomic(REPORT_FILE, "\n".join(lines) + "\n")

          print(f"\nReport geschrieben: {REPORT_FILE}")
          EOF

      - name: Commit and Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ipinsights_daily_report.md state/ipinsights_last_snapshot.txt state/ipinsights_first_seen.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "ipinsights.io Neuzugaenge: $(date -u '+%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs reports/ipinsights_daily_report.md state/ipinsights_last_snapshot.txt state/ipinsights_first_seen.json 2>/dev/null || true
                git add reports/ipinsights_daily_report.md state/ipinsights_last_snapshot.txt state/ipinsights_first_seen.json 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi
