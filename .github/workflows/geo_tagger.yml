name: Geo-Tagger

on:
  schedule:
    - cron: '45 7 * * 0'  # Sonntag 07:45 UTC (45min Puffer nach score_decay 07:00)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  geo-tagger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Enrich Blacklist with Geo Data via ScaniteX
        run: |
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import (
              load_whitelist, load_fp_set, is_in_fp_set,
              is_valid_public_ipv4, is_valid_public_cidr,
              is_protected_entry, is_whitelisted,
              parse_entries as _parse_entries, calculate_confidence,
              safe_get_date, parse_date, sort_ips, write_ip_list,
              write_json_atomic, write_text_atomic,
              fetch_url, check_local_feed_age,
              IPV4_RE, CIDR_RE, TIMESTAMP_RE,
          )

          # Init: Whitelist + FP-Set laden
          load_whitelist()
          load_fp_set()

          import urllib.request
          import re
          import os
          import sys
          import json
          import time
          import ipaddress
          from datetime import datetime, timezone
          from collections import defaultdict

          now = datetime.now(timezone.utc)
          now_str = now.strftime("%Y-%m-%d %H:%M UTC")
          # CIDR_RE wird aus netshield_common importiert (strikte Variante).
          # Frühere lokale \b-Definition entfernt – konsistente Single Source.

          def fetch_raw(url, timeout=30, retries=3):
              # FIX BUG-WF2-FETCHURL: siehe asn_reputation_scorer.yml.
              # fetch_url liefert SSRF, DNS-Pin, gzip-Streaming und korrekte
              # 429/5xx-Retry-Logik – der alte selbst-gebaute Loop hatte
              # nichts davon und 4xx ohne Retry war ueberzogen restriktiv
              # bei transienten 5xx Fehlern.
              return fetch_url(url, timeout=timeout, retries=retries,
                               user_agent="NETSHIELD-GeoTagger/2.0")

          # ── Länder-Definitionen ───────────────────────────────────────────
          # Alle Länder die getrackt werden sollen.
          # ScaniteX URL: https://scanitex.com/en/resources/ip-ranges/{cc_lower}
          COUNTRIES = [
              # High-Risk (geopolitisch + bekannte Abuse-Quellen)
              {"cc": "RU", "name": "Russland",          "flag": "🇷🇺", "risk": "high"},
              {"cc": "CN", "name": "China",             "flag": "🇨🇳", "risk": "high"},
              {"cc": "KP", "name": "Nordkorea",         "flag": "🇰🇵", "risk": "high"},
              {"cc": "IR", "name": "Iran",              "flag": "🇮🇷", "risk": "high"},
              {"cc": "SY", "name": "Syrien",            "flag": "🇸🇾", "risk": "high"},
              {"cc": "BY", "name": "Belarus",           "flag": "🇧🇾", "risk": "high"},
              # Medium-Risk
              {"cc": "UA", "name": "Ukraine",           "flag": "🇺🇦", "risk": "medium"},
              {"cc": "NG", "name": "Nigeria",           "flag": "🇳🇬", "risk": "medium"},
              {"cc": "BR", "name": "Brasilien",         "flag": "🇧🇷", "risk": "medium"},
              {"cc": "IN", "name": "Indien",            "flag": "🇮🇳", "risk": "medium"},
              {"cc": "VN", "name": "Vietnam",           "flag": "🇻🇳", "risk": "medium"},
              {"cc": "RO", "name": "Rumänien",          "flag": "🇷🇴", "risk": "medium"},
              {"cc": "TR", "name": "Türkei",            "flag": "🇹🇷", "risk": "medium"},
              {"cc": "ID", "name": "Indonesien",        "flag": "🇮🇩", "risk": "medium"},
              {"cc": "PK", "name": "Pakistan",          "flag": "🇵🇰", "risk": "medium"},
              {"cc": "BD", "name": "Bangladesch",       "flag": "🇧🇩", "risk": "medium"},
              {"cc": "HK", "name": "Hongkong",          "flag": "🇭🇰", "risk": "medium"},
              {"cc": "KZ", "name": "Kasachstan",        "flag": "🇰🇿", "risk": "medium"},
              # Low-Risk / Tracking (grosse Netzwerke / bekannte Hoster-Länder)
              {"cc": "US", "name": "USA",               "flag": "🇺🇸", "risk": "low"},
              {"cc": "DE", "name": "Deutschland",       "flag": "🇩🇪", "risk": "low"},
              {"cc": "NL", "name": "Niederlande",       "flag": "🇳🇱", "risk": "low"},
              {"cc": "FR", "name": "Frankreich",        "flag": "🇫🇷", "risk": "low"},
              {"cc": "GB", "name": "Grossbritannien",   "flag": "🇬🇧", "risk": "low"},
              {"cc": "SG", "name": "Singapur",          "flag": "🇸🇬", "risk": "low"},
              {"cc": "JP", "name": "Japan",             "flag": "🇯🇵", "risk": "low"},
              {"cc": "KR", "name": "Südkorea",          "flag": "🇰🇷", "risk": "low"},
          ]

          SCANITEX_BASE = "https://scanitex.com/en/resources/ip-ranges"

          # ── Blacklist laden ───────────────────────────────────────────────
          # FIX BUG-TRUNCATE-PARTS: Sobald die Vollliste >= 100 MB GitHub-Push-
          # Limit erreicht, schreibt update_combined_blacklist die Hauptdatei
          # truncatiert und verteilt die vollstaendige Liste auf
          # combined_threat_blacklist_ipv4_part*.txt. Wenn wir hier nur die
          # Hauptdatei lesen, fehlen IPs aus den Parts in der Geo-Statistik
          # → Country-/Continent-Reports unterzaehlen systematisch.
          # Loesung: Hauptdatei + alle Parts einlesen, dedupen via set.
          # Unter Schwelle (Parts existieren nicht) safe – glob matcht nichts.
          # Identisch zum Fix in update_confidence_blacklist.yml.
          import glob as _glob
          BLACKLIST = "combined_threat_blacklist_ipv4.txt"
          _sources_read = [BLACKLIST] + sorted(
              _glob.glob("combined_threat_blacklist_ipv4_part*.txt"))
          _existing_sources = [s for s in _sources_read if os.path.exists(s)]
          if not _existing_sources:
              print("FEHLER: Blacklist nicht gefunden!")
              sys.exit(1)

          _bl_set = set()
          for _src in _existing_sources:
              with open(_src) as f:
                  for line in f:
                      s = line.strip()
                      if s and not s.startswith("#"):
                          _bl_set.add(s)
          blacklist_ips = list(_bl_set)
          if len(_existing_sources) > 1:
              print(f"Blacklist: {len(blacklist_ips):,} IPs geladen "
                    f"(Hauptdatei + {len(_existing_sources) - 1} Part(s))")
          else:
              print(f"Blacklist: {len(blacklist_ips):,} IPs geladen")

          # IPs als sortierte Integer für Binary-Search (~60x schneller als brute-force)
          from bisect import bisect_right

          def build_ranges(networks):
              ranges = sorted(
                  [(int(n.network_address), int(n.broadcast_address)) for n in networks]
              )
              return ranges, [r[0] for r in ranges]

          def ip_in_ranges(ip_int, ranges, starts):
              idx = bisect_right(starts, ip_int) - 1
              return idx >= 0 and ranges[idx][0] <= ip_int <= ranges[idx][1]

          bl_addrs = []          # Einzel-IPs: list[(ip_str, ip_int)]
          bl_cidrs = []          # CIDRs:      list[(entry_str, lo_int, hi_int)]
          _skipped_unparseable = 0
          for ip in blacklist_ips:
              try:
                  if "/" in ip:
                      _net = ipaddress.ip_network(ip, strict=False)
                      bl_cidrs.append((ip,
                                       int(_net.network_address),
                                       int(_net.broadcast_address)))
                  else:
                      bl_addrs.append((ip, int(ipaddress.ip_address(ip))))
              except Exception:
                  _skipped_unparseable += 1
          bl_addrs.sort(key=lambda x: x[1])
          # Repräsentative IP pro CIDR (network_address) für First-Match-Wins-
          # Geo-Zuordnung. So bekommen CIDR-Einträge zumindest eine Länder-
          # Klassifikation; bisher wurden sie stillschweigend verworfen.
          if _skipped_unparseable:
              print(f"  WARN: {_skipped_unparseable} unparsbare Einträge übersprungen")
          print(f"Gültige IPs für Geo-Match: {len(bl_addrs):,} "
                f"({len(bl_cidrs):,} CIDR-Einträge zusätzlich erkannt)")

          # ── Pro Land: Prefixliste laden + Blacklist-IPs matchen ───────────
          # Hinweis: First-Match-Wins – eine IP wird dem ersten Land zugeordnet
          # dessen Prefix-Range sie enthält (Reihenfolge in COUNTRIES ist definierend).
          # Reihenfolge: High-Risk zuerst, dann Medium-Risk, dann Low-Risk.
          # IPs in Transit-ASNs (z.B. Cogent, Level3) können so einem
          # geopolitisch höher eingestuften Land zugeordnet werden – gewollt.
          print(f"\nLade Länderprefixe von ScaniteX und matche gegen Blacklist...")
          print(f"({len(COUNTRIES)} Länder)\n")

          MAX_ELAPSED_SECONDS = 20 * 60
          started_at = time.time()

          results       = []
          ip_to_country = {}   # ip → cc (für blacklist_geo_enriched.json)

          for entry in COUNTRIES:
              elapsed = time.time() - started_at
              if elapsed > MAX_ELAPSED_SECONDS:
                  _skipped = [e["cc"] for e in COUNTRIES[COUNTRIES.index(entry):]]
                  _msg = (f"Laufzeitlimit erreicht ({elapsed:.0f}s > {MAX_ELAPSED_SECONDS}s) – "
                          f"{len(_skipped)} Länder übersprungen: {', '.join(_skipped)}")
                  print(f"::warning file=geo_tagger.yml::{_msg}")
                  print(f"\nWARNUNG: {_msg}")
                  break
              cc   = entry["cc"]
              url  = f"{SCANITEX_BASE}/{cc.lower()}/download/cidr"
              print(f"  {entry['flag']} {entry['name']} ({cc})...", end=" ", flush=True)

              raw = fetch_raw(url)
              if not raw:
                  print("SKIP")
                  continue

              # CIDRs aus HTML/TXT parsen
              networks = []
              for cidr in CIDR_RE.findall(raw):
                  try:
                      networks.append(ipaddress.ip_network(cidr, strict=False))
                  except Exception as _suppressed:
                      print(f"WARN: suppressed Exception: {_suppressed}", file=sys.stderr)

              if not networks:
                  print("SKIP (keine CIDRs)")
                  continue

              asn_ranges, asn_starts = build_ranges(networks)

              # Blacklist-IPs matchen (Binary-Search)
              matched = []
              for ip_str, ip_int in bl_addrs:
                  if ip_str in ip_to_country:
                      continue
                  if ip_in_ranges(ip_int, asn_ranges, asn_starts):
                      matched.append(ip_str)
                      ip_to_country[ip_str] = cc

              # CIDR-Einträge: über Netzadresse zuordnen (First-Match-Wins).
              # Eine CIDR-Range kann theoretisch mehrere Länder umspannen –
              # für die Geo-Statistik wird sie dem Land der network_address
              # zugeschlagen. Vermeidet stilles Verwerfen wie zuvor.
              for cidr_str, lo, _hi in bl_cidrs:
                  if cidr_str in ip_to_country:
                      continue
                  if ip_in_ranges(lo, asn_ranges, asn_starts):
                      matched.append(cidr_str)
                      ip_to_country[cidr_str] = cc

              total_ips = sum(n.num_addresses for n in networks)
              results.append({
                  "cc":       cc,
                  "name":     entry["name"],
                  "flag":     entry["flag"],
                  "risk":     entry["risk"],
                  "matches":  len(matched),
                  "prefixes": len(networks),
                  "total_ips": total_ips,
              })

              print(f"{len(matched):,} BL-Hits / {len(networks)} Prefixes")
              time.sleep(0.3)

          # Nicht-gematchte Einträge als "Unknown" (IPs + CIDRs)
          unmatched = [ip for ip, _ in bl_addrs if ip not in ip_to_country]
          unmatched += [c for c, _, _ in bl_cidrs if c not in ip_to_country]
          print(f"\nNicht zugeordnet: {len(unmatched):,} Einträge "
                f"(IPs + CIDRs)")

          # Sortieren nach Matches
          results.sort(key=lambda x: x["matches"], reverse=True)
          total_matched = sum(r["matches"] for r in results)

          # ── Report immer zuerst schreiben ────────────────────────────────
          # Gesamt = Einzel-IPs + CIDR-Einträge (CIDRs sind in combined selten,
          # aber vorhanden – im Report explizit ausgewiesen).
          total_entries = len(bl_addrs) + len(bl_cidrs)
          pct_covered = total_matched / max(total_entries, 1) * 100

          lines = [
              "# Geo-Tagger – Blacklist Enrichment Report",
              f"**Aktualisiert:** {now_str}  ",
              f"**Methode:** ScaniteX Länderprefixe (kein API-Key, kein Rate-Limit)  ",
              f"**Blacklist-Einträge gesamt:** {total_entries:,} "
              f"({len(bl_addrs):,} IPs + {len(bl_cidrs):,} CIDRs)  ",
              f"**Davon zugeordnet:** {total_matched:,} ({pct_covered:.1f}%)  ",
              f"**Nicht zugeordnet:** {len(unmatched):,}",
              "",
              "---",
              "",
              "## Länder-Übersicht",
              "",
              "| Land | CC | Risiko | Prefixe | Treffer |",
              "|---|---|---|---:|---:|",
          ]
          for r in results:
              lines.append(
                  f"| {r['flag']} {r['name']} | `{r['cc']}` | {r['risk']} | {r['prefixes']:,} | **{r['matches']:,}** |"
              )

          if unmatched:
              lines += ["", "---", "", "## Nicht zugeordnete IPs (Sample)", ""]
              for ip in unmatched[:50]:
                  lines.append(f"- `{ip}`")
              if len(unmatched) > 50:
                  lines.append(f"- … und {len(unmatched) - 50:,} weitere")

          lines += [
              "",
              "---",
              f"*Datenquelle: [ScaniteX IP Ranges](https://scanitex.com/en/resources/ip-ranges) (länderweise CIDR-Listen, kein API-Key)*  ",
              f"*Generiert: {now_str}*",
          ]

          write_text_atomic("reports/geo_tagger_report.md", "\n".join(lines))
          print("reports/geo_tagger_report.md geschrieben")

          # ── Leerungsschutz ────────────────────────────────────────────────
          # Wenn ScaniteX nicht erreichbar war und alle Länder-Requests fehlschlugen,
          # sind total_matched=0 und ip_to_country leer → keine Ausgabe schreiben.
          MIN_GEO_MATCHED = 100
          if total_matched < MIN_GEO_MATCHED:
              msg = (f"Nur {total_matched} Geo-Treffer (< {MIN_GEO_MATCHED}) – "
                     f"behalte bestehende geo_enriched/blacklist_geo_enriched.json")
              print(f"::warning file=geo_tagger.yml::{msg}")
              print(f"WARNUNG: {msg}")
              sys.exit(1)

          # ── blacklist_geo_enriched.json ───────────────────────────────────
          # FIX: atomar schreiben (wird von workflow_health_checker gelesen).
          # Bei der Groesse ist ein Runner-Kill waehrend dem Schreiben besonders
          # wahrscheinlich → ohne atomaren Write bleibt eine halb-geschriebene
          # JSON-Datei zurueck, die den Reader zum Absturz bringt.
          #
          # FIX HARD-LIMIT-GEO: Groesse VOR dem Schreiben schaetzen und bei
          # >= HARD_LIMIT_MB Truncate-Fallback + Parts anwenden, analog zur
          # Logik in update_combined_blacklist.yml. Ohne diesen Schutz wuerde
          # git push hart fehlschlagen sobald geo_enriched die 100 MB GitHub-
          # Push-Grenze reisst. Wachstum ist proportional zu combined_threat
          # (Faktor ~1.12 wegen JSON-Overhead) – schwellenwert wird kurz nach
          # combined erreicht. Hauptdatei bleibt vollstaendig solange unter
          # HARD_LIMIT, Parts decken Vollstaendigkeit ab sobald Split-Schwelle
          # erreicht. ip_to_country wird sortiert in Chunks geteilt, Metadaten
          # (updated/method/bl_total/matched/unmatched) bleiben in jeder Datei.
          HARD_LIMIT_MB      = 100  # GitHub Push-Limit
          TRUNCATE_TARGET_MB = 95   # Sicherheitspuffer unter HARD_LIMIT_MB
          SPLIT_THRESHOLD_MB = 90   # ab hier Parts erzeugen
          PART_TARGET_MB     = 40   # Groesse pro Part

          # FIX GEO-SUBDIR (Juni 2026): Haupt- und Part-Dateien liegen in
          # einem eigenen Unterordner statt im Repo-Root, da die Part-Zahl
          # mit dem Listenwachstum steigt und den Root sonst zumuellt.
          # write_json_atomic nutzt tempfile.mkstemp(dir=target_dir) – das
          # Zielverzeichnis MUSS vorher existieren, sonst FileNotFoundError
          # beim ersten Write. Daher hier einmalig anlegen.
          GEO_DIR  = "geo_enriched"
          os.makedirs(GEO_DIR, exist_ok=True)
          GEO_MAIN = f"{GEO_DIR}/blacklist_geo_enriched.json"

          # Stabile Item-Reihenfolge fuer deterministisches Splitting.
          # Sortierung: numerisch nach IP, CIDRs am Ende (lexikographisch).
          # Eine deterministische Reihenfolge ist wichtig damit Konsumenten
          # die Parts in derselben Reihenfolge lesen wie sie geschrieben werden.
          def _geo_sort_key(item):
              k = item[0]
              try:
                  if "/" in k:
                      # CIDR sortiert nach numerischer Netzadresse, suffix als Tiebreaker
                      _addr, _mask = k.split("/", 1)
                      parts = tuple(int(x) for x in _addr.split("."))
                      return (0, parts, int(_mask))
                  parts = tuple(int(x) for x in k.split("."))
                  return (0, parts, -1)
              except (ValueError, AttributeError):
                  # Korrupte Keys nach hinten
                  return (1, (256, 256, 256, 256), 0)

          _geo_items = sorted(ip_to_country.items(), key=_geo_sort_key)

          # Sample-basierte Avg-Schaetzung der serialisierten Eintrags-Groesse.
          # Pro Entry: '"ip":"cc"' + ',' Trenner (am Ende einer zu viel, aber
          # Approximation – das +2% Aufschlag faengt die Restunschaerfe).
          _g_step = max(1, len(_geo_items) // 10_000)
          _g_sample = _geo_items[::_g_step][:10_000]
          if _g_sample:
              # len(json.dumps({k:v})) inkludiert die {}, also -2 fuer Pro-Entry-Volumen
              _g_avg_entry = sum(
                  len(json.dumps({k: v}, separators=(",", ":"))) - 2 for k, v in _g_sample
              ) / len(_g_sample)
              _g_avg_entry += 1  # ',' zwischen Eintraegen
          else:
              _g_avg_entry = 18  # Fallback ~"1.2.3.4":"DE",
          _g_meta_overhead = 1024  # updated/method/bl_total/matched/unmatched + JSON-Struktur
          _geo_estimated_mb = (
              len(_geo_items) * _g_avg_entry * 1.02 + _g_meta_overhead
          ) / 1024 / 1024
          print(f"\nGeschaetzte Groesse geo_enriched (ungesplittet): {_geo_estimated_mb:.1f} MB")

          if _geo_estimated_mb >= HARD_LIMIT_MB:
              # Truncate: erste max_entries (sortiert nach IP). Rest in Parts.
              _g_max = int((TRUNCATE_TARGET_MB * 1024 * 1024 - _g_meta_overhead) / _g_avg_entry)
              _g_max = max(1000, min(_g_max, len(_geo_items)))
              _g_truncated = dict(_geo_items[:_g_max])
              _g_dropped = len(_geo_items) - _g_max
              _g_trunc_msg = (
                  f"Hauptdatei wuerde {_geo_estimated_mb:.1f} MB "
                  f"(>= {HARD_LIMIT_MB} MB GitHub-Limit) – TRUNCATE auf "
                  f"{_g_max:,} Eintraege (~{TRUNCATE_TARGET_MB} MB). "
                  f"{_g_dropped:,} Eintraege ausschliesslich in Parts. Consumer auf Parts umstellen!"
              )
              print(f"::warning file=geo_tagger.yml::{_g_trunc_msg}")
              print(f"WARNUNG: {_g_trunc_msg}")
              write_json_atomic(GEO_MAIN, {
                  "updated":         now_str,
                  "method":          "scanitex-cidr-match",
                  "bl_total":        len(bl_addrs),
                  "matched":         total_matched,
                  "unmatched":       len(unmatched),
                  "truncated":       True,
                  "entries_in_file": _g_max,
                  "entries_total":   len(_geo_items),
                  "note":            (f"{_g_dropped} Eintraege NICHT in dieser Datei "
                                      f"(GitHub-Hard-Limit 100 MB) – siehe "
                                      f"{GEO_DIR}/blacklist_geo_enriched_part*.json fuer Rest"),
                  "ip_to_country":   _g_truncated,
              }, separators=(",", ":"))
          else:
              write_json_atomic(GEO_MAIN, {
                  "updated":       now_str,
                  "method":        "scanitex-cidr-match",
                  "bl_total":      len(bl_addrs),
                  "matched":       total_matched,
                  "unmatched":     len(unmatched),
                  "ip_to_country": dict(_geo_items),
              }, separators=(",", ":"))
          _geo_main_mb = os.path.getsize(GEO_MAIN) / 1024 / 1024
          print(f"{GEO_MAIN} geschrieben ({_geo_main_mb:.1f} MB)")

          # ── Split-Logik fuer grosse geo_enriched-Dateien ──────────────────
          # Identische Strategie wie combined/conf40: Split-Entscheidung auf
          # Basis der VOLLSTAENDIGEN Liste (estimated_mb), Hauptdatei bleibt
          # bei Truncate parallel als Legacy-Pfad (subset der Eintraege).
          import glob as _glob_geo
          _geo_part_glob = f"{GEO_DIR}/blacklist_geo_enriched_part*.json"
          _existing_parts_geo = sorted(_glob_geo.glob(_geo_part_glob))

          if _geo_estimated_mb >= SPLIT_THRESHOLD_MB:
              _g_num_parts = max(2, int((_geo_estimated_mb / PART_TARGET_MB) + 0.5))
              _g_chunk = (len(_geo_items) + _g_num_parts - 1) // _g_num_parts
              print(f"  -> Split aktiv: {_g_num_parts} Parts a ~{PART_TARGET_MB} MB "
                    f"({_g_chunk:,} Eintraege/Part)")

              _new_parts_geo = []
              for _g_idx in range(_g_num_parts):
                  _g_start = _g_idx * _g_chunk
                  _g_end   = min(_g_start + _g_chunk, len(_geo_items))
                  if _g_start >= len(_geo_items):
                      break
                  _g_part_name = f"{GEO_DIR}/blacklist_geo_enriched_part{_g_idx+1}.json"
                  _g_part_items = _geo_items[_g_start:_g_end]
                  write_json_atomic(_g_part_name, {
                      "updated":         now_str,
                      "method":          "scanitex-cidr-match",
                      "part":            _g_idx + 1,
                      "parts_total":     _g_num_parts,
                      "key_range":       [_g_part_items[0][0], _g_part_items[-1][0]],
                      "entries_in_part": _g_end - _g_start,
                      "ip_to_country":   dict(_g_part_items),
                  }, separators=(",", ":"))
                  _new_parts_geo.append(_g_part_name)
                  print(f"  {_g_part_name}: {_g_end - _g_start:,} Eintraege, "
                        f"{os.path.getsize(_g_part_name)/1024/1024:.1f} MB")

              # Alte Parts entfernen, die nicht mehr erzeugt wurden
              for _g_old in _existing_parts_geo:
                  if _g_old not in _new_parts_geo:
                      try:
                          os.unlink(_g_old)
                          print(f"  Alten Part entfernt: {_g_old}")
                      except OSError:
                          pass

              if _geo_estimated_mb < HARD_LIMIT_MB:
                  _g_split_msg = (f"Vollliste waere {_geo_estimated_mb:.1f} MB "
                                  f"(>= {SPLIT_THRESHOLD_MB} MB). Parts erzeugt als Reserve.")
                  print(f"::warning file=geo_tagger.yml::{_g_split_msg}")
                  print(f"WARNUNG: {_g_split_msg}")
          else:
              for _g_old in _existing_parts_geo:
                  try:
                      os.unlink(_g_old)
                      print(f"  Alten Part entfernt (unter Schwelle): {_g_old}")
                  except OSError:
                      pass

          print(f"\nFERTIG: {total_matched:,} von {len(bl_addrs):,} IPs ({pct_covered:.1f}%) zugeordnet")
          EOF

      - name: Commit
        if: always()  # FIX: auch bei Leerungsschutz-Exit den Report committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # FIX SUBDIR-MIGRATION: alte Root-Version entfernen, sobald dieser
          # Workflow die neue reports///logs/-Version committet (atomar im
          # selben Commit). Idempotent: --ignore-unmatch nach 1. Lauf.
          git rm -q --ignore-unmatch geo_tagger_report.md 2>/dev/null || true
          # FIX GEO-SUBDIR: einmalige Migration – alte Root-Geo-Dateien aus
          # dem Repo entfernen (Hauptdatei + variable Part-Anzahl). Idempotent:
          # nach dem ersten Lauf matchen die Globs nichts mehr, --ignore-unmatch
          # verhindert den Fehler. Die neuen Dateien liegen unter geo_enriched/.
          git rm -q --ignore-unmatch blacklist_geo_enriched.json blacklist_geo_enriched_part*.json 2>/dev/null || true
          # FIX HARD-LIMIT-GEO: Parts-Pattern mitnehmen damit der Commit
          # die durch Split entstandenen Parts erfasst und alte (geloeschte)
          # Parts als Removal committet werden.
          git add geo_enriched/blacklist_geo_enriched.json reports/geo_tagger_report.md
          git add -A geo_enriched 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Geo-Tagger: Blacklist geo-enriched [$(date -u '+%Y-%m-%d %H:%M') UTC]"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs geo_enriched/blacklist_geo_enriched.json reports/geo_tagger_report.md 2>/dev/null || true
                git checkout --theirs geo_enriched/blacklist_geo_enriched_part*.json 2>/dev/null || true
                git add geo_enriched/blacklist_geo_enriched.json reports/geo_tagger_report.md 2>/dev/null || true
                git add -A geo_enriched 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi
