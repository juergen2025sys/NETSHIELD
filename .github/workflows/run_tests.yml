name: Run Tests

on:
  push:
    paths:
      - '*.txt'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '*.txt'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Security hygiene (SHA-Pinning, atomic writes, SSRF)
        run: python3 scripts/check_security_hygiene.py

      - name: Test-Abhaengigkeiten installieren (defusedxml, ijson, PyYAML)
        # FIX BUG-XML-FALLBACK-FILTER (2026-08-25): ohne dieses Paket landet
        # parse_feed_entries() beim XML-Parsen immer im Regex-Fallback-Pfad
        # (siehe Kommentar in netshield_common.py) - der ist zwar inzwischen
        # ebenfalls gegen die Gateway/Resolver-Ausschlussliste abgesichert,
        # aber der eigentliche ElementTree-Pfad (ueber defusedxml) sollte
        # hier trotzdem mitgetestet werden, nicht nur der Fallback.
        # ijson: JSON-State-Import im Combined-Regressionstest; Version wie im Combined-Workflow.
        # PyYAML: Workflow-Pruefungen ohne Abhaengigkeit von vorinstallierten Runner-Paketen.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages defusedxml==0.7.1 ijson==3.5.1 PyYAML==6.0.2 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check defusedxml==0.7.1 ijson==3.5.1 PyYAML==6.0.2

      - name: Run Unit Tests
        run: python3 -m unittest discover -s tests -v

  release-list-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate published IPv4 lists
        run: python3 scripts/check_release_lists.py
