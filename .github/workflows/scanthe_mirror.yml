name: ScanThe.Net Mirror

# Holt die Cloudflare-geschuetzte ScanThe.Net-Blocklist via Headless-Browser
# (Playwright/Chromium) und legt sie als scanthe_daily.txt im Repo ab, damit
# NETSHIELD und OPNsense sie ueber raw.githubusercontent.com ohne Cloudflare
# ziehen koennen.

on:
  schedule:
    - cron: '17 */6 * * *'   # alle 6h (versetzt, nicht auf der vollen Stunde)
  workflow_dispatch:          # manuell ausloesbar (fuer den ersten Test)

permissions:
  contents: write             # noetig, um scanthe_daily.txt zu committen

concurrency:
  group: scanthe-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright + Chromium installieren
        run: |
          pip install --quiet playwright playwright-stealth
          python -m playwright install --with-deps chromium

      - name: Blocklist via Headless-Browser holen
        run: python scripts/scanthe_mirror.py

      - name: Bei Aenderung committen und pushen
        run: |
          if [[ -n "$(git status --porcelain scanthe_daily.txt)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scanthe_daily.txt
            git commit -m "scanthe mirror: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "keine Aenderung - nichts zu committen"
          fi
