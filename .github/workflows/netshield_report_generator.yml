name: NETSHIELD Report Generator

on:
  schedule:
    - cron: '30 * * * *'   # stündlich (30 Min nach der vollen Stunde – combined braucht ~20min, Puffer 10min)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write    # write noetig fuer 'gh workflow run' (Bot-Detector-Trigger am Ende, 2026-07-05)
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Generate reports/NETSHIELD_REPORT.md
        run: |
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import (
              load_whitelist, load_fp_set, is_in_fp_set,
              is_valid_public_ipv4, is_valid_public_cidr,
              is_protected_entry, is_whitelisted,
              parse_entries as _parse_entries, calculate_confidence,
              safe_get_date, parse_date, sort_ips, write_ip_list,
              write_text_atomic, concatenate_files_atomic,
              fetch_url, check_local_feed_age,
              IPV4_RE, CIDR_RE, TIMESTAMP_RE,
          )

          # Init: Whitelist + FP-Set laden
          load_whitelist()
          load_fp_set()

          import sys
          import json
          import os
          import re
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          now_str = now.strftime("%Y-%m-%d %H:%M UTC")

          # CHANGE ZWEI-FESTE-PARTS: Die Hauptdatei wird nicht mehr committet
          # (Parts part1/part2 sind kanonisch). Fuer die Report-Funktionen
          # (count_ips, file_age) hier einmalig aus den committeten Parts
          # rekonstruieren, falls sie fehlt (numerische Reihenfolge via sort).
          import glob as _rc_glob
          _rc_main = "combined_threat_blacklist_ipv4.txt"
          if not os.path.exists(_rc_main):
              _rc_parts = sorted(_rc_glob.glob("combined_threat_blacklist_ipv4_part*.txt"))
              if _rc_parts:
                  _rc_bytes = concatenate_files_atomic(_rc_main, _rc_parts)
                  print(
                      f"Rekonstruiert: {_rc_main} aus {len(_rc_parts)} Part(s) "
                      f"({_rc_bytes:,} Bytes, atomar)"
                  )

          def count_ips(filepath):
              # FIX TRUNCATE-PARTS-COUNT: Liest Hauptdatei + alle Parts,
              # dedupliziert via set. Vorher zaehlte die Funktion nur die
              # Hauptdatei – bei aktivem Truncate (combined/conf40 >= 100 MB)
              # zeigte der Report eine falsche, zu niedrige IP-Anzahl.
              # Identisches Pattern wie FIX BUG-TRUNCATE-PARTS in geo_tagger.yml
              # und update_confidence_blacklist.yml.
              # Glob-Pattern leitet sich aus der Hauptdatei ab: foo.txt → foo_part*.txt
              if not os.path.exists(filepath):
                  return 0
              import glob as _glob
              _base, _ext = os.path.splitext(filepath)
              _sources = [filepath] + sorted(_glob.glob(f"{_base}_part*{_ext}"))
              _seen = set()
              for _src in _sources:
                  try:
                      with open(_src, encoding="utf-8") as f:
                          for line in f:
                              s = line.strip()
                              if s and not s.startswith("#"):
                                  _seen.add(s)
                  except OSError:
                      continue
              return len(_seen)
              if not os.path.exists(workflow_path):
                  return "–"
              try:
                  with open(workflow_path, encoding="utf-8") as f:
                      workflow = f.read()

                  sources_block = re.search(r'^\s+SOURCES\s*=\s*\{', workflow, re.MULTILINE)
                  if not sources_block:
                      return "–"

                  brace_start = sources_block.start() + sources_block.group().index('{')
                  depth = 0
                  brace_end = brace_start
                  for i, ch in enumerate(workflow[brace_start:], brace_start):
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              brace_end = i + 1
                              break
                  raw_sources = workflow[brace_start:brace_end]
                  remote_feeds = len(re.findall(r'^[ \t]*"([^"\n]+)"\s*:\s*\(\s*"([^"\n]+)"\s*,\s*(True|False)\s*\)\s*,?', raw_sources, re.MULTILINE))

                  # FIX BUG1: LOCAL_FEEDS ist ein Dict ({...}), keine List ([...]).
                  # Suche nach { statt [ und parse Dict-Einträge "name": True/False.
                  local_block = re.search(r'^\s+LOCAL_FEEDS\s*=\s*\{', workflow, re.MULTILINE)
                  local_feeds = 0
                  if local_block:
                      brace_start2 = local_block.start() + local_block.group().index('{')
                      depth = 0
                      brace_end2 = brace_start2
                      for i, ch in enumerate(workflow[brace_start2:], brace_start2):
                          if ch == '{':
                              depth += 1
                          elif ch == '}':
                              depth -= 1
                              if depth == 0:
                                  brace_end2 = i + 1
                                  break
                      raw_local = workflow[brace_start2:brace_end2]
                      local_feeds = len(re.findall(r'^[ \t]*"([^"\n]+)"\s*:\s*(True|False)\s*,?', raw_local, re.MULTILINE))

                  total = remote_feeds + local_feeds

                  # Auto-discovered Feeds mitzählen
                  auto_file = "state/auto_discovered_feeds.json"
                  if os.path.exists(auto_file):
                      try:
                          with open(auto_file, encoding="utf-8") as af:
                              auto_data = json.load(af)
                          total += auto_data.get("total_feeds", 0)
                      except Exception as _suppressed:
                          print(f"WARN: suppressed Exception: {_suppressed}", file=sys.stderr)

                  return str(total) if total > 0 else "–"
              except Exception:
                  return "–"

          # Rueckwaertskompatibel: alte Dateien tragen UTC, die Combined-/Active-
          # Ausgaben verwenden deutsche Ortszeit (CET/CEST, Europe/Berlin).
          _TS_RE = re.compile(
              r'#\s*Aktualisiert:\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})'
              r'\s*(UTC|CET|CEST)(\s*\(Europe/Berlin\))?'
          )

          def file_age(filepath):
              """Liest den Aktualisiert-Header (UTC oder Europe/Berlin).
              Fallback auf os.path.getmtime() wäre falsch – git checkout setzt mtime
              immer auf den Checkout-Zeitpunkt, nicht auf das letzte echte Update."""
              if not os.path.exists(filepath):
                  return "–"
              try:
                  with open(filepath, encoding="utf-8") as _f:
                      # Nur die ersten 10 Zeilen lesen – Header steht immer am Anfang
                      for _ in range(10):
                          line = _f.readline()
                          if not line:
                              break
                          m = _TS_RE.search(line)
                          if m:
                              zone = m.group(2)
                              suffix = " (Europe/Berlin)" if zone in ("CET", "CEST") else ""
                              return f"{m.group(1)} {zone}{suffix}"
              except Exception as _suppressed:
                  print(f"WARN: suppressed Exception: {_suppressed}", file=sys.stderr)
              return "–"

          FILES = {
              "combined_threat_blacklist_ipv4.txt": "Stufe 1 – Alle IPs (180 Tage)",
              "active_blacklist_ipv4.txt": "Stufe 2 – Aktiv (30 Tage + Conf≥65)",
              "blacklist_confidence40_ipv4.txt": "Mittleres/Hohes Vertrauen (≥40/100) → OPNsense",
              "watchlist_confidence25to39_ipv4.txt": "Watchlist (Score 25-39/100)",
              "cve_exploit_ips.txt": "CVE Exploit IPs",
              "bot_detector_blacklist_ipv4.txt": "Bot-Detector Blacklist",
              "honeypot_ips.txt": "Honeypot IPs",
              "honigtopf_ips.txt": "Honigtopf Community Honeypot (API)",
          }

          lines = []
          lines.append("# 🛡 NETSHIELD Report")
          lines.append(f"**Aktualisiert:** {now_str}\n")
          lines.append("---")
          lines.append("## 📊 Listen-Übersicht\n")
          lines.append("| Datei | Beschreibung | IPs | Letzte Änderung |")
          lines.append("|---|---|---:|---|")

          total = 0
          for fname, desc in FILES.items():
              count = count_ips(fname)
              age = file_age(fname)
              exists = "✅" if os.path.exists(fname) else "❌"
              lines.append(f"| {exists} `{fname}` | {desc} | **{count:,}** | {age} |")
              if fname == "combined_threat_blacklist_ipv4.txt":
                  total = count

          lines.append("")

          if os.path.exists("state/feed_health_status.json"):
              try:
                  with open("state/feed_health_status.json", encoding="utf-8") as f:
                      fh = json.load(f)
                  s = fh.get("summary", {})
                  lines.append("---")
                  lines.append(f"## 🔍 Feed Health: ✅ {s.get('ok', 0)} OK | ⚠️ {s.get('warn', 0)} leer | ❌ {s.get('error', 0)} Fehler\n")
                  failed = fh.get("failed_feeds", [])
                  warned = fh.get("warned_feeds", [])
                  if failed:
                      lines.append(f"**❌ Ausgefallen:** {', '.join(f'`{n}`' for n in failed[:10])}{'…' if len(failed) > 10 else ''}\n")
                  if warned:
                      lines.append(f"**⚠️ Leer:** {', '.join(f'`{n}`' for n in warned[:10])}{'…' if len(warned) > 10 else ''}\n")
                  # ── Stale-/Quarantäne-Status (Selbstregulierungs-Schleife) ──
                  # Zeigt eingefrorene Feeds (liefern HTTP 200 + IPs, aber seit
                  # Tagen unveränderte IP-Menge). stale_feeds stammt aus dem Feed
                  # Health Monitor. Feeds, die die Quarantäne-Schwelle (21 T) des
                  # Combined-Builds erreichen, werden dort automatisch nicht mehr
                  # als frische Bestätigung gezählt – das wird hier sichtbar.
                  stale = fh.get("stale_feeds", [])
                  if stale:
                      def _du(x):
                          try:
                              return int(x.get("days_unchanged", 0) or 0)
                          except (TypeError, ValueError):
                              return 0
                      _parts = []
                      for x in stale[:10]:
                          if not isinstance(x, dict):
                              continue
                          _mark = " ⚠️DP" if x.get("is_dataplane") else ""
                          _parts.append(f"`{x.get('name', '?')}` {_du(x)}T{_mark}")
                      lines.append(f"**🧊 Eingefroren ({len(stale)}):** "
                                   + ", ".join(_parts)
                                   + ("…" if len(stale) > 10 else "") + "\n")
                      _quar = [x for x in stale if isinstance(x, dict) and _du(x) >= 21]
                      if _quar:
                          lines.append(f"*{len(_quar)} davon ≥21 Tage → im Combined automatisch in Quarantäne "
                                       f"(eingefrorene HQ-Feeds zählen nicht mehr als frische Bestätigung, "
                                       f"betroffene IPs altern normal aus). Details: "
                                       f"[reports/stale_feed_report.md](reports/stale_feed_report.md)*\n")
                      else:
                          lines.append(f"*Noch unter der 21-Tage-Quarantäne-Schwelle – nur beobachtet. "
                                       f"Details: [reports/stale_feed_report.md](reports/stale_feed_report.md)*\n")
                  lines.append(f"*Letzter Check: {fh.get('updated', '–')} – Details: [reports/feed_health_report.md](reports/feed_health_report.md)*\n")
              except Exception as e:
                  print(f"WARNUNG: state/feed_health_status.json konnte nicht gelesen werden: {e}")

          if os.path.exists("reports/workflow_health_report.md"):
              lines.append("---")
              lines.append("## ⚙️ Workflow Health\n")
              lines.append("*Details: [reports/workflow_health_report.md](reports/workflow_health_report.md)*\n")

          lines.append("---")
          lines.append(f"*Automatisch generiert von NETSHIELD Report Generator · {now_str}*")

          # ── FIX: Nur schreiben wenn sich Daten geändert haben ──────────
          # Verhindert ~24 unnötige Commits/Tag durch stündlich wechselnde
          # Timestamps bei unveränderten IP-Zahlen und Feed-Health-Daten.
          new_content = "\n".join(lines)
          _ts_strip = re.compile(r'\*\*Aktualisiert:\*\*[^\n]*|\*Automatisch generiert[^\n]*|\*Letzter Check:[^\n]*')
          def _data_only(text):
              return _ts_strip.sub("", text).strip()

          write_report = True
          # FIX: Wenn combined_threat_blacklist_ipv4.txt fehlt oder leer ist,
          # Report nicht mit 0-Werten überschreiben (fehlgeschlagener Combined-Run).
          if total == 0 and os.path.exists("reports/NETSHIELD_REPORT.md"):
              print("WARNUNG: combined=0 IPs – behalte bestehenden reports/NETSHIELD_REPORT.md")
              write_report = False
          elif os.path.exists("reports/NETSHIELD_REPORT.md"):
              with open("reports/NETSHIELD_REPORT.md", encoding="utf-8") as _old:
                  if _data_only(_old.read()) == _data_only(new_content):
                      write_report = False
                      print(f"reports/NETSHIELD_REPORT.md: Daten unverändert – Schreiben übersprungen")

          if write_report:
              write_text_atomic("reports/NETSHIELD_REPORT.md", new_content)
              print(f"reports/NETSHIELD_REPORT.md geschrieben | combined: {total:,} IPs")
          EOF

      - name: Update README Header Stats
        run: |
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import (
              load_whitelist, load_fp_set, is_in_fp_set,
              is_valid_public_ipv4, is_valid_public_cidr,
              is_protected_entry, is_whitelisted,
              parse_entries as _parse_entries, calculate_confidence,
              safe_get_date, parse_date, sort_ips, write_ip_list,
              write_text_atomic,
              fetch_url, check_local_feed_age,
              IPV4_RE, CIDR_RE, TIMESTAMP_RE,
          )
          import json
          import os
          import re
          import sys
          from datetime import datetime, timezone

          # ── Konstanten ────────────────────────────────────────────────────
          WORKFLOW_COUNT  = len([
              f for f in os.listdir(".github/workflows")
              if f.endswith(".yml")
          ]) if os.path.isdir(".github/workflows") else 16

          def count_ips(filepath):
              # FIX TRUNCATE-PARTS-COUNT: Hauptdatei + Parts deduplizieren.
              # Siehe identische Funktion im vorherigen Step (Heredoc-Namespaces
              # teilen keinen State, deshalb hier zweite Kopie). Vorher unterzaehlte
              # die Funktion bei Truncate-aktivem combined/conf40 systematisch.
              if not os.path.exists(filepath):
                  return 0
              import glob as _glob
              _base, _ext = os.path.splitext(filepath)
              _sources = [filepath] + sorted(_glob.glob(f"{_base}_part*{_ext}"))
              _seen = set()
              for _src in _sources:
                  try:
                      with open(_src, encoding="utf-8") as f:
                          for line in f:
                              s = line.strip()
                              if s and not s.startswith("#"):
                                  _seen.add(s)
                  except OSError:
                      continue
              return len(_seen)
          # FIX DUP1: Funktion als eigenständige Definition direkt hier, statt
          # als unsynchronisierte Kopie. Beide EOF-Blöcke definieren die Funktion
          # lokal – das ist unvermeidbar wegen des Heredoc-Namespaces.
          # STAND: Beide Blöcke verwenden identischen Namen derive_feed_count()
          # (kein abweichendes _-Präfix mehr) und identische Implementierung.
          # Änderungen immer in BEIDEN EOF-Blöcken vornehmen (Kommentar markiert Stelle).
          if not os.path.exists("README.md"):
              print("README.md nicht gefunden – übersprungen")
              raise SystemExit(0)

          active     = count_ips("active_blacklist_ipv4.txt")
          cve        = count_ips("cve_exploit_ips.txt")
          honeypot   = count_ips("honeypot_ips.txt")
          # FIX: Guard gegen 0-Werte bei fehlendem/leerem Combined-Run.
          # Wenn alle Hauptlisten 0 IPs haben, liegt wahrscheinlich ein
          # fehlgeschlagener Combined-Run vor → README nicht mit 0-Werten überschreiben.
          if active == 0 and cve == 0 and honeypot == 0:
              print("WARNUNG: Alle Hauptlisten leer oder fehlend – README-Update übersprungen")
              raise SystemExit(0)
          # FIX DUP1: Identische Logik wie derive_feed_count() im ersten EOF-Block.
          # Separate EOF-Heredocs teilen keinen Namespace – lokale Definition nötig.
          # !! Bei Änderungen auch derive_feed_count() im ersten EOF-Block anpassen !!
          def derive_feed_count(workflow_path=".github/workflows/update_combined_blacklist.yml"):
              if not os.path.exists(workflow_path):
                  return "–"
              try:
                  with open(workflow_path, encoding="utf-8") as _wf:
                      _wf_text = _wf.read()
                  _sb = re.search(r'^\s+SOURCES\s*=\s*\{', _wf_text, re.MULTILINE)
                  if not _sb:
                      return "–"
                  _bs = _sb.start() + _sb.group().index('{')
                  _depth, _be = 0, _bs
                  for _i, _ch in enumerate(_wf_text[_bs:], _bs):
                      if _ch == '{': _depth += 1
                      elif _ch == '}':
                          _depth -= 1
                          if _depth == 0: _be = _i + 1; break
                  _remote = len(re.findall(r'^[ \t]*"([^"\n]+)"\s*:\s*\(\s*"([^"\n]+)"\s*,\s*(True|False)\s*\)\s*,?', _wf_text[_bs:_be], re.MULTILINE))
                  _lb = re.search(r'^\s+LOCAL_FEEDS\s*=\s*\{', _wf_text, re.MULTILINE)
                  _local = 0
                  if _lb:
                      _bs2 = _lb.start() + _lb.group().index('{')
                      _depth, _be2 = 0, _bs2
                      for _i, _ch in enumerate(_wf_text[_bs2:], _bs2):
                          if _ch == '{': _depth += 1
                          elif _ch == '}':
                              _depth -= 1
                              if _depth == 0: _be2 = _i + 1; break
                      _local = len(re.findall(r'^[ \t]*"([^"\n]+)"\s*:\s*(True|False)\s*,?', _wf_text[_bs2:_be2], re.MULTILINE))
                  _total = _remote + _local
                  _auto = "state/auto_discovered_feeds.json"
                  if os.path.exists(_auto):
                      try:
                          with open(_auto, encoding="utf-8") as _af:
                              _total += json.load(_af).get("total_feeds", 0)
                      except Exception as _suppressed:
                          print(f"WARN: suppressed Exception: {_suppressed}", file=sys.stderr)
                  return str(_total) if _total > 0 else "–"
              except Exception:
                  return "–"
          feed_count = derive_feed_count()
          now_str    = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          # ── Neue Tabelleninhalte (HTML – passend zum README-Format) ───────
          # FIX README-HTML: Die README verwendet <table>-HTML, nicht Markdown-Pipes.
          # Der vorherige Code schrieb Markdown-Pipes zwischen die Marker und matchte
          # mit einer Regex auf "**Titel**" + "|...|"-Zeilen – das gibt es in der
          # HTML-README nicht, die Regex matchte 0×, und das Datum blieb eingefroren.
          #
          # FIX README-HEIGHT: Alle Zellen haben jetzt zweizeilige Untertitel
          # (bei Bedarf mit &nbsp;-Padding) + vertical-align:top, damit die Zahlen
          # immer auf derselben Höhe stehen – auch wenn ein Untertitel länger ist.

          # STATS_TABLE: 4 Zahlen-Kacheln, alle gleich aufgebaut
          # (<h3>Zahl</h3> + 2-zeiliger <sub>, Leerzeile via &nbsp; falls nur 1 Zeile).
          stats_html = (
              "<table>\n"
              "<tr>\n"
              f"<td align=\"center\" valign=\"top\" width=\"25%\">\n"
              f"<h3>{feed_count}</h3>\n"
              f"<sub>IP-Quellen<br>(dynamisch)</sub>\n"
              f"</td>\n"
              f"<td align=\"center\" valign=\"top\" width=\"25%\">\n"
              f"<h3>{active:,}</h3>\n"
              f"<sub>Aktive IP-Drohungen<br>(Confidence \u226565)</sub>\n"
              f"</td>\n"
              f"<td align=\"center\" valign=\"top\" width=\"25%\">\n"
              f"<h3>{cve:,}</h3>\n"
              f"<sub>CVE/Exploit IPs<br>&nbsp;</sub>\n"
              f"</td>\n"
              f"<td align=\"center\" valign=\"top\" width=\"25%\">\n"
              f"<h3>{honeypot:,}</h3>\n"
              f"<sub>Honeypot IPs<br>&nbsp;</sub>\n"
              f"</td>\n"
              "</tr>\n"
              "</table>"
          )

          # META_TABLE: 2×4-Zellen + 1 zusammengefasste Zeile
          meta_html = (
              "<table>\n"
              "<tr>\n"
              "<td><strong>\U0001F552 Letztes Update</strong></td>\n"
              f"<td>{now_str}</td>\n"
              "<td><strong>\U0001F504 Intervall</strong></td>\n"
              "<td>8\u00D7 t\u00E4glich</td>\n"
              "</tr>\n"
              "<tr>\n"
              "<td><strong>\U0001F4C5 IP-Retention</strong></td>\n"
              "<td>180 Tage</td>\n"
              "<td><strong>\u2699\uFE0F Aktive Workflows</strong></td>\n"
              f"<td>{WORKFLOW_COUNT}</td>\n"
              "</tr>\n"
              "<tr>\n"
              "<td><strong>\U0001F30D Abdeckung</strong></td>\n"
              "<td colspan=\"3\">250+ L\u00E4nder</td>\n"
              "</tr>\n"
              "</table>"
          )

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          def replace_between_markers(text, start_marker, end_marker, new_block, label):
              """Ersetzt den Inhalt zwischen zwei HTML-Kommentar-Markern komplett.

              Matcht Marker + beliebigen Inhalt (non-greedy) + End-Marker und
              ersetzt den Inhalt durch new_block. Funktioniert sowohl mit dem
              alten Markdown-Pipe-Format als auch mit dem neuen HTML-Format.
              """
              pattern = (
                  re.escape(start_marker)
                  + r'\n.*?\n'
                  + re.escape(end_marker)
              )
              replacement = start_marker + '\n' + new_block + '\n' + end_marker
              new_text, n = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if n:
                  print(f"\u2705 {label} aktualisiert")
              else:
                  print(f"WARNUNG: {label} \u2013 Marker nicht gefunden")
              return new_text

          # FIX: Nur schreiben wenn sich IP-Zahlen oder Feed-Counts geändert haben.
          # Timestamp in meta_data ändert sich jede Stunde → nur aktualisieren
          # wenn auch die Daten-Spalten unterschiedlich sind.
          _old_content = content  # content vor replace_between_markers
          content = replace_between_markers(
              content,
              "<!-- STATS_TABLE_START -->", "<!-- STATS_TABLE_END -->",
              stats_html, "STATS_TABLE"
          )
          content = replace_between_markers(
              content,
              "<!-- META_TABLE_START -->", "<!-- META_TABLE_END -->",
              meta_html, "META_TABLE"
          )

          # Vergleich ohne Timestamps: nur schreiben wenn Daten-Zeilen sich unterscheiden.
          # Das Timestamp-Muster matcht sowohl die alte Markdown-Variante ("| DATE |")
          # als auch die neue HTML-Variante ("<td>DATE</td>").
          _ts_re_readme = re.compile(
              r'(\|\s*|<td>\s*)\d{4}-\d{2}-\d{2} \d{2}:\d{2} UTC(\s*\||\s*</td>)'
          )
          _old_stripped = _ts_re_readme.sub("TS", _old_content)
          _new_stripped = _ts_re_readme.sub("TS", content)

          if _old_stripped != _new_stripped:
              write_text_atomic("README.md", content)
              print(f"   Active={active:,} | CVE={cve:,} | Honeypot={honeypot:,} | Update={now_str}")
          else:
              print("README Header Stats: Daten unverändert – Schreiben übersprungen")
          EOF

      - name: Update README IP Counts
        run: |
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import (
              load_whitelist, load_fp_set, is_in_fp_set,
              is_valid_public_ipv4, is_valid_public_cidr,
              is_protected_entry, is_whitelisted,
              parse_entries as _parse_entries, calculate_confidence,
              safe_get_date, parse_date, sort_ips, write_ip_list,
              write_text_atomic,
              fetch_url, check_local_feed_age,
              IPV4_RE, CIDR_RE, TIMESTAMP_RE,
          )
          import os
          import re

          def count_ips(filepath):
              # FIX COMBINED-PARTS-COUNT: Die Combined-Liste wird nur noch als
              # zwei kanonische Parts committet. Deshalb muessen die Parts auch
              # dann gezaehlt werden, wenn die fruehere Hauptdatei fehlt.
              # Existiert eine rekonstruierte Combined-Hauptdatei im Runner,
              # werden nur die Parts gelesen, damit dieselben ~7 Mio. IPs nicht
              # dreifach (Hauptdatei + Part 1 + Part 2) verarbeitet werden.
              import glob as _glob
              _base, _ext = os.path.splitext(filepath)
              _parts = sorted(_glob.glob(f"{_base}_part*{_ext}"))
              if filepath == "combined_threat_blacklist_ipv4.txt" and _parts:
                  _sources = _parts
              elif os.path.exists(filepath):
                  _sources = [filepath] + _parts
              else:
                  return None

              _seen = set()
              for _src in _sources:
                  try:
                      with open(_src, encoding="utf-8") as f:
                          for line in f:
                              s = line.strip()
                              if s and not s.startswith("#"):
                                  _seen.add(s)
                  except OSError:
                      continue
              return len(_seen)

          # Wert: (Quelldatei fuer die Zaehlung, Link-Ziel als README-Anker,
          # Formatierung). Bei Combined wird aus beiden kanonischen Parts gezaehlt,
          # die Tabellenzeile aber ueber den Part-1-Link gefunden.
          README_COUNTS = {
              "combined_threat_blacklist_ipv4.txt": ("combined_threat_blacklist_ipv4_part1.txt", lambda n: f"**{n:,}**"),
              "active_blacklist_ipv4.txt": ("active_blacklist_ipv4.txt", lambda n: f"**{n:,}**"),
              "blacklist_confidence40_ipv4.txt": ("blacklist_confidence40_ipv4.txt", lambda n: f"**{n:,}**"),
              "watchlist_confidence25to39_ipv4.txt": ("watchlist_confidence25to39_ipv4.txt", lambda n: f"**{n:,}**"),
              "cve_exploit_ips.txt": ("cve_exploit_ips.txt", lambda n: f"**{n:,}**"),
              "bot_detector_blacklist_ipv4.txt": ("bot_detector_blacklist_ipv4.txt", lambda n: f"**{n:,}**"),
              "reputation_blacklist.txt": ("reputation_blacklist.txt", lambda n: f"**{n:,}**"),
              "honeypot_ips.txt": ("honeypot_ips.txt", lambda n: f"**{n:,}**"),
              "honigtopf_ips.txt": ("honigtopf_ips.txt", lambda n: f"**{n:,}**"),
              "asn_blocklist_firewall.txt": ("asn_blocklist_firewall.txt", lambda n: f"**{n:,}**"),
          }

          if not os.path.exists("README.md"):
              print("README.md nicht gefunden – übersprungen")
              raise SystemExit(0)

          # FIX BUG#9: Guard gegen 0-Überschreibung bei leerem/fehlendem Combined-Run.
          # Der vorige Step ("Update README Header Stats") hat denselben Guard –
          # dieser Step hatte ihn nicht. Bei Pipeline-Ausfall würden die IP-Zahlen
          # im README stillschweigend auf 0 gesetzt (combined existiert, ist aber leer).
          # Prüfung: combined_threat_blacklist als Hauptindikator. Falls leer/fehlend
          # → kein Update, damit die README-Zahlen des letzten erfolgreichen Runs
          # sichtbar bleiben.
          combined_count = count_ips("combined_threat_blacklist_ipv4.txt")
          if combined_count is not None and combined_count == 0:
              print("WARNUNG: combined_threat_blacklist_ipv4.txt ist leer – "
                    "README IP Counts nicht überschrieben (Pipeline-Ausfall?)")
              raise SystemExit(0)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          changes = 0
          for filename, (readme_anchor, fmt) in README_COUNTS.items():
              count = count_ips(filename)
              if count is None:
                  print(f"  SKIP: {filename} nicht vorhanden")
                  continue

              formatted = fmt(count)
              # FIX README-CROSSLINE: [^|]* / [^|]+? schliessen zwar '|' aus,
              # aber NICHT '\n'. Dadurch konnte der Regex quer ueber Zeilen
              # matchen – konkret 26 Zeilen vom Dateinamen in einer NOTE
              # (Zeile 129) bis zur Scoring-Tabelle (Zeile 155 '| Dimension
              # | Gewicht | Logik |'). Der Generator hat so die Scoring-
              # Tabelle bei jedem Run "infiziert": "Gewicht" wurde durch
              # die IP-Anzahl von combined_threat_blacklist (4,779,997)
              # ueberschrieben. Fix: [^|\n] statt [^|].
              # Der sichtbare Linktext kann vom Dateinamen abweichen
              # (Combined zeigt nur _part1.txt/_part2.txt). Deshalb wird die
              # Tabellenzeile robust ueber das Link-Ziel in (...) gefunden.
              pattern_link = (
                  r'(\|[^|\n]*\]\(' + re.escape(readme_anchor) + r'\)[^|\n]*\|[^|\n]*\|)\s*[^|\n]+?(\s*\|)'
              )
              pattern_code = (
                  r'(\|[^|\n]*`' + re.escape(readme_anchor) + r'`[^|\n]*\|[^|\n]*\|)\s*[^|\n]+?(\s*\|)'
              )

              matched = False
              new_readme, n1 = re.subn(pattern_link, rf'\1 {formatted} \2', readme)
              if n1 > 0:
                  readme = new_readme
                  matched = True
                  print(f"  ✅ {filename}: {formatted} (Link-Pattern, {n1} Treffer)")

              if not matched:
                  new_readme, n2 = re.subn(pattern_code, rf'\1 {formatted} \2', readme)
                  if n2 > 0:
                      readme = new_readme
                      matched = True
                      print(f"  ✅ {filename}: {formatted} (Code-Pattern, {n2} Treffer)")

              if matched:
                  changes += 1
                  continue

              lines_out = []
              replaced = False
              for line in readme.splitlines(keepends=True):
                  if f"`{readme_anchor}`" in line or f"({readme_anchor})" in line:
                      cols = line.split("|")
                      if len(cols) >= 5:
                          for idx in range(1, len(cols) - 1):
                              cleaned = cols[idx].strip().replace("*", "").replace(",", "").replace(" ", "")
                              if cleaned.isdigit():
                                  cols[idx] = f" {formatted} "
                                  line = "|".join(cols)
                                  replaced = True
                                  break
                  lines_out.append(line)

              if replaced:
                  readme = "".join(lines_out)
                  changes += 1
                  print(f"  ✅ {filename}: {formatted} (Spalten-Fallback)")
              else:
                  print(f"  ⚠️  {filename}: kein Match in README-Tabelle")

          if changes > 0:
              write_text_atomic("README.md", readme)
              print(f"\n{changes} IP-Zahlen im README aktualisiert")
          else:
              print("Keine Änderungen am README")
          EOF

      - name: Commit
        if: always()  # FIX: auch bei unbehandelter Exception in Python-Steps den Report committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # FIX SUBDIR-MIGRATION: alte Root-Version entfernen, sobald dieser
          # Workflow die neue reports///logs/-Version committet (atomar im
          # selben Commit). Idempotent: --ignore-unmatch nach 1. Lauf.
          git rm -q --ignore-unmatch NETSHIELD_REPORT.md 2>/dev/null || true
          git add reports/NETSHIELD_REPORT.md README.md
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "NETSHIELD Report Generator: $(date -u '+%Y-%m-%d %H:%M') UTC"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs reports/NETSHIELD_REPORT.md README.md 2>/dev/null || true
                git add reports/NETSHIELD_REPORT.md README.md 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi

      - name: Trigger Bot-Detector
        # Stoesst update_bot_detector.yml direkt nach jedem erfolgreichen
        # Report-Lauf an (2026-07-05). Gleiches Muster wie der bereits
        # etablierte "Trigger Report Generator"-Step in
        # update_confidence_blacklist.yml: expliziter workflow_dispatch via
        # gh statt workflow_run-Event, weil workflow_run in diesem Repo
        # nachweislich Probleme macht (feuert nicht zuverlaessig bei per
        # workflow_dispatch gestarteten oder von der Concurrency-Gruppe
        # verdraengten Laeufen – siehe Kommentar in
        # update_confidence_blacklist.yml). Der taegliche Cron in
        # update_bot_detector.yml (22:45 UTC) bleibt als Fallback erhalten;
        # durch diesen Trigger laeuft der Proxy-Feed-Fetch jetzt effektiv
        # bis zu stuendlich (wann immer dieser Report-Workflow erfolgreich
        # durchlaeuft).
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Report abgeschlossen - triggere Bot-Detector (Proxy-Feeds)"
          gh workflow run update_bot_detector.yml \
            --repo "${{ github.repository }}" \
            --ref "${GITHUB_REF_NAME}"

      - name: Trigger ThreatFox Export Downloader
        # Stoesst threatfox_export_downloader.yml direkt nach jedem
        # erfolgreichen Report-Lauf an (2026-07-24). Gleiches Muster wie
        # der "Trigger Bot-Detector"-Step oben: expliziter workflow_dispatch
        # via gh statt workflow_run-Event, weil workflow_run in diesem Repo
        # nachweislich Probleme macht (siehe Kommentar oben und in
        # update_confidence_blacklist.yml). threatfox_export_downloader.yml
        # hat aktuell KEINEN eigenen Cron - dieser Trigger ist der einzige
        # automatische Lauf-Ausloeser (sonst nur manuell via
        # workflow_dispatch im UI).
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Report abgeschlossen - triggere ThreatFox Export Downloader"
          gh workflow run threatfox_export_downloader.yml \
            --repo "${{ github.repository }}" \
            --ref "${GITHUB_REF_NAME}"
