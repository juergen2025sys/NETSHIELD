name: DNS List Mirror

# Spiegelt DNS-Blocklisten, die OPNsense nicht direkt laden kann, nach dns/
# (Details siehe Kopf von scripts/dns_list_mirror.py):
#   - dns/antimalware_domains.txt  DandelionSprout (Original-URL enthaelt "%20",
#                                   daran stuerzt der OPNsense-DNSBL-Aufbau ab)
#   - dns/stamparm_malicious_domains.txt  alle Stamparm malicious/-DNS-Domains
#   - dns/threatfox_domains.txt    ThreatFox Domain-IOCs (Auth-Key-Export)
#
# Hauptausloeser: "Trigger DNS List Mirror" am Ende von
# netshield_report_generator.yml (expliziter workflow_dispatch via gh, wie
# Bot-Detector/Honeypot Monitor/Auto-Feed Refresh - workflow_run feuert in
# diesem Repo nicht zuverlaessig). Der Cron unten ist nur Fallback.
#
# REIHENFOLGE (2026-11-15): Dieser Workflow holt die ThreatFox-ZIP und schreibt
# dns/threatfox_c2_ips.txt. Hat sich diese Datei geaendert, startet er danach
# ASN-DROP (asn_drop.yml), damit die ASN-Auswertung immer die frischen C2-IPs
# nutzt. Combined startet deshalb nur noch diesen Workflow, nicht mehr ASN-DROP.
on:
  schedule:
    # Fallback alle 2 Stunden um :35 UTC - abseits der Combined-Slots
    # (:07/:27/:47) und des Honeypot Monitors (:00).
    - cron: '35 */2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write    # noetig fuer 'gh workflow run asn_drop.yml' am Ende
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dns-list-mirror:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          # 2026-11-22: nur scripts/ und dns/ auschecken (vorher ~55 s fuer das
          # ganze Repo). fetch/rebase/push im Commit-Schritt funktionieren so weiter.
          fetch-depth: 1
          sparse-checkout: |
            /scripts/
            /dns/
          sparse-checkout-cone-mode: false

      # Direkter HTTPS-Abruf ueber GitHub-Runner, ohne WireGuard/VPN.
      - name: DNS-Listen erzeugen
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          THREATFOX_AUTH_KEY_2: ${{ secrets.THREATFOX_AUTH_KEY_2 }}
          THREATFOX_AUTH_KEY_3: ${{ secrets.THREATFOX_AUTH_KEY_3 }}
          THREATFOX_AUTH_KEY_4: ${{ secrets.THREATFOX_AUTH_KEY_4 }}
          THREATFOX_AUTH_KEY_5: ${{ secrets.THREATFOX_AUTH_KEY_5 }}
          THREATFOX_AUTH_KEY_6: ${{ secrets.THREATFOX_AUTH_KEY_6 }}
          THREATFOX_AUTH_KEY_7: ${{ secrets.THREATFOX_AUTH_KEY_7 }}
          THREATFOX_AUTH_KEY_8: ${{ secrets.THREATFOX_AUTH_KEY_8 }}
          THREATFOX_AUTH_KEY_9: ${{ secrets.THREATFOX_AUTH_KEY_9 }}
          THREATFOX_AUTH_KEY_10: ${{ secrets.THREATFOX_AUTH_KEY_10 }}
          THREATFOX_AUTH_KEY_11: ${{ secrets.THREATFOX_AUTH_KEY_11 }}
          THREATFOX_AUTH_KEY_12: ${{ secrets.THREATFOX_AUTH_KEY_12 }}
          THREATFOX_AUTH_KEY_13: ${{ secrets.THREATFOX_AUTH_KEY_13 }}
          THREATFOX_AUTH_KEY_14: ${{ secrets.THREATFOX_AUTH_KEY_14 }}
          THREATFOX_AUTH_KEY_15: ${{ secrets.THREATFOX_AUTH_KEY_15 }}
          THREATFOX_AUTH_KEY_16: ${{ secrets.THREATFOX_AUTH_KEY_16 }}
          THREATFOX_AUTH_KEY_17: ${{ secrets.THREATFOX_AUTH_KEY_17 }}
          THREATFOX_AUTH_KEY_18: ${{ secrets.THREATFOX_AUTH_KEY_18 }}
          THREATFOX_AUTH_KEY_19: ${{ secrets.THREATFOX_AUTH_KEY_19 }}
          THREATFOX_AUTH_KEY_20: ${{ secrets.THREATFOX_AUTH_KEY_20 }}
          THREATFOX_AUTH_KEY_21: ${{ secrets.THREATFOX_AUTH_KEY_21 }}
          THREATFOX_AUTH_KEY_22: ${{ secrets.THREATFOX_AUTH_KEY_22 }}
          THREATFOX_AUTH_KEY_23: ${{ secrets.THREATFOX_AUTH_KEY_23 }}
          THREATFOX_AUTH_KEY_24: ${{ secrets.THREATFOX_AUTH_KEY_24 }}
          THREATFOX_AUTH_KEY_25: ${{ secrets.THREATFOX_AUTH_KEY_25 }}
          THREATFOX_AUTH_KEY_26: ${{ secrets.THREATFOX_AUTH_KEY_26 }}
          THREATFOX_AUTH_KEY_27: ${{ secrets.THREATFOX_AUTH_KEY_27 }}
          THREATFOX_AUTH_KEY_28: ${{ secrets.THREATFOX_AUTH_KEY_28 }}
          THREATFOX_AUTH_KEY_29: ${{ secrets.THREATFOX_AUTH_KEY_29 }}
          THREATFOX_AUTH_KEY_30: ${{ secrets.THREATFOX_AUTH_KEY_30 }}
        run: python3 -u scripts/dns_list_mirror.py

      - name: Commit
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dns/ 2>/dev/null || true
          if git diff --staged --name-only | grep -q '^dns/threatfox_c2_ips.txt$'; then
            echo "c2_changed=true" >> "$GITHUB_OUTPUT"
            echo "ThreatFox-C2-IPs geaendert - ASN-DROP wird danach gestartet"
          fi
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "DNS List Mirror: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              if ! git fetch origin "${GITHUB_REF_NAME}"; then
                echo "Fetch fehlgeschlagen (Versuch $attempt/5)"
                if [ "$attempt" -eq 5 ]; then exit 1; fi
                sleep $((attempt * 2))
                continue
              fi
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs dns/ 2>/dev/null || true
                git add dns/ 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi

      - name: Trigger ASN-DROP
        # Nur wenn neue ThreatFox-C2-IPs erfolgreich gepusht wurden. So wertet
        # ASN-DROP immer die frische Liste aus und laeuft nicht unnoetig.
        if: steps.commit.outcome == 'success' && steps.commit.outputs.c2_changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Neue C2-IPs gepusht - triggere ASN-DROP"
          gh workflow run asn_drop.yml \
            --repo "${{ github.repository }}" \
            --ref "${GITHUB_REF_NAME}"
