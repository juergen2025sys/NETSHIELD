name: Confidence Blacklist

# Confidence and Watchlist are now generated inside Combined and committed
# together. Manual retries request that complete pipeline, including its guards.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  request-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request complete Combined generation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_combined_blacklist.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
