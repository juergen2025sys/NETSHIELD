name: Ledger-Diagnose & Auswirkungsanalyse

# ══════════════════════════════════════════════════════════════════
# NUR-LESEN. Dieser Workflow schreibt nichts, committet nichts und
# laedt nichts hoch. Er laedt die echten Daten aus den bestehenden
# Releases und wertet sie aus.
#
# Zweck: Die Fixes der Bugs 21-25 (28.08.) sind bisher ausschliesslich
# simulativ verifiziert. Dieser Workflow prueft an den ECHTEN Daten,
# ob die Groessenordnungen plausibel sind - und beantwortet die im
# Bericht offenen Beobachtungspunkte.
#
# TEIL B - Ledger-Diagnose:
#   - tatsaechliche Eintraegezahl und Dateigroesse beider Ledger
#   - gemessene Bytes je Eintrag (Gegenprobe zur 96-Byte-Schaetzung
#     aus Abschnitt 6.4 des Berichts, die auf synthetischen Daten beruht)
#   - Verteilung von "eingefroren_am" -> Prognose, ob der Sanity-Guard
#     (Bug 18/20) bei der naechsten Kohorte ausloesen wird
#
# TEIL A - Auswirkungsanalyse der Bugs 21-25:
#   - Bug 21: IPs gleichzeitig im Ledger UND in einer Output-Datei
#   - Bug 22: Eintraege, die unter der alten Regel schon geprunt waeren
#   - Bug 23: Active-Ledger-Eintraege, denen der Sweep den Schutz
#             genommen haette (Sentinel-Rueckfall)
#   - Bug 24: IPs, die an der neuen 2-HQ-Familien-Huerde scheitern
#
# Laeuft manuell und optional woechentlich. Ergebnis steht in der
# Job-Summary.
# ══════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      mit_seen_db:
        description: "seen_db laden (gross, langsamer) - fuer Bug-21/24-Analyse noetig"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: ledger-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Anti-Churn-Ledger aus Release laden (nur lesen)
        run: |
          set -euo pipefail
          mkdir -p state
          if gh release download anti-churn-ledger-backup \
              --repo "${{ github.repository }}" \
              --pattern "*_expired_history.json.gz.part*" \
              --dir state/ 2>/dev/null; then
            echo "Ledger-Release geladen:"
            ls -la state/*_expired_history.json.gz.part* | awk '{printf "  %s  %.2f MB\n", $9, $5/1048576}'
          else
            echo "::warning ::Kein anti-churn-ledger-backup-Release gefunden - Diagnose laeuft mit leeren Ledgern"
          fi

      - name: seen_db SQLite aus Release laden (nur lesen)
        if: inputs.mit_seen_db
        run: |
          set -euo pipefail
          if gh release download seen-db-sqlite-backup \
              --repo "${{ github.repository }}" \
              --pattern "seen_db.sqlite3.gz" \
              --dir . --clobber 2>/dev/null; then
            gzip -df seen_db.sqlite3.gz
            python3 -c 'import sqlite3; c=sqlite3.connect("seen_db.sqlite3"); q=c.execute("PRAGMA quick_check").fetchone(); n=c.execute("SELECT COUNT(*) FROM seen_db").fetchone()[0]; c.close(); print(f"seen_db SQLite geladen: {n:,} IPs"); assert q and q[0]=="ok" and n>=100000, (q,n)'
          else
            echo "::warning ::Kein seen-db-sqlite-backup-Release gefunden - Bug-21/23/24-Analyse wird uebersprungen"
          fi

      - name: Auswertung
        run: |
          python3 << 'EOF'
          import glob, gzip, json, os, sys, sqlite3
          from collections import Counter
          from datetime import date, datetime, timedelta, timezone

          SENTINEL = "2000-01-01"
          WATCHLIST_EXPIRY_DAYS = 30
          EXPIRY_DAYS = 180
          WL_PRUNE = 14
          AC_PRUNE = 400
          heute = datetime.now(timezone.utc).date()

          zeilen = []
          def sag(t=""):
              print(t)
              zeilen.append(t)

          def lade(muster):
              teile = sorted(glob.glob(muster))
              if not teile:
                  return {}, 0, 0
              puffer = io.BytesIO()
              roh_komp = 0
              for t in teile:
                  with open(t, "rb") as f:
                      d = f.read()
                      roh_komp += len(d)
                      puffer.write(d)
              puffer.seek(0)
              with gzip.GzipFile(fileobj=puffer, mode="rb") as gz:
                  inhalt = gz.read()
              return json.loads(inhalt.decode("utf-8")).get("entries", {}), roh_komp, len(inhalt)

          def als_datum(s):
              try:
                  return datetime.strptime(s, "%Y-%m-%d").date()
              except (ValueError, TypeError):
                  return None

          # ══ TEIL B: Ledger-Diagnose ═══════════════════════════════
          sag("# Ledger-Diagnose & Auswirkungsanalyse")
          sag()
          sag(f"Stand: {heute.isoformat()} (UTC)")
          sag()
          sag("## Teil B — Ledger-Diagnose")
          sag()

          ledger = {}
          for name, muster, ankerfeld, prune in [
              ("Watchlist", "state/watchlist_expired_history.json.gz.part*", "first", WL_PRUNE),
              ("Active",    "state/active_expired_history.json.gz.part*",    "last",  AC_PRUNE),
          ]:
              eintraege, komp, unkomp = lade(muster)
              ledger[name] = eintraege
              if not eintraege:
                  sag(f"### {name}-Ledger: leer oder nicht vorhanden")
                  sag()
                  continue
              n = len(eintraege)
              sag(f"### {name}-Ledger")
              sag()
              sag(f"| Kennzahl | Wert |")
              sag(f"|---|---|")
              sag(f"| Eintraege | {n:,} |")
              sag(f"| Parts (komprimiert) | {komp/1024**2:.2f} MB |")
              sag(f"| unkomprimiert | {unkomp/1024**2:.2f} MB |")
              sag(f"| Bytes je Eintrag, unkomprimiert | {unkomp/n:.1f} |")
              sag(f"| Bytes je Eintrag, komprimiert | {komp/n:.2f} |")
              sag(f"| Hochrechnung auf 9,6 Mio. IPs | {9_600_000*komp/n/1024**2:.0f} MB Parts |")
              sag()

              # Format-Verteilung (Alt = reiner String, Neu = Dict)
              alt = sum(1 for w in eintraege.values() if not isinstance(w, dict))
              if alt:
                  sag(f"Alt-Format-Eintraege (reiner Datums-String, vor Bug 17): **{alt:,}**")
                  sag()

              # eingefroren_am-Verteilung -> Prune-Prognose
              verteilung = Counter()
              ohne = 0
              for w in eintraege.values():
                  if isinstance(w, dict) and w.get("eingefroren_am"):
                      verteilung[w["eingefroren_am"]] += 1
                  else:
                      ohne += 1
              if verteilung:
                  sag(f"**Verteilung von `eingefroren_am`** ({len(verteilung)} verschiedene Tage)")
                  sag()
                  sag("| Datum | Eintraege | Anteil | prune-faellig am |")
                  sag("|---|---|---|---|")
                  for tag_, anz in sorted(verteilung.items(), reverse=True)[:12]:
                      d_ = als_datum(tag_)
                      faellig = (d_ + timedelta(days=prune + 1)).isoformat() if d_ else "?"
                      sag(f"| {tag_} | {anz:,} | {100*anz/n:.1f} % | {faellig} |")
                  sag()
                  groesste = max(verteilung.values())
                  sag(f"Groesste Tages-Kohorte: **{groesste:,}** Eintraege "
                      f"= **{100*groesste/n:.1f} %** des Ledgers.")
                  if 100*groesste/n >= 50 and n >= 1000:
                      sag()
                      sag(f"> **Achtung:** Diese Kohorte allein ueberschreitet die 50-%-Schwelle des "
                          f"Sanity-Guards (Bug 18). Wird sie geschlossen prune-faellig, blockiert der "
                          f"Guard den Prune-Vorgang und meldet einen moeglichen Fehler — obwohl es "
                          f"eine legitime Kohorte waere (Bug 20).")
                  else:
                      sag()
                      sag(f"> Keine Kohorte erreicht die 50-%-Schwelle des Sanity-Guards. "
                          f"Ein Fehlalarm nach Bug 20 ist derzeit nicht zu erwarten.")
                  sag()
              if ohne:
                  sag(f"Eintraege ohne `eingefroren_am`: **{ohne:,}** "
                      f"(werden beim Pruning konservativ behandelt)")
                  sag()

          # ══ TEIL A: Auswirkungsanalyse ════════════════════════════
          sag("## Teil A — Auswirkungsanalyse der Bugs 21–25")
          sag()

          db_conn = None
          db_count = 0
          if os.path.exists("seen_db.sqlite3"):
              db_conn = sqlite3.connect("file:seen_db.sqlite3?mode=ro", uri=True)
              q = db_conn.execute("PRAGMA quick_check").fetchone()
              if q and q[0] == "ok":
                  db_count = int(db_conn.execute("SELECT COUNT(*) FROM seen_db").fetchone()[0])
                  sag(f"seen_db SQLite geladen: **{db_count:,}** IPs")
                  sag()
              else:
                  db_conn.close(); db_conn = None
                  sag("> seen_db SQLite ist ungueltig — Auswertung wird uebersprungen.")
                  sag()
          else:
              sag("> seen_db nicht geladen — die Bug-21/23/24-Auswertung wird uebersprungen.")
              sag()

          def db_get(ip):
              if db_conn is None:
                  return None
              row = db_conn.execute("SELECT first,last FROM seen_db WHERE ip=?", (ip,)).fetchone()
              return None if row is None else {"first": row[0], "last": row[1]}

          if db_conn is not None:
              wl = ledger.get("Watchlist", {})
              ac = ledger.get("Active", {})

              def feld(eintrag, name, default=None):
                  if isinstance(eintrag, dict):
                      return eintrag.get(name, default)
                  return eintrag if name in ("first", "last") else default

              # ── Bug 21: IP gleichzeitig im WL-Ledger und aktiv in seen_db
              b21 = []
              for ip in wl:
                  e = db_get(ip)
                  if e is None:
                      continue
                  if e.get("last") not in (None, SENTINEL):
                      b21.append(ip)
              sag(f"### Bug 21 — veraltete Watchlist-Ledger-Eintraege")
              sag()
              sag(f"IPs, die im Watchlist-Ledger stehen und gleichzeitig in seen_db "
                  f"auf dem Active-Pfad sind (`last` != Sentinel): **{len(b21):,}**")
              sag()
              sag("> Das ist die Konstellation, die vor dem Fix einen dauerhaften "
                  "False-Positive-\"Rueckfall\" im verifikation-Job erzeugt hat. "
                  "Nach dem Fix sollte diese Zahl ueber die naechsten Laeufe gegen 0 gehen.")
              sag()

              # ── Bug 22: Eintraege, die unter der ALTEN Regel schon weg waeren
              # Alte Regel: Pruning 14 Tage nach dem ERSTEN Einfrieren.
              # Naeherung: Eintraege, deren Anker-Datum deutlich aelter ist als
              # eingefroren_am -> sie sind mehrfach abgelaufen, ihre Uhr wurde
              # also durch den Refresh-Fix mindestens einmal neu gesetzt.
              b22 = 0
              for ip, w in wl.items():
                  if not isinstance(w, dict):
                      continue
                  d_first = als_datum(w.get("first"))
                  d_frost = als_datum(w.get("eingefroren_am"))
                  if d_first and d_frost:
                      # Beim ERSTEN Ablauf gilt: eingefroren_am ~ first + 30 Tage.
                      # Deutlich groesserer Abstand => Uhr wurde aufgefrischt.
                      if (d_frost - d_first).days > WATCHLIST_EXPIRY_DAYS + 2:
                          b22 += 1
              sag(f"### Bug 22 — durch den Refresh-Fix zusaetzlich geschuetzte Eintraege")
              sag()
              sag(f"Watchlist-Ledger-Eintraege, deren Einfrier-Uhr nachweislich aufgefrischt "
                  f"wurde (Abstand `eingefroren_am` − `first` > {WATCHLIST_EXPIRY_DAYS + 2} Tage): "
                  f"**{b22:,}**")
              sag()
              sag("> Diese Eintraege waeren unter der alten Regel 14 Tage nach ihrem "
                  "ERSTEN Ablauf geprunt worden und die IPs haetten ein frisches "
                  "30-Tage-Fenster bekommen. Direkt nach dem Deployment ist hier 0 zu "
                  "erwarten; die Zahl sollte ueber die naechsten Wochen steigen.")
              sag()

              # ── Bug 23: Active-Ledger-Eintraege mit Sentinel-Rueckfall
              b23 = []
              for ip, w in ac.items():
                  e = db_get(ip)
                  if e is None:
                      continue
                  if e.get("last") == SENTINEL:
                      b23.append(ip)
              sag(f"### Bug 23 — Sentinel-Rueckfall im Active-Ledger")
              sag()
              sag(f"IPs im Active-Ledger, die in seen_db aktuell auf dem Watchlist-Pfad "
                  f"stehen (`last` == Sentinel): **{len(b23):,}**")
              sag()
              sag("> Genau bei diesen IPs haette der alte Sweep den Active-Ledger-Eintrag "
                  "geloescht — ein einzelner HQ-Feed haette danach wieder volle 180 Tage "
                  "vergeben. Nach dem Fix bleibt der Schutz erhalten. Diese IPs stehen "
                  "jetzt legitim in BEIDEN Ledgern (siehe DIAGNOSE 4 in ip_ablauf.yml).")
              sag()

              # ── Bug 24: Wer wuerde an der neuen 2-HQ-Huerde scheitern?
              in_beiden = set(wl) & set(ac)
              sag(f"### Bug 24 — Wiedereintritts-Huerde")
              sag()
              sag(f"IPs in BEIDEN Ledgern: **{len(in_beiden):,}** "
                  f"(legitimer Zustand, seit dem Bug-23-Fix moeglich)")
              sag()
              nur_wl = {ip for ip in wl if db_get(ip) is None}
              sag(f"Eingefrorene Watchlist-IPs, die aktuell NICHT in seen_db stehen: "
                  f"**{len(nur_wl):,}**")
              sag()
              sag("> Fuer genau diese IPs gilt die neue Regel: Ein einzelner HQ-Feed "
                  "hebt sie nicht mehr auf den 180-Tage-Pfad, es braucht 2 HQ-Familien. "
                  "Die Zahl ist die Obergrenze der betroffenen IPs, nicht die Zahl der "
                  "taeglich tatsaechlich betroffenen.")
              sag()

          # ══ Ausgabe ═══════════════════════════════════════════════
          # FIX HYGIENE-APPEND (2026-08-29): Vorher stand hier ein direktes
          # open(summary, "a"). Das hat check_security_hygiene.py zu Recht
          # beanstandet - die Regel verlangt write_text_atomic() fuer
          # Schreibzugriffe. Fuer GITHUB_STEP_SUMMARY passt ein atomares
          # Ersetzen aber nicht: Die Datei gehoert dem Runner, andere Steps
          # haengen ebenfalls an, und os.replace() wuerde deren Inhalt
          # verwerfen. Deshalb hier gar nicht mehr in die Datei schreiben,
          # sondern die Auswertung schlicht auf die Standardausgabe geben -
          # das Log enthaelt ohnehin alles, und der Workflow bleibt damit
          # vollstaendig ohne Dateischreibzugriff.
          print()
          print("═" * 70)
          print("ERGEBNIS (auch im Log oben, hier nochmal am Stueck)")
          print("═" * 70)
          for _z in zeilen:
              print(_z)
          EOF

      - name: Geladene Daten entfernen
        if: always()
        run: |
          rm -f state/*_expired_history.json.gz.part* seen_db.sqlite3
          echo "Temporaer geladene Release-Daten entfernt (es wurde nichts geschrieben oder gepusht)"
