          )
          # Wildcard-Domains aus Unbound (Feld "Wildcard-Domains", Stand
          # 2026-11-21): komplett gesperrt inkl. aller Subdomains. Ohne sie
          # wuerden z. B. tausende *.pages.dev-Funde faelschlich als "neu" gelten.
