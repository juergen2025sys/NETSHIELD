name: DNS Blocklist Finder

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions nutzt UTC. Laeuft jeden Tag um 04:15 UTC.
    - cron: "15 4 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: dns-blocklist-finder
  cancel-in-progress: false

jobs:
  find-dns-blocklists:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 2026-11-21: fetch-depth 0 (volle Historie) dauerte >11 min.
          # Jetzt nur der aktuelle Stand (fetch-depth 1) und per Sparse-
          # Checkout nur die Ordner, die dieser Workflow braucht (die grossen
          # Listen-Dateien im Hauptordner werden nicht ausgecheckt).
          # fetch/rebase/push am Ende funktionieren damit genauso.
          fetch-depth: 1
          sparse-checkout: |
            /.github/
            /scripts/
            /reports/
          sparse-checkout-cone-mode: false

      - name: Aktuelle DNS-Blocklisten auf GitHub suchen
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import time
          import io
          import urllib.parse
          import urllib.request
          import zipfile
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          API = "https://api.github.com"
          TOKEN = os.environ["GH_TOKEN"]
          CURRENT_REPO = os.environ["CURRENT_REPO"].lower()

          # Nur wirklich aktuelle Listen in den Report aufnehmen.
          MAX_FILE_AGE_DAYS = 7

          # Wie viele Repositories / Dateien maximal geprueft werden.
          MAX_REPOS = 40
          MAX_FILES_PER_REPO = 4
          TOP_RESULTS = 30

          # Leerungsschutz: Liefert die Suche (z. B. wegen Rate-Limit oder
          # API-Ausfall) zu wenige Treffer, wird der bestehende Report NICHT
          # mit einer leeren Tabelle ueberschrieben.
          MIN_RESULTS = 3

          # Stichprobe reicht fuer die Formaterkennung.
          SAMPLE_BYTES = 1024 * 1024
          TIMEOUT = 20

          # Suchbegriffe bewusst auf Security-DNS-Feeds beschraenkt.
          SEARCH_QUERIES = [
              '"dns blocklist" malware',
              '"domain blocklist" malware',
              '"malware domains" blocklist',
              '"phishing domains" blocklist',
              '"c2 domains" blocklist',
              '"command and control" domains blocklist',
              '"threat intelligence" domains blocklist',
              '"ioc domains" blocklist',
              # 2026-11-21: zusaetzliche Suchen (Topics + weitere Begriffe)
              'topic:dns-blocklist',
              'topic:domain-blocklist',
              '"malicious domains" list',
              '"scam domains" blocklist',
          ]

          # ── 2026-11-21: Fehlalarm-Pruefung + Abgleich mit genutzten Listen ──
          # Volle Datei fuer die besten Treffer laden (bis FULL_MAX_BYTES), alle
          # Eintraege zaehlen und gegen die meistbesuchten Domains (Tranco Top
          # POPULAR_TOP) pruefen. Listen mit vielen beliebten Domains sperren
          # echte Seiten (wie USOM full-domains mit csiro.au, is.gd, r2.dev).
          FULL_MAX_BYTES = 40 * 1024 * 1024
          POPULAR_TOP = 20000
          TRANCO_URL = "https://tranco-list.eu/top-1m.csv.zip"

          # Listen, die schon in den Unbound-Blocklisten der Firewall stehen
          # (Stand 2026-11-21). Werden im Report als "schon genutzt" markiert.
