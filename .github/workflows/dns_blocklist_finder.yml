          """.split()
          # Abgleich nur, wenn die eigenen Listen genug Domains liefern -
          # sonst waere "neu" irrefuehrend (z. B. bei Download-Fehlern).
          COVERAGE_MIN_DOMAINS = 1000000
          COVERAGE_MAX_BYTES = 400 * 1024 * 1024

          SECURITY_TERMS = (
              "malware", "phish", "phishing", "c2", "botnet",
              "command control", "command-and-control", "threat",
              "ioc", "badware", "ransomware", "trojan", "stealer",
              "scam", "fraud", "dnsbl",
          )

          GOOD_PATH_TERMS = (
              "domain", "domains", "block", "black", "malware",
              "phish", "c2", "ioc", "threat", "dns", "badware",
          )

          BAD_PATH_TERMS = (
              "allowlist", "whitelist", "exclude", "exception",
              "readme", "license", "changelog", "sample", "example",
              "test", "archive", "old", "deprecated",
          )

          DOMAIN_RE = re.compile(
              r"^(?:\*\.)?"
              r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+"
              r"(?:[a-z]{2,63}|xn--[a-z0-9-]{2,59})$",
              re.I,
          )

          def utcnow():
              return datetime.now(timezone.utc)

          def parse_dt(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except Exception:
                  return None

          def age_days(value):
              dt = parse_dt(value) if isinstance(value, str) else value
              if not dt:
                  return 99999.0
              return max(0.0, (utcnow() - dt).total_seconds() / 86400.0)

          def headers():
              return {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {TOKEN}",
                  "User-Agent": "NETSHIELD-DNS-Blocklist-Finder",
                  "X-GitHub-Api-Version": "2022-11-28",
              }

          def gh_json(url, params=None):
              if params:
                  url += ("&" if "?" in url else "?") + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers())
              with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          def raw_sample(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "NETSHIELD-DNS-Blocklist-Finder",
                      "Range": f"bytes=0-{SAMPLE_BYTES - 1}",
                      "Accept": "text/plain,*/*;q=0.5",
                  },
              )
              with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                  return r.read(SAMPLE_BYTES).decode("utf-8", "replace")

          def relevance(repo, path=""):
              text = " ".join([
                  repo.get("name", ""),
                  repo.get("description") or "",
                  path,
              ]).lower()
              return sum(1 for t in SECURITY_TERMS if t in text)

          def path_score(path):
              low = path.lower()
              name = low.rsplit("/", 1)[-1]

              if any(x in low for x in BAD_PATH_TERMS):
                  return -100

              if name.endswith((
                  ".md", ".json", ".xml", ".yml", ".yaml", ".py",
                  ".js", ".ts", ".sh", ".ps1", ".bat", ".exe", ".zip",
                  ".tar", ".gz"
              )):
                  return -100

              score = 0
              score += 4 * sum(1 for x in GOOD_PATH_TERMS if x in low)

              if name in (
                  "domains", "domains.txt", "blocklist.txt",
                  "malware_domains.txt", "phishing_domains.txt",
                  "c2_domains.txt", "dns_blocklist.txt",
              ):
                  score += 20

              if name.endswith((".txt", ".list", ".domains")):
                  score += 8

              # Diese Formate sind moeglicherweise brauchbar, aber nicht direkt
              # als reine Domainliste fuer OPNsense Unbound.
              if "hosts" in name or "dnsmasq" in name or "adblock" in name:
                  score -= 4

              return score

          def detect_format(text):
              data = 0
              plain = 0
              dnsmasq = 0
              hosts = 0
              adblock = 0
              urls = 0
              invalid = 0

              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("#", "!", ";", "//")):
                      continue

                  data += 1
                  low = line.lower()

                  if low.startswith("address=/"):
                      dnsmasq += 1
                      continue

                  if re.match(r"^(?:0\.0\.0\.0|127\.0\.0\.1|::1)\s+", low):
                      hosts += 1
                      continue

                  if low.startswith("||") or low.startswith("@@||"):
                      adblock += 1
                      continue

                  if "://" in low:
                      urls += 1
                      continue

                  candidate = re.split(r"\s+#", line, maxsplit=1)[0].strip().rstrip(".")
                  if DOMAIN_RE.fullmatch(candidate):
                      plain += 1
                  else:
                      invalid += 1

              ratio = plain / data if data else 0.0

              if dnsmasq:
                  fmt = "dnsmasq"
              elif hosts:
                  fmt = "hosts"
              elif adblock:
                  fmt = "adblock"
              elif urls:
                  fmt = "url-list"
              elif data and ratio >= 0.98:
                  fmt = "plain-domains"
              elif data and ratio >= 0.90:
                  fmt = "mostly-domains"
              else:
                  fmt = "unknown"

              # Direkt fuer "URLs der Blocklisten" in OPNsense/Unbound geeignet.
              opnsense_direct = (
                  fmt == "plain-domains"
                  and plain >= 20
                  and ratio >= 0.98
              )

              return {
                  "format": fmt,
                  "sample_data_lines": data,
                  "sample_domain_lines": plain,
                  "domain_ratio": round(ratio, 4),
                  "opnsense_direct": opnsense_direct,
                  "invalid_sample_lines": invalid,
              }

          def latest_file_commit(repo_full, path):
              try:
                  commits = gh_json(
                      f"{API}/repos/{repo_full}/commits",
                      {"path": path, "per_page": 1},
                  )
                  if not commits:
                      return None

                  commit = commits[0].get("commit", {})
                  return (
                      commit.get("committer", {}).get("date")
                      or commit.get("author", {}).get("date")
                  )
              except Exception:
                  return None

          def score_result(item):
              score = 0
              age = item["age_days"]

              # Frische ist absichtlich der wichtigste Faktor.
              if age <= 1:
                  score += 45
              elif age <= 3:
                  score += 38
              elif age <= 7:
                  score += 30
              else:
                  return 0

              if item["opnsense_direct"]:
                  score += 25
              elif item["domain_ratio"] >= 0.90:
                  score += 8
              else:
                  score -= 15

              score += min(item["relevance"] * 4, 16)

              stars = item["stars"]
              if stars >= 5000:
                  score += 8
              elif stars >= 1000:
                  score += 7
              elif stars >= 250:
                  score += 5
              elif stars >= 50:
                  score += 3
              elif stars >= 10:
                  score += 1

              if item.get("license"):
                  score += 2

              if item.get("fork"):
                  score -= 5

              return max(0, min(100, int(round(score))))

          def search_repositories():
              cutoff = (utcnow() - timedelta(days=MAX_FILE_AGE_DAYS)).date().isoformat()
              repos = {}

              for query in SEARCH_QUERIES:
                  q = f"{query} pushed:>={cutoff}"

                  try:
                      data = gh_json(
                          f"{API}/search/repositories",
                          {
                              "q": q,
                              "sort": "updated",
                              "order": "desc",
                              "per_page": 25,
                          },
                      )
                  except Exception as exc:
                      print(f"::warning::Suche fehlgeschlagen: {query}: {exc}")
                      continue

                  for repo in data.get("items", []):
                      full = (repo.get("full_name") or "").lower()
                      if not full or full == CURRENT_REPO:
                          continue
                      if repo.get("archived"):
                          continue
                      repos[full] = repo

                  # Search-API Rate-Limit schonen.
                  time.sleep(1.2)

              ordered = sorted(
                  repos.values(),
                  key=lambda r: (
                      age_days(r.get("pushed_at")),
                      -(r.get("stargazers_count") or 0),
                  ),
              )
              return ordered[:MAX_REPOS]

          def candidate_files(repo):
              full = repo["full_name"]
              branch = repo.get("default_branch") or "main"

              try:
                  tree = gh_json(
                      f"{API}/repos/{full}/git/trees/{urllib.parse.quote(branch, safe='')}",
                      {"recursive": "1"},
                  )
              except Exception as exc:
                  print(f"::warning::Tree konnte fuer {full} nicht geladen werden: {exc}")
                  return []

              candidates = []
              for entry in tree.get("tree", []):
                  if entry.get("type") != "blob":
                      continue

                  path = entry.get("path") or ""
                  ps = path_score(path)
                  if ps <= 0:
                      continue

                  size = entry.get("size") or 0
                  if 0 < size < 100:
                      continue

                  candidates.append((ps, path, size))

              candidates.sort(key=lambda x: (-x[0], -x[2]))
              return candidates[:MAX_FILES_PER_REPO]

          # ── Bekannte Quellen (Unbound + NETSHIELD-Workflows/Skripte) ─────────
          def norm_url(u):
              u = u.strip().lower().rstrip("/")
              u = re.sub(r"^https?://(www\.)?", "", u)
              # github.com/o/r/blob/<branch>/p  ->  raw.githubusercontent.com/o/r/<branch>/p
              m = re.match(r"github\.com/([^/]+/[^/]+)/(?:blob|raw)/(.+)$", u)
              if m:
                  u = f"raw.githubusercontent.com/{m.group(1)}/{m.group(2)}"
              u = u.replace("/refs/heads/", "/")
              return u

          def raw_repo(u):
              m = re.match(r"raw\.githubusercontent\.com/([^/]+/[^/]+)/", norm_url(u))
              return m.group(1) if m else None

          def load_known():
              urls = {norm_url(u) for u in UNBOUND_URLS}
              for pattern in (".github/workflows/*.yml", "scripts/*.py"):
                  for f in Path(".").glob(pattern):
                      if f.name == "dns_blocklist_finder.yml":
                          continue
                      try:
                          txt = f.read_text(encoding="utf-8", errors="replace")
                      except Exception:
                          continue
                      for u in re.findall(r"https?://[^\s\"'<>()\]]+", txt):
                          urls.add(norm_url(u))
              repos_known = {raw_repo(u) for u in urls if raw_repo(u)}
              return urls, repos_known

          KNOWN_URLS, KNOWN_REPOS = load_known()
          print(f"{len(KNOWN_URLS)} bekannte Quell-URLs, {len(KNOWN_REPOS)} bekannte Repos geladen.")

          KNOWN_REPO_NAMES = {r.split("/", 1)[1] for r in KNOWN_REPOS if "/" in r}

          def known_status(item):
              if norm_url(item["raw_url"]) in KNOWN_URLS:
                  return "genutzt"
              repo = item["repo"].lower()
              if any(repo.startswith(p) for p in UNBOUND_REPOS) or repo in KNOWN_REPOS:
                  return "Repo genutzt"
              # Spiegel/Fork: gleicher Repo-Name wie eine schon genutzte Quelle
              # (z. B. rosical-labs/SiberGuvenlikBaskanligi-API = USOM-Kopie).
              if repo.split("/", 1)[-1] in KNOWN_REPO_NAMES:
                  return "Spiegel"
              return "neu"

          # ── Abdeckung durch die eigenen Unbound-Listen ──────────────────────
          def load_own_domains():
              own = set()
              total_bytes = 0
              for u in UNBOUND_URLS + PREDEFINED_URLS:
                  try:
                      req = urllib.request.Request(u, headers={"User-Agent": "NETSHIELD-DNS-Blocklist-Finder"})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          data = r.read(COVERAGE_MAX_BYTES - total_bytes + 1)
                      total_bytes += len(data)
                      before = len(own)
                      own.update(extract_domains(data.decode("utf-8", "replace")))
                      print(f"  eigene Liste: +{len(own) - before:>9} | {u}")
                  except Exception as exc:
                      print(f"::warning::Eigene Liste nicht ladbar: {u}: {str(exc)[:80]}")
                  if total_bytes >= COVERAGE_MAX_BYTES:
                      print("::warning::Groessenlimit fuer eigene Listen erreicht.")
                      break
              own.update(d.lower() for d in UNBOUND_WILDCARDS)
              print(f"  eigene Wildcard-Domains: {len(UNBOUND_WILDCARDS)}")
              return own

          def covered(domain, own):
              """Exakt gesperrt oder ueber eine uebergeordnete Domain (Wildcard)."""
              parts = domain.split(".")
              for i in range(len(parts) - 1):
                  if ".".join(parts[i:]) in own:
                      return True
              return False

          # ── Beliebte Domains (Tranco) fuer die Fehlalarm-Pruefung ─────────────
          def load_popular():
              try:
                  req = urllib.request.Request(TRANCO_URL, headers={"User-Agent": "NETSHIELD-DNS-Blocklist-Finder"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      name = z.namelist()[0]
                      out = set()
                      with z.open(name) as fh:
                          for i, line in enumerate(io.TextIOWrapper(fh, encoding="utf-8", errors="replace")):
                              if i >= POPULAR_TOP:
                                  break
                              parts = line.strip().split(",")
                              if len(parts) >= 2 and parts[1]:
                                  out.add(parts[1].lower())
                  return out
              except Exception as exc:
                  print(f"::warning::Tranco-Liste nicht ladbar, Fehlalarm-Pruefung entfaellt: {exc}")
                  return set()

          def extract_domains(text):
              out = []
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("#", "!", ";", "//")):
                      continue
                  low = line.lower()
                  if low.startswith("address=/"):
                      cand = low.split("/")[1] if low.count("/") >= 2 else ""
                  elif re.match(r"^(?:0\.0\.0\.0|127\.0\.0\.1|::1)\s+", low):
                      cand = low.split()[1] if len(low.split()) > 1 else ""
                  elif low.startswith("||"):
                      cand = low[2:].split("^")[0]
                  else:
                      cand = re.split(r"\s+#", low, maxsplit=1)[0].strip()
                  cand = cand.rstrip(".")
                  if cand.startswith("*."):
                      cand = cand[2:]
                  if DOMAIN_RE.fullmatch(cand):
                      out.append(cand)
              return out

          def full_check(item, popular):
              """Ganze Datei laden: Eintraege zaehlen + beliebte Domains finden."""
              item["entries"] = None
              item["popular_hits"] = None
              item["popular_examples"] = []
              if item.get("size_bytes") and item["size_bytes"] > FULL_MAX_BYTES:
                  item["full_note"] = "zu gross, nur Stichprobe"
                  return
              try:
                  req = urllib.request.Request(item["raw_url"], headers={"User-Agent": "NETSHIELD-DNS-Blocklist-Finder"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      text = r.read(FULL_MAX_BYTES + 1).decode("utf-8", "replace")
              except Exception as exc:
                  item["full_note"] = f"nicht ladbar: {str(exc)[:60]}"
                  return
              doms = set(extract_domains(text))
              item["entries"] = len(doms)
              if popular:
                  hits = sorted(d for d in doms if d in popular or (d.startswith("www.") and d[4:] in popular))
                  item["popular_hits"] = len(hits)
                  item["popular_examples"] = hits[:8]
              return doms

          repos = search_repositories()
          print(f"{len(repos)} aktuelle Repository-Kandidaten gefunden.")

          results = []

          for i, repo in enumerate(repos, 1):
              full = repo["full_name"]
              print(f"[{i}/{len(repos)}] Pruefe {full}")

              base_rel = relevance(repo)
              if base_rel == 0:
                  continue

              for _, path, size in candidate_files(repo):
                  last_commit = latest_file_commit(full, path)
                  age = age_days(last_commit)

                  # Ganz wichtig: Nicht nur Repository-Aktivitaet pruefen.
                  # Das konkrete Listen-File selbst muss <= 7 Tage alt sein.
                  if age > MAX_FILE_AGE_DAYS:
                      continue

                  branch = repo.get("default_branch") or "main"
                  raw_url = (
                      "https://raw.githubusercontent.com/"
                      + full
                      + "/"
                      + urllib.parse.quote(branch, safe="")
                      + "/"
                      + urllib.parse.quote(path, safe="/")
                  )

                  try:
                      sample = raw_sample(raw_url)
                      fmt = detect_format(sample)
                  except Exception as exc:
                      print(f"::warning::Datei nicht lesbar: {raw_url}: {exc}")
                      continue

                  item = {
                      "repo": full,
                      "repo_url": repo.get("html_url"),
                      "raw_url": raw_url,
                      "path": path,
                      "last_file_update": last_commit,
                      "age_days": round(age, 2),
                      "size_bytes": size,
                      "stars": repo.get("stargazers_count") or 0,
                      "license": (repo.get("license") or {}).get("spdx_id"),
                      "fork": bool(repo.get("fork")),
                      "relevance": base_rel + relevance(repo, path),
                      **fmt,
                  }

                  item["score"] = score_result(item)
                  if item["score"] > 0:
                      results.append(item)

          # Doppelte Raw-Links entfernen.
          dedup = {}
          for item in results:
              url = item["raw_url"]
              if url not in dedup or item["score"] > dedup[url]["score"]:
                  dedup[url] = item

          results = list(dedup.values())
          results.sort(
              key=lambda x: (
                  -x["score"],
                  x["age_days"],
                  -x["domain_ratio"],
                  -x["stars"],
              )
          )
          results = results[:TOP_RESULTS]

          # 2026-11-21: Bekannt/neu markieren, volle Datei pruefen, Score
          # bei beliebten Domains (Fehlalarm-Gefahr) senken und neu sortieren.
          popular = load_popular()
          print(f"{len(popular)} beliebte Domains (Tranco Top {POPULAR_TOP}) geladen.")
          print("Eigene Unbound-Listen fuer den Abdeckungs-Vergleich laden ...")
          own = load_own_domains()
          coverage_ok = len(own) >= COVERAGE_MIN_DOMAINS
          print(f"{len(own)} eigene Domains geladen - Abgleich {'aktiv' if coverage_ok else 'AUS (zu wenige)'}.")
          for item in results:
              item["known"] = known_status(item)
              doms = full_check(item, popular)
              item["new_domains"] = None
              item["covered_pct"] = None
              if coverage_ok and doms:
                  new = sum(1 for d in doms if not covered(d, own))
                  item["new_domains"] = new
                  item["covered_pct"] = round(100.0 * (len(doms) - new) / len(doms), 1)
              hits = item.get("popular_hits") or 0
              if hits > 5:
                  item["score"] = max(0, item["score"] - 30)
              elif hits > 0:
                  item["score"] = max(0, item["score"] - 10)
              if item["known"] != "neu":
                  item["score"] = max(0, item["score"] - 20)
              # Bringt die Liste kaum Neues gegenueber den eigenen Listen?
              if item["covered_pct"] is not None:
                  if item["covered_pct"] >= 95:
                      item["score"] = max(0, item["score"] - 25)
                  elif item["covered_pct"] >= 80:
                      item["score"] = max(0, item["score"] - 10)
          del own
          results.sort(key=lambda x: (-x["score"], x["age_days"], -x["stars"]))

          if len(results) < MIN_RESULTS:
              print(
                  f"::warning file=dns_blocklist_finder.yml::Leerungsschutz: nur "
                  f"{len(results)} Treffer (Minimum {MIN_RESULTS}). "
                  "Bestehender Report bleibt unveraendert."
              )
              raise SystemExit(1)

          out = Path("reports")
          out.mkdir(parents=True, exist_ok=True)

          json_data = {
              "generated_at": utcnow().isoformat(),
              "rule": f"Nur Listen, deren konkretes Listen-File maximal {MAX_FILE_AGE_DAYS} Tage alt ist.",
              "result_count": len(results),
              "results": results,
          }

          (out / "dns_blocklists_current.json").write_text(
              json.dumps(json_data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          def human_size(n):
              if not n:
                  return "?"
              for unit in ("B", "KB", "MB", "GB"):
                  if n < 1024 or unit == "GB":
                      return f"{n:.1f} {unit}"
                  n /= 1024

          def short_date(v):
              dt = parse_dt(v)
              return dt.strftime("%Y-%m-%d %H:%M UTC") if dt else "?"

          md = []
          md.append("# NETSHIELD – aktuelle DNS-Blocklisten")
          md.append("")
          md.append(f"Stand: **{utcnow().strftime('%Y-%m-%d %H:%M UTC')}**")
          md.append("")
          md.append(
              f"Es werden nur Listen angezeigt, deren **konkrete Listen-Datei in den letzten "
              f"{MAX_FILE_AGE_DAYS} Tagen aktualisiert wurde**. "
              "Eine frische README oder irgendein anderer Repository-Commit reicht nicht."
          )
          md.append("")
          md.append(
              "**Wichtig:** Der Workflow aktiviert keine Liste automatisch. "
              "Er erstellt nur einen Fundbericht mit Raw-Links."
          )
          md.append("")
          md.append("| # | Score | Status | Repository / Datei | Letztes Datei-Update | Alter | Format | OPNsense direkt | Eintraege | Schon gesperrt | Neu fuer mich | Beliebte Domains | Groesse | Raw-Link |")
          md.append("|---:|---:|---|---|---|---:|---|:---:|---:|---:|---:|---|---:|---|")

          def de_num(n):
              return f"{n:,}".replace(",", ".")

          for idx, r in enumerate(results, 1):
              direct = "Ja" if r["opnsense_direct"] else "Nein"
              status = {"neu": "🆕 neu", "genutzt": "✅ genutzt", "Repo genutzt": "☑️ Repo genutzt",
                        "Spiegel": "🪞 Spiegel"}.get(r.get("known"), "?")
              cov = f"{r['covered_pct']} %" if r.get("covered_pct") is not None else "?"
              newd = de_num(r["new_domains"]) if r.get("new_domains") is not None else "?"
              entries = f"{r['entries']:,}".replace(",", ".") if r.get("entries") is not None else (r.get("full_note") or "?")
              hits = r.get("popular_hits")
              if hits is None:
                  pop = "?"
              elif hits == 0:
                  pop = "0 ✅"
              else:
                  pop = f"⚠️ {hits} ({', '.join(r.get('popular_examples', [])[:4])})"
              md.append(
                  f"| {idx} | **{r['score']}** | {status} | "
                  f"[{r['repo']}]({r['repo_url']}) / `{r['path']}` | "
                  f"{short_date(r['last_file_update'])} | "
                  f"{r['age_days']} d | {r['format']} | {direct} | {entries} | {cov} | {newd} | {pop} | "
                  f"{human_size(r['size_bytes'])} | [Raw]({r['raw_url']}) |"
              )

          md.append("")
          md.append("## Bedeutung")
          md.append("")
          md.append("- **Score:** Frische wird am staerksten gewichtet. Abzug bei beliebten Domains (-10 / -30) und bei schon genutzten Listen (-20).")
          md.append("- **Status:** 🆕 neu = noch nirgends genutzt · ✅ genutzt = URL steht schon in Unbound oder NETSHIELD · ☑️ Repo genutzt = andere Datei aus einem schon genutzten Repo · 🪞 Spiegel = Kopie einer genutzten Quelle unter anderem Konto.")
          md.append("- **Schon gesperrt / Neu fuer mich:** Abgleich mit allen eigenen Unbound-Listen (eigene URLs + AdGuard, StevenBlack, OISD NSFW, Hagezi Pro++/TIF/DoH-Bypass + Unbound-Wildcard-Domains wie pages.dev/workers.dev), exakt und ueber die Hauptdomain (Wildcard). Score-Abzug ab 80 % (-10) und 95 % (-25) Abdeckung.")
          md.append(f"- **Beliebte Domains:** Treffer aus den {POPULAR_TOP:,} meistbesuchten Domains (Tranco). Jeder Treffer waere eine echte Seite, die gesperrt wuerde.".replace(",", "."))
          md.append("- **Eintraege:** Anzahl Domains in der ganzen Datei (nicht nur Stichprobe).")
          md.append("- **OPNsense direkt = Ja:** Stichprobe besteht zu mindestens 98 % aus reinen Domains/Wildcards.")
          md.append("- **dnsmasq / hosts / adblock:** gefunden, aber nicht als direkte reine Domainliste markiert.")
          md.append("- **Maximal 7 Tage alt:** aeltere Listen werden gar nicht erst im Report ausgegeben.")
          md.append("")
          md.append("Der Score sagt nichts darueber aus, ob eine Liste garantiert frei von False Positives ist.")
          md.append("")

          (out / "dns_blocklists_current.md").write_text(
              "\n".join(md),
              encoding="utf-8",
          )

          print("")
          print(f"{len(results)} wirklich aktuelle Listen im Report.")
          for r in results[:10]:
              print(
                  f"{r['score']:3d} | {r['age_days']:>5} d | "
                  f"{'OPNsense' if r['opnsense_direct'] else r['format']} | "
                  f"{r.get('known', '?')} | Eintraege {r.get('entries')} | "
                  f"beliebt {r.get('popular_hits')} | gesperrt {r.get('covered_pct')} % | "
                  f"neu {r.get('new_domains')} | {r['repo']} | {r['raw_url']}"
              )
          PY

      - name: Report in GitHub Actions anzeigen
        if: always()
        shell: bash
        run: |
          if [ -f reports/dns_blocklists_current.md ]; then
            cat reports/dns_blocklists_current.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report als Artifact speichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dns-blocklists-current
          path: |
            reports/dns_blocklists_current.md
            reports/dns_blocklists_current.json
          retention-days: 30
          if-no-files-found: warn

      - name: Report ins NETSHIELD-Repository schreiben
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f reports/dns_blocklists_current.md ]; then
            echo "Kein Report vorhanden."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/dns_blocklists_current.md reports/dns_blocklists_current.json

          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi

          git commit -m "chore: update current DNS blocklist report"
          # Other workflows can publish between checkout and this push.
          # Rebase onto the current branch; never overwrite conflicting edits.
          for attempt in 1 2 3 4 5; do
            if git fetch origin "${GITHUB_REF_NAME}"; then
              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort
                echo "::error::Rebase-Konflikt beim DNS-Report. Keine Remote-Aenderungen ueberschrieben."
                exit 1
              fi
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          echo "::error::DNS-Report konnte nach 5 Versuchen nicht gepusht werden."
          exit 1
