name: Update Combined Blacklist

on:
  schedule:
    # 3 Slots pro 3h-Fenster gegen GitHub-Schedule-Skips bei hoher Last.
    # Primaerer Slot 7 min nach voller Stunde meidet top-of-hour congestion.
    # Backup-Slots +20min und +40min triggern den Workflow erneut, wenn der
    # primaere Slot von GitHub verzoegert/uebersprungen wurde. Der Idempotenz-
    # Guard im ersten Step (Skip-Check via gh run list) verhindert, dass der
    # Backup-Trigger laeuft, wenn in den letzten 2h bereits ein erfolgreicher
    # Run war - dadurch keine Doppellaeufe trotz 24 Trigger pro Tag.
    - cron: '7 */3 * * *'   # 00:07, 03:07, 06:07 ... UTC – primaerer Slot
    - cron: '27 */3 * * *'  # 00:27, 03:27, 06:27 ... UTC – Backup #1 (+20min)
    - cron: '47 */3 * * *'  # 00:47, 03:47, 06:47 ... UTC – Backup #2 (+40min)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: write    # write noetig fuer 'gh workflow run' (Confidence-Trigger am Ende)
  issues: none
  packages: none
  pull-requests: none
  security-events: none


jobs:
  # FIX QUEUE-NOOP-SKIP (2026-08-09): Der Idempotenz-Check lief bisher als
  # erster Step INNERHALB des 'update'-Jobs - und der ganze Job traegt die
  # geteilte Concurrency-Gruppe 'netshield-seen-db-writers' (5 Mitglieder,
  # queue: max, cancel-in-progress: false). Das bedeutet: auch ein Run, der
  # sich Sekunden spaeter selbst als reinen Skip herausstellt, musste vorher
  # erst in der GEMEINSAMEN Warteschlange auf einen freien Platz warten -
  # sichtbar als "Pending" ueber viele Minuten, obwohl am Ende gar keine
  # echte Arbeit anfiel (siehe z.B. Run #2627-#2631, alle overlappend
  # "Pending"/"In progress" innerhalb von ~35min).
  #
  # Fix: Idempotenz-Check in einen eigenen, kleinen Vorab-Job 'gate' ohne
  # Concurrency-Gruppe ausgelagert. Der schwere 'update'-Job (der die
  # Concurrency-Gruppe traegt) startet per 'needs'+'if' nur noch dann
  # ueberhaupt, wenn 'gate' einen echten Lauf fuer noetig haelt. Reine
  # Skip-Faelle (Backup-Slot, aber Slot schon bedient) blockieren die
  # gemeinsame Warteschlange dadurch gar nicht mehr - 'gate' lief in
  # Sekunden auf einem eigenen, sofort verfuegbaren Runner durch.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      already_ran: ${{ steps.idempotency.outputs.already_ran }}
    steps:
      # Idempotenz-Guard gegen Doppellaeufe durch Backup-Cron-Slots.
      # Bei 3 Slots pro 3h-Fenster (7/27/47 min nach voller Stunde) wuerde
      # ohne Guard jeder Backup-Trigger einen vollen Run starten, auch wenn
      # der primaere Slot regulaer durchlief. Der Check via gh run list
      # ermittelt erfolgreiche Runs in den letzten 2h - existiert ein
      # solcher, skippt dieser Trigger. Bei workflow_dispatch wird der
      # Guard uebersprungen (immer durchlassen). Pattern adaptiert von
      # auto_feed_discovery.yml (dort "schon heute gelaufen?" - hier
      # "in den letzten 2h gelaufen?" wegen 3h-Cron-Intervall).
      #
      # FIX BUG-SKIP-CASCADE (2026-05-21): MIN_REAL_RUN_SECONDS-Filter
      # ergaenzt. Vorher zaehlten die eigenen 7-9s-Skip-Runs sich selbst
      # als "erfolgreicher Run in den letzten 2h" und blockierten dadurch
      # nachfolgende echte Trigger. Belegt durch Logs der Nacht 20./21.05.:
      # Run #645 lief 20:28 UTC erfolgreich (21min). Backup-Trigger 20:49
      # und 20:56 skippten korrekt. Aber Triggers 22:39, 22:49, 23:00 sahen
      # alle 1-2 "success" - das waren aber nur die Skip-Runs untereinander.
      # Echter Run #645 war zu dem Zeitpunkt schon ausserhalb des 2h-Fensters.
      # Folge: keine echten Combined-Laeufe zwischen 20:48 und ~05:00 UTC.
      # Fix-Logik analog zum Watchdog: Laufzeit aus startedAt/updatedAt
      # berechnen, nur Runs >60s zaehlen. Skip-Runs (~10s) zaehlen damit
      # nicht mehr als "erfolgreicher Run" und blockieren echte Trigger
      # nicht.
      #
      # FIX BUG-GATE-INFLIGHT (2026-08-10): Der bisherige Check fragte nur
      # ABGESCHLOSSENE erfolgreiche Runs ab (--status=success). Ein Run, der
      # noch laeuft, zaehlt dabei nicht mit - auch wenn er laengst als
      # "echt" (>60s) erkennbar waere. Beobachtet am 10.08.2026: Run #2653
      # startete 13:35:08 UTC und lief bis 13:55:38 UTC (~20min, echter
      # Lauf). Der Backup-Slot-Trigger fuer #2654 fuehrte seinen Gate-Check
      # aber bereits um 13:51:38 UTC aus - #2653 war zu dem Zeitpunkt noch
      # nicht in der success-Liste, weil er schlicht noch nicht fertig war.
      # success_count=0 -> already_ran=false -> #2654 lief als zweiter
      # echter Lauf direkt im Anschluss an #2653 (dank concurrency queue:
      # max nicht parallel, aber trotzdem komplett unnoetig durch). Folge:
      # sowohl #2653 als auch #2654 triggerten je einen vollen Confidence-
      # Blacklist-Lauf - zwei Confidence-Runs ~20min auseinander statt
      # einem alle ~3h.
      # Der Watchdog hat fuer genau dieses Problem bereits die richtige
      # Loesung (siehe watchdog_combined.yml, Schritt "Combined-Status
      # pruefen"): zusaetzlich zu abgeschlossenen Runs auch in_progress/
      # queued pruefen. Dasselbe Pattern jetzt auch hier im Gate - inkl.
      # Ausschluss des eigenen Runs (github.run_id), da dieser Gate-Job
      # selbst Teil des aktuell laufenden Workflow-Runs ist und sonst
      # faelschlich sich selbst als "aktiven Lauf" zaehlen wuerde.
      - name: Skip if recent successful run exists
        id: idempotency
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Mindest-Laufzeit in Sekunden, ab der ein Run als "echt" zaehlt.
          # Combined dauert normal ~22min. Idempotenz-Skip selbst dauert 7-10s.
          # 60s trennt zuverlaessig zwischen Skip und echtem Build, ohne dass
          # kuenftige Speed-Optimierungen versehentlich rausgefiltert wuerden.
          MIN_REAL_RUN_SECONDS: "60"
        run: |
          # ── FIX BUG-GATE-INFLIGHT: Aktiven Lauf zuerst pruefen ──────────
          # Wenn bereits ein anderer Run (in_progress oder queued) dieses
          # Workflows existiert, ist der aktuelle Slot damit faktisch schon
          # bedient bzw. wird es gleich sein - ein zweiter Lauf waere
          # redundant und wuerde am Ende einen zweiten, unnoetigen
          # Confidence-Blacklist-Trigger nach sich ziehen. Der eigene Run
          # (github.run_id) wird ausgeschlossen, sonst wuerde sich dieser
          # Gate-Job faelschlich selbst als "aktiv" zaehlen.
          running_count=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=update_combined_blacklist.yml \
            --status=in_progress \
            --limit=10 \
            --json databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          queued_count=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=update_combined_blacklist.yml \
            --status=queued \
            --limit=10 \
            --json databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          active=$(( running_count + queued_count ))
          if [ "$active" -gt 0 ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "Combined hat bereits ${active} aktive(n) Lauf/Laeufe (running=${running_count}, queued=${queued_count}) – Skip dieses Backup-Triggers"
            exit 0
          fi

          # 2h-Fenster: Bei 3h-Cron ein erfolgreicher Run innerhalb von 2h
          # bedeutet "der aktuelle Slot wurde bereits bedient". Die 2h-
          # Schwelle laesst Raum fuer Run-Laufzeit (typ. ~25min) plus
          # GitHub-Verzoegerung, ohne in den naechsten 3h-Slot zu reichen.
          #
          # WICHTIG: Nur Runs mit Laufzeit > MIN_REAL_RUN_SECONDS zaehlen.
          # Sonst zaehlen Skip-Runs (eigene 7-10s-Laeufe dieses Steps) sich
          # gegenseitig als "success" und blockieren echte Trigger - siehe
          # FIX BUG-SKIP-CASCADE im Step-Kommentar oben.
          cutoff_iso=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          success_count=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=update_combined_blacklist.yml \
            --status=success \
            --created=">${cutoff_iso}" \
            --limit=20 \
            --json startedAt,updatedAt \
            --jq "[.[] | select(((.updatedAt | fromdateiso8601) - (.startedAt | fromdateiso8601)) > ${MIN_REAL_RUN_SECONDS})] | length")
          if [ "$success_count" -gt 0 ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "In den letzten 2h bereits $success_count echte(r) Run(s) (>${MIN_REAL_RUN_SECONDS}s) – Skip dieses Backup-Triggers"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
            echo "Kein echter Run (>${MIN_REAL_RUN_SECONDS}s) in den letzten 2h – fortfahren"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.already_ran != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: netshield-seen-db-writers
      cancel-in-progress: false
      # FIX BUG-QUEUE-STARVE (2026-07-24): siehe score_decay_monitor.yml.
      # queue: max konsistent fuer alle 5 Mitglieder dieser Gruppe gesetzt,
      # damit kein Workflow einen anderen aus der Warteschlange verdraengt.
      queue: max

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # FIX RACE-STALE-CHECKOUT (2026-08-01): Beobachtet im Log vom 01.08.:
      # Dieser Job startete 9s NACH einem erfolgreichen Push von
      # auto_feed_discovery.yml, bekam laut `git log -1 --format=%H` aber
      # trotzdem einen AELTEREN Commit als den frisch gepushten (vermutlich
      # GitHub-interne Replikationsverzoegerung zwischen Push und der naechsten
      # Checkout-Anfrage, nicht durch actions/checkout selbst verursacht).
      # Folge: zwei neu entdeckte Feeds (bitwire_it_ip_list_fetch,
      # leon406_subcrawler) fehlten in diesem Lauf komplett, obwohl ihr Commit
      # laengst gepusht war.
      #
      # Fix: Nach dem Checkout einmal explizit gegen origin/main resyncen,
      # mit kurzen Retries falls der allererste Fetch noch den alten Stand
      # liefert. Bewusst KEIN workflow_run-Trigger (siehe Kommentar weiter
      # unten bei "Trigger Confidence Blacklist" – workflow_run erwies sich
      # in diesem Projekt bereits als unzuverlaessig bei workflow_dispatch-
      # Ausloesung), sondern ein einfacher, in sich abgeschlossener Resync.
      - name: Resync auf aktuellsten origin/main-Stand (Race-Condition-Fix)
        run: |
          BEFORE=$(git rev-parse HEAD)
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            REMOTE=$(git rev-parse origin/main)
            if [ "$(git rev-parse HEAD)" = "$REMOTE" ]; then
              break
            fi
            git reset --hard "$REMOTE" --quiet
            sleep 2
          done
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "Resync: HEAD war veraltet ($BEFORE), jetzt aktuell ($AFTER)"
          else
            echo "Resync: HEAD war bereits aktuell ($AFTER)"
          fi

      - name: Restore seen_db Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: seen_db.json
          key: netshield-seen-db-v2-${{ github.run_id }}
          restore-keys: |
            netshield-seen-db-v2-
            netshield-seen-db-v1-
            netshield-seen-db-

      # ══════════════════════════════════════════════════════════════════
      # CHANGE BACKUP-OFF-GIT (2026-08-07): Das seen_db-Backup (~2,4 GB
      # unkomprimiert, siehe state/seen_db_meta.json) wurde bisher bei
      # praktisch jedem der ~8 echten Laeufe/Tag als
      # state/seen_db_backup.json.gz.part* committet und gepusht. Weil sich
      # die Datei bei jedem Lauf grossflaechig aendert, erzeugte GENAU DIESER
      # Mechanismus mehrere hundert MB NEUER Git-Objekt-Historie pro Tag -
      # identifiziert als Hauptursache dafuer, dass GitHub das Repository mit
      # "Repository is above its size quota" blockiert hat.
      #
      # Fix: Backup liegt jetzt als GitHub-Release-Asset (Tag "seen-db-backup"),
      # nicht mehr in der Git-Historie. Das Asset wird bei jedem Lauf ERSETZT
      # statt akkumuliert (siehe "Backup seen_db to Repo"-Step weiter unten) -
      # kein Git-History-Wachstum mehr dadurch.
      #
      # WICHTIG: Einmalig per workflow_dispatch testen, ob GITHUB_TOKEN
      # ausreichende Rechte fuer Release-Erstellung hat (contents: write ist
      # in permissions: bereits gesetzt). Schlaegt der Download hier fehl,
      # ist das unkritisch (fail-open, Warnung im Log) - nur beim allerersten
      # Lauf mit diesem Mechanismus gibt es ohnehin noch kein Release.
      - name: Restore seen_db Backup from GitHub Release (falls Cache leer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p state
          if [ ! -f state/seen_db_backup.json.gz ] && ! ls state/seen_db_backup.json.gz.part* >/dev/null 2>&1; then
            if gh release download seen-db-backup \
                --repo "${{ github.repository }}" \
                --pattern "seen_db_backup.json.gz.part*" \
                --dir state/ 2>/dev/null; then
              COUNT=$(ls state/seen_db_backup.json.gz.part* 2>/dev/null | wc -l | tr -d ' ')
              echo "seen_db Backup von Release geladen: ${COUNT} Part(s)"
            else
              echo "Kein Release-Backup gefunden (evtl. erster Lauf mit diesem Mechanismus) – fahre ohne fort"
            fi
          else
            echo "state/seen_db_backup* liegt bereits im Checkout – kein Download noetig"
          fi

      - name: Fetch Reputation Blacklist (API, Round-Robin)
        continue-on-error: true  # Rate-Limit (5 Req/Tag, Free-Plan) darf den Haupt-Build nicht blockieren
        env:
          # Alle Repo-Secrets als JSON; benoetigte Schluessel werden im
          # Python-Block kodiert nachgeschlagen (keine Klartext-Namen hier).
          _S: ${{ toJSON(secrets) }}
        run: |
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import (
              load_whitelist, load_fp_set, is_in_fp_set,
              is_valid_public_ipv4, is_valid_public_cidr,
              is_protected_entry, is_whitelisted,
              parse_entries, calculate_confidence,
              safe_get_date, parse_date, sort_ips, write_ip_list,
              fetch_url, check_local_feed_age,
              IPV4_RE, CIDR_RE, TIMESTAMP_RE,
          )

          # Init: Whitelist + FP-Set laden
          load_whitelist()
          load_fp_set()

          import json, os, glob, urllib.request, urllib.error, base64
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          now_str = (
              datetime.now(timezone.utc)
              .astimezone(ZoneInfo("Europe/Berlin"))
              .strftime("%Y-%m-%d %H:%M %Z")
              + " (Europe/Berlin)"
          )

          # Secrets als JSON (toJSON(secrets)); Schluessel kodiert nachgeschlagen.
          _SEC = {}
          try:
              _SEC = json.loads(os.environ.get("_S", "{}") or "{}")
          except Exception:
              _SEC = {}
          _dec = lambda b: base64.b64decode(b).decode()
          _pref = _dec("QUJVU0VJUERCX0FQSV9LRVlf")  # Schluessel-Praefix

          # ── Fallback-Logik: Free-Plan erlaubt 1 Request/Tag pro Key ─────────────
          # Key 1 wird zuerst versucht. Schlägt er fehl (429 Rate-Limit oder
          # sonstiger Fehler), wird Key 2 versucht, dann Key 3.
          # Da alle Keys dieselbe Liste zurückgeben (Free-Plan, Top-10.000
          # nach Score ≥ 50), reicht ein erfolgreicher Request pro Tag.
          # .strip() entfernt versehentliche Newlines/Leerzeichen aus dem Secret
          KEYS = [
              str(_SEC.get(f"{_pref}1", "") or "").strip(),
              str(_SEC.get(f"{_pref}2", "") or "").strip(),
              str(_SEC.get(f"{_pref}3", "") or "").strip(),
          ]
          MIN_SCORE = 50
          LIMIT     = 10000

          all_ips = set()
          stats   = []

          for idx, key in enumerate(KEYS, 1):
              if not key:
                  print(f"  Key {idx}: nicht gesetzt – übersprungen")
                  stats.append((idx, 0, "KEY_MISSING"))
                  continue

              url = (
                  _dec("aHR0cHM6Ly9hcGkuYWJ1c2VpcGRiLmNvbS9hcGkvdjIvYmxhY2tsaXN0")
                  + f"?confidenceMinimum={MIN_SCORE}&limit={LIMIT}&plaintext=1"
              )
              req = urllib.request.Request(url, headers={
                  "Key":    key,
                  "Accept": "text/plain",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      status = r.status
                      body   = r.read().decode("utf-8", errors="ignore")

                  # FIX BUG-WF3-VALIDATE: Vorher rohes splitlines/strip ohne
                  # IP-Validierung – ein HTML-Errorbody, eine Cloudflare-DDoS-
                  # Page oder Whitespace-getrennte Tokens haetten direkt in
                  # reputation_blacklist.txt gelandet. parse_entries
                  # validiert via is_valid_public_ipv4 / is_valid_public_cidr
                  # und filtert RFC1918/Reserved/CGNAT. Whitelist-IPs werden
                  # nicht ueber use_protected_check=True gefiltert (war hier
                  # vorher auch nicht), weil die Whitelist in diesem Step
                  # nicht zwingend geladen ist und der Output noch durch die
                  # combined-Pipeline laeuft (wo der Whitelist-Filter greift).
                  ips = parse_entries(body)
                  all_ips.update(ips)
                  print(f"  Key {idx}: {len(ips)} IPs  [HTTP {status}] – Erfolg, stoppe hier")
                  stats.append((idx, len(ips), "OK"))
                  break   # ← ein erfolgreicher Request reicht, nächste Keys schonen

              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="ignore")[:200]
                  print(f"  Key {idx}: HTTP {e.code} – {body} → versuche nächsten Key")
                  stats.append((idx, 0, f"HTTP_{e.code}"))
              except Exception as e:
                  print(f"  Key {idx}: Fehler – {e} → versuche nächsten Key")
                  stats.append((idx, 0, "ERROR"))

          # ── Ergebnis speichern ────────────────────────────────────────────────
          OUT = "reputation_blacklist.txt"
          # FIX BUG-WF3-SORT: sort_ips aus netshield_common (mit Crash-Guard)
          # statt manuellem sorted(... tuple(int(x) ...) ...) – ein einzelner
          # korrupter Eintrag (sollte nach parse_entries-Filter nicht mehr
          # vorkommen, defense-in-depth) crashed sonst den ganzen Step.
          sorted_ips = sort_ips(all_ips)

          # ── Leerungsschutz für Reputation-Ausgabe ─────────────────────────
          # Rate-Limit (Free-Plan: 5 Req/Tag) → exit(0) statt exit(1), da
          # continue-on-error am Step den Build-Abbruch verhindert.
          # Die bestehende reputation_blacklist.txt wird als lokaler Feed weiter gelesen.
          import sys
          MIN_REPUTATION = 100
          if len(sorted_ips) < MIN_REPUTATION:
              msg = (f"Nur {len(sorted_ips)} Reputation-IPs (<{MIN_REPUTATION}) – "
                     f"Rate-Limit erschöpft, behalte bestehende {OUT}")
              print(f"::warning file=update_combined_blacklist.yml::{msg}")
              print(f"WARNUNG: {msg}")
              sys.exit(0)  # exit(0) = kein Fehler; continue-on-error am Step verhindert Build-Block

          # FIX ATOMIC: Direktes open("w") durch write_ip_list ersetzt –
          # garantiert dass die Datei bei Crash/Kill/OOM entweder komplett
          # alt oder komplett neu ist, nie halb geschrieben.
          write_ip_list(
              OUT,
              sorted_ips,
              header_lines=[
                  "reputation_blacklist – NETSHIELD",
                  f"Aktualisiert: {now_str}",
                  f"Eintraege: {len(sorted_ips)}",
              ],
          )

          print(f"\nReputation gesamt: {len(sorted_ips)} einzigartige IPs → {OUT}")
          EOF

      - name: Fetch, discover, learn and build IPv4 lists
        env:
          PYTHONUNBUFFERED: "1"
          # FEED-MOVE-RESOLVER: Token fuer authentifizierte Git-Tree-API
          # (5000/h statt 60/h). Wird nur bei 404-Feeds ueberhaupt genutzt.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "BASH-DIAG-A: python3-Prozess wird gestartet um $(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
          python3 << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import (
              load_whitelist, load_fp_set, is_in_fp_set,
              is_valid_public_ipv4, is_valid_public_cidr,
              is_protected_entry, is_whitelisted,
              parse_entries, parse_feed_entries, calculate_confidence,
              safe_get_date, parse_date, sort_ips, write_ip_list,
              write_json_atomic, write_text_atomic,
              fetch_url, fetch_parallel_daemon, check_local_feed_age,
              fetch_parallel_daemon_start, fetch_parallel_daemon_collect,
              resolve_github_moved_url,
              validate_auto_feeds,
              is_bot_detector_feed_name,
              IPV4_RE, CIDR_RE, TIMESTAMP_RE,
          )
          import ipaddress, json, os, glob, re, sys, urllib.request
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo
          from concurrent.futures import ThreadPoolExecutor, as_completed, TimeoutError
          # FIX PERF-SORT: socket.inet_aton + struct.unpack ist die C-Implementierung
          # fuer IP→int und ~10x schneller als int(ipaddress.IPv4Address(s)). Wird im
          # Sort-Key fuer combined_threat_blacklist und active_blacklist verwendet.
          import socket as _socket, struct as _struct
          import threading as _threading
          import gc as _gc, time as _time, traceback as _traceback

          # FIX PHASE-TIMING-LOG-2026-08-13: Waehrend der Suche nach der
          # Shutdown-Verzoegerung (siehe FIX SHUTDOWN-DELAY-2026-08-13 weiter
          # unten) mussten Phasen-Uebergaenge muehsam manuell aus rohen
          # Zeitstempeln im Log herausgesucht und von Hand verglichen werden.
          # Dieser Helper macht das dauerhaft: jeder Phasenuebergang traegt
          # sich selbst mit Name+Zeitstempel in _phase_log ein, eine saubere
          # Zusammenfassungstabelle wird direkt vor "Fertig!" gedruckt -
          # klare Phasen-Dauer auf einen Blick, ohne Log-Archaeologie.
          _phase_log = []
          def _phase_mark(name):
              _phase_log.append((name, _time.monotonic()))

          def _print_phase_summary():
              if len(_phase_log) < 2:
                  return
              print("\n── Phasen-Zeitübersicht ──────────────────────────────────────────")
              _total = _phase_log[-1][1] - _phase_log[0][1]
              # FIX PHASE-TABLE-LABEL-BUG-2026-08-14: War _phase_log[i-1][0]
              # (das Label der VORHERIGEN Marke) - beobachtet am 14.08.2026
              # anhand roher Log-Zeitstempel: die als "Phase 2: Restliche
              # Feeds -> 219.0s" ausgewiesene Zeile war in Wahrheit Phase 3s
              # echte Dauer (Phase-3-Header bis Phase-3.5-Header). Jede Marke
              # beschreibt "diese Phase ist JETZT zu Ende" - das Label muss
              # also mit der Zeitspanne VOR sich selbst gepaart werden
              # (_phase_log[i], nicht [i-1]), nicht danach.
              for i in range(1, len(_phase_log)):
