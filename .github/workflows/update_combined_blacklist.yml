          # erfolgte beim Schreiben → das gz selbst hat garantiert Inhalt).
          db = {}
          BACKUP_FILE = "state/seen_db_backup.json.gz"
          BACKUP_PART_GLOB = "state/seen_db_backup.json.gz.part*"
          if os.path.exists(DB_FILE):
              try:
                  # FIX BUG-SEENDB-LIMIT: Pre-Size-Check vor json.load.
                  # seen_db.json ist heute ~600 MB. 5 GB Hard-Cap erlaubt
                  # 8x Wachstum, schuetzt aber gegen ein versehentlich
                  # oder boeswillig korruptes seen_db (z.B. via Cache-
                  # Restore aus einem anderen Repo) das den Runner mit
                  # 7 GB RAM via json.load OOM kippen wuerde.
                  _SEENDB_LIMIT = 5 * 1024 * 1024 * 1024
                  _dsize = os.path.getsize(DB_FILE)
                  if _dsize > _SEENDB_LIMIT:
                      raise ValueError(
                          f"seen_db.json zu gross: {_dsize / 1024 / 1024:.1f} MB "
                          f"> {_SEENDB_LIMIT / 1024 / 1024 / 1024:.0f} GB "
                          f"(moegliche Korruption oder Cache-Mismatch)")
                  with open(DB_FILE) as f:
                      db = json.load(f)
                  print(f"seen_db geladen: {len(db)} IPs")
              except Exception as _load_err:
                  print(f"WARN: seen_db.json korrupt ({_load_err}) – versuche Backup", file=sys.stderr)
                  db = {}
          if not db:
              try:
                  import gzip, tempfile
                  # FIX BUG-GZIP-BACKUP-SPLIT: Repo-Backup darf nicht als eine
                  # Datei >=100 MB committet werden (GitHub Hard-Limit). Daher
                  # Restore entweder aus Legacy-Datei oder aus sortierten Parts:
                  # state/seen_db_backup.json.gz.part000, part001, ...
                  _backup_parts = sorted(glob.glob(BACKUP_PART_GLOB))
                  _backup_source = None
                  _tmp_backup_path = None

                  if _backup_parts:
                      _tmp = tempfile.NamedTemporaryFile(prefix="seen_db_backup_", suffix=".json.gz", delete=False)
                      _tmp_backup_path = _tmp.name
                      try:
                          for _part in _backup_parts:
                              with open(_part, "rb") as _pf:
                                  while True:
                                      _chunk = _pf.read(1024 * 1024)
                                      if not _chunk:
                                          break
                                      _tmp.write(_chunk)
                      finally:
                          _tmp.close()
                      _backup_source = _tmp_backup_path
                      print(f"seen_db Backup-Parts gefunden: {len(_backup_parts)} Parts")
                  elif os.path.exists(BACKUP_FILE):
                      _backup_source = BACKUP_FILE

                  if not _backup_source:
                      raise FileNotFoundError("kein seen_db Backup und keine Backup-Parts vorhanden")

                  # Pre-Size + Streaming-Limit gegen korrupte Backups/zip bombs.
                  _BACKUP_COMPRESSED_LIMIT   = 2 * 1024 * 1024 * 1024
                  _BACKUP_DECOMPRESSED_LIMIT = 2 * 1024 * 1024 * 1024
                  _bsize = os.path.getsize(_backup_source)
                  if _bsize > _BACKUP_COMPRESSED_LIMIT:
                      raise ValueError(
                          f"Backup zu gross: {_bsize / 1024 / 1024:.1f} MB "
                          f"> {_BACKUP_COMPRESSED_LIMIT / 1024 / 1024:.0f} MB "
