name: Watchdog Combined Blacklist

# Zweck:
# Sicherstellen dass Update Combined Blacklist mindestens alle 3h 30min laeuft -
# auch wenn GitHub Actions Schedule-Trigger ueberspringt (bekanntes Verhalten
# bei hoher Last; siehe github.com/orgs/community/discussions/52477 und andere).
#
# Funktion:
# Alle 30min prueft dieser Workflow, wann der letzte erfolgreiche Lauf von
# update_combined_blacklist.yml war. Wenn der > 3h 30min her ist, triggert er
# einen workflow_dispatch-Lauf des Combined-Workflows. workflow_dispatch wird
# - im Gegensatz zu schedule - von GitHub nicht geskippt und laeuft zuverlaessig.
#
# Hinweise:
# - 30min-Cron-Trigger des Watchdogs koennen selbst von GitHub geskippt werden,
#   aber bei 48 Triggern/Tag ist Wahrscheinlichkeit dass mehrere in Folge
#   ausfallen sehr gering.
# - Falls Watchdog selbst nicht laeuft, fallen wir auf die 7/27/47 */3-Schedule
#   von Combined zurueck - bisheriges Verhalten bleibt erhalten, nichts wird
#   schlechter.
# - Im Combined-Workflow steht beim Idempotenz-Guard: if: github.event_name == 'schedule'.
#   Bei workflow_dispatch wird der Guard somit nicht ausgefuehrt - das ist hier
#   gewuenscht, weil der Watchdog vorher selbst die Frische geprueft hat und
#   nur dann triggert, wenn wirklich ein Lauf faellig ist.

on:
  schedule:
    # Laeuft 8x taeglich, jeweils ~68min nach dem primaeren Combined-Slot
    # (Combined-Cron: 7 */3 * * * = 00:07, 03:07, 06:07 ... UTC).
    # 68min Puffer reichen fuer: alle 3 Backup-Slots des Combined (07/27/47)
    # + ~22min Run-Dauer. Wenn zu diesem Zeitpunkt kein erfolgreicher Combined
    # in den letzten 3h 30min war, springt der Watchdog ein.
    # Frueher: alle 30min (*/30) - das war zu hektisch, hat viele unnoetige
    # Trigger erzeugt obwohl Combined regulaer lief. Jetzt: gezielter Check
    # genau dann, wenn ein Combined-Slot ueberhaupt verpasst sein koennte.
    - cron: '15 1-23/3 * * *'  # 01:15, 04:15, 07:15, 10:15, 13:15, 16:15, 19:15, 22:15 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: write    # Pflicht fuer gh workflow run (Schreibrecht auf Actions API)

concurrency:
  group: watchdog-combined
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check freshness and trigger Combined if stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_THRESHOLD_MINUTES: "210"   # 3h 30min = 210min
          # Mindest-Laufzeit in Sekunden, ab der ein Combined-Run als "echt"
          # zaehlt. Combined dauert normal ~22min. Idempotenz-Guard-Skips
          # dauern 10-15s. Schwelle 60s trennt zuverlaessig zwischen Skip
          # und echtem Run, ohne dass kuenftige Speed-Optimierungen am
          # Combined-Build versehentlich rausgefiltert wuerden.
          MIN_REAL_RUN_SECONDS: "60"
        run: |
          set -e

          # Hole die letzten 20 erfolgreichen Runs und filtere clientseitig
          # auf echte Runs (Laufzeit > MIN_REAL_RUN_SECONDS). Grund: Der
          # frueher genutzte "nimm einfach den neuesten Erfolg"-Ansatz hat
          # 10-15s lange Idempotenz-Guard-Skip-Runs als "frisch" gezaehlt,
          # wodurch der Watchdog nie eingegriffen hat obwohl real seit
          # Stunden kein Daten-Update mehr war (siehe Lauf #2 am 2026-05-20:
          # "Letzter Erfolg vor 106 min" = war aber #644, ein 10s-Skip).
          #
          # jq berechnet die Laufzeit aus startedAt/updatedAt (beide ISO-8601)
          # und gibt den neuesten Run zurueck, der laenger als die Schwelle
          # lief. Falls kein solcher in den letzten 20 Runs existiert,
          # liefert .[]?... nichts zurueck und last_success_iso bleibt leer.
          last_success_iso=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=update_combined_blacklist.yml \
            --status=success \
            --limit=20 \
            --json startedAt,updatedAt \
            --jq "[.[] | select(((.updatedAt | fromdateiso8601) - (.startedAt | fromdateiso8601)) > ${MIN_REAL_RUN_SECONDS})] | .[0].updatedAt // empty")

          if [ -z "$last_success_iso" ]; then
            echo "Kein echter Lauf (>${MIN_REAL_RUN_SECONDS}s) in den letzten 20 erfolgreichen Runs - triggere Combined zur Sicherheit"
            should_trigger=true
          else
            now_epoch=$(date -u +%s)
            last_epoch=$(date -u -d "$last_success_iso" +%s)
            age_min=$(( (now_epoch - last_epoch) / 60 ))
            echo "Letzter echter Erfolg (>${MIN_REAL_RUN_SECONDS}s Laufzeit): $last_success_iso (vor ${age_min} min)"
            if [ "$age_min" -ge "$STALE_THRESHOLD_MINUTES" ]; then
              echo "Schwelle ${STALE_THRESHOLD_MINUTES}min ueberschritten - triggere Combined"
              should_trigger=true
            else
              echo "Innerhalb der Schwelle ${STALE_THRESHOLD_MINUTES}min - kein Eingriff"
              should_trigger=false
            fi
          fi

          if [ "$should_trigger" = "true" ]; then
            # Pruefe ob Combined bereits laeuft - in dem Fall nicht zusaetzlich
            # triggern (Combined hat eigene concurrency-Gruppe, ein wartender
            # Run wuerde vom naechsten cancelled werden - siehe Lauf #639).
            running_count=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=update_combined_blacklist.yml \
              --status=in_progress \
              --limit=5 \
              --json databaseId \
              --jq 'length')
            queued_count=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=update_combined_blacklist.yml \
              --status=queued \
              --limit=5 \
              --json databaseId \
              --jq 'length')
            active=$(( running_count + queued_count ))

            if [ "$active" -gt 0 ]; then
              echo "Combined hat bereits ${active} aktive(n) Lauf/Laeufe (running+queued) - kein Re-Trigger"
            else
              echo "Triggere update_combined_blacklist.yml via workflow_dispatch"
              gh workflow run update_combined_blacklist.yml \
                --repo "${{ github.repository }}" \
                --ref main
              echo "Triggered."
            fi
          fi
