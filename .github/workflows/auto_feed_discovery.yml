name: Auto Feed Discovery

on:
  schedule:
    # Sonntag mit Backup-Slots gegen GitHub-Skips bei hoher Last.
    # Krumme Minuten meiden top-of-hour congestion. Idempotenz-Guard im
    # ersten Step skippt Folge-Trigger, wenn heute bereits erfolgreich gelaufen.
    - cron: '37 4 * * 0'   # 04:37 UTC – primärer Slot (nach cve_to_ip_mapper um 04:00)
    - cron: '23 7 * * 0'   # 07:23 UTC – Backup #1 falls primärer Slot von GitHub übersprungen
    - cron: '47 11 * * 0'  # 11:47 UTC – Backup #2 als letzte Sicherheit
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  issues: none
  packages: none
  pull-requests: none
  security-events: none

concurrency:
  group: netshield-seen-db-writers
  cancel-in-progress: false
  # FIX BUG-QUEUE-STARVE (2026-07-24): siehe score_decay_monitor.yml.
  # Die 3 Backup-Slots hier mildern GitHub-Schedule-Skips, schuetzen aber
  # NICHT vor dem separaten Problem, dass ein bereits "pending" Run dieser
  # Gruppe von einem neu ankommenden Trigger (z.B. update_combined_blacklist)
  # gecancelt wird. queue: max reiht wartende Runs stattdessen ein.
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    # FIX RUNTIME-30MIN (2026-07-31): Von 60 auf 30 Min reduziert (Vorgabe:
    # FIX RUNTIME-40MIN (2026-08-02): Von 30 auf 40 Min angehoben, um mehr
    # Suchreichweite pro Lauf zu ermoeglichen (mehr Topics/Code-Queries/
    # Trusted Owner, groesseres Eval-Budget). Interner Skript-Cutoff
    # (_MAX_RUNTIME_SECONDS, siehe unten) auf 35 Min gesetzt, der Rest ist
    # Puffer fuer Checkout/Cache/Commit/Push. Der Dynamic-Cap-Fix (siehe
    # "EVAL-BUDGET-DYNAMIC" weiter unten) bleibt als zusaetzliches
    # Sicherheitsnetz aktiv, falls eine Woche trotzdem laenger braucht.
    timeout-minutes: 40

    steps:
      # Idempotenz-Guard: Bei mehreren Cron-Slots (4:37, 7:23, 11:47 UTC) verhindert
      # dieser Step, dass Backup-Trigger laufen, wenn der primäre Slot bereits
      # erfolgreich war. Bei manuellem Dispatch wird der Guard übersprungen
      # (github.event_name != 'schedule'), sodass forcierte Runs immer durchgehen.
      - name: Skip if already succeeded today
        id: idempotency
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          success_count=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=auto_feed_discovery.yml \
            --status=success \
            --created="$today" \
            --limit=10 \
            --json databaseId \
            --jq 'length')
          if [ "$success_count" -gt 0 ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "Heute bereits $success_count erfolgreiche Run(s) – Skip dieses Backup-Triggers"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
            echo "Noch kein erfolgreicher Run heute – fortfahren"
          fi

      - name: Checkout Repository
        if: steps.idempotency.outputs.already_ran != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Restore seen_db Cache
        if: steps.idempotency.outputs.already_ran != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: seen_db.json
          # Eigener afd-Prefix verhindert dass auto_feed_discovery den
          # Combined-Cache (v2-Prefix) überschreibt. restore-keys lesen
          # zuerst den letzten eigenen afd-Stand, dann den Combined-Stand.
          key: netshield-seen-db-afd-save-${{ github.run_id }}
          restore-keys: |
            netshield-seen-db-afd-save-
            netshield-seen-db-afd-
            netshield-seen-db-v2-
            netshield-seen-db-v1-
            netshield-seen-db-

      - name: Discover, Validate and Ingest IP Feeds
        if: steps.idempotency.outputs.already_ran != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          # FIX UNBUFFERED: -u erzwingt ungepufferten stdout. Ohne das block-puffert
          # CPython, weil GitHub Actions kein TTY ist – bei einem Job-Cancel
          # (SIGTERM/Timeout) gehen alle bisherigen prints verloren, und im Log
          # steht nichts ausser dem Heredoc-Echo. Mit -u streamen Logs live und
          # zeigen genau, wo das Skript hing.
          python3 -u << 'EOF'
          import sys as _sys; _sys.path.insert(0, "scripts")
          from netshield_common import (
              load_whitelist, load_fp_set, is_in_fp_set,
              is_valid_public_ipv4, is_valid_public_cidr,
              is_protected_entry, is_whitelisted,
              parse_entries as _parse_entries,
              parse_feed_entries as _parse_feed_entries, calculate_confidence,
              safe_get_date, parse_date, sort_ips, write_ip_list,
              write_json_atomic, write_text_atomic,
              fetch_url, check_local_feed_age,
              IPV4_RE, CIDR_RE, TIMESTAMP_RE,
          )

          # Init: Whitelist + FP-Set laden
          load_whitelist()
          load_fp_set()

          import urllib.request
          import urllib.error
          import urllib.parse
          import json
          import re
          import os
          import sys
          import time
          import ipaddress
          import hashlib
          from datetime import datetime, timezone, timedelta
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor

          # ── IP-Fingerprint (Content-Dedup) ────────────────────────────────
          # Hasht die TATSAECHLICHE, sortierte IP-Menge eines Feeds. Zwei Feeds
          # gelten nur dann als Dublette, wenn ihre IP-Listen byte-genau gleich
          # sind. Unterschied auch nur in einer IP → andere Fingerprints → beide
          # bleiben. Ersetzt den fehlerhaften (repo, ip_count)-Dedup, der schon
          # bei zufaellig gleicher IP-Zahl kollabierte. Leere Menge → "" (wird
          # vom Dedup ignoriert, damit 0-IP-Feeds nicht alle zusammenfallen).
          def _ip_fingerprint(ip_set):
              if not ip_set:
                  return ""
              joined = "\n".join(sorted(ip_set))
              return hashlib.sha1(joined.encode("utf-8")).hexdigest()[:16]

          # FIX RUNTIME-30MIN: Globale Timeout-Sicherheit.
          # Workflow hat ein 30-Minuten-Limit (job.timeout-minutes).
          # FIX REACH-2026-07-31: Von 22 auf 26 Min angehoben. Beide bisher
          # beobachteten Laeufe zeigten realen Overhead ausserhalb dieses
          # Scripts (Checkout+Cache-Restore am Anfang, Commit+Push am Ende)
          # von nur ca. 1,5 Min statt der urspruenglich konservativ
          # angesetzten 8 Min - der Puffer war zu grosszuegig bemessen.
          # Die zusaetzlichen 4 Min kommen der erweiterten Suchreichweite
          # zugute, ohne die Eval-Phase (die eigentlich Feeds findet) zu
          # verhungern, falls Topic-/Code-Search mal nicht frueh durch
          # Rate-Limits abbrechen. 3-4 Min Puffer bleiben trotzdem.
          _JOB_START = time.time()
          _MAX_RUNTIME_SECONDS = 35 * 60  # 35 Minuten = harter Cutoff (war 26)
          def _check_timeout(label=""):
              elapsed = time.time() - _JOB_START
              if elapsed > _MAX_RUNTIME_SECONDS:
                  print(f"::warning file=auto_feed_discovery.yml::"
                        f"Timeout-Sicherheit ausgelöst ({label}): "
                        f"{elapsed/60:.1f}min elapsed, breche ab um "
                        f"sauberen Exit vor dem 60min-Limit zu gewährleisten.")
                  return True
              return False


          now     = datetime.now(timezone.utc)
          now_str = now.strftime("%Y-%m-%d %H:%M UTC")
          now_day = now.strftime("%Y-%m-%d")

          GH_TOKEN   = os.environ.get("GH_TOKEN", "")
          # IPV4_RE wird aus netshield_common importiert (strikte Variante mit
          # Lookbehind/-ahead auf '.', filtert Versions-Strings wie '1.2.3.4.5'
          # zuverlässig). Frühere lokale Re-Definition war eine schwächere
          # Variante (nur \d-Lookbehind) und liess Versions-IPs durch.
          # Zentrale Feed-Grenzen. 500.000 IPs waren fuer grosse, legitime
          # Blocklisten zu knapp. Das neue Limit von 2 Mio. IPs deckt grosse
          # Aggregatoren ab, bleibt aber mit einem harten 64-MiB-Downloadlimit
          # gegen unkontrollierte Speicher-/Netzlast abgesichert.
          MIN_FEED_IPS = 100
          MAX_FEED_IPS = 2_000_000
          MAX_FEED_DOWNLOAD_BYTES = 64 * 1024 * 1024
          READ_LIMIT = MAX_FEED_DOWNLOAD_BYTES

          # CONTENT-SNIFF-FALLBACK: Dateinamen bleiben der schnelle Primaerweg,
          # sind aber kein hartes Ausschlusskriterium mehr. Neutrale Dateien wie
          # ``big.log`` werden stichprobenartig anhand ihres Inhalts erkannt.
          # Nur wenn im Repo KEINE Datei ueber IP_FILE_PATTERNS gefunden wurde,
          # werden maximal sechs textartige Kandidaten mit 1 MiB angelesen.
          CONTENT_SNIFF_SAMPLE_LIMIT = 1 * 1024 * 1024
          CONTENT_SNIFF_FULL_LIMIT   = MAX_FEED_DOWNLOAD_BYTES
          CONTENT_SNIFF_MAX_FILES    = 6
          CONTENT_SNIFF_MIN_BYTES    = 1024
          CONTENT_SNIFF_MIN_IPS      = MIN_FEED_IPS
          # v2: groessere Feeds erneut pruefen + sichere Infrastruktur-Sublisten
          # aus bestehendem State entfernen.
          CONTENT_SNIFF_STATE_VERSION = 2

          # ── Bekannte Repos – NICHT erneut aufnehmen ───────────────────────
          KNOWN_REPOS = {
              "firehol/blocklist-ipsets", "stamparm/ipsum", "stamparm/maltrail",
              "montysecurity/C2-Tracker", "drb-ra/C2IntelFeeds",
              "Gi7w0rm/CobaltStrikeC2Tracker", "borestad/blocklist-abuseipdb",
              "elliotwutingfeng/ThreatFox-IOC-IPs", "elliotwutingfeng/ESET-APR-IPs",
              "elliotwutingfeng/Spamhaus-DNSBL-IPs", "romainmarcoux/malicious-ip",
              "romainmarcoux/malicious-outgoing-ip", "duggytuxy/malicious_ip_addresses",
              "duggytuxy/Data-Shield_IPv4_Blocklist", "ShadowWhisperer/IPs",
              "GridinSoft/IP-Blocklist", "T145/black-mirror", "LittleJake/ip-blacklist",
              "actuallymentor/bluetack-ip-blacklist-generator", "sefinek/Malicious-IP-Addresses",
              "scriptzteam/AbuseIPDB-BlackList", "axllent/iplists",
              "mrlooker/Suspicious-IPs", "MagicTeaMC/bad-ips",
              "ddrimus/http-threat-blocklist", "BlacKSnowDot0/packetsdatabase-db",
              "FreakuencyFive/Public-IP-ThreatFeed", "amitambekar510/Malicious-IP-Threat-List",
              "dolutech/blacklist-dolutech", "ZEROF/ipextractor",
              "coyote-nl/blocklist", "bitwire-it/ipblocklist",
              "NETMOUNTAINS/Curated-IP-Blocklist", "4IP-Solutions/threat-feeds",
              "cybersecurity-cyna/Malicious_IP", "lula73/bot-detector",
              "CriticalPathSecurity/Public-Intelligence-Feeds",
              "SecOps-Institute/Tor-IP-Addresses", "Enkidu-6/tor-relay-lists",
              "yuexuana521/honeypot-blocklist", "EdanWong/ip_list",
              # Bereits direkt ueber honeypot_monitor.yml eingebunden. Bleibt
              # fuer die neue Content-Sniff-Logik ein Regressionstest, darf aber
              # nicht zusaetzlich als Auto-Feed aufgenommen werden (Doppelzaehlung).
              "timgerstel/suspicious_IPs",
              "nixbear/malicious_ips", "ufukart/Blacklist", "f3csystems/BlockList_IP",
              "IT3ngineer/FortigateBlockList", "florentvinai/bad-ips-on-my-vps",
              "Y3ll0w/CrowdSec-CAPI-Decisions", "cenk/trcert-malware",
              "Tizian-Maxime-Weigt/L7-HTTP-DDoS-Flood-IP-Signature-IP-List",
              "Ultimate-Hosts-Blacklist/Ultimate.Hosts.Blacklist",
              "tushroy/bdix-isp-blocks", "jgamblin/Shodan-Malware-Scanning-IPs",
              # Awesome-Listen: werden für Link-Extraktion genutzt, nicht als Feed
              "hslatman/awesome-threat-intelligence",
              "paralax/awesome-honeypots",
              "rshipp/awesome-malware-analysis",
              "Correia-jpv/fucking-awesome-threat-intelligence",
          }

          # ── Bekannte GitLab-Projekte – NICHT erneut aufnehmen ─────────────
          # Format: "namespace/project" (Lowercase, wie GitLab path_with_namespace)
          KNOWN_GITLAB_REPOS = set()

          # ── Ausschluss-Keywords ───────────────────────────────────────────
          EXCLUDE_KEYWORDS = {
              "geoip", "geo-ip", "geo_ip", "country", "countries", "geolocation",
              "vpn", "datacenter", "cdn", "cloud-ip", "cloud-range",
              "alienvault", "otx", "ads", "adblock", "adguard", "hosts",
              "dns-blocklist", "domain", "pihole",
          }

          # Zusätzliche Repo-Ausschlüsse: reine Whitelist/Allowlist-Repos
          # (ergänzt WHITELIST_REPO_KEYWORDS in add_repo_candidate)
          EXCLUDE_KEYWORDS.update({
              "whitelist", "allowlist", "safelist", "greenlist",
          })

          # FIX OWNER-BLOCKLIST (2026-07-31): Repo-Owner, die wiederholt viele
          # fast-identische Repos mit Eval-Budget verbrauchen, ohne je eine
          # Chance auf Annahme zu haben. Konkreter Befund aus Report vom
          # 31.07.: 10 von 12 "Overlap zu gering"-Ablehnungen kamen von
          # `gnxD3RfTT2WE` (~10 Repos wie proxy-list-for-scraping,
          # socks-proxy-list-free, txt-proxy-list, ...) - offene Scraping-
          # Proxys, keine boesartigen IPs, daher strukturell nie Overlap mit
          # den HQ-Referenz-Feeds. Owner-Sperre statt Keyword-Sperre, damit
          # legitime Tor-Exit-/Malicious-Proxy-Feeds anderer Betreiber nicht
          # mitbetroffen sind. Bei Bedarf einfach weitere Owner ergänzen.
          BLOCKED_OWNERS = {
              "gnxd3rftt2we",
          }

          # ── Dateinamen-Muster für IP-Listen ───────────────────────────────
          # Erlaubt optional .gz-Suffix – fetch_url dekomprimiert transparent.
          # IP_FILE_PATTERNS: erkennt IP-Listen-Dateien anhand Name/Extension.
          # Zwei Pfade:
          #   1. Endung .ip/.ips/.ipset/.netset/.cidr = immer eine IP-Liste
          #      (domains.ips cbuijs/hagezi-Stil; firehol_level1.netset,
          #      *.ipset = FireHOL/ipset-Konvention; *.cidr = CIDR-Liste).
          #      Diese Endungen sind zweckgebunden, daher stem-unabhaengig.
          #   2. Bekannte Stems (blacklist, blocklist, honeypot, Feed-/Provider-
          #      Namen wie drop/edrop/ipsum/emerging/dshield/feodo/greensnow ...)
          #      mit Standard-Endungen.
          # Erlaubt optional .gz-Suffix – fetch_url dekomprimiert transparent.
          # Nachgelagert validiert _evaluate_one IMMER den Rohinhalt (IP-Count,
          # FP-Rate, Overlap, >=30% IP-Zeilen), daher ist eine grosszuegigere
          # Namens-Erkennung sicher: Fehl-Treffer fallen unten durch.
          # Die kurzen/woerter-aehnlichen Feed-Stems (drop/ipsum/ban/deny ...)
          # sind per (?<![a-z0-9])-Lookbehind bzw. ^-Anker gegen Wort-Mitten-
          # Treffer abgesichert (urban->ban, eavesdrop->drop, lorem_ipsum->ipsum
          # matchen NICHT). Getestet gegen 29 reale Feed-Namen (alle erkannt)
          # und 34 Tool-/Config-/Adversarial-Namen (0 Falsch-Positive).
          IP_FILE_PATTERNS = re.compile(
              r'(?i)(?:'
              # Pfad 1: .ip/.ips/.ipset/.netset/.cidr/.edl-Endung = immer IP-Liste
              # .edl (2026-08-02): Palo Alto Networks "External Dynamic List" -
              # Dateien mit dieser Endung sind laut Konvention praktisch immer
              # reine IP-/CIDR-Listen (siehe t11z/pan-edl, glassman2u/PA-Release),
              # analog zu .ipset/.netset.
              r'[^/]+\.(?:ips?|ipset|netset|cidr|edl)(?:\.gz)?$'
              r'|'
              # Pfad 2: bekannte Stems mit anderen Endungen
              r'(?:'
              r'ip[s_-]?(?:black|block|ban|threat|malicious|bad|abuse|deny|reputation|ioc)?list|'
              r'blacklist|blocklist|denylist|banlist|'
              r'threat[-_]?feed|threatintel|threat[-_]?intel|'
              r'malicious|malicious[-_]?ips?|bad[-_]?ips?|'
              r'suspicious[-_]?ips?|'
              r'ipblock|ioc|iocs|c2|botnet|scanner|scanners|'
              r'bruteforce|ssh|rdp|attack|attackers|'
              r'tor|honeypot|reputation|'
              r'^ipsum|'                              # ipsum-Feed nur am Datei-Anfang
              # NEU: Feed-/Provider-Stems, Lookbehind gegen Wort-Mitten-Treffer
              r'(?<![a-z0-9])(?:'
              r'drop(?:v?[46])?|edrop|'
              r'emerging(?:[-_]?(?:threats?|block|ips?))?|'
              r'compromised(?:[-_]?ips?)?|blocked?(?:[-_]?ips?)?|'
              r'ban(?:ned)?[-_]?ips?|block[-_]?ips?|deny(?:[-_]?ips?)?|'
              r'greensnow|ci[-_]?army|dshield(?:[-_]?block)?|feodo|'
              r'abuseipdb|abuse[-_]?ips?|'
              # NEU: Phishing + weitere haeufige Angriffsklassen-Stems.
              # Lookbehind (siehe oben) verhindert Wort-Mitten-Treffer.
              r'phishing(?:[-_]?ips?)?|'
              r'malvertising|skimmer|magecart|'
              r'exploit[-_]?kit|bulletproof(?:[-_]?hosting)?|'
              r'booter|stresser|iot[-_]?botnet|'
              # NEU (2026-08-02): Palo Alto Networks "External Dynamic List"
              # (EDL) - eigenes Community-Oekosystem auf GitHub (z.B.
              # t11z/pan-edl, david-ramsden/paloalto-edl, glassman2u/PA-Release
              # - verifiziert als echte, aktive Repos). Meist reine
              # IP-/CIDR-Listen im selben Klartext-Format wie die uebrigen
              # erkannten Stems, nur mit EDL-spezifischer Namensgebung.
              r'edl(?:[-_]?ips?)?|pan[-_]?edl|palo[-_]?alto(?:[-_]?edl)?'
              r')|'
              r'adblock[-_.]ip|'
              r'(?:plain|optimized|sorted)[-.].+ip[46]?cidr|'
              r'ip[46]?cidr|ipv4cidr|ipv6cidr|'
              r'black[-.]ip|plain[-.]black[-.]ip'
              # Firewall-Formate: zusätzlich .acl/.rules/.nft/.iptables/.pf/.fw,
              # strukturierte Feeds (.json/.jsonl/.xml/.yaml/.toml/.ini) sowie
              # .tsv/.cfg/.block/.deny. Der Inhalt wird weiterhin streng durch
              # _evaluate_one validiert; eine passende Endung allein genügt nie.
              # rsc: MikroTik-RouterOS-Skript-Endung. Ergaenzt am 2026-07-02,
              # nachdem Serp07/dude_blacklist_ip faelschlich als "Keine
              # IP-Datei" verworfen wurde (reason war Extension-Luecke, kein
              # inhaltliches Problem – parse_entries() parst .rsc korrekt
              # ueber den generischen IPV4/CIDR-Regex-Fallback, live gegen
              # echten Feed-Inhalt verifiziert). Format: "add list=...
              # address=1.2.3.4 comment=..." – der Stem-Teil dieser Regex
              # (blacklist/blocklist/ban/etc.) matcht bereits auf den
              # Dateinamen, es fehlte nur die Endung in der Whitelist unten.
              r')\.(?:txt|csv|tsv|json|jsonl|xml|yaml|yml|toml|ini|ipset|netset|list|lst|conf|cfg|sh|dat|rsc|acl|rules?|nft|iptables|pf|fw|block|deny)(?:\.gz)?$'
              r')'
          )

          # ── Inhaltsbasierter Fallback fuer neutrale Dateinamen ───────────
          # Diese Endungen sind nur KANDIDATEN fuer ein 1-MiB-Content-Sniffing.
          # Eine passende Endung allein fuehrt niemals zur Aufnahme. Archive,
          # Binaerdateien, Quellcode und Dokumentation bleiben ausgeschlossen.
          CONTENT_SNIFF_EXTENSIONS = {
              "", ".txt", ".list", ".lst", ".dat", ".log", ".csv", ".tsv",
              ".json", ".jsonl", ".xml", ".yaml", ".yml", ".toml", ".ini",
              ".conf", ".cfg", ".block", ".deny",
              # NEU (2026-08-02): Zeek/Bro Intelligence Framework. Verifiziert
              # gegen CriticalPathSecurity/Zeek-Intelligence-Feeds (echtes,
              # aktives Repo mit z.B. "abuse-ch-ipblocklist.intel"). Format ist
              # Tab-getrennt mit gemischten Indikator-Typen (Intel::ADDR,
              # Intel::DOMAIN, Intel::URL, Intel::FILE_HASH etc.) - bewusst NICHT
              # im Pfad-1-Schnellpfad (anders als .edl/.ipset/.netset), da nicht
              # jede .intel-Datei eine IP-Liste ist. Der generische IPv4/CIDR-
              # Regex-Fallback in parse_entries() extrahiert automatisch nur die
              # Zeilen mit echten IP-Werten (Intel::ADDR/Intel::SUBNET), Domain-/
              # Hash-Zeilen matchen den IP-Regex ohnehin nicht und werden
              # uebersprungen - dieselbe Machanik wie bei .rsc-Dateien.
              ".intel",
          }
          CONTENT_SNIFF_SKIP_RE = re.compile(
              r'(?i)(?:^|/)(?:docs?|examples?|samples?|fixtures?|tests?|testdata|'
              r'vendor|node_modules|\.git|\.github|dist|build|coverage)(?:/|$)|'
              r'(?:^|/)(?:readme|license|copying|changelog|contributing|authors?|'
              r'requirements|package(?:-lock)?|poetry\.lock|pipfile(?:\.lock)?)'
              r'(?:\.[^/]*)?$'
          )
          THREAT_CONTEXT_RE = re.compile(
              r'(?i)\b(?:honeypot|connection\s+attempt|rejected|accepted|'
              r'disconnected|failed\s+password|invalid\s+user|authentication\s+failure|'
              r'brute[\s_-]?force|scanner|scanning|attack(?:er|ers|ing)?|malicious|'
              r'blocked?|deny|denied|drop(?:ped)?|blacklist|blocklist|ioc|c2|botnet)\b'
          )
          PLAIN_IP_LINE_RE = re.compile(
              r'^\s*\d{1,3}(?:\.\d{1,3}){3}(?:/32|:\d{1,5})?\s*$'
          )

          # ── Whitelist/Allowlist-Erkennung ────────────────────────────────
          # Dateinamen, die auf eine ALLOW-Liste (nicht Blocklist) hinweisen.
          # Solche Dateien werden aus ip_files herausgefiltert, damit ein Repo
          # mit gemischten Dateien (blacklist.txt + whitelist.txt) nicht seine
          # eigene Whitelist als Feed aufnimmt.
          WHITELIST_FILE_RE = re.compile(
              r'(?i)(?:white[_-]?list|allowlist|allow[_-]?list|safelist|'
              r'trusted[_-]?ip|good[_-]?ip|legit[_-]?ip|'
              r'clean[_-]?ip|safe[_-]?ip|'
              r'cloudflare[_-]?ip|cdn[_-]?ip|'
              r'permit[_-]?list|greenlist|'
              r'whitelist|wl[_-]?ip)',
              re.IGNORECASE
          )

          # Eindeutig legitime Infrastruktur-/Providerlisten sind keine
          # Angreifer-Feeds. Sie koennen in gemischten Repositories neben echten
          # Blocklisten liegen (z.B. privacy/apple_icloud.ipset) und wuerden das
          # reine FP-Sampling passieren, weil nicht jede Provider-IP in der
          # lokalen Whitelist enthalten ist. Token-Grenzen verhindern Treffer in
          # laengeren, unverbundenen Woertern.
          NON_THREAT_INFRA_FILE_RE = re.compile(
              r'(?i)(?:^|[/_.-])(?:'
              r'apple[_-]?icloud|icloud|cloudflare|google(?:bot|cloud|services?)?|'
              r'microsoft|azure|amazon(?:aws)?|aws|akamai|fastly|github|'
              r'facebook|meta|oracle|digitalocean|linode'
              r')(?:$|[/_.-])'
          )

          def _is_non_threat_file(path):
              path_lc = str(path or "").lower()
              if (WHITELIST_FILE_RE.search(path_lc)
                      or GEO_FILE_RE.search(path_lc)
                      or REDUNDANT_FEED_RE.search(path_lc)):
                  return True
              # Providername allein ist nur dann ein Ausschluss, wenn der
              # Dateiname selbst keinen klaren Threat-Kontext wie attackers,
              # malicious oder blocklist traegt. So bleibt z.B.
              # amazonaws_attackers.txt zulaessig, apple_icloud.ipset aber nicht.
              basename = path_lc.rsplit("/", 1)[-1]
              basename_words = re.sub(r"[_\-.]+", " ", basename)
              return bool(
                  NON_THREAT_INFRA_FILE_RE.search(path_lc)
                  and not THREAT_CONTEXT_RE.search(basename_words)
              )

          # ── Geo-/Laender-Allokationslisten ───────────────────────────────
          # GEO_FILE_RE: erkennt reine Geolokations-/Laender-/Kontinent-IP-Listen
          # (z.B. ipip_continent_eu.ipset, dbip_country_us.ipset, GeoLite2-
          # Country.csv, maxmind_*.netset). Das sind ALLE IPs eines Landes/
          # Kontinents, KEINE Bedrohungslisten - sie wuerden ganze Regionen
          # blocken. Werden wie Whitelist-Dateien aus ip_files herausgefiltert.
          # Noetig seit .ipset/.netset stem-unabhaengig matchen: ohne diesen
          # Filter rutschen Geo-Datenbanken (ipip.net, db-ip, MaxMind) durch,
          # da grosse Laenderlisten das Overlap-Gate via overlap>=50-Abs.-Regel
          # passieren (jedes Land enthaelt >=50 bekannte Bad-IPs).
          # Getestet: 14/14 Geo-Listen ausgeschlossen, 22/22 echte Blocklisten
          # (spamhaus_drop, greensnow, abuseipdb, firehol_level1, myip_full ...)
          # bleiben erhalten.
          GEO_FILE_RE = re.compile(
              r'(?i)(?:'
              r'continent|country|'
              r'geo[-_]?ip|geoip|geolite|geo[-_]?location|geofeed|'
              r'maxmind|ipip|db[-_]?ip|ip2location|ip2region'
              r')'
          )

          # ── Redundante Aggregator-Sublisten ──────────────────────────────
          # REDUNDANT_FEED_RE: erkennt Datei-/Feednamen, die Re-Publikationen
          # von Upstreams sind, die NETSHIELD bereits DIREKT in SOURCES zieht
          # (verifiziert: dataplane 58x, blocklist.de 12x, abuseipdb 16x,
          # stopforumspam, ciarmy via cinsscore, greensnow, feodo, dshield,
          # emergingthreats stehen schon im statischen SOURCES-Block von
          # update_combined_blacklist.yml).
          # Warum noetig: Combined zaehlt pro IP die Anzahl unterschiedlicher
          # Feed-NAMEN (today_count/feed_count, Aufnahme-Gate len(feeds)>=2).
          # Aggregatoren wie kraloveckey liefern denselben Upstream unter vielen
          # Namen (stopforumspam_7d/_30d/.../_365d = 1 reale Quelle, inhaltlich
          # ineinander geschachtelt – per Containment-Analyse belegt: _365d ist
          # Obermenge aller anderen). Ohne Filter wird eine Ein-Quellen-IP wie
          # mehrere unabhaengige Feeds gewertet -> Confidence-Score-Inflation
          # und faelschliches Passieren des >=2-Feeds-Gates (Score-Drift,
          # vgl. BUG-9 im Combined-Workflow). Diese Namen sind Einzel-Upstreams,
          # daher ist ein Ausschluss verlustfrei (Direktquelle bleibt erhalten).
          # Wort-Grenze per Lookbehind, damit z.B. blocklist_net_ua NICHT matcht.
          # Getestet: 24/24 Dubletten ausgeschlossen, 21/21 unabhaengige Feeds
          # (blocklist_net_ua, threatview, maltrail, cleantalk, botscout ...)
          # bleiben erhalten.
          REDUNDANT_FEED_RE = re.compile(
              r'(?i)(?<![a-z0-9])(?:'
              r'dataplane|stopforumspam|blocklist[_-]?de|abuseipdb|'
              r'ciarmy|cinsscore|greensnow|feodo|dshield|'
              r'emergingthreats|et_(?:block|spamhaus|dshield|tor|compromised)'
              r')'
          )

          # Keywords im Repo-Namen/Beschreibung/Topics, die auf eine reine
          # Whitelist- oder Allow-Liste hinweisen → Kandidat wird verworfen.
          WHITELIST_REPO_KEYWORDS = {
              "whitelist", "white-list", "white_list",
              "allowlist", "allow-list", "allow_list",
              "safelist", "safe-list",
              "trusted-ip", "trusted_ip",
              "ip-whitelist", "ip-allowlist",
              "greenlist", "clean-ip",
          }

          # ── Whitelist-CIDRs (False-Positive-Schutz) ──────────────────────
          # FIX SSOT4: whitelist.json als Single Source of Truth laden.
          # Ersetzt hardcoded FP_CIDRS, DNS_WHITELIST und PROTECTED_CIDRS.
          # Synchron mit update_combined_blacklist, false_positive_checker
          # und community_ip_report.
          try:
              with open(".github/workflows/whitelist.json", encoding="utf-8") as _wl_f:
                  _WHITELIST_ENTRIES = json.load(_wl_f)["entries"]
          except Exception as _wl_err:
              _msg = f"whitelist.json nicht ladbar: {_wl_err} – Auto Feed Discovery abgebrochen"
              print(f"::error file=auto_feed_discovery.yml::{_msg}")
              print(f"FEHLER: {_msg}")
              sys.exit(1)

          fp_nets = []
          for _wl_entry in _WHITELIST_ENTRIES:
              try:
                  fp_nets.append(ipaddress.ip_network(_wl_entry, strict=False))
              except Exception as _suppressed:
                  print(f"WARN: suppressed Exception: {_suppressed}", file=sys.stderr)

          # Protected-Nets für is_valid_public_ipv4: identisch mit fp_nets
          # (whitelist.json enthält bereits alle privaten Ranges, DNS, CDN etc.)
          protected_nets = fp_nets

          # ── GitHub-API-Hilfsfunktion ──────────────────────────────────────
          def gh_api(path, token=GH_TOKEN, retries=3):
              # FIX RATE-LIMIT: bei 403/429 X-RateLimit-Reset auswerten. Wenn
              # Reset in ≤ MAX_WAIT_SECONDS liegt, einmal warten – sonst sofort
              # raus. Frühere Variante (30 min wait) führte mit parallelem
              # REFRESH zum Job-Timeout-Tod, weil mehrere Worker gleichzeitig
              # sleepten. Pragmatik: einen Call opfern ist billiger als ganzer
              # Run failt; der nächste Sonntags-Run holt's nach.
              # FIX 5xx-RETRY: 500/502/503/504 vorher → sofortiges None.
              # Jetzt exponentielles Backoff (5s, 10s, 20s).
              url = f"https://api.github.com{path}"
              headers = {"Accept": "application/vnd.github+json",
                         "X-GitHub-Api-Version": "2022-11-28"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"

              TRANSIENT_CODES = {500, 502, 503, 504}
              MAX_WAIT_SECONDS = 90   # Hard-Cap: niemals länger als 90s warten

              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 429):
                          reset_str = ""
                          try:
                              reset_str = e.headers.get("X-RateLimit-Reset", "") if e.headers else ""
                          except Exception:
                              pass
                          wait = None
                          try:
                              if reset_str:
                                  candidate = int(reset_str) - int(time.time()) + 5
                                  if 0 < candidate <= MAX_WAIT_SECONDS:
                                      wait = candidate
                          except (ValueError, TypeError):
                              pass
                          if wait is not None and attempt < retries - 1:
                              print(f"  Rate-Limit (HTTP {e.code}) – warte {wait}s bis Reset...")
                              time.sleep(wait)
                              continue
                          # Reset zu weit weg, fehlt, oder Retries erschöpft – skip
                          print(f"  Rate-Limit (HTTP {e.code}) – skip {path} "
                                f"(Reset >{MAX_WAIT_SECONDS}s oder fehlt)")
                          return None
                      elif e.code == 422:
                          return None
                      elif e.code in TRANSIENT_CODES:
                          if attempt < retries - 1:
                              sleep_s = 5 * (2 ** attempt)
                              print(f"  HTTP {e.code} (transient) {path} – warte {sleep_s}s, "
                                    f"Retry {attempt+1}/{retries}")
                              time.sleep(sleep_s)
                              continue
                          print(f"  HTTP {e.code} – Retries erschöpft für {path}")
                          return None
                      else:
                          print(f"  HTTP {e.code} für {path}")
                          return None
                  except Exception as ex:
                      if attempt < retries - 1:
                          time.sleep(5)
                      else:
                          print(f"  Fehler API {path}: {ex}")
                          return None

          # ── GitLab-API-Hilfsfunktion ──────────────────────────────────────
          # NEU: GitLab public API – kein Token erforderlich für öffentliche Projekte.
          # Rate-Limit ohne Auth: 500 Req/h (~8/min). 2s Pause pro Call = 30/min,
          # deutlich unter Limit. SSRF-Schutz via fetch_url greift nicht hier,
          # daher hardcoded HTTPS + Domain-Check im Pfad.
          # Gibt None bei Fehler zurück (identisch zu gh_api).
          def gitlab_api(path, retries=2):
              url = f"https://gitlab.com/api/v4{path}"
              # Sicherheitscheck: nur gitlab.com erlaubt, kein SSRF
              if not url.startswith("https://gitlab.com/api/v4/"):
                  print(f"  SICHERHEIT: Ungültige GitLab-URL blockiert: {url}", file=sys.stderr)
                  return None
              headers = {"Accept": "application/json"}
              TRANSIENT_CODES = {500, 502, 503, 504}
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 403):
                          print(f"  GitLab Rate-Limit (HTTP {e.code}) – skip {path}")
                          return None
                      elif e.code in TRANSIENT_CODES and attempt < retries - 1:
                          time.sleep(5)
                          continue
                      else:
                          print(f"  GitLab HTTP {e.code} für {path}")
                          return None
                  except Exception as ex:
                      if attempt < retries - 1:
                          time.sleep(3)
                      else:
                          print(f"  GitLab Fehler {path}: {ex}")
                          return None

          def fetch_raw(url, limit=READ_LIMIT, timeout=25, allow_partial=False):
              # FIX SEC: Nutzt fetch_url aus netshield_common – enthält SSRF-Schutz
              # (Schema-/Host-Validierung, auch bei Redirects). Ohne diesen Schutz
              # könnte eine aus GitHub-Suchergebnissen stammende URL auf
              # 169.254.169.254 / localhost / RFC1918 zeigen.
              # Voll-Downloads sind fail-loud. Nur explizite Stichproben (Content-
              # Sniff/Awesome-Listen) duerfen bewusst einen Prefix auswerten.
              return fetch_url(url, timeout=timeout, retries=1,
                               user_agent="NETSHIELD-AutoDiscovery/3.0",
                               read_limit=limit,
                               fail_on_truncation=not allow_partial,
                               # Content-Sniff/Awesome-List sind bewusst begrenzte
                               # Stichproben. Dort ist > limit erwartbar und kein
                               # Datenverlust eines Voll-Downloads.
                               warn_on_truncation=not allow_partial)

          # is_valid_public_ipv4() → importiert aus netshield_common
          # ── Universeller Format-Detektor ──────────────────────────────────
          # Hilfsfunktionen außerhalb von extract_ips definiert damit
          # sie auch von anderen Stellen genutzt werden können.

          def extract_ips(text, source_hint=""):
              """Zentrale, formatbewusste Feed-Auswertung.

              Auto-Discovery und Combined-Workflow verwenden damit exakt
              denselben Parser aus scripts/netshield_common.py. Ein Feed wird
              also bei der Aufnahme genauso interpretiert wie spaeter beim
              Erzeugen der Combined-Liste. Nur einzelne IPv4-Hosts bzw. /32
              werden akzeptiert; breitere Netze und Ranges bleiben abgelehnt.
              """
              return _parse_feed_entries(
                  text, source_hint=source_hint, use_protected_check=False
              )

          def _is_content_sniff_candidate(item):
              """True fuer kleine/mittlere textartige Dateien mit neutralem Namen.

              Dieser Pfad wird nur genutzt, wenn IP_FILE_PATTERNS im Repo gar
              nichts gefunden hat. Dadurch bleibt die bisherige schnelle
              Namenslogik unveraendert und der zusaetzliche Download-Aufwand
              ist hart begrenzt.
              """
              path = str(item.get("path", "")).strip()
              if not path:
                  return False
              path_lc = path.lower()
              if CONTENT_SNIFF_SKIP_RE.search(path_lc):
                  return False
              if _is_non_threat_file(path_lc):
                  return False

              size = int(item.get("size", 0) or 0)
              # GitLab liefert in der Tree-API oft keine Groesse (0). Das ist
              # unbekannt und darf daher nicht als "zu klein" gelten.
              if size and size < CONTENT_SNIFF_MIN_BYTES:
                  return False
              if size > CONTENT_SNIFF_FULL_LIMIT:
                  return False

              no_gz = path_lc[:-3] if path_lc.endswith(".gz") else path_lc
              ext = os.path.splitext(no_gz)[1]
              return ext in CONTENT_SNIFF_EXTENSIONS

          def _content_profile(text, source_hint=""):
              """Bewertet eine Text-Stichprobe ohne Dateinamen-Vertrauen.

              Akzeptiert entweder eine echte IP-pro-Zeile-Liste oder ein
              Bedrohungs-/Honeypot-Log mit vielen IP-tragenden Zeilen. Reine
              System-/Web-Logs ohne Threat-Kontext werden nicht allein wegen
              vieler Client-IPs als Blockliste eingestuft.
              """
              profile = {
                  "looks_like_feed": False,
                  "unique_ips": 0,
                  "data_lines": 0,
                  "ip_lines": 0,
                  "plain_ip_lines": 0,
                  "threat_lines": 0,
                  "ip_line_ratio": 0.0,
                  "plain_line_ratio": 0.0,
                  "reason": "leer",
              }
              if not isinstance(text, str) or not text.strip():
                  return profile
              if "\x00" in text:
                  profile["reason"] = "Null-Byte/Binaerdaten"
                  return profile

              # Weitere Steuerzeichen sind ein starker Binaerindikator. Nur
              # ein begrenzter Prefix wird betrachtet, damit das Profil auch
              # bei grossen Dateien billig bleibt.
              probe = text[:64 * 1024]
              controls = sum(
                  1 for ch in probe
                  if ord(ch) < 32 and ch not in "\r\n\t"
              )
              if probe and controls / len(probe) > 0.01:
                  profile["reason"] = "zu viele Steuerzeichen"
                  return profile

              ips = extract_ips(text, source_hint)
              profile["unique_ips"] = len(ips)

              # Max. 25k Zeilen reichen fuer eine stabile Dichte-Schaetzung und
              # halten den Aufwand fuer strukturierte Multi-MB-Dateien klein.
              data_lines = []
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith(("#", ";", "//")):
                      continue
                  data_lines.append(line)
                  if len(data_lines) >= 25_000:
                      break

              profile["data_lines"] = len(data_lines)
              if not data_lines:
                  profile["reason"] = "keine Datenzeilen"
                  return profile

              ip_lines = 0
              plain_lines = 0
              threat_lines = 0
              for line in data_lines:
                  if THREAT_CONTEXT_RE.search(line):
                      threat_lines += 1

                  # Standalone-IP-/32-/ip:port-Zeilen sind das staerkste
                  # Signal und benoetigen keinen Threat-Kontext.
                  token = re.split(r"\s*[#;]", line, maxsplit=1)[0].strip()
                  if PLAIN_IP_LINE_RE.fullmatch(token):
                      raw_ip = token.split("/", 1)[0].split(":", 1)[0]
                      if is_valid_public_ipv4(raw_ip):
                          plain_lines += 1

                  has_public_ip = False
                  for match in IPV4_RE.finditer(line):
                      if is_valid_public_ipv4(match.group(1)):
                          has_public_ip = True
                          break
                  if has_public_ip:
                      ip_lines += 1

              total = len(data_lines)
              ip_ratio = ip_lines / total
              plain_ratio = plain_lines / total
              profile.update({
                  "ip_lines": ip_lines,
                  "plain_ip_lines": plain_lines,
                  "threat_lines": threat_lines,
                  "ip_line_ratio": ip_ratio,
                  "plain_line_ratio": plain_ratio,
              })

              enough_ips = len(ips) >= CONTENT_SNIFF_MIN_IPS
              plain_feed = plain_ratio >= 0.70
              # Bei Logs reichen 0,5 % Threat-Kontext-Zeilen, mindestens aber
              # drei. big.log liegt weit darueber; normale Access-Logs ohne
              # Honeypot-/Block-Kontext fallen hier durch.
              min_threat_lines = max(3, int(total * 0.005))
              threat_log = ip_ratio >= 0.30 and threat_lines >= min_threat_lines

              profile["looks_like_feed"] = enough_ips and (plain_feed or threat_log)
              if not enough_ips:
                  profile["reason"] = (
                      f"nur {len(ips)} eindeutige IPs (<{CONTENT_SNIFF_MIN_IPS})"
                  )
              elif plain_feed:
                  profile["reason"] = "IP-Liste anhand Zeilendichte"
              elif threat_log:
                  profile["reason"] = "Threat-/Honeypot-Log anhand Inhalt"
              else:
                  profile["reason"] = (
                      f"kein Feed-Signal (IP-Zeilen {ip_ratio:.1%}, "
                      f"Threat-Zeilen {threat_lines}/{total})"
                  )
              return profile

          def _format_quality(text, ips, source_hint="", profile=None):
              """Robuste Formatqualitaet fuer Listen UND wiederholende Logs.

              Der alte Quotient ``eindeutige IPs / eindeutige Zeilen`` bestrafte
              Honeypot-Logs massiv, weil dieselbe Angreifer-IP in Connection-,
              Auth- und Disconnect-Zeilen mehrfach vorkommt. Jetzt gilt das
              Maximum aus altem Quotienten und Anteil IP-tragender Zeilen.
              """
              unique_lines = {
                  line.strip() for line in text.splitlines()
                  if line.strip() and not line.lstrip().startswith(("#", ";", "//"))
              }
              legacy_ratio = len(ips) / max(len(unique_lines), 1)
              if profile is None:
                  profile = _content_profile(text, source_hint)
              line_ratio = profile.get("ip_line_ratio", 0.0)
              return max(legacy_ratio, line_ratio), legacy_ratio, line_ratio

          def fp_rate(ips, sample_size=200):
              # FIX SAMPLE-BIAS: random.sample statt list(ips)[:200]. Set-Iteration
              # ist zwar nicht streng sortiert, aber die ersten N Elemente korrelieren
              # in der Praxis stark (Hash-Bucketing nach IP-Bytes) → Stichprobe trifft
              # oft denselben /24-Block, was die FP-Rate verzerrt.
              # Seed=42 für deterministische Reproduzierbarkeit zwischen Runs:
              # Borderline-Feeds bei ~5% FP-Rate flackern sonst zwischen accept/reject.
              import random as _random
              ips_list = list(ips)
              if not ips_list:
                  return 1.0
              if len(ips_list) > sample_size:
                  sample = _random.Random(42).sample(ips_list, sample_size)
              else:
                  sample = ips_list
              hits = 0
              for ip_str in sample:
                  try:
                      addr = ipaddress.ip_address(ip_str)
                      if any(addr in net for net in fp_nets):
                          hits += 1
                  except ValueError as _suppressed:
                      print(f"WARN: suppressed ValueError: {_suppressed}", file=sys.stderr)
              return hits / len(sample)

          def _validate_individual_feed(text, ips, path, source_url="",
                                        detected_by="filename"):
              """Validiert jede Feed-Datei einzeln, auch Repo-Extra-Dateien.

              Ein vertrauenswuerdiges Repository macht nicht automatisch jede
              darin enthaltene Datei zu einer Bedrohungsliste. Diese Funktion
              erzwingt fuer Haupt- und Extra-Dateien dieselben Kern-Gates:
              Groesse, legitime Infrastruktur, FP-Rate, HQ-Overlap und Format.
              """
              result = {
                  "ok": False,
                  "reason": "unbekannt",
                  "fp": 1.0,
                  "overlap": 0,
                  "overlap_pct": 0.0,
                  "ip_ratio": 0.0,
                  "legacy_ip_ratio": 0.0,
                  "line_ip_ratio": 0.0,
                  "profile": None,
              }
              count = len(ips)
              if not (MIN_FEED_IPS <= count <= MAX_FEED_IPS):
                  result["reason"] = (
                      f"Groesse {count} IPs ausserhalb "
                      f"{MIN_FEED_IPS}-{MAX_FEED_IPS}"
                  )
                  return result
              if _is_non_threat_file(path):
                  result["reason"] = "legitime Infrastruktur-/Nicht-Threat-Datei"
                  return result

              fp = fp_rate(ips)
              result["fp"] = fp
              if fp > 0.05:
                  result["reason"] = f"FP-Rate {fp:.1%} > 5%"
                  return result

              profile = _content_profile(text, source_url)
              result["profile"] = profile
              if hq_ref_ready:
                  overlap = len(ips & hq_ref_ips)
                  overlap_pct = overlap / count if count else 0.0
                  result["overlap"] = overlap
                  result["overlap_pct"] = overlap_pct
                  if overlap_pct < 0.20 and overlap < 50:
                      result["reason"] = (
                          f"HQ-Overlap {overlap_pct:.1%}/{overlap} IPs zu gering"
                      )
                      return result
                  if overlap_pct > 0.95:
                      independent_threat_log = (
                          detected_by == "content"
                          and profile.get("looks_like_feed", False)
                          and profile.get("plain_line_ratio", 0.0) < 0.70
                          and profile.get("threat_lines", 0) >= 3
                          and profile.get("ip_line_ratio", 0.0) >= 0.30
                      )
                      if not independent_threat_log:
                          result["reason"] = (
                              f"HQ-Overlap {overlap_pct:.1%} > 95% (Klon-Verdacht)"
                          )
                          return result

              ip_ratio, legacy_ratio, line_ratio = _format_quality(
                  text, ips, source_url, profile=profile
              )
              result.update({
                  "ip_ratio": ip_ratio,
                  "legacy_ip_ratio": legacy_ratio,
                  "line_ip_ratio": line_ratio,
              })
              if ip_ratio < 0.30:
                  result["reason"] = f"Format-Qualitaet {ip_ratio:.1%} < 30%"
                  return result

              result["ok"] = True
              result["reason"] = "OK"
              return result

          def add_repo_candidate(candidate_repos, repo, source_label):
              if not repo:
                  return
              full_name = repo.get("full_name")
              if not full_name or full_name in KNOWN_REPOS:
                  return
              # FIX OWNER-BLOCKLIST: siehe BLOCKED_OWNERS weiter oben. Frühester
              # moeglicher Filterpunkt - spart Eval-Budget komplett statt den
              # Kandidaten erst durch Tool-Filter/Stratifizierung laufen zu
              # lassen und ihn dann doch abzulehnen.
              _owner_l = full_name.split("/", 1)[0].lower() if "/" in full_name else ""
              if _owner_l in BLOCKED_OWNERS:
                  return
              combined = " ".join([
                  full_name.lower(),
                  " ".join(repo.get("topics", [])),
                  (repo.get("description") or "").lower()
              ])
              if any(kw in combined for kw in EXCLUDE_KEYWORDS):
                  return
              # Whitelist/Allowlist-Repos direkt ausschließen
              if any(kw in combined for kw in WHITELIST_REPO_KEYWORDS):
                  return
              existing = candidate_repos.get(full_name, {})
              sources = set(existing.get("sources", []))
              sources.add(source_label)
              candidate_repos[full_name] = {
                  "stars":       repo.get("stargazers_count", existing.get("stars", 0)),
                  "forks":       repo.get("forks_count",      existing.get("forks", 0)),
                  "updated":     repo.get("updated_at",       existing.get("updated", "")),
                  "pushed":      repo.get("pushed_at",        existing.get("pushed", "")),
                  "description": repo.get("description",      existing.get("description", "")),
                  "topics":      repo.get("topics",           existing.get("topics", [])),
                  # NEU v4: language fuer Tool-vs-Liste-Heuristik (siehe
                  # _looks_like_tool_not_list weiter unten). Bei Awesome-Repos
                  # fehlt das Feld - Default leerer String, keine Bestrafung.
                  "language":    repo.get("language",         existing.get("language", "")) or "",
                  # NEU v4: full_name explizit speichern, damit der Tool-Filter
                  # auch bei GitHub-Kandidaten Zugriff auf "owner/repo" hat
                  # (vorher konnte der Filter den Repo-Namen nur fuer GitLab
                  # via gl_path lesen - GitHub-Suffix-Check war effektiv tot).
                  "full_name":   full_name,
                  "sources":     sorted(sources),
                  "platform":    existing.get("platform", "github"),
              }

          def add_gitlab_candidate(candidate_repos, project, source_label):
              """GitLab-Projekt als Kandidat hinzufügen (analog zu add_repo_candidate)."""
              if not project:
                  return
              path = project.get("path_with_namespace", "")
              if not path or path.lower() in KNOWN_GITLAB_REPOS:
                  return
              # Beschreibung + Pfad auf Ausschluss-Keywords prüfen
              combined = " ".join([
                  path.lower(),
                  (project.get("description") or "").lower(),
                  " ".join(project.get("tag_list", [])),
              ])
              if any(kw in combined for kw in EXCLUDE_KEYWORDS):
                  return
              # GitLab-Repos bekommen ein eigenes Namens-Prefix um Kollisionen
              # mit gleichnamigen GitHub-Repos zu vermeiden
              gl_key = f"gitlab:{path}"
              existing = candidate_repos.get(gl_key, {})
              sources = set(existing.get("sources", []))
              sources.add(source_label)
              pushed = project.get("last_activity_at", existing.get("pushed", ""))
              candidate_repos[gl_key] = {
                  "stars":        project.get("star_count",    existing.get("stars", 0)),
                  "forks":        project.get("forks_count",   existing.get("forks", 0)),
                  "updated":      pushed,
                  "pushed":       pushed,
                  "description":  project.get("description",   existing.get("description", "")),
                  "topics":       project.get("tag_list",       existing.get("topics", [])),
                  # NEU v4: full_name unified mit GitHub-Pfad, damit Tool-Filter
                  # auch bei GitLab-Kandidaten den Namen sieht.
                  "full_name":    path,
                  "sources":      sorted(sources),
                  "platform":     "gitlab",
                  "gl_path":      path,
                  "gl_id":        project.get("id"),
                  "gl_default_branch": project.get("default_branch", "main"),
              }

          # NEU v4: Tool-vs-Liste-Heuristik.
          # Hintergrund (Mai 2026): Von 86 tatsaechlich evaluierten Kandidaten
          # scheiterten 56 (~65%) am "Keine IP-Datei"-Check. Analyse der Reject-
          # Liste zeigte: das sind fast alle Tools/Libraries/Frameworks aus
          # Awesome-Listen (cuckoosandbox, TAXIIProject/yeti, MISP/misp-workbench,
          # Yara-Rules/rules, STIXProject/openioc-to-stix, mitre/cti etc).
          # Diese Repos enthalten Code, der mit IPs *arbeitet*, aber sind selbst
          # keine IP-Listen. Wir filtern sie hier raus *bevor* sie die teure
          # Tree-API-Abfrage in _evaluate_one auslosen.
          #
          # Strategie: Punkte-System. Ein Repo gilt als "wahrscheinlich Tool",
          # wenn es mehrere Indikatoren sammelt. Strenge: mindestens 3 Punkte.
          # Das spart API-Calls und gibt Awesome/GitLab/Fresh-Slots fuer
          # echte Listen frei. Verlust einzelner echter Feeds ist akzeptabel,
          # weil sie ohnehin keine IP-Datei haben wuerden.
          #
          # v4.1: Hard-Reject vorgeschaltet. Bei eindeutigen Namens-Mustern
          # (z.B. "awesome-" im Namen) ueberspringen wir die Punkte-Logik und
          # filtern sofort. Empirisch: 18 awesome-Repos in rejected_repos -
          # alle waren falsch positive Kandidaten aus Awesome-List-Scraping
          # (die echten 9 Awesome-Quellen sind in AWESOME_LISTS hartkodiert,
          # die hier gefangenen sind Tochterlisten *innerhalb* der Awesome-Repos).
          _TOOL_INDICATOR_KEYWORDS = (
              # Im Description / Name finden sich Tool-Begriffe
              "library", "framework", "toolkit", "sdk", "api client",
              "client library", "python library", "go library",
              "platform", "workbench", "dashboard", "ui", "gui",
              "sandbox", "scanner tool", "parser", "extractor",
              "converter", "translator", "interpreter",
              "plugin for", "module for", "extension for",
              "honeypot software", "honeypot framework",
              "ids ", "ips ", "siem ", "soar ",  # Tool-Kategorien
              "intel platform", "tip platform",
              "yara rules", "sigma rules", "stix package",
              # v4.1: Curated-List-Phrasen aus Beschreibungen
              "curated list", "awesome list", "collection of",
              "list of resources", "list of tools", "list of awesome",
              # v5: Dependency Injection / IoC Container ("ioc" triggert c2-Topic-Suche)
              "dependency injection", "di container", "ioc container",
              "inversion of control", "service locator",
              # v5: Compiler / Programmiersprachen-Tools
              "compiler", "programming language", "transpiler", "code generator",
              "bytecode", "runtime environment", "virtual machine",
              # v5: Pentest / Red-Team-Tools (haben keine IP-Listen)
              "penetration testing", "pentest framework", "red team",
              "post-exploitation", "c2 framework", "command and control framework",
              "payload generator", "exploit framework", "offensive security tool",
              # v5: Vulnerability-Scanner-Tools
              "vulnerability scanner", "vuln scanner", "security scanner",
              "cve scanner", "exploit scanner", "osv scanner",
              # v5: Frontend / UI / Electron-Apps
              "electron app", "desktop app", "web application", "frontend",
              "graphical interface", "web ui", "react app",
              # v5: Allgemeine Software-Kategorien ohne IP-Bezug
              "utility library", "helper library", "utils library",
              "open source tool", "cli tool", "command line tool",
              "monitoring tool", "logging tool", "observability",
              "orchestration", "automation tool", "devops tool",
          )

          # Repos mit diesen Sprachen sind fast immer Tools (Listen sind
          # typischerweise reine .txt/.csv ohne erkannte Sprache, oder
          # Markdown). Punkte nur fuer "echte" Programmiersprachen.
          _TOOL_LANGUAGES = {
              "java", "c", "c++", "c#", "rust", "ruby",
              "scala", "kotlin", "swift", "php",
              # v5: weitere eindeutige Tool-Sprachen
              "dart", "elixir", "erlang", "haskell", "ocaml",
              "f#", "nim", "d", "lua", "r",
          }
          # Python/Go/JavaScript sind grenzwertig - viele Listen-Maintainer
          # nutzen sie fuer ihren Build-Prozess, ohne dass das Repo selbst
          # ein Tool waere. Geben nur 1 Punkt statt 2.
          _AMBIGUOUS_LANGUAGES = {"python", "go", "javascript", "typescript"}

          # Repos mit diesen Begriffen im Namen sind fast sicher Tools.
          # v4.1: -framework und Listen-Suffixe ergaenzt (empirisch belegt
          # in rejected_repos-Auswertung: 14 *-tool/-tools, 5 *-framework,
          # 20 *-list/-lists, 13 *-scanner/-scanners).
          _TOOL_NAME_SUFFIXES = ("-cli", "-tool", "-tools", "-api", "-server",
                                  "-daemon", "-sandbox", "-scanner", "-scanners",
                                  "-extractor", "-parser", "-framework",
                                  # v5: Zusätzliche Tool-Suffixe
                                  "-compiler", "-teamserver", "-c2server",
                                  "-platform", "-workbench", "-studio",
                                  "-di", "-ioc", "-kit", "-suite",
                                  "-next", "-lite", "-pro",  # Versions-/Varianten-Suffixe bei Frameworks
                                  "-monitor", "-dashboard", "-ui")
          # Listen-Suffixe sind separat: viele Maintainer nennen ihren echten
          # IP-Feed *-list (z.B. "phishing-list") - darum NICHT als Tool werten.
          # Aber: -lists (Plural) ist fast immer Meta-Sammlung.
          _LIST_COLLECTION_SUFFIXES = ("-lists", "-collection", "-resources")

          # v4.1: Hard-Reject-Patterns - bei diesen Namens-Mustern wird das
          # Repo unabhaengig vom Punkte-Score aussortiert.
          _HARD_REJECT_NAME_PATTERNS = (
              "awesome-",       # GitHub-Konvention fuer kuratierte Linksammlungen
              "/awesome",       # Variante: am Beginn des Repo-Namens
              "fucking-awesome", # Forks der awesome-* Listen
              # v5: Compiler / Sprachen-Repos ("c2" trifft C2-Programmiersprache)
              "/c2compiler", "/c2lang",
              # v5: Bekannte Tool-Repos die immer wieder auftauchen
              "/yakit", "/velociraptor", "/intelowl", "/starkiller",
              "/osv-scanner", "/zdns", "/loopback-next",
          )

          def _looks_like_tool_not_list(meta):
              """Punkte-basierte Heuristik. >=3 Punkte -> wahrscheinlich Tool.
              Zusaetzlich Hard-Reject bei eindeutigen Awesome-Listen-Mustern.
              """
              # FIX BUG: full_name lesen statt nur gl_path - bei GitHub war
              # name vorher immer leer, also griff der Suffix-Check nie.
              name = (meta.get("full_name") or meta.get("gl_path") or "").lower()
              desc = (meta.get("description") or "").lower()
              lang = (meta.get("language") or "").lower()
              topics = [t.lower() for t in (meta.get("topics") or [])]

              # Hard-Reject: Repo-Name matcht eindeutiges Sammlungs-Muster.
              # "awesome-" trifft sowohl "awesome-honeypots" als auch
              # "owner/awesome-foo" - 99% dieser Repos sind kuratierte Listen,
              # keine IP-Feeds.
              for pat in _HARD_REJECT_NAME_PATTERNS:
                  if pat in name:
                      return True

              score = 0

              # Indikator 1: Sprache
              if lang in _TOOL_LANGUAGES:
                  score += 2
              elif lang in _AMBIGUOUS_LANGUAGES:
                  score += 1

              # Indikator 2: Tool-Keywords in Beschreibung
              for kw in _TOOL_INDICATOR_KEYWORDS:
                  if kw in desc:
                      score += 2
                      break  # Einmal reicht

              # Indikator 3: Name endet auf Tool-Suffix
              if any(name.endswith(sfx) for sfx in _TOOL_NAME_SUFFIXES):
                  score += 2

              # Indikator 3b: Name endet auf Meta-Sammlungs-Suffix (-lists,
              # -collection, -resources). +2 Punkte da das fast nie eine
              # IP-Liste ist.
              if any(name.endswith(sfx) for sfx in _LIST_COLLECTION_SUFFIXES):
                  score += 2

              # Indikator 4: Topics enthalten Tool-Klassifikation
              _TOOL_TOPICS = {"cli", "library", "framework", "sdk", "tool",
                              "honeypot", "sandbox", "platform",
                              # v4.1: Sammlungs-Topics
                              "awesome", "awesome-list", "curated-list",
                              "collection"}
              if any(t in _TOOL_TOPICS for t in topics):
                  score += 1

              return score >= 3

          # ── Schritt 1: seen_db laden ──────────────────────────────────────
          # FIX BUG-CACHE-RESTORE: Identisch zu update_combined_blacklist.yml.
          # Wenn der Cache abgelaufen/leer ist und auto_feed_discovery (wöchentlich
          # Sonntag) zuerst läuft, würde er sonst mit db={} starten und nach
          # dem Lauf eine fast-leere seen_db zurück in den Cache schreiben.
          # Combined würde dann beim nächsten Lauf diesen gekürzten Cache
          # laden → komplette History (days_seen, first, hq_feed_names) verloren.
          # Backup-Restore aus state/seen_db_backup.json.gz oder gesplitteten
          # state/seen_db_backup.json.gz.partNNN Repo-Dateien verhindert das.
          DB_FILE = "seen_db.json"
          BACKUP_FILE = "state/seen_db_backup.json.gz"
          BACKUP_PART_GLOB = "state/seen_db_backup.json.gz.part*"
          db = {}

          def _restore_seen_db_backup():
              import gzip
              import glob
              import io

              _BACKUP_COMPRESSED_LIMIT   = 512 * 1024 * 1024
              _BACKUP_DECOMPRESSED_LIMIT = 2 * 1024 * 1024 * 1024
              _MIN_BACKUP_ENTRIES = 10000

              _parts = sorted(glob.glob(BACKUP_PART_GLOB))
              _source = None

              if _parts:
                  _total = sum(os.path.getsize(_p) for _p in _parts)
                  if _total > _BACKUP_COMPRESSED_LIMIT:
                      raise ValueError(
                          f"Backup-Parts zu gross: {_total / 1024 / 1024:.1f} MB "
                          f"> {_BACKUP_COMPRESSED_LIMIT / 1024 / 1024:.0f} MB "
                          f"(moegliche zip-Bombe oder Repo-Korruption)")
                  _buf = bytearray()
                  for _p in _parts:
                      with open(_p, "rb") as _pf:
                          _buf.extend(_pf.read())
                  _source = f"{len(_parts)} Backup-Part(s)"
                  _gz_fileobj = io.BytesIO(bytes(_buf))
                  _opener = lambda: gzip.open(_gz_fileobj, "rt", encoding="utf-8")
              elif os.path.exists(BACKUP_FILE):
                  _bsize = os.path.getsize(BACKUP_FILE)
                  if _bsize > _BACKUP_COMPRESSED_LIMIT:
                      raise ValueError(
                          f"Backup zu gross: {_bsize / 1024 / 1024:.1f} MB "
                          f"> {_BACKUP_COMPRESSED_LIMIT / 1024 / 1024:.0f} MB "
                          f"(moegliche zip-Bombe oder Repo-Korruption)")
                  _source = BACKUP_FILE
                  _opener = lambda: gzip.open(BACKUP_FILE, "rt", encoding="utf-8")
              else:
                  return {}

              with _opener() as _bf:
                  _raw = _bf.read(_BACKUP_DECOMPRESSED_LIMIT + 1)
                  if len(_raw) > _BACKUP_DECOMPRESSED_LIMIT:
                      raise ValueError(
                          f"Backup-Stream > "
                          f"{_BACKUP_DECOMPRESSED_LIMIT / 1024 / 1024:.0f} MB "
                          f"nach Dekomprimierung (zip-Bombe), verworfen")
                  _restored = json.loads(_raw)

              if not isinstance(_restored, dict) or len(_restored) < _MIN_BACKUP_ENTRIES:
                  print(f"WARN: Backup hat nur {len(_restored) if isinstance(_restored, dict) else 0} "
                        f"Eintraege (<{_MIN_BACKUP_ENTRIES}) - wird verworfen, starte neu.",
                        file=sys.stderr)
                  return {}

              print(f"seen_db aus Backup wiederhergestellt: {len(_restored)} IPs "
                    f"(Quelle: {_source}; Cache war leer/korrupt)")
              return _restored

          if os.path.exists(DB_FILE):
              try:
                  with open(DB_FILE) as f:
                      db = json.load(f)
                  print(f"seen_db geladen: {len(db)} IPs")
              except Exception as _load_err:
                  print(f"WARN: seen_db.json korrupt ({_load_err}) – versuche Backup", file=sys.stderr)
                  db = {}

          if not db:
              try:
                  db = _restore_seen_db_backup()
                  if db:
                      write_json_atomic(DB_FILE, db, separators=(",", ":"))
                  else:
                      print("Keine seen_db gefunden, kein Backup vorhanden – starte neu.")
              except Exception as _restore_err:
                  print(f"WARN: Backup-Restore fehlgeschlagen ({_restore_err}) – starte neu", file=sys.stderr)
                  db = {}

          # ── Schritt 1b: Bestehende state/auto_discovered_feeds.json laden ───────
          # FIX BUG-EXISTING-FEEDS-ORDER: Dieser Block stand frueher als
          # "Schritt 4" weiter unten. Vorgezogen weil mehrere fruehe Schritte
          # (Tool-Filter, ehemaliger Org-Crawl) auf existing_feeds zugreifen
          # koennen sollen - chronologisch sauber: erst alles laden, dann suchen.
          AUTO_FILE = "state/auto_discovered_feeds.json"
          existing_feeds = {}
          existing_rejected = set()
          # NEU v4: rejected_repos_meta speichert pro Repo {reason, rejected_at}.
          # Erlaubt TTL-basierten Re-Try: Aktualitaets-Rejects ("Zu alt", "IP-Datei
          # Xd alt") werden nach REJECT_TTL_DAYS aus der Reject-Liste entfernt,
          # damit reanimierte Feeds wieder eine Chance bekommen. Strukturelle
          # Rejects ("Keine IP-Datei", "FP-Rate", "Format", "Klon-Verdacht",
          # "Overlap zu gering") bleiben permanent - die aendern sich selten.
          existing_rejected_meta = {}
          REJECT_TTL_DAYS      = 90    # Standard-TTL (Aktualitäts-Rejects)
          REJECT_TTL_DAYS_LONG = 30    # Kurzer TTL für "Keine IP-Datei":
          # Ein Repo das heute keine IP-Liste hat, kann morgen eine haben.
          # 30d = 4 wöchentliche Discovery-Runs bis zur Neuevaluierung.
          # Vorher war dieser Wert 180d – zu lang für einen Zustandscheck
          # der sich täglich ändern kann (im Gegensatz zu FP-Rate oder Klon-
          # Verdacht, die strukturell sind und sich selten ändern).
          # Reject-Gruende, die als "transient" gelten und nach TTL ablaufen.
          # Identifikation via Substring im reason-Feld (vgl. _evaluate_one).
          TRANSIENT_REJECT_SUBSTRINGS = (
              "Zu alt:",            # Repo-Push > 30d
              "IP-Datei",           # IP-Datei selbst > 30d ("IP-Datei 378d alt")
              "Download-Fehler",    # transient: Netz/CDN-Fehler
              "Keine IP-Datei",     # Repo könnte Liste nachträglich hinzugefügt haben
          )
          LONG_TTL_SUBSTRINGS = ("Keine IP-Datei",)  # nutzen REJECT_TTL_DAYS_LONG

          def _is_transient_reject(reason):
              return any(sub in reason for sub in TRANSIENT_REJECT_SUBSTRINGS)

          # NETSHIELD FIX 2026-07-04:
          # Nur die drei wirklich problematischen ConfigServerApps-Massenfeeds
          # hart sperren. Andere ConfigServerApps-Dateien bleiben erlaubt, bis
          # ein echter Inhaltsvergleich zeigt, dass sie keine eigenen IPs liefern.
          # cbuijs/accomplist bleibt ausdruecklich erlaubt.
          BLOCKED_CLONE_FEED_NAMES = {
              "configserverapps_service_blocklists",
              "configserverapps_service_blocklists_anonymous",
              "configserverapps_service_blocklists_proxies",
          }

          def _is_blocked_clone_feed(name="", repo="", file_path="", url=""):
              name_l = (name or "").strip().lower()
              return name_l in BLOCKED_CLONE_FEED_NAMES

          def _existing_feed_for_fingerprint(ip_fp, current_name=""):
              """Findet bereits registrierte Feeds mit exakt gleicher IP-Menge.

              Das ist der wichtige Clone-Schutz fuer Auto-Discovery: nicht nur
              gleiche URL/Repo pruefen, sondern den Inhalt. Wenn ein neuer Feed
              bytegenau dieselbe sortierte IP-Menge wie ein vorhandener Feed hat,
              wird er gar nicht erst aufgenommen. Unterschiede von nur einer IP
              ergeben einen anderen Fingerprint und bleiben erlaubt.
              """
              if not ip_fp:
                  return ""
              current_name = (current_name or "").strip()
              for _ex_name, _ex_feed in approved_feeds.items():
                  if _ex_name == current_name:
                      continue
                  if _ex_feed.get("ip_fingerprint") == ip_fp:
                      return _ex_name
              return ""

          if os.path.exists(AUTO_FILE):
              try:
                  with open(AUTO_FILE) as f:
                      auto_data = json.load(f)
                  _geo_pruned = []
                  _redundant_pruned = []
                  _non_threat_pruned = []
                  for feed in auto_data.get("feeds", []):
                      # Auto-Prune: bereits registrierte Geo-/Laenderlisten
                      # (file/url matcht GEO_FILE_RE) NICHT uebernehmen -> sie
                      # werden beim Speichern nicht zurueckgeschrieben und damit
                      # einmalig entfernt. Heilt frueher faelschlich aufgenommene
                      # ipip_*/dbip_*/continent_*/country_*-Feeds.
                      _feed_loc = f"{feed.get('name','')} {feed.get('file','')} {feed.get('url','')}"
                      if GEO_FILE_RE.search(_feed_loc):
                          _geo_pruned.append(feed.get("name", "?"))
                          continue
                      # Auto-Prune: redundante Aggregator-Sublisten bereits direkt
                      # gezogener Upstreams (dataplane_*, stopforumspam_*,
                      # blocklist_de_*, abuseipdb_*, ciarmy, ...) entfernen ->
                      # beendet die Score-Drift durch Mehrfachzaehlung.
                      if REDUNDANT_FEED_RE.search(_feed_loc):
                          _redundant_pruned.append(feed.get("name", "?"))
                          continue
                      _feed_path_for_policy = feed.get("file", "") or feed.get("name", "")
                      _feed_basename = _feed_path_for_policy.rsplit("/", 1)[-1]
                      _feed_basename_words = re.sub(r"[_\-.]+", " ", _feed_basename)
                      if (NON_THREAT_INFRA_FILE_RE.search(_feed_path_for_policy)
                              and not THREAT_CONTEXT_RE.search(_feed_basename_words)):
                          _non_threat_pruned.append(feed.get("name", "?"))
                          continue
                      existing_feeds[feed["name"]] = feed
                  if _geo_pruned:
                      print(f"Auto-Prune: {len(_geo_pruned)} Geo-/Laenderlisten aus "
                            f"bestehenden Feeds entfernt: {', '.join(_geo_pruned[:10])}"
                            + (" ..." if len(_geo_pruned) > 10 else ""))
                  if _redundant_pruned:
                      print(f"Auto-Prune: {len(_redundant_pruned)} redundante Upstream-"
                            f"Sublisten aus bestehenden Feeds entfernt: "
                            f"{', '.join(_redundant_pruned[:10])}"
                            + (" ..." if len(_redundant_pruned) > 10 else ""))
                  if _non_threat_pruned:
                      print(f"Auto-Prune: {len(_non_threat_pruned)} legitime Infrastruktur-"
                            f"Sublisten aus bestehenden Feeds entfernt: "
                            f"{', '.join(_non_threat_pruned[:10])}"
                            + (" ..." if len(_non_threat_pruned) > 10 else ""))
                  _raw_rejected = auto_data.get("rejected_repos", [])
                  existing_rejected = set(_raw_rejected)
                  # Meta-Dict laden (neues Feld, kann bei alten JSONs fehlen)
                  existing_rejected_meta = dict(auto_data.get("rejected_repos_meta", {}))

                  # Bereits fest in anderen Workflows/SOURCES integrierte Repos
                  # duerfen nicht gleichzeitig als Reject im Auto-Feed-State
                  # stehen. Das bereinigt u.a. timgerstel/suspicious_IPs, das
                  # direkt ueber honeypot_monitor.yml verarbeitet wird.
                  _known_rejects_pruned = existing_rejected & set(KNOWN_REPOS)
                  for _kr in _known_rejects_pruned:
                      existing_rejected.discard(_kr)
                      existing_rejected_meta.pop(_kr, None)
                  if _known_rejects_pruned:
                      print(
                          f"State-Prune: {len(_known_rejects_pruned)} bereits direkt "
                          f"integrierte Repos aus rejected_repos entfernt"
                      )

                  # CONTENT-SNIFF-MIGRATION: Alte "Keine IP-Datei"-Rejects
                  # entstanden unter der rein dateinamenbasierten Erkennung und
                  # sind nach Einfuehrung des Inhalts-Fallbacks nicht mehr
                  # belastbar. Pro State-Version einmalig freigeben, damit sie
                  # sofort neu bewertet werden koennen statt bis zu 30 Tage zu
                  # warten. Das Eval-Budget bleibt unveraendert bei 400 Repos.
                  _stored_sniff_version = int(
                      auto_data.get("content_sniff_state_version", 0) or 0
                  )
                  _content_retries_unlocked = 0
                  if _stored_sniff_version < CONTENT_SNIFF_STATE_VERSION:
                      for _r, _info in list(existing_rejected_meta.items()):
                          _reason = (
                              _info.get("reason", "")
                              if isinstance(_info, dict) else ""
                          )
                          if ("Keine IP-Datei" not in _reason
                                  and not _reason.startswith("Größe:")
                                  and not _reason.startswith("Groesse:")):
                              continue
                          existing_rejected.discard(_r)
                          existing_rejected_meta.pop(_r, None)
                          _content_retries_unlocked += 1
                      if _content_retries_unlocked:
                          print(
                              f"Content-Sniff-Migration v{CONTENT_SNIFF_STATE_VERSION}: "
                              f"{_content_retries_unlocked} alte Dateinamen-/Groessen-Rejects "
                              f"zur sofortigen Neuevaluierung freigegeben"
                          )

                  # FIX BUG-LEGACY-DATE-KEY: Ältere Meta-Einträge nutzen den
                  # Schlüssel "date" statt "rejected_at". Die TTL-Prüfung liest
                  # ausschließlich "rejected_at" (_info.get("rejected_at", "")) →
                  # bei diesen Einträgen leerer String → strptime-Exception →
                  # continue → TTL lief NIE ab. Der Backfill unten heilt nur
                  # Repos OHNE Meta-Eintrag, nicht solche mit "date"-Meta, daher
                  # blieben sie dauerhaft blockiert (Stand-Analyse: 955 Repos,
                  # alle reason="Keine IP-Datei"). Migration beim Laden: date →
                  # rejected_at. Dadurch greift der TTL und der Schlüssel wird
                  # künftig konsistent zurückgeschrieben.
                  _legacy_key_migrated = 0
                  for _mrepo, _minfo in existing_rejected_meta.items():
                      if (isinstance(_minfo, dict)
                              and "rejected_at" not in _minfo
                              and _minfo.get("date")):
                          _minfo["rejected_at"] = _minfo["date"]
                          _legacy_key_migrated += 1
                  if _legacy_key_migrated:
                      print(f"Meta-Migration: {_legacy_key_migrated} Legacy-'date'-"
                            f"Rejects auf 'rejected_at' normalisiert (TTL greift jetzt)")

                  # Backfill: Repos ohne Meta-Eintrag bekommen einen Meta-Eintrag
                  # mit backdatiertem Datum, damit der TTL-Mechanismus greift.
                  # FIX BUG-BACKFILL-KEY: Vorher wurde "date" statt "rejected_at"
                  # geschrieben. Die TTL-Prüfung liest ausschließlich "rejected_at"
                  # (_info.get("rejected_at", "")) → leerer String → strptime-
                  # Exception → continue → TTL lief für alle Backfill-Einträge
                  # NIEMALS ab. Repos blieben dauerhaft in rejected_repos blockiert.
                  # Rückdatierung auf 16d: bei REJECT_TTL_DAYS_LONG=30d läuft der
                  # Eintrag nach 14 weiteren Tagen (2 Discovery-Runs) ab. Vorher
                  # war die Rückdatierung auf 91d bei 180d-TTL – gleiches Verhältnis.
                  _backfill_date = (now - timedelta(days=16)).strftime("%Y-%m-%d")
                  _backfilled = 0
                  for _pr in list(existing_rejected):
                      if _pr not in existing_rejected_meta and _pr not in KNOWN_REPOS:
                          existing_rejected_meta[_pr] = {
                              "reason": "Keine IP-Datei",
                              "rejected_at": _backfill_date,
                          }
                          _backfilled += 1
                  if _backfilled:
                      print(f"Backfill: {_backfilled} permanente Rejects mit Meta versehen "
                            f"(TTL-Datum: {_backfill_date})")

                  # TTL-Bereinigung: transiente Rejects, die aelter als
                  # REJECT_TTL_DAYS sind, aus rejected_repos entfernen damit
                  # sie diesen Run neu evaluiert werden.
                  _ttl_expired = []
                  for _r, _info in list(existing_rejected_meta.items()):
                      if not isinstance(_info, dict):
                          continue
                      _reason = _info.get("reason", "")
                      _at = _info.get("rejected_at", "")
                      if not _is_transient_reject(_reason):
                          continue
                      try:
                          _at_dt = datetime.strptime(_at[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                      except Exception:
                          continue
                      _this_ttl = REJECT_TTL_DAYS_LONG if any(
                          s in (_info.get("reason") or "") for s in LONG_TTL_SUBSTRINGS
                      ) else REJECT_TTL_DAYS
                      if (now - _at_dt).days >= _this_ttl:
                          _ttl_expired.append(_r)
                  for _r in _ttl_expired:
                      existing_rejected.discard(_r)
                      existing_rejected_meta.pop(_r, None)

                  _blocked_existing = []
