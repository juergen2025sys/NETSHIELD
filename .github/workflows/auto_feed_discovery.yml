          # volle Scan allein schon min. 249*2s = 8,3 Minuten und liess kaum
          # Budget fuer die Eval-Phase (30-Minuten-Gesamtlimit).
          #
          # Fix: Pro Kalenderwoche wird nur 1 von 4 Topic-Chunks bearbeitet
          # (Round-Robin ueber ISO-Kalenderwoche, kein State noetig - der
          # woechentliche Cron sorgt fuer natuerliche Rotation). Interleaved
          # Split (chunk = SEARCH_TOPICS[idx::4]) statt Bloecken, damit jeder
          # Chunk Themen aus allen Kategorien enthaelt und nicht nur z.B.
          # Malware-Familien in Woche 1 und Honeypot-Typen in Woche 3.
          # Dafuer werden pro Topic jetzt 2 Seiten geholt (Platz 1-200 statt
          # nur 1-100), und die Sortierung alterniert wochenweise zwischen
          # "updated" (aktive Repos) und "created" (neu angelegte Repos) -
          # "created" findet gezielt frische Repos, die bei "updated" nie an
          # die Oberflaeche kommen. Damit wird der volle Topic-Katalog alle
          # 4 Wochen einmal durchsucht, alle 8 Wochen mit beiden Sortierungen.
          # FIX ROTATION-RUN-BASED (2026-08-02): Vorher war die Rotation an
          # die ISO-Kalenderwoche gekoppelt (now.isocalendar()[1]) - das
          # bedeutete: mehrfaches manuelles Triggern am selben Tag traf IMMER
          # denselben Topic-/Code-Chunk, unabhaengig davon wie oft man
          # startet. "Mehr Reichweite sofort" war damit gar nicht moeglich,
          # nur durch Abwarten auf die naechste Kalenderwoche. Jetzt an
          # github.run_number gekoppelt (monoton steigende Lauf-Nummer,
          # bei jedem Run - auch manuellen workflow_dispatch-Runs am selben
          # Tag - garantiert verschieden). Mehrfaches manuelles Triggern
          # hintereinander deckt jetzt tatsaechlich unterschiedliche Chunks
          # ab - die komplette Rotation (2 Topic-/Code-Chunks) laesst sich
          # so an einem einzigen Tag durch 2x manuelles Triggern abdecken,
          # statt auf die naechste Kalenderwoche warten zu muessen.
          _iso_week = int(os.environ.get("GITHUB_RUN_NUMBER", "0")) or now.isocalendar()[1]
          # FIX REACH-2026-07-31: Von 4 auf 3 Chunks verkuerzt (mehr Topics pro
          # Lauf, volle Abdeckung alle 3 statt 4 Wochen). Grundlage: letzter
          # Lauf brauchte nur ~21 von 30 verfuegbaren Minuten - Headroom fuer
          # ca. 1,5 Min mehr Topic-Suche vorhanden (87 statt 65 Topics).
          # FIX REACH-40MIN (2026-08-02): Von 3 auf 2 Chunks verkuerzt (mehr
          # Topics pro Lauf dank 40-Minuten-Budget), voller Katalog jetzt
          # alle 2 statt alle 3 Wochen komplett durchsucht.
          _TOPIC_CHUNK_COUNT = 2
          _topic_chunk_idx = _iso_week % _TOPIC_CHUNK_COUNT
          _topic_chunk = SEARCH_TOPICS[_topic_chunk_idx::_TOPIC_CHUNK_COUNT]
          _topic_sort = "updated" if (_iso_week % 2 == 0) else "created"
          print(f"Topic-Rotation: Lauf #{_iso_week}, Chunk {_topic_chunk_idx+1}/{_TOPIC_CHUNK_COUNT} "
                f"({len(_topic_chunk)} von {len(SEARCH_TOPICS)} Topics), sort={_topic_sort}")

          for topic in _topic_chunk:
              if _check_timeout("Topic-Suche"):
                  break
              print(f"Suche GitHub-Topic: {topic}...")
              for _page in (1, 2):
                  if _check_timeout("Topic-Suche-Paginierung"):
                      break
                  data = gh_api(
                      f"/search/repositories?q=topic:{topic}&sort={_topic_sort}"
                      f"&order=desc&per_page=100&page={_page}"
                  )
                  time.sleep(2)
                  if not data:
                      break
                  _items = data.get("items", [])
                  for repo in _items:
                      add_repo_candidate(candidate_repos, repo, f"topic:{topic}")
                      _github_found += 1
                  if len(_items) < 100:
                      break  # keine weitere Seite noetig, Ergebnis erschoepft

          print(f"\nGitHub-Topic-Suche: {_github_found} Treffer → {len(candidate_repos)} Kandidaten")

          # ── Bewährte Feed-Betreiber weiter durchsuchen ───────────────────
          # Eigentümer bereits bekannter, funktionierender Feeds veröffentlichen
          # häufig weitere Listen in Schwester-Repositories. Maximal 15 Owner und
          # je 50 zuletzt aktualisierte Repositories, damit API-Budget und Laufzeit
          # kontrollierbar bleiben. Alle Treffer durchlaufen die unveränderte
          # Dateinamen-, Inhalts-, Geo-/Whitelist- und Qualitätsprüfung.
          # FIX REACH-2026-07-31: Von 15 auf 30 erhoeht. KNOWN_REPOS enthaelt
          # 52 eindeutige, bereits verifizierte Owner (kuratiert, keine neue
          # Quelle noetig) - bisher wurden nur die ersten 15 davon nach
          # weiteren Repos durchsucht. Kosten: 1 zusaetzlicher API-Call +
          # 1s sleep pro weiterem Owner (~15s fuer die 15 zusaetzlichen).
          # FIX REACH-40MIN (2026-08-02): Von 30 auf 45 erhoeht (von 52
          # bekannten Ownern in KNOWN_REPOS insgesamt).
          TRUSTED_OWNER_LIMIT = 45
          TRUSTED_OWNER_REPO_LIMIT = 50
          _trusted_owners = []
          for _known_repo in sorted(KNOWN_REPOS):
              if "/" not in _known_repo:
                  continue
              _owner = _known_repo.split("/", 1)[0]
              if _owner.lower() not in {x.lower() for x in _trusted_owners}:
                  _trusted_owners.append(_owner)
              if len(_trusted_owners) >= TRUSTED_OWNER_LIMIT:
                  break

          _owner_found = 0
          for _owner in _trusted_owners:
              if _check_timeout("Trusted-Owner-Suche"):
                  break
              print(f"  Suche weitere Repositories von bewährtem Betreiber: {_owner}...")
              _owner_data = gh_api(
                  f"/search/repositories?q=user:{urllib.parse.quote(_owner)}+archived:false"
                  f"&sort=updated&order=desc&per_page={TRUSTED_OWNER_REPO_LIMIT}"
              )
              time.sleep(1)
              if not _owner_data:
                  continue
              for _repo in _owner_data.get("items", []):
                  _before = len(candidate_repos)
                  add_repo_candidate(candidate_repos, _repo, f"trusted-owner:{_owner}")
                  if len(candidate_repos) > _before:
                      _owner_found += 1

          print(f"Trusted-Owner-Suche: {_owner_found} zusätzliche Kandidaten")

          # FIX CODE-SEARCH-ALWAYS-ON (2026-07-31): Root-Cause-Befund war, dass
          # die alte Schwelle (Skip sobald candidate_repos >= 300) die
          # Code-Search PRAKTISCH BEI JEDEM LAUF verhinderte, weil die
          # Topic-Suche allein schon tausende Kandidaten liefert. Dabei ist
          # Code-Search laut Konstruktion (filename:-Queries matchen direkt
          # IP_FILE_PATTERNS) der treffsicherste Suchpfad und hatte trotzdem
          # ein eigenes, dadurch staendig leeres Eval-Budget (QUOTA_CODE).
          #
          # Fix: Schwelle entfernt, Code-Search laeuft jetzt IMMER, aber mit
          # wochenweise rotierten Query-Chunks (analog zur Topic-Rotation
          # oben) statt aller 135 Queries auf einmal - das haelt die Phase
          # bei ca. 27 Queries * 7s ≈ 3,2 Minuten statt bis zu 15,75 Minuten
          # bei vollem Durchlauf. Voller Query-Katalog wird alle 5 Wochen
          # einmal komplett durchsucht.
          #
          # FIX CODE-SEARCH-RATELIMIT (unveraendert):
          #   1. MAX_WAIT_SECONDS für Code-Search = 0 → sofortiger Skip bei 429,
          #      kein langes Warten das den Timeout auffrisst
          #   2. Circuit-Breaker auf 2 statt 5 reduziert – beim ersten Doppel-429
          #      sofort abbrechen statt 5× 65s zu warten
          #   3. Nur 1 Worker statt 2 – verhindert parallele 429-Bursts
          import threading as _threading
          _cs_skip_lock = _threading.Lock()
          _cs_consecutive_skips = [0]
          _cs_break_event = _threading.Event()

          # FIX REACH-2026-07-31: Von 5 auf 3 Chunks verkuerzt (45 statt 27
          # Queries pro Lauf, volle Abdeckung alle 3 statt 5 Wochen). Der
          # Circuit-Breaker (siehe unten, jetzt 4 statt 2) faengt weiterhin
          # ab, falls Rate-Limits frueh zuschlagen - im letzten Lauf brach
          # die Phase nach nur 8 von 27 Queries wegen zweier 429 in Folge ab
          # und kostete dadurch nur 57s statt der budgetierten ~3 Min.
          # FIX REACH-40MIN (2026-08-02): Von 3 auf 2 Chunks verkuerzt (mehr
          # Queries pro Lauf), voller Katalog jetzt alle 2 statt 3 Wochen.
          _CODE_CHUNK_COUNT = 2
          _code_chunk_idx = _iso_week % _CODE_CHUNK_COUNT
          _code_chunk = SEARCH_CODE_QUERIES[_code_chunk_idx::_CODE_CHUNK_COUNT]

          if _check_timeout("Code-Search-Start"):
              print("\nCode-Search ÜBERSPRUNGEN: globales Laufzeitbudget bereits ausgeschöpft")
          else:
              print(f"\nCode-Search startet: Lauf #{_iso_week}, Chunk {_code_chunk_idx+1}/"
                    f"{_CODE_CHUNK_COUNT} ({len(_code_chunk)} von {len(SEARCH_CODE_QUERIES)} Queries)")

              # Eigener gh_api-Wrapper für Code-Search ohne Wartezeit bei 429.
              # Normales gh_api wartet bis zu MAX_WAIT_SECONDS (90s) – für Code-Search
              # wollen wir bei 429 sofort skippen damit der Circuit-Breaker schnell feuert.
              def _gh_code_search(path):
                  url = f"https://api.github.com{path}"
                  headers = {
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  if GH_TOKEN:
                      headers["Authorization"] = f"Bearer {GH_TOKEN}"
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 429, 422):
                          # Sofortiger Skip – kein Warten, Circuit-Breaker soll greifen
                          print(f"  Code-Search HTTP {e.code} – sofortiger Skip (kein Warten)")
                          return None
                      print(f"  Code-Search HTTP {e.code} für {path}")
                      return None
                  except Exception as ex:
                      print(f"  Code-Search Fehler: {ex}")
                      return None

              def _search_code_one(query):
                  if _cs_break_event.is_set():
                      return None
                  if _check_timeout("Code-Search-Query"):
                      _cs_break_event.set()
                      return None
                  print(f"Suche Code: {query}...")
                  encoded_query = urllib.parse.quote(query, safe=':+*')
                  # FIX AUDIT-PERF-1 (2026-07-14): per_page von 30 auf den von
                  # GitHub dokumentierten Maximalwert 100 angehoben
                  # (docs.github.com/en/rest/search/search - "returns up to
                  # 100 results per page"). Das Rate-Limit fuer Code-Search
                  # ist laut GitHub-Doku 9 Requests/Minute PRO TOKEN
                  # (authentifiziert; docs.github.com/en/rest/search/search,
                  # Stand 2026-07-18) - der vorherige Kommentar nannte
                  # faelschlich 10. Bei gleicher Anzahl Requests und gleichem
                  # sleep liefert jeder Call bis zu 3,3x mehr Treffer, also
                  # mehr Kandidaten in derselben Laufzeit.
                  data = _gh_code_search(
                      f"/search/code?q={encoded_query}&sort=indexed&order=desc&per_page=100"
                  )
                  if data is None:
                      with _cs_skip_lock:
                          _cs_consecutive_skips[0] += 1
                          # FIX REACH-2026-07-31: Schwelle von 2 auf 4 erhoeht.
                          # Der urspruengliche Wert 2 war fuer die ALTE Version
                          # mit bis zu 65s Wartezeit pro 429 gedacht (5x65s =
                          # >5 Min Kosten). Seit _gh_code_search bei 429/403/422
                          # SOFORT ohne Warten skippt (siehe oben), kostet ein
                          # Fehlschlag nur noch den Requestlauf selbst (~1-2s) -
                          # 4 statt 2 Versuche kosten also kaum mehr Zeit, ueber-
                          # stehen aber kurze/transiente Spitzen (wie im Log vom
                          # 31.07. beobachtet: Abbruch nach nur 8 von 27 Queries).
                          if _cs_consecutive_skips[0] >= 4:
                              print(f"  CIRCUIT-BREAKER: 4 Code-Queries in Folge fehlgeschlagen "
                                    f"– Code-Search abgebrochen, weiter mit vorhandenen Kandidaten")
                              _cs_break_event.set()
                  else:
                      with _cs_skip_lock:
                          _cs_consecutive_skips[0] = 0
                      for item in data.get("items", []):
                          repo = item.get("repository")
                          add_repo_candidate(candidate_repos, repo, f"code:{query}")
                  # PERF: 10s -> 7s. Bei 9 Req/Min (siehe oben) ist die
                  # minimale sichere Pause 60/9 = 6,67s. 7s haelt mit
                  # kleinem Puffer sicher darunter (~8,6 Req/Min effektiv).
                  # Bei ca. 27 Queries pro Wochen-Chunk (siehe _CODE_CHUNK_COUNT
                  # oben) sind das ca. 3,2 Min pro Lauf statt bis zu 15,75 Min
                  # bei allen 135 Queries auf einmal.
                  time.sleep(7)
                  return data

              # 1 Worker statt 2: verhindert parallele 429-Bursts
              with ThreadPoolExecutor(max_workers=1) as _cs_ex:
                  list(_cs_ex.map(_search_code_one, _code_chunk))

          print(f"\nNach GitHub-Suche: {len(candidate_repos)} Kandidaten gesamt")

          # ── Schritt 3a: Awesome-List-Scraping ─────────────────────────────
          # NEU v3: Kuratierte Awesome-Listen enthalten handgepickte,
          # qualitativ hochwertige Security-Feed-Repos – oft unbekannt
          # für GitHub-Topic-Suche weil Maintainer keine Topics setzen.
          # Strategie: Markdown-Dateien laden, GitHub-URLs extrahieren,
          # als Kandidaten hinzufügen. Timeout pro URL: 10s.
          print("\n── Schritt 3a: Awesome-List-Scraping ────────────────────────────")
          AWESOME_LISTS = [
              # Threat Intelligence Feeds & IOC-Quellen
              "https://raw.githubusercontent.com/hslatman/awesome-threat-intelligence/master/README.md",
              # Honeypot-Projekte
              "https://raw.githubusercontent.com/paralax/awesome-honeypots/master/README.md",
              # Malware-Analyse (enthält oft C2-IP-Listen)
              "https://raw.githubusercontent.com/rshipp/awesome-malware-analysis/master/README.md",
              # OSINT-Tools (enthält IP-Reputations-Dienste)
              "https://raw.githubusercontent.com/jivoi/awesome-osint/master/README.md",
              # Incident Response (enthält Feed-Aggregatoren)
              "https://raw.githubusercontent.com/meirwah/awesome-incident-response/master/README.md",
              # NEU v4: Threat Detection - Blue-Team-Detection-Repos enthalten
              # oft kuratierte IOC-Feeds als Beispieldaten
              "https://raw.githubusercontent.com/0x4D31/awesome-threat-detection/master/README.md",
              # NEU v4: Security-Sammlung mit breitem Defense-Fokus
              "https://raw.githubusercontent.com/sbilly/awesome-security/master/README.md",
              # NEU v4: Cybersecurity Blue-Team Tools & Feeds
              "https://raw.githubusercontent.com/fabacab/awesome-cybersecurity-blueteam/master/README.md",
              # FIX REACH-2026-07-31: IOC-Sammlung (Indicators of Compromise),
              # andere Kuration/Linkmenge als hslatman's awesome-threat-intelligence.
              # URL verifiziert (HTTP 200, 40 GitHub-Links enthalten).
              "https://raw.githubusercontent.com/sroberts/awesome-iocs/master/README.md",
              # FIX REACH-2026-07-31: CSIRT-Alltagsressourcen, verlinkt u.a.
              # C2-Tracker und Malware-Repos, die in den anderen Listen nicht
              # auftauchen. URL verifiziert (HTTP 200).
              "https://raw.githubusercontent.com/Spacial/awesome-csirt/master/README.md",
          ]

          # GitHub-URL-Pattern für Markdown-Links: [Text](https://github.com/owner/repo)
          _GH_LINK_RE = re.compile(
              r'https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)'
              r'(?:/[^\s\)\"]*)?'
          )

          _awesome_found = 0
          for _aw_url in AWESOME_LISTS:
              if _check_timeout("Awesome-List"):
                  break
              _aw_text = fetch_raw(
                  _aw_url, limit=512 * 1024, timeout=10, allow_partial=True
              )
              if not _aw_text:
                  print(f"  SKIP (Download fehlgeschlagen): {_aw_url.split('/')[-2]}")
                  continue
              _aw_repos = set(_GH_LINK_RE.findall(_aw_text))
              _new_from_aw = 0
              for _repo_path in _aw_repos:
                  if _repo_path in KNOWN_REPOS:
                      continue
                  if _repo_path in candidate_repos:
                      continue
                  # Pseudo-Repo-Dict: Stars/Forks unbekannt, pushed=now (zur
                  # Überwindung des 30-Tage-Guards wird pushed auf heute gesetzt;
                  # das tatsächliche Datum prüft die Evaluations-Phase via API).
                  add_repo_candidate(candidate_repos, {
                      "full_name":        _repo_path,
                      "stargazers_count": 0,
                      "forks_count":      0,
                      "updated_at":       now_day,
                      "pushed_at":        now_day,  # Guard wird in _evaluate_one per API geprüft
                      "description":      "",
                      "topics":           [],
                  }, f"awesome:{_aw_url.split('/')[-2]}")
                  _new_from_aw += 1
                  _awesome_found += 1
              print(f"  {_aw_url.split('/')[-2]}: {len(_aw_repos)} Links, {_new_from_aw} neue Kandidaten")

          print(f"Awesome-List-Scraping: {_awesome_found} neue Kandidaten hinzugefügt")
          print(f"Kandidaten gesamt nach Awesome-Scraping: {len(candidate_repos)}")

          # ── Schritt 3b: GitLab-Suche ──────────────────────────────────────
          # NEU v3: GitLab public API durchsuchen – viele EU- und
          # Security-Forscher hosten dort, die in GitHub-Suche nie auftauchen.
          # GitLab API v4, kein Token nötig, 500 Req/h ohne Auth.
          # Nur öffentliche Projekte (visibility=public) werden gesucht.
          # GitLab-Kandidaten durchlaufen dieselbe Evaluations-Pipeline,
          # nutzen aber GitLab-Raw-URLs statt GitHub-Raw-URLs.
          print("\n── Schritt 3b: GitLab-Suche ─────────────────────────────────────")

          GITLAB_SEARCH_TERMS = [
              "ip-blocklist", "ip-blacklist", "malicious-ip",
              "threat-feed", "threatintel", "blocklist",
              "honeypot", "ssh-bruteforce", "botnet", "c2-ips",
              "ioc-feed", "abuseipdb", "ipset", "denylist",
              # NEU (2026-08-02): Palo Alto Networks EDL (External Dynamic List)
              "edl", "external-dynamic-list", "pan-edl", "palo-alto",
              # NEU (2026-08-02): weitere Firewall-Hersteller
              "fortigate", "fortinet", "cisco-firepower", "checkpoint",
              # NEU: spezifischere Begriffe
              "attacker-ips", "scanner-ips", "bruteforce-ips",
              "threat-intelligence", "security-feed",
              "blacklist-ip", "ip-ban", "ip-abuse",
              # NEU: weitere Quellklassen
              "drop-list", "spam-ip", "ddos-ip", "tor-exit",
              "proxy-list", "c2-feed", "malware-ip", "ip-reputation",
              "fail2ban", "crowdsec", "ip-deny", "firewall-blocklist",
              # NEU: Phishing + weitere bisher fehlende Kategorien
              "phishing", "phishing-ip", "bulletproof-hosting",
              "exploit-kit", "iot-botnet", "malvertising",
              "skimmer", "magecart", "booter", "stresser",
              # FIX REACH-2026-07-31: weitere themennahe Begriffe
              "malicious-ips", "cti", "sinkhole", "webshell-ips",
              "brute-force-ip", "reputation-list", "scan-blocklist",
              "cobalt-strike-c2",
          ]

          # Nur Topics-Suche – GitLab-Code-Search ist ohne Auth sehr limitiert
          _gitlab_found = 0
          for _gl_term in GITLAB_SEARCH_TERMS:
              if _check_timeout("GitLab-Suche"):
                  break
              print(f"  Suche GitLab-Topic: {_gl_term}...")
              for _gl_page in (1, 2):
                  if _check_timeout("GitLab-Topic-Paginierung"):
                      break
                  _gl_data = gitlab_api(
                      f"/projects?topic={urllib.parse.quote(_gl_term)}"
                      f"&order_by=last_activity_at&sort=desc&per_page=50"
                      f"&page={_gl_page}&visibility=public"
                  )
                  time.sleep(1)
                  if not _gl_data or not isinstance(_gl_data, list):
                      break
                  for _gl_project in _gl_data:
                      add_gitlab_candidate(candidate_repos, _gl_project, f"gitlab-topic:{_gl_term}:p{_gl_page}")
                      _gitlab_found += 1
                  if len(_gl_data) < 50:
                      break

          # GitLab-Keyword-Suche (ergänzend zur Topic-Suche)
          GITLAB_KEYWORDS = [
              "ip blocklist malicious",
              "threat feed ipv4",
              "honeypot ip list",
              "bruteforce blacklist",
              "phishing ip list",
          ]
          for _gl_kw in GITLAB_KEYWORDS:
              if _check_timeout("GitLab-Keyword"):
                  break
              print(f"  Suche GitLab-Keyword: {_gl_kw}...")
              for _gl_page in (1, 2):
                  if _check_timeout("GitLab-Keyword-Paginierung"):
                      break
                  _gl_data = gitlab_api(
                      f"/projects?search={urllib.parse.quote(_gl_kw)}"
                      f"&order_by=last_activity_at&sort=desc&per_page=50"
                      f"&page={_gl_page}&visibility=public"
                  )
                  time.sleep(1)
                  if not _gl_data or not isinstance(_gl_data, list):
                      break
                  for _gl_project in _gl_data:
                      add_gitlab_candidate(candidate_repos, _gl_project, f"gitlab-search:{_gl_kw}:p{_gl_page}")
                      _gitlab_found += 1
                  if len(_gl_data) < 50:
                      break

          _gitlab_unique = sum(1 for v in candidate_repos.values() if v.get("platform") == "gitlab")
          print(f"GitLab-Suche: {_gitlab_found} Treffer → {_gitlab_unique} GitLab-Kandidaten")
          print(f"Kandidaten gesamt: {len(candidate_repos)}\n")

          # Schritt 4 (state/auto_discovered_feeds.json laden) wurde nach oben
          # gezogen - siehe direkt nach Schritt 1. Grund: Org-Crawl (Schritt
          # 3a2) braucht existing_feeds um die Owner bekannter Feeds zu kennen.

          # ── Schritt 5: Kandidaten bewerten & IPs extrahieren ─────────────
          approved_feeds  = dict(existing_feeds)
          rejected_repos  = set(existing_rejected) | set(KNOWN_REPOS)
          # NEU v4: Meta-Tracking spiegelt rejected_repos. Bei jedem add() auch
          # rejected_meta updaten, bei discard() auch hier entfernen. Wird am
          # Ende ins JSON geschrieben fuer TTL-Re-Try im naechsten Run.
          rejected_meta   = dict(existing_rejected_meta)
          evaluation_log  = []

          all_new_ips = set()
          all_known_ips = set()
          ip_auto_feed_count = {}

          # ── Schritt 5a: REFRESH bestehender Feeds ─────────────────────────
          removed_stale = []
          removed_aged  = []

          def _build_raw_url_for_feed(feed):
              """Raw-URL aus Feed-Dict ableiten (GitHub oder GitLab)."""
              url = feed.get("url", "")
              if url:
                  return url
              # Fallback für ältere Feed-Einträge ohne explizite URL
              _repo = feed.get("repo", "")
              _path = feed.get("file", "")
              _platform = feed.get("platform", "github")
              if not _repo or not _path:
                  return ""
              if _platform == "gitlab":
                  _branch = feed.get("gl_default_branch", "main")
                  return f"https://gitlab.com/{_repo}/-/raw/{_branch}/{_path}"
              return f"https://raw.githubusercontent.com/{_repo}/HEAD/{_path}"

          def _get_commit_date_for_feed(feed):
              """Letztes Commit-Datum der IP-Datei ermitteln (GitHub oder GitLab)."""
              _repo = feed.get("repo", "")
              _path = feed.get("file", "")
              _platform = feed.get("platform", "github")
              if not _repo or not _path:
                  return None
              if _platform == "gitlab":
                  _gl_id = feed.get("gl_id")
                  if not _gl_id:
                      return None
                  _commits = gitlab_api(
                      f"/projects/{_gl_id}/repository/commits"
                      f"?path={urllib.parse.quote(_path)}&per_page=1"
                  )
                  if _commits and isinstance(_commits, list) and _commits:
                      _date_str = _commits[0].get("committed_date", "")
                      try:
                          return datetime.strptime(_date_str[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                      except Exception:
                          return None
              else:
                  _commits = gh_api(
                      f"/repos/{_repo}/commits"
                      f"?path={urllib.parse.quote(_path)}&per_page=1"
                  )
                  if _commits and isinstance(_commits, list) and _commits:
                      _date_str = (_commits[0].get("commit", {})
                                   .get("committer", {}).get("date", ""))
                      try:
                          return datetime.strptime(_date_str[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                      except Exception:
                          return None
              return None

          # REFRESH muss denselben vollstaendigen Download wie die Erstpruefung
          # nutzen. Bei Ueberschreitung wird fail-loud verworfen statt eine
          # abgeschnittene Teilliste als vollstaendigen Feed zu speichern.
          _REFRESH_READ_LIMIT = MAX_FEED_DOWNLOAD_BYTES

          def _refresh_one(item):
              _name, _feed = item
              _url = _build_raw_url_for_feed(_feed)
              result = {
                  "name": _name, "feed": _feed, "url": _url,
                  "skip": not _url, "content": None,
                  "file_days": None, "ips": set(),
                  "zero_ips": False,
              }
              if result["skip"]:
                  return result
              result["content"] = fetch_raw(_url, limit=_REFRESH_READ_LIMIT, timeout=20)
              if result["content"] is None:
                  return result
              _file_dt = _get_commit_date_for_feed(_feed)
              if _file_dt is not None:
                  result["file_days"] = (now - _file_dt).days
              result["ips"] = extract_ips(result["content"], _url)
              # Merker: Download OK aber 0 IPs extrahiert.
              # Vorab-Diagnose: erste 200 Zeichen loggen damit im Report
              # sichtbar ist ob es ein Format-Problem ist (JSON, Domains etc.)
              if not result["ips"]:
                  result["zero_ips"] = True
                  result["content_preview"] = result["content"][:200].replace("\n", " ").strip()
              return result

          if existing_feeds:
              # FIX SPEED-REFRESH (2026-08-02): Von 4 auf 10 Worker erhoeht.
              # Anders als GitHub/GitLab-API-Calls (gemeinsames Rate-Limit-
              # Budget) sind das Fetches auf viele verschiedene externe Feed-
              # URLs (unterschiedliche Domains, kein gemeinsames Limit) - rein
              # I/O-gebunden, sicher hochzuskalieren fuer spuerbar kuerzere
              # Laufzeit dieser Phase.
              print(f"REFRESH-Phase: {len(existing_feeds)} Feeds parallel (10 Worker)...")
              with ThreadPoolExecutor(max_workers=10) as _ex:
                  _refresh_results = list(_ex.map(_refresh_one,
                                                  list(existing_feeds.items())))
          else:
              _refresh_results = []

          for _r in _refresh_results:
              if _r["skip"]:
                  continue
              _name = _r["name"]
              _feed = _r["feed"]

              if _r["content"] is None:
                  _fails = _feed.get("consecutive_fails", 0) + 1
                  approved_feeds[_name]["consecutive_fails"] = _fails
                  approved_feeds[_name]["last_checked"] = now_day
                  print(f"  REFRESH {_name}: FAIL ({_fails}. Versuch)")
                  if _fails >= 3:
                      del approved_feeds[_name]
                      removed_stale.append(_name)
                      print(f"  REFRESH {_name}: 3x in Folge fehlgeschlagen – entfernt")
                  continue

              _file_days = _r["file_days"]
              if _file_days is not None and _file_days > 30:
                  _repo = _feed.get("repo", "")
                  del approved_feeds[_name]
                  removed_aged.append(f"{_name} ({_file_days}d)")
                  rejected_repos.discard(_repo)
                  rejected_repos.discard(f"gitlab:{_repo}")
                  rejected_meta.pop(_repo, None)
                  rejected_meta.pop(f"gitlab:{_repo}", None)
                  existing_rejected.discard(_repo)
                  print(f"  REFRESH {_name}: IP-Datei {_file_days}d alt – "
                        f"entfernt (Re-Discovery bei Aktivität möglich)")
                  continue

              _ips = _r["ips"]
              _age_str = f", Datei {_file_days}d alt" if _file_days is not None else ""

              # 0 IPs nach erfolgreichem Download = Format-Problem oder Feed leer.
              # Als Soft-Fail behandeln: consecutive_fails hochzaehlen wie bei
              # echtem Download-Fehler. So werden dauerhaft leere Feeds nach 3
              # Versuchen automatisch entfernt statt ewig als "OK" zu erscheinen.
              if _r.get("zero_ips"):
                  _fails = _feed.get("consecutive_fails", 0) + 1
                  approved_feeds[_name]["consecutive_fails"] = _fails
                  approved_feeds[_name]["last_checked"] = now_day
                  _preview = _r.get("content_preview", "")
                  print(f"  REFRESH {_name}: WARN 0 IPs trotz erfolgreichem Download "
                        f"({_fails}. Versuch{_age_str}) – Format-Problem?")
                  if _preview:
                      print(f"    Inhalt-Vorschau: {_preview[:150]}")
                  if _fails >= 3:
                      del approved_feeds[_name]
                      removed_stale.append(_name)
                      print(f"  REFRESH {_name}: 3x 0 IPs – entfernt")
                  continue

              approved_feeds[_name]["consecutive_fails"] = 0
              approved_feeds[_name]["last_checked"] = now_day
              approved_feeds[_name]["ip_count"] = len(_ips)
              approved_feeds[_name]["ip_fingerprint"] = _ip_fingerprint(_ips)
              if _file_days is not None:
                  approved_feeds[_name]["file_days_old"] = _file_days
              all_known_ips.update(_ips)
              for _ip in _ips:
                  ip_auto_feed_count[_ip] = ip_auto_feed_count.get(_ip, 0) + 1
              print(f"  REFRESH {_name}: OK ({len(_ips)} IPs{_age_str})")

          if removed_stale:
              print(f"\nAls tot entfernt: {len(removed_stale)} Feeds: {', '.join(removed_stale)}")
          if removed_aged:
              print(f"Als stale entfernt (Datei >30d): {len(removed_aged)} Feeds: {', '.join(removed_aged)}")

          existing_repo_set = {v.get("repo") for v in approved_feeds.values() if v.get("repo")}

          # ── Schritt 5a.5: Extra-Dateien in bestehenden Repos entdecken ──────
          # Problem: approved_feeds enthält pro Repo nur die erste/größte Datei.
          # Beim REFRESH wird nur diese eine URL geladen – neue oder andere
          # IP-Dateien im selben Repo werden nie entdeckt.
          # Lösung: Für jedes Repo mit aktivem Feed einmal den Tree scannen und
          # alle IP-Dateien finden die NICHT bereits in approved_feeds stehen.
          # Pro neu gefundener Datei: vollstaendig laden und mit denselben
          # Kern-Gates wie eine Hauptdatei validieren.
          # Timeout-bewusst: max. 1 API-Call pro Repo, Skip bei Timeout.
          print("\n── Schritt 5a.5: Extra-Dateien in bestehenden Repos ────────────")
          _extra_found_total = 0
          _extra_repos_scanned = 0

          # Pro Repo nur einmal scannen (mehrere Feeds können dasselbe Repo teilen)
          _repos_to_scan = {}
          for _fname, _fdata in list(approved_feeds.items()):
              _repo = _fdata.get("repo", "")
              _platform = _fdata.get("platform", "github")
              if not _repo or _repo in _repos_to_scan:
                  continue
              _repos_to_scan[_repo] = {
                  "platform":   _platform,
                  "gl_id":      _fdata.get("gl_id"),
                  "gl_branch":  _fdata.get("gl_default_branch", "main"),
                  "stars":      _fdata.get("stars", 0),
                  "rep_score":  _fdata.get("rep_score", 0),
                  "overlap_pct": _fdata.get("overlap_pct", 0),
                  "fp_rate":    _fdata.get("fp_rate", 0),
                  "days_old":   _fdata.get("days_old", 0),
              }

          # FIX SPEED-EXTRA-SCAN (2026-08-02): Vorher wurden JEDE Woche ALLE
          # bekannten Repos sequentiell gescannt (Tree-Fetch + ggf. Commit-
          # Lookup + Raw-Fetch pro neuer Datei, jeweils mit sleep(0.3)) - bei
          # 44 Repos war das der mit Abstand groesste Zeitanteil der
          # REFRESH+Extra-File-Scan-Phase (zusammen 7:43 Min in einem
          # beobachteten Lauf). Analog zur bereits etablierten Topic-/Code-
          # Query-Rotation wird jetzt nur die Haelfte der bekannten Repos pro
          # Lauf gescannt (Round-Robin ueber ISO-Kalenderwoche) - voller
          # Bestand wird alle 2 Wochen einmal komplett abgedeckt, spart aber
          # in jedem einzelnen Lauf ca. die Haelfte dieser Phase.
          _all_scan_repos = list(_repos_to_scan.items())
          _scan_chunk_idx = _iso_week % 2
          _repos_to_scan = dict(_all_scan_repos[_scan_chunk_idx::2])
          print(f"Extra-File-Scan-Rotation: Lauf #{_iso_week}, Chunk {_scan_chunk_idx+1}/2 "
                f"({len(_repos_to_scan)} von {len(_all_scan_repos)} bekannten Repos)")

          # Alle bereits registrierten URLs sammeln (Duplikat-Schutz)
          _registered_urls = {v.get("url", "") for v in approved_feeds.values()}
          _registered_files = {(v.get("repo",""), v.get("file",""))
                                for v in approved_feeds.values()}

          for _repo, _rmeta in _repos_to_scan.items():
              if _check_timeout("Extra-File-Scan"):
                  break

              _platform = _rmeta["platform"]
              _gl_id    = _rmeta["gl_id"]
              _gl_branch = _rmeta["gl_branch"]

              # Tree-Scan
              time.sleep(0.3)
              _tree_items = []
              if _platform == "gitlab" and _gl_id:
                  _gl_tree = gitlab_api(
                      f"/projects/{_gl_id}/repository/tree?recursive=true&per_page=100"
                  )
                  if _gl_tree and isinstance(_gl_tree, list):
                      _tree_items = [
                          {"path": item["path"], "size": item.get("size", 0)}
                          for item in _gl_tree
                          if item.get("type") == "blob"
                      ]
              else:
                  _gh_tree = gh_api(f"/repos/{_repo}/git/trees/HEAD?recursive=1")
                  if _gh_tree:
                      _tree_items = [
                          {"path": item["path"], "size": item.get("size", 0)}
                          for item in _gh_tree.get("tree", [])
                          if item.get("type") == "blob"
                      ]

              if not _tree_items:
                  continue

              _extra_repos_scanned += 1

              # IP-Dateien die noch nicht registriert sind.
              # Ausschluss: .deprecated, dev-tools/test*, backup, archive, sample
              # Ordner um Duplikat-Testdateien zu vermeiden (z.B. mitchellkrogza).
              _SKIP_PATH_PARTS = {
                  ".deprecated", "deprecated", "dev-tools", "test", "sample",
                  "example", "backup", "archive", "old", "legacy", "beta",
                  "_sample", "test1", "test2", "test3", "test4", "test5",
              }
              def _skip_path(path):
                  return any(part.lower() in _SKIP_PATH_PARTS
                             for part in path.split("/")[:-1])

              _new_files = [
                  item for item in _tree_items
                  if IP_FILE_PATTERNS.search(item["path"].split("/")[-1])
                  and (_repo, item["path"]) not in _registered_files
                  and not _skip_path(item["path"])
                  and not _is_non_threat_file(item["path"])
              ]

              if not _new_files:
                  continue

              print(f"  {_repo}: {len(_new_files)} neue IP-Datei(en) gefunden")

              for _nf in sorted(_new_files, key=lambda x: x["size"], reverse=True)[:15]:
                  if _check_timeout("Extra-File-Download"):
                      break

                  if _platform == "gitlab":
                      _nf_url = (f"https://gitlab.com/{_repo}/-/raw/{_gl_branch}/"
                                 f"{urllib.parse.quote(_nf['path'], safe='/')}")
                  else:
                      _nf_url = (f"https://raw.githubusercontent.com/{_repo}/"
                                 f"HEAD/{urllib.parse.quote(_nf['path'], safe='/')}")

                  if _nf_url in _registered_urls:
                      continue

                  # Frische der Datei pruefen (max. 30 Tage) – identisch zum
                  # Hauptpfad (Kriterium 1b). Ohne diesen Check nahm der
                  # Extra-File-Scan eingefrorene Aggregator-Dateien auf (z.B.
                  # cps_log4j.ipset, Stand Mai ~49d alt). Default 999 => bei
                  # fehlender/fehlerhafter Commit-Info wird die Datei verworfen
                  # (gleiche konservative Semantik wie im Hauptpfad).
                  # Vor dem Download, um veraltete Dateien nicht erst zu laden.
                  time.sleep(0.3)
                  _nf_file_days = 999
                  if _platform == "gitlab" and _gl_id:
                      _nf_commits = gitlab_api(
                          f"/projects/{_gl_id}/repository/commits"
                          f"?path={urllib.parse.quote(_nf['path'])}&per_page=1"
                      )
                      if _nf_commits and isinstance(_nf_commits, list) and _nf_commits:
                          _nf_cd = _nf_commits[0].get("committed_date", "")
                          try:
                              _nf_dt = datetime.strptime(
                                  _nf_cd[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                              _nf_file_days = (now - _nf_dt).days
                          except Exception:
                              pass
                  else:
                      _nf_commits = gh_api(
                          f"/repos/{_repo}/commits"
                          f"?path={urllib.parse.quote(_nf['path'])}&per_page=1"
                      )
                      if _nf_commits and isinstance(_nf_commits, list) and _nf_commits:
                          _nf_cd = (_nf_commits[0].get("commit", {})
                                    .get("committer", {}).get("date", ""))
                          try:
                              _nf_dt = datetime.strptime(
                                  _nf_cd[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                              _nf_file_days = (now - _nf_dt).days
                          except Exception:
                              pass
                  if _nf_file_days > 30:
                      print(f"    ⏭ {_nf['path']}: IP-Datei {_nf_file_days}d alt "
                            f"(>30) – uebersprungen")
                      continue

                  _nf_size = int(_nf.get("size", 0) or 0)
                  if _nf_size > MAX_FEED_DOWNLOAD_BYTES:
                      print(f"    ⏭ {_nf['path']}: {_nf_size:,} Bytes > "
                            f"{MAX_FEED_DOWNLOAD_BYTES:,} – uebersprungen")
                      continue
                  _nf_limit = (
                      MAX_FEED_DOWNLOAD_BYTES
                      if _nf_size <= 0
                      else min(MAX_FEED_DOWNLOAD_BYTES, _nf_size + 1024 * 1024)
                  )
                  time.sleep(0.3)
                  _nf_text = fetch_raw(
                      _nf_url, limit=_nf_limit,
                      timeout=40 if _nf_size > 8 * 1024 * 1024 else 25,
                  )
                  if not _nf_text:
                      continue

                  _nf_ips = extract_ips(_nf_text, _nf_url)
                  _nf_validation = _validate_individual_feed(
                      _nf_text, _nf_ips, _nf["path"], _nf_url,
                      detected_by=_nf.get("detected_by", "filename"),
                  )
                  if not _nf_validation["ok"]:
                      print(f"    ⏭ {_nf['path']}: {_nf_validation['reason']}")
                      continue

                  # Loop-Schutz: Wenn diese Datei inhaltlich identisch (gleicher
                  # IP-Fingerprint) zu einem bereits registrierten Feed DESSELBEN
                  # Repos ist, NICHT erneut aufnehmen. Sonst wuerde der end-of-run
                  # Fingerprint-Dedup sie loeschen und dieser Scan sie im naechsten
                  # Lauf wieder hinzufuegen → dieselbe Endlosschleife wie beim
                  # alten ip_count-Dedup. So wird die Dublette gar nicht erst
                  # registriert und der Loser bleibt stabil draussen.
                  _nf_fp = _ip_fingerprint(_nf_ips)
                  _nf_existing = _existing_feed_for_fingerprint(_nf_fp)
                  if _nf_existing:
                      print(f"    ⏭ {_nf['path']}: identische IP-Liste bereits "
                            f"als {_nf_existing} registriert "
                            f"(Fingerprint {_nf_fp}) – uebersprungen")
                      continue

                  # Feed-Name: repo_base + Dateiname-Stem
                  _name_base = re.sub(r'[^a-z0-9_]', '_',
                                      _repo.lower().replace('/', '_'))
                  _stem = re.sub(r'[^a-z0-9_]', '_',
                                 _nf["path"].split("/")[-1].rsplit(".", 1)[0].lower())
                  _nf_name = f"{_name_base}_{_stem}"
                  # Eindeutigkeit sicherstellen
                  _sfx = 2
                  while _nf_name in approved_feeds:
                      _nf_name = f"{_name_base}_{_stem}_v{_sfx}"
                      _sfx += 1

                  _is_new = _nf_name not in existing_feeds
                  approved_feeds[_nf_name] = {
                      "name":          _nf_name,
                      "url":           _nf_url,
                      "repo":          _repo,
                      "file":          _nf["path"],
                      "platform":      _platform,
                      "added":         now_day,
                      "last_checked":  now_day,
                      "ip_count":      len(_nf_ips),
                      "ip_fingerprint": _ip_fingerprint(_nf_ips),
                      "overlap_pct":   round(_nf_validation["overlap_pct"] * 100, 1),
                      "fp_rate":       round(_nf_validation["fp"] * 100, 2),
                      "rep_score":     _rmeta["rep_score"],
                      "stars":         _rmeta["stars"],
                      "days_old":      _rmeta["days_old"],
                      "search_sources": ["extra_file_scan"],
                      "hq":            False,
                  }
                  if _platform == "gitlab":
                      approved_feeds[_nf_name]["gl_id"]            = _gl_id
                      approved_feeds[_nf_name]["gl_default_branch"] = _gl_branch

                  _registered_urls.add(_nf_url)
                  _registered_files.add((_repo, _nf["path"]))

                  if _is_new:
                      all_new_ips.update(_nf_ips)
                  else:
                      all_known_ips.update(_nf_ips)
                  for _ip in _nf_ips:
                      ip_auto_feed_count[_ip] = ip_auto_feed_count.get(_ip, 0) + 1

                  evaluation_log.append({
                      "repo":        _repo,
                      "result":      "APPROVED",
                      "feed_name":   _nf_name,
                      "ips":         len(_nf_ips),
                      "new_feed":    _is_new,
                      "overlap_pct": round(_nf_validation["overlap_pct"] * 100, 1),
                      "fp_rate":     round(_nf_validation["fp"] * 100, 2),
                      "stars":       _rmeta["stars"],
                      "platform":    _platform,
                  })
                  _extra_found_total += 1
                  print(f"    ✅ {_nf_name}: {len(_nf_ips)} IPs ({_nf['path']})")

          print(f"Extra-File-Scan: {_extra_repos_scanned} Repos gescannt, "
                f"{_extra_found_total} neue Feed(s) hinzugefügt")

          # existing_repo_set nach Extra-Scan aktualisieren
          existing_repo_set = {v.get("repo") for v in approved_feeds.values() if v.get("repo")}


          # Timeout-Check vor aufwändiger Evaluations-Phase
          if _check_timeout("Pre-Evaluation"):
              _now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              _report_md = (
                  f"# Auto Feed Discovery – Report\n"
                  f"**Aktualisiert:** {_now_str}\n\n"
                  f"---\n\n"
                  f"## ⚠️ Abbruch: Timeout-Sicherheit\n\n"
                  f"*Evaluations-Phase abgebrochen um sauberen Exit vor dem 60min-Limit zu gewährleisten.*\n\n"
                  f"*Generiert: {_now_str}*\n"
              )
              write_text_atomic("reports/auto_feed_discovery_report.md", _report_md)
              print("reports/auto_feed_discovery_report.md geschrieben (Timeout-Report)")
              sys.exit(0)

          # FIX PERF-EVAL v2: Stratifizierte Kandidaten-Auswahl statt reines
          # Reputation-Ranking. Hintergrund (Mai 2026): Vorher wurden Top-120
          # nach stars*2+forks*3 gewählt - GitHub-Topic-Repos mit vielen Stars
          # dominierten. Folge: Aus 705 Awesome-Kandidaten und 37 GitLab-Repos
          # wurde im letzten Run 0 angenommen, weil keiner es in die Top-120
          # schaffte. Stratifizierung gibt jeder Quell-Klasse eigene Quote.
          #
          # Aufteilung (insgesamt EVAL_BUDGET=400):
          #   - GH_CODE: 60 Slots ausschliesslich fuer Code-Search-Treffer (NEU).
          #             Diese Kandidaten stammen aus filename:-Queries (z.B.
          #             "filename:blocklist.txt malicious ip") und matchen damit
          #             per Konstruktion IP_FILE_PATTERNS - hoechste Trefferquote
          #             fuer "IP-Datei vorhanden". Laeuft als Pool 0 ZUERST, damit
          #             diese Treffer nicht im Stars-/Pushed-Ranking untergehen.
          #   - GH_REP: Top-160 nach Reputation
          #   - AWESOME: 100 Slots ausschliesslich für Awesome-List-Kandidaten
          #   - GITLAB: 40 Slots ausschliesslich für GitLab-Kandidaten
          #   - GH_FRESH: 40 Slots nach Pushed-Datum aus Rest-GitHub (Code-Pool
          #              uebernimmt einen Teil dieser Aufgabe mit staerkerem
          #              Signal, daher von 80 auf 40 reduziert)
          # Bei zu wenig Kandidaten in einer Quote werden ungenutzte Slots
          # NICHT umverteilt - das wuerde den Reputation-Bias wiederherstellen.
          # FIX REACH-40MIN (2026-08-02): Quoten fuer die groessere
          # Suchreichweite (mehr Topics/Code-Queries/Owner) angehoben.
          # EVAL_BUDGET 400 -> 500. Der Dynamic-Cap-Fix (siehe
          # "EVAL-BUDGET-DYNAMIC" weiter unten) kappt die tatsaechliche
          # Eval-Liste bei Bedarf ohnehin auf die verbleibende Zeit - diese
          # Zahlen sind also obere Grenzen, kein garantierter Verbrauch.
          EVAL_BUDGET   = 500   # 80+200+120+40+60
          QUOTA_CODE    = 80    # war 60
          QUOTA_REP     = 200   # war 160
          QUOTA_AWESOME = 120   # war 100
          QUOTA_GITLAB  = 40    # unveraendert: nur ~70 GitLab-Kandidaten insgesamt vorhanden
          QUOTA_FRESH   = 60    # war 40

          def _is_awesome(meta):
              return any(s.startswith("awesome:") for s in meta.get("sources", []))

          def _is_code(meta):
              # Kandidat stammt (auch) aus einer Code-Search-Query (Tag "code:..."
              # via add_repo_candidate). filename:-Treffer matchen per
              # Konstruktion IP_FILE_PATTERNS -> hoechste Feed-Wahrscheinlichkeit.
              return any(s.startswith("code:") for s in meta.get("sources", []))

          def _is_gitlab(meta):
              return meta.get("platform") == "gitlab"

          def _rep_score(meta):
              return min(meta.get("stars", 0) * 2 + meta.get("forks", 0) * 3, 100)

          def _pushed_key(meta):
              # ISO-Datum sortiert lexikografisch korrekt; leere Werte ans Ende
              return meta.get("pushed", "") or "0000-00-00"

          _all_items_raw = list(candidate_repos.items())

          # NEU v4: Tool-Filter vor der Pool-Bildung. Spart API-Calls in der
          # teuren _evaluate_one-Phase (Tree-API + Commit-Date pro Kandidat).
          # Filter wird NICHT auf den Reputation-Pool angewendet - hochbewertete
          # Repos haben sich verdient richtig geprueft zu werden, auch wenn
          # die Heuristik sie als Tool einschaetzt. Schutz vor Falsch-Positiven
          # bei beruehmten Maintainern.
          #
          # v4.1: Aber: Hard-Reject (z.B. "awesome-" im Namen) greift IMMER -
          # auch fuer hochbewertete Repos. Eine Awesome-Liste mit 9000 Stars
          # ist trotzdem keine IP-Liste, und die teure Tree-API-Abfrage waere
          # garantiert verschwendet.
          _tool_filtered_count = 0
          _hard_reject_count   = 0
          _skipped_known_pre   = 0
          _all_items = []
          for k, v in _all_items_raw:
              name_lc = (v.get("full_name") or v.get("gl_path") or "").lower()
              # Hard-Reject: greift unabhaengig vom Reputation-Score
              if any(pat in name_lc for pat in _HARD_REJECT_NAME_PATTERNS):
                  _hard_reject_count += 1
                  _tool_filtered_count += 1
                  continue
              # FIX EVAL-BUDGET: Bereits rejected/known/approved Repos VOR der
              # Pool-Bildung rausfiltern. Frueher belegten sie Eval-Slots und
              # wurden von _evaluate_one nur per `return None` sofort wieder
              # uebersprungen - im letzten Run gingen so 211 von 240 Slots leer
              # aus (nur 36 echte Evaluierungen). Jetzt fliessen alle Slots in
              # noch nicht getestete Kandidaten. Skip-Logik identisch zu der in
              # _evaluate_one (rejected_repos enthaelt bereits KNOWN_REPOS).
              _full = v.get("full_name", "") or k
              _reject_key = f"gitlab:{v.get('gl_path', '')}" if _is_gitlab(v) else _full
              if (k in rejected_repos or _reject_key in rejected_repos
                      or _full in rejected_repos
                      or k in existing_repo_set or _full in existing_repo_set):
                  _skipped_known_pre += 1
                  continue
              # Reputation-Pool-Kandidaten umgehen die Punkte-Heuristik
              # (aber Hard-Reject oben hat schon gegriffen, falls relevant).
              # NEU: Code-Search-Treffer (code:) umgehen den Tool-Filter ebenfalls
              # - ein filename:-Match ist ein staerkeres Signal als die
              # Namens-Heuristik, sonst wuerden kleine Feeds mit 0 Stars hier
              # faelschlich als "Tool" aussortiert.
              if (not _is_gitlab(v) and not _is_awesome(v)
                      and (_rep_score(v) >= 20 or _is_code(v))):
                  _all_items.append((k, v))
                  continue
              # Awesome/GitLab/Fresh: Tool-Filter aktiv
              if _looks_like_tool_not_list(v):
                  _tool_filtered_count += 1
                  continue
              _all_items.append((k, v))
          print(f"Tool-Filter: {_tool_filtered_count} mutmassliche Tools/Libraries "
                f"aussortiert (davon {_hard_reject_count} via Hard-Reject) "
                f"von {len(_all_items_raw)} Kandidaten, Rest: {len(_all_items)}")
          print(f"Pre-Filter bekannt/rejected/approved: {_skipped_known_pre} Repos "
                f"uebersprungen (Eval-Budget bleibt fuer frische Kandidaten frei)")

          _picked_keys = set()
          _sorted_candidates = []

          # Pool 0: Code-Search-Treffer (code:-Tag). Hoechste Prioritaet, weil
          # diese Kandidaten aus filename:-Queries stammen und damit per
          # Konstruktion eine IP_FILE_PATTERNS-passende Datei besitzen -> die
          # mit Abstand hoechste Trefferquote fuer "IP-Datei vorhanden". Wird
          # ZUERST gezogen, sortiert nach Pushed-Datum (frischere zuerst),
          # damit sie nicht im Stars-Ranking der anderen Pools untergehen.
          _code_pool = [
              (k, v) for k, v in _all_items
              if _is_code(v) and not _is_gitlab(v) and not _is_awesome(v)
          ]
          _code_pool.sort(key=lambda x: _pushed_key(x[1]), reverse=True)
          _code_added = 0
          for k, v in _code_pool[:QUOTA_CODE]:
              if k not in _picked_keys:
                  _sorted_candidates.append((k, v))
                  _picked_keys.add(k)
                  _code_added += 1

          # Pool 1: Top-Reputation aus GitHub (Awesome und GitLab ausgeschlossen,
          # damit deren Quote nicht doppelt zaehlt)
          _rep_pool = [
              (k, v) for k, v in _all_items
              if not _is_gitlab(v) and not _is_awesome(v)
          ]
          _rep_pool.sort(key=lambda x: _rep_score(x[1]), reverse=True)
          for k, v in _rep_pool[:QUOTA_REP]:
              if k not in _picked_keys:
                  _sorted_candidates.append((k, v))
                  _picked_keys.add(k)

          # Pool 2: Awesome-List-Kandidaten (typischerweise stars=0, sortiert
          # nach Pushed-Datum - frischere Repos zuerst)
          _aw_pool = [
              (k, v) for k, v in _all_items
              if _is_awesome(v) and k not in _picked_keys
          ]
          _aw_pool.sort(key=lambda x: _pushed_key(x[1]), reverse=True)
          _aw_added = 0
          for k, v in _aw_pool[:QUOTA_AWESOME]:
              _sorted_candidates.append((k, v))
              _picked_keys.add(k)
              _aw_added += 1

          # Pool 3: GitLab-Kandidaten (eigene Quote, da Stars dort generell
          # niedriger sind und sie sonst nie evaluiert wuerden)
          _gl_pool = [
              (k, v) for k, v in _all_items
              if _is_gitlab(v) and k not in _picked_keys
          ]
          _gl_pool.sort(
              key=lambda x: (_rep_score(x[1]), _pushed_key(x[1])),
              reverse=True
          )
          _gl_added = 0
          for k, v in _gl_pool[:QUOTA_GITLAB]:
              _sorted_candidates.append((k, v))
              _picked_keys.add(k)
              _gl_added += 1

          # Pool 4: Frische GitHub-Repos die nicht ins Reputation-Top-120 kamen
          # - oft kleine, junge Feeds, die im normalen Ranking untergehen
          #
          # FIX QUOTA-REDISTRIBUTE (2026-07-31): Ungenutzte Slots aus dem
          # Code-Pool (z.B. wenn der Wochen-Chunk wenig Treffer hatte) und dem
          # GitLab-Pool (nur ~70 GitLab-Kandidaten insgesamt vorhanden, Quote
          # von 40 selten voll) verfallen NICHT mehr, sondern werden an den
          # Fresh-Pool weitergereicht. Bewusst NUR an Fresh (nicht an den
          # Reputation-Pool) - beide bevorzugen frische statt bekannte Repos,
          # das urspruengliche Ziel der Stratifizierung (kein Reputations-
          # Bias) bleibt damit erhalten, nur totes Budget wird genutzt.
          _quota_fresh_effective = (
              QUOTA_FRESH + max(0, QUOTA_CODE - _code_added) + max(0, QUOTA_GITLAB - _gl_added)
          )
          _fresh_pool = [
              (k, v) for k, v in _all_items
              if not _is_gitlab(v) and not _is_awesome(v)
              and k not in _picked_keys
          ]
          _fresh_pool.sort(key=lambda x: _pushed_key(x[1]), reverse=True)
          _fresh_added = 0
          for k, v in _fresh_pool[:_quota_fresh_effective]:
              _sorted_candidates.append((k, v))
              _picked_keys.add(k)
              _fresh_added += 1

          # FIX EVAL-BUDGET-DYNAMIC (2026-08-01): Beobachtet in einem Lauf, der
          # vom harten 30-Minuten-Job-Limit abgebrochen wurde (##[error] The
          # operation was canceled), OHNE dass Report oder State ueberhaupt
          # geschrieben wurden. Ursache: Die Eval-Phase (blockierender
          # ThreadPoolExecutor.map()-Aufruf) startete zu spaet, mitten im
          # internen 26-Minuten-Cutoff - da dieser Aufruf erst zurueckkehrt,
          # wenn ALLE Worker fertig sind, konnte _check_timeout() innerhalb
          # einzelner _evaluate_one-Aufrufe den bereits laufenden Block nicht
          # mehr stoppen. Fix: Kandidatenliste HIER, VOR dem blockierenden
          # Aufruf, dynamisch auf die tatsaechlich verbleibende Zeit kappen
          # (konservative Schaetzung 1,5s/Kandidat bei 4 Workern, plus 90s
          # Sicherheitspuffer fuer Report-Schreiben/State-Save/Commit danach).
          # Prioritaet bleibt gewahrt, da Pools in Prioritaetsreihenfolge
          # angehaengt wurden (Code > Rep > Awesome > GitLab > Fresh) - eine
          # Kappung am Ende trifft zuerst die niedrigst priorisierten
          # Fresh-Kandidaten, nicht die wertvollen Code-/Rep-Pool-Treffer.
          _ESTIMATED_SECONDS_PER_EVAL_CANDIDATE = 1.5
          _EVAL_PHASE_SAFETY_BUFFER_SECONDS = 90
          _elapsed_before_eval = time.time() - _JOB_START
          _remaining_before_cutoff = _MAX_RUNTIME_SECONDS - _elapsed_before_eval
          _eval_time_budget = max(0, _remaining_before_cutoff - _EVAL_PHASE_SAFETY_BUFFER_SECONDS)
          _max_candidates_fitting = int(_eval_time_budget / _ESTIMATED_SECONDS_PER_EVAL_CANDIDATE)
          _dynamic_cap_applied = False
          if len(_sorted_candidates) > _max_candidates_fitting:
              _dynamic_cap_applied = True
              _capped_at = max(20, _max_candidates_fitting)
              print(
                  f"WARNUNG EVAL-BUDGET-DYNAMIC: Nur noch {_remaining_before_cutoff:.0f}s bis "
                  f"internem Cutoff ({_elapsed_before_eval:.0f}s bereits durch Discovery-/"
                  f"Refresh-Phasen verbraucht) - Eval-Liste von {len(_sorted_candidates)} auf "
                  f"{_capped_at} gekappt, damit Report/State/Commit garantiert noch Zeit haben."
              )
              _sorted_candidates = _sorted_candidates[:_capped_at]

          print(
              f"Stratifizierte Auswahl aus {len(candidate_repos)} Kandidaten:\n"
              f"  Code-Search-Pool (GH):    {_code_added} (von {len(_code_pool)} verfuegbar)\n"
              f"  Reputation-Pool (GH):     {min(QUOTA_REP, len(_rep_pool))}\n"
              f"  Awesome-Pool:             {_aw_added} (von {len(_aw_pool)} verfuegbar)\n"
              f"  GitLab-Pool:              {_gl_added} (von {len(_gl_pool)} verfuegbar)\n"
              f"  Fresh-Pool (GH):          {_fresh_added} (von {len(_fresh_pool)} verfuegbar, "
              f"Quote {_quota_fresh_effective} = {QUOTA_FRESH} Basis + "
              f"{_quota_fresh_effective - QUOTA_FRESH} umverteilt von Code/GitLab)\n"
              f"  → EVAL-Total:             {len(_sorted_candidates)} (Budget {EVAL_BUDGET}"
              f"{', dynamisch gekappt wegen Zeitbudget' if _dynamic_cap_applied else ''})"
          )

          _eval_lock = _threading.Lock()

          def _evaluate_one(args):
              full_name, meta = args
              # FIX TIMEOUT-EVAL: Da die Eval-Phase jetzt mit echten Kandidaten
              # gefuellt ist (statt grossteils leerlaufender Rejects), kann sie
              # deutlich laenger dauern. Greift die globale Laufzeit-Sicherung,
              # geben wir hier sauber None zurueck statt weiter API-Calls zu
              # feuern - so bleibt Zeit fuer Report + Commit (if: always).
              if _check_timeout("Eval-Phase"):
                  return None
              _platform = meta.get("platform", "github")
              _gl_path   = meta.get("gl_path", "")
              _gl_id     = meta.get("gl_id")
              _gl_branch = meta.get("gl_default_branch", "main")

              # Für GitLab: rejected_repos nutzt "gitlab:namespace/project"-Keys
              _reject_key = f"gitlab:{_gl_path}" if _platform == "gitlab" else full_name
              if _reject_key in rejected_repos:
                  return None
              if full_name in rejected_repos:
                  return None
              if full_name in existing_repo_set:
                  return None

              _log_lines = [f"\nBewerte [{_platform.upper()}]: {full_name}"]

              # Kriterium 1: Aktualität (letzter Push max. 30 Tage)
              pushed_str = meta.get("pushed", "")
              try:
                  pushed_dt = datetime.strptime(
                      pushed_str[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                  days_old = (now - pushed_dt).days
              except Exception:
                  days_old = None  # unbekannt - siehe Live-Nachladung unten

              if days_old is None and _platform == "github":
                  # FIX CODE-SEARCH-PUSHED-MISSING (2026-07-31): Verifiziert gegen
                  # die offizielle GitHub-Doku (docs.github.com/en/rest/search/search
                  # #search-code) - das eingebettete "repository"-Objekt der
                  # /search/code-Antwort enthaelt KEIN pushed_at (und auch kein
                  # stargazers_count/forks_count/topics/language). Seit Code-Search
                  # tatsaechlich laeuft (vorheriger Fix), wurden dadurch alle
                  # Code-Search-Kandidaten hier faelschlich als "999 Tage alt"
                  # abgelehnt, noch bevor ihr Inhalt geprueft wurde (im Report vom
                  # 31.07. betraf das 58 von 300 Kandidaten). Statt das als "zu alt"
                  # zu werten, wird das echte Datum per einzelnem, guenstigem
                  # REST-Call nachgeladen (normales 5000/h-Limit, NICHT das enge
                  # Search-Limit) - nur fuer den kleinen Anteil an Kandidaten ohne
                  # brauchbares pushed-Feld, keine Mehrkosten fuer den Regelfall.
                  _repo_meta = gh_api(f"/repos/{full_name}")
                  if _repo_meta and _repo_meta.get("pushed_at"):
                      try:
                          pushed_dt = datetime.strptime(
                              _repo_meta["pushed_at"][:10], "%Y-%m-%d"
                          ).replace(tzinfo=timezone.utc)
                          days_old = (now - pushed_dt).days
                          # Stars/Forks fehlten aus demselben Grund evtl. auch -
                          # gleich mit auffrischen, damit Reputation/Tool-Filter
                          # spaeter nicht auf 0 statt echtem Wert basieren.
                          meta["stars"] = _repo_meta.get("stargazers_count", meta.get("stars", 0))
                          meta["forks"] = _repo_meta.get("forks_count", meta.get("forks", 0))
                          _log_lines.append(
                              f"  ℹ pushed_at fehlte (Code-Search-Herkunft) – "
                              f"per API nachgeladen: {days_old} Tage alt"
                          )
                      except Exception:
                          days_old = 999
                  else:
                      days_old = 999
              elif days_old is None:
                  days_old = 999

              if days_old > 30:
                  _log_lines.append(f"  ❌ Aktualität: {days_old} Tage alt (max. 30)")
                  return {"action": "reject", "repo": _reject_key,
                          "reason": f"Zu alt: {days_old}d", "logs": _log_lines,
                          "platform": _platform}

              # Für Awesome-List-Kandidaten: pushed=today als Platzhalter gesetzt,
              # tatsächliche Aktualität wird hier per API verifiziert.
              _log_lines.append(f"  ✅ Aktualität: {days_old} Tage alt")

              # IP-Dateien im Repo suchen (plattformabhängig)
              time.sleep(0.5)
              all_blob_files = []

              if _platform == "gitlab" and _gl_id:
                  _gl_tree = gitlab_api(
                      f"/projects/{_gl_id}/repository/tree?recursive=true&per_page=100"
                  )
                  if _gl_tree and isinstance(_gl_tree, list):
                      all_blob_files = [
                          {"path": item["path"], "size": item.get("size", 0)}
                          for item in _gl_tree
                          if item.get("type") == "blob"
                      ]
              else:
                  tree = gh_api(f"/repos/{full_name}/git/trees/HEAD?recursive=1")
                  if tree:
                      all_blob_files = [
                          {"path": item["path"], "size": item.get("size", 0)}
                          for item in tree.get("tree", [])
                          if item.get("type") == "blob"
                      ]

              ip_files = [
                  item for item in all_blob_files
                  if IP_FILE_PATTERNS.search(item["path"].split("/")[-1])
                  and not _is_non_threat_file(item["path"])
              ]
              for item in ip_files:
                  item["detected_by"] = "filename"

              def _raw_url_for_path(path):
                  if _platform == "gitlab":
                      return (f"https://gitlab.com/{_gl_path}/-/raw/{_gl_branch}/"
                              f"{urllib.parse.quote(path, safe='/')}")
                  return (f"https://raw.githubusercontent.com/{full_name}/"
                          f"HEAD/{urllib.parse.quote(path, safe='/')}")

              # CONTENT-SNIFF-FALLBACK: Nur wenn der bisherige Dateinamenweg
              # gar nichts gefunden hat. Maximal sechs textartige Kandidaten,
              # je 1 MiB Stichprobe. So bleibt Laufzeit/API-Budget kontrolliert.
              if not ip_files:
                  sniff_candidates = [
                      item for item in all_blob_files
                      if _is_content_sniff_candidate(item)
                  ]
                  sniff_candidates.sort(
                      key=lambda x: (int(x.get("size", 0) or 0), x.get("path", "")),
                      reverse=True,
                  )
                  if sniff_candidates:
                      _log_lines.append(
                          f"  ℹ Kein Dateinamen-Treffer – Content-Sniffing "
                          f"von max. {CONTENT_SNIFF_MAX_FILES} Kandidaten"
                      )

                  for candidate in sniff_candidates[:CONTENT_SNIFF_MAX_FILES]:
                      if _check_timeout("Content-Sniffing"):
                          break
                      candidate_url = _raw_url_for_path(candidate["path"])
                      sample = fetch_raw(
                          candidate_url,
                          limit=CONTENT_SNIFF_SAMPLE_LIMIT,
                          timeout=12,
                          allow_partial=True,
                      )
                      if not sample:
                          _log_lines.append(
                              f"  ⚠ Content-Sniff Download fehlgeschlagen: "
                              f"{candidate['path']}"
                          )
                          continue
                      profile = _content_profile(sample, candidate_url)
                      _log_lines.append(
                          f"  {'✅' if profile['looks_like_feed'] else '↪'} "
                          f"Content-Sniff {candidate['path']}: "
                          f"{profile['unique_ips']} IPs, "
                          f"{profile['ip_line_ratio']:.1%} IP-Zeilen, "
                          f"{profile['threat_lines']} Threat-Zeilen – "
                          f"{profile['reason']}"
                      )
                      if profile["looks_like_feed"]:
                          selected = dict(candidate)
                          selected.update({
                              "detected_by": "content",
                              "sniff_unique_ips": profile["unique_ips"],
                              "sniff_ip_ratio": profile["ip_line_ratio"],
                          })
                          ip_files.append(selected)

              if not ip_files:
                  _log_lines.append(
                      "  ❌ Keine IP-Datei per Dateiname oder Inhalt gefunden"
                  )
                  return {"action": "reject", "repo": _reject_key,
                          "reason": "Keine IP-Datei (Name/Inhalt)", "logs": _log_lines,
                          "platform": _platform}

              # Bei Content-Treffern gewinnt die groesste Stichproben-IP-Menge;
              # beim bisherigen Dateinamenpfad bleibt die Groessenprioritaet.
              ip_files.sort(
                  key=lambda x: (
                      int(x.get("sniff_unique_ips", 0) or 0),
                      int(x.get("size", 0) or 0),
                  ),
                  reverse=True,
              )
              best_file = ip_files[0]
              raw_url = _raw_url_for_path(best_file["path"])

              _clone_check_name = re.sub(r'[^a-z0-9_]', '_', full_name.lower().replace('/', '_'))
              if _is_blocked_clone_feed(
                  name=_clone_check_name,
                  repo=full_name,
                  file_path=best_file.get("path", ""),
                  url=raw_url,
              ):
                  _log_lines.append(
                      f"  ❌ Bekannter Mirror-/Klon-Feed blockiert: {best_file['path']}"
                  )
                  return {"action": "reject", "repo": _reject_key,
                          "reason": "Bekannter Mirror-/Klon-Feed",
                          "logs": _log_lines, "platform": _platform}

              detection_label = (
                  "Inhalt" if best_file.get("detected_by") == "content"
                  else "Dateiname"
              )
              _log_lines.append(
                  f"  Datei: {best_file['path']} ({best_file['size']:,} Bytes, "
                  f"erkannt über {detection_label})"
              )

              # Kriterium 1b: Aktualität der IP-Datei selbst (max. 30 Tage)
              time.sleep(0.5)
              file_days_old = 999
              if _platform == "gitlab" and _gl_id:
                  _gl_commits = gitlab_api(
                      f"/projects/{_gl_id}/repository/commits"
                      f"?path={urllib.parse.quote(best_file['path'])}&per_page=1"
                  )
                  if _gl_commits and isinstance(_gl_commits, list) and _gl_commits:
                      _date_str = _gl_commits[0].get("committed_date", "")
                      try:
                          _file_dt = datetime.strptime(
                              _date_str[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                          file_days_old = (now - _file_dt).days
                      except Exception:
                          pass
              else:
                  file_commits = gh_api(
                      f"/repos/{full_name}/commits"
                      f"?path={urllib.parse.quote(best_file['path'])}&per_page=1"
                  )
                  if file_commits and isinstance(file_commits, list) and file_commits:
                      file_date_str = (file_commits[0].get("commit", {})
                                       .get("committer", {}).get("date", ""))
                      try:
                          file_dt = datetime.strptime(
                              file_date_str[:10], "%Y-%m-%d").replace(tzinfo=timezone.utc)
                          file_days_old = (now - file_dt).days
                      except Exception:
                          pass

              if file_days_old > 30:
                  _log_lines.append(f"  ❌ IP-Datei veraltet: {file_days_old} Tage "
                                    f"(Repo-Push frisch, aber Blocklist stale)")
                  return {"action": "reject", "repo": _reject_key,
                          "reason": f"IP-Datei {file_days_old}d alt", "logs": _log_lines,
                          "platform": _platform}
              _log_lines.append(f"  ✅ IP-Datei frisch: {file_days_old} Tage alt")

              time.sleep(0.5)
              file_size = int(best_file.get("size", 0) or 0)
              if file_size > MAX_FEED_DOWNLOAD_BYTES:
                  _log_lines.append(
                      f"  ❌ Feed-Datei zu gross: {file_size:,} Bytes "
                      f"(max. {MAX_FEED_DOWNLOAD_BYTES:,})"
                  )
                  return {"action": "reject", "repo": _reject_key,
                          "reason": "Feed-Datei zu gross", "logs": _log_lines,
                          "platform": _platform}
              # Fuer alle Erkennungswege vollstaendig laden. Bei bekannter
              # Blob-Groesse reicht Datei + 1 MiB Reserve; unbekannte GitLab-
              # Groessen nutzen das harte 64-MiB-Limit.
              fetch_limit = (
                  MAX_FEED_DOWNLOAD_BYTES
                  if file_size <= 0
                  else min(MAX_FEED_DOWNLOAD_BYTES, file_size + 1024 * 1024)
              )
              fetch_timeout = 40 if file_size > 8 * 1024 * 1024 else 25

              text = fetch_raw(
                  raw_url,
                  limit=fetch_limit,
                  timeout=fetch_timeout,
              )
              if not text:
                  _log_lines.append("  ❌ Download fehlgeschlagen")
                  return {"action": "reject", "repo": _reject_key,
                          "reason": "Download-Fehler", "logs": _log_lines,
                          "platform": _platform}

              ips = extract_ips(text, raw_url)
              full_content_profile = _content_profile(text, raw_url)

              # Kriterium 2: Groesse (100 – 2.000.000 IPs)
              if not (MIN_FEED_IPS <= len(ips) <= MAX_FEED_IPS):
                  _log_lines.append(
                      f"  ❌ Größe: {len(ips)} IPs "
                      f"(erwartet {MIN_FEED_IPS:,}–{MAX_FEED_IPS:,})"
                  )
                  return {"action": "reject", "repo": _reject_key,
                          "reason": f"Größe: {len(ips)} IPs", "logs": _log_lines,
                          "platform": _platform}
              _log_lines.append(f"  ✅ Größe: {len(ips)} IPs")

              # Kriterium 3: False-Positive-Rate (max. 5%)
              fp = fp_rate(ips)
              if fp > 0.05:
                  _log_lines.append(f"  ❌ False-Positive-Rate: {fp:.1%} (max. 5%)")
                  return {"action": "reject", "repo": _reject_key,
                          "reason": f"FP-Rate: {fp:.1%}", "logs": _log_lines,
                          "platform": _platform}
              _log_lines.append(f"  ✅ False-Positive-Rate: {fp:.1%}")

              # Kriterium 3b: Whitelist-Inhalt prüfen – wenn der Dateiname
              # nicht schon rausgefiltert wurde, check ob der Datei-Pfad
              # whitelist-typische Begriffe enthält.
              _file_path_lc = best_file["path"].lower()
              if WHITELIST_FILE_RE.search(_file_path_lc):
                  _log_lines.append(f"  ❌ Whitelist-Dateiname: {best_file['path']}")
                  return {"action": "reject", "repo": _reject_key,
                          "reason": "Whitelist-Datei", "logs": _log_lines,
                          "platform": _platform}

              # Kriterium 3c: Geo-/Laender-Allokationsliste verwerfen (keine
              # Bedrohungsliste, sondern alle IPs eines Landes/Kontinents).
              if GEO_FILE_RE.search(_file_path_lc):
                  _log_lines.append(f"  ❌ Geo-/Laenderliste: {best_file['path']}")
                  return {"action": "reject", "repo": _reject_key,
                          "reason": "Geo-/Laenderliste", "logs": _log_lines,
                          "platform": _platform}

              # Kriterium 3d: Redundante Aggregator-Subliste eines bereits
              # direkt gezogenen Upstreams verwerfen (verhindert Score-Drift
              # durch Mehrfachzaehlung derselben Quelle).
              if REDUNDANT_FEED_RE.search(_file_path_lc):
                  _log_lines.append(f"  ❌ Redundanter Upstream (schon in SOURCES): {best_file['path']}")
                  return {"action": "reject", "repo": _reject_key,
                          "reason": "Redundanter Upstream", "logs": _log_lines,
                          "platform": _platform}
              if NON_THREAT_INFRA_FILE_RE.search(_file_path_lc):
                  _log_lines.append(
                      f"  ❌ Legitime Infrastruktur-/Providerliste: {best_file['path']}"
                  )
                  return {"action": "reject", "repo": _reject_key,
                          "reason": "Legitime Infrastruktur-Datei", "logs": _log_lines,
                          "platform": _platform}

              # Kriterium 4: Overlap mit HQ-Feeds (min. 20% oder 50 IPs, max. 95%)
              if hq_ref_ready:
                  overlap     = len(ips & hq_ref_ips)
                  overlap_pct = overlap / len(ips) if ips else 0
                  if overlap_pct < 0.20 and overlap < 50:
                      _log_lines.append(f"  ❌ Overlap: {overlap_pct:.1%} / {overlap} IPs (min. 20% oder 50)")
                      return {"action": "reject", "repo": _reject_key,
                              "reason": f"Overlap zu gering: {overlap_pct:.1%}", "logs": _log_lines,
                              "platform": _platform}
                  if overlap_pct > 0.95:
                      # Ein Roh-Eventlog mit Connection-/Auth-/Disconnect-
                      # Ereignissen ist trotz hoher Ueberschneidung kein
                      # kopierter Feed. Gerade kleine Honeypots melden fast nur
                      # bereits bekannte AbuseIPDB-Angreifer. Die Ausnahme gilt
                      # ausschliesslich fuer inhalts-erkanntes Threat-Log;
                      # neutrale Plain-IP-Listen bleiben beim 95%-Klon-Gate.
                      _is_independent_threat_log = (
                          best_file.get("detected_by") == "content"
                          and full_content_profile.get("looks_like_feed", False)
                          and full_content_profile.get("plain_line_ratio", 0.0) < 0.70
                          and full_content_profile.get("threat_lines", 0) >= 3
                          and full_content_profile.get("ip_line_ratio", 0.0) >= 0.30
                      )
                      if not _is_independent_threat_log:
                          _log_lines.append(f"  ❌ Overlap zu hoch: {overlap_pct:.1%} (max. 95% - reiner Klon)")
                          return {"action": "reject", "repo": _reject_key,
                                  "reason": f"Klon-Verdacht: {overlap_pct:.1%}", "logs": _log_lines,
                                  "platform": _platform}
                      _log_lines.append(
                          f"  ⚠ Hoher Overlap {overlap_pct:.1%}, aber als "
                          f"eigenstaendiges Threat-/Honeypot-Eventlog erkannt"
                      )
                  _log_lines.append(f"  ✅ Overlap mit HQ-Feeds: {overlap_pct:.1%} ({overlap} IPs)")
              else:
                  overlap_pct = 0
                  overlap     = 0

              # Kriterium 5: Format-Qualitaet (min. 30% IP-Zeilen)
              # Bei wiederholenden Honeypot-Logs darf nicht
              # ``eindeutige IPs / eindeutige Zeilen`` allein entscheiden:
              # dieselbe Angreifer-IP erscheint legitim in mehreren Events.
              # Deshalb wird zusaetzlich der Anteil IP-tragender Zeilen genutzt.
              ip_ratio, legacy_ip_ratio, line_ip_ratio = _format_quality(
                  text, ips, raw_url, profile=full_content_profile
              )
              if ip_ratio < 0.30:
                  _log_lines.append(
                      f"  ❌ Format-Qualitaet: {ip_ratio:.1%} (min. 30%; "
                      f"Unique-IP/Zeilen {legacy_ip_ratio:.1%}, "
                      f"IP-tragende Zeilen {line_ip_ratio:.1%})"
                  )
                  return {"action": "reject", "repo": _reject_key,
                          "reason": f"Format: {ip_ratio:.1%}", "logs": _log_lines,
                          "platform": _platform}
              _log_lines.append(
                  f"  ✅ Format-Qualitaet: {ip_ratio:.1%} "
                  f"(Unique-IP/Zeilen {legacy_ip_ratio:.1%}, "
                  f"IP-tragende Zeilen {line_ip_ratio:.1%})"
              )

              stars     = meta.get("stars", 0)
              forks     = meta.get("forks", 0)
              rep_score = min(stars * 2 + forks * 3, 100)
              _log_lines.append(f"  ⭐ Reputation: {stars} Stars / {forks} Forks → Score {rep_score} [{_platform}]")

              # ── Multi-File: weitere IP-Dateien aus demselben Repo ────────
              # Repo-Vertrauen wird NICHT auf jede Datei vererbt. Jede Extra-Datei
              # muss Groesse, Nicht-Threat-Pfad, FP-Rate, HQ-Overlap, Format und
              # Aktualitaet eigenstaendig bestehen. Dadurch gelangen Provider-
              # oder Privacy-Listen aus gemischten Repos nicht in die Blocklist.
              # Max. 15 Extra-Dateien pro Repo (Schutz gegen zu breite Repos).
              MAX_EXTRA_FILES = 15
              extra_files = []
              _extra_candidates = [f for f in ip_files[1:] if f != best_file][:MAX_EXTRA_FILES]
              for _ef in _extra_candidates:
                  if _platform == "gitlab":
                      _ef_url = (f"https://gitlab.com/{_gl_path}/-/raw/{_gl_branch}/"
                                 f"{urllib.parse.quote(_ef['path'], safe='/')}")
                  else:
                      _ef_url = (f"https://raw.githubusercontent.com/{full_name}/"
                                 f"HEAD/{urllib.parse.quote(_ef['path'], safe='/')}")
                  _ef_size = int(_ef.get("size", 0) or 0)
                  if _ef_size > MAX_FEED_DOWNLOAD_BYTES:
                      _log_lines.append(
                          f"  ⚠ Extra-Datei zu gross ({_ef_size:,} Bytes): {_ef['path']}"
                      )
                      continue
                  _ef_limit = (
                      MAX_FEED_DOWNLOAD_BYTES
                      if _ef_size <= 0
                      else min(MAX_FEED_DOWNLOAD_BYTES, _ef_size + 1024 * 1024)
                  )
                  _ef_timeout = 40 if _ef_size > 8 * 1024 * 1024 else 25
                  _ef_text = fetch_raw(
                      _ef_url,
                      limit=_ef_limit,
                      timeout=_ef_timeout,
                  )
                  if not _ef_text:
                      _log_lines.append(f"  ⚠ Extra-Datei Download fehlgeschlagen: {_ef['path']}")
                      continue
                  _ef_ips = extract_ips(_ef_text, _ef_url)
                  _ef_validation = _validate_individual_feed(
                      _ef_text, _ef_ips, _ef["path"], _ef_url,
                      detected_by=_ef.get("detected_by", "filename"),
                  )
                  if not _ef_validation["ok"]:
                      _log_lines.append(
                          f"  ⚠ Extra-Datei verworfen ({_ef_validation['reason']}): "
                          f"{_ef['path']}"
                      )
                      continue

                  # Aktualitaet jeder Extra-Datei separat pruefen.
                  _ef_file_days = 999
                  time.sleep(0.2)
                  if _platform == "gitlab" and _gl_id:
                      _ef_commits = gitlab_api(
                          f"/projects/{_gl_id}/repository/commits"
                          f"?path={urllib.parse.quote(_ef['path'])}&per_page=1"
                      )
                      if _ef_commits and isinstance(_ef_commits, list):
                          _ef_date = _ef_commits[0].get("committed_date", "")
                      else:
                          _ef_date = ""
                  else:
                      _ef_commits = gh_api(
                          f"/repos/{full_name}/commits"
                          f"?path={urllib.parse.quote(_ef['path'])}&per_page=1"
                      )
                      if _ef_commits and isinstance(_ef_commits, list):
                          _ef_date = (_ef_commits[0].get("commit", {})
                                      .get("committer", {}).get("date", ""))
                      else:
                          _ef_date = ""
                  try:
                      _ef_dt = datetime.strptime(
                          _ef_date[:10], "%Y-%m-%d"
                      ).replace(tzinfo=timezone.utc)
                      _ef_file_days = (now - _ef_dt).days
                  except Exception:
                      pass
                  if _ef_file_days > 30:
                      _log_lines.append(
                          f"  ⚠ Extra-Datei veraltet ({_ef_file_days}d): {_ef['path']}"
                      )
                      continue

                  extra_files.append({
                      "file":          _ef["path"],
                      "url":           _ef_url,
                      "ips":           _ef_ips,
                      "size":          _ef["size"],
                      "fp":            _ef_validation["fp"],
                      "overlap_pct":   _ef_validation["overlap_pct"],
                      "overlap":       _ef_validation["overlap"],
                      "ip_ratio":      _ef_validation["ip_ratio"],
                      "file_days_old": _ef_file_days,
                  })
                  _log_lines.append(
                      f"  ✅ Extra-Datei: {_ef['path']} ({len(_ef_ips)} IPs, "
                      f"Overlap {_ef_validation['overlap_pct']:.1%}, "
                      f"FP {_ef_validation['fp']:.1%})"
                  )

              if extra_files:
                  _log_lines.append(f"  → {len(extra_files)} Extra-Datei(en) aus demselben Repo")

              return {
                  "action":      "approve",
                  "repo":        _reject_key,
                  "repo_display": full_name,
                  "meta":        meta,
                  "best_file":   best_file,
                  "raw_url":     raw_url,
                  "ips":         ips,
                  "fp":          fp,
                  "overlap_pct": overlap_pct,
                  "overlap":     overlap,
                  "ip_ratio":    ip_ratio,
                  "stars":       stars,
                  "forks":       forks,
                  "rep_score":   rep_score,
                  "days_old":    days_old,
                  "file_days_old": file_days_old,
                  "platform":    _platform,
                  "gl_path":     _gl_path,
                  "gl_id":       _gl_id,
                  "gl_branch":   _gl_branch,
                  "logs":        _log_lines,
                  "extra_files":  extra_files,
              }

          # Parallele Ausführung
          print(f"EVAL-Phase: {len(_sorted_candidates)} Kandidaten parallel (4 Worker)...")
          with ThreadPoolExecutor(max_workers=4) as _eval_ex:
              _eval_results = list(_eval_ex.map(_evaluate_one, _sorted_candidates))

          # Serielle Anwendung der Ergebnisse (kein Race)
          for _res in _eval_results:
              if _res is None:
                  continue
              for _line in _res["logs"]:
                  print(_line)

              _platform_res = _res.get("platform", "github")

              if _res["action"] == "reject":
                  rejected_repos.add(_res["repo"])
                  # Meta-Eintrag fuer TTL-Re-Try im naechsten Run.
                  rejected_meta[_res["repo"]] = {
                      "reason":      _res["reason"],
                      "rejected_at": now_day,
                  }
                  evaluation_log.append({"repo": _res["repo"], "result": "REJECTED",
                                         "reason": _res["reason"],
                                         "platform": _platform_res})
                  continue

              # APPROVE – Hauptdatei + alle Extra-Dateien aus demselben Repo
              full_name   = _res["repo_display"]
              reject_key  = _res["repo"]
              meta        = _res["meta"]
              best_file   = _res["best_file"]
              raw_url     = _res["raw_url"]
              ips         = _res["ips"]
              fp          = _res["fp"]
              overlap_pct = _res["overlap_pct"]
              stars       = _res["stars"]
              forks       = _res["forks"]
              rep_score   = _res["rep_score"]
              days_old    = _res["days_old"]
              file_days_old = _res["file_days_old"]
              extra_files = _res.get("extra_files", [])

              # Hilfsfunktion: einen Feed-Eintrag anlegen und in approved_feeds eintragen
              def _register_feed(f_url, f_path, f_ips, f_name_suffix="",
                                 metrics=None):
                  _name_base = full_name if _platform_res == "github" else f"gl_{_res['gl_path']}"
                  _base = re.sub(r'[^a-z0-9_]', '_', _name_base.lower().replace('/', '_'))
                  if f_name_suffix:
                      _base = f"{_base}_{f_name_suffix}"
                  _fname = _base
                  _sfx = 2
                  while (_fname in approved_feeds and
                         approved_feeds[_fname].get("repo") != reject_key):
                      _fname = f"{_base}_v{_sfx}"
                      _sfx += 1
                  _entry_fingerprint = _ip_fingerprint(f_ips)
                  _existing_clone = _existing_feed_for_fingerprint(_entry_fingerprint, _fname)
                  if _existing_clone:
                      print(f"  ⏭ {_fname}: identische IP-Liste bereits als "
                            f"{_existing_clone} registriert "
                            f"(Fingerprint {_entry_fingerprint}) – uebersprungen")
                      evaluation_log.append({
                          "repo": full_name,
                          "result": "REJECTED",
                          "feed_name": _fname,
                          "reason": f"Identischer Inhalt wie {_existing_clone}",
                          "platform": _platform_res,
                      })
                      return False
                  _is_new = _fname not in existing_feeds
                  _metrics = metrics or {}
                  _entry_overlap_pct = _metrics.get("overlap_pct", overlap_pct)
                  _entry_fp = _metrics.get("fp", fp)
                  _entry_file_days = _metrics.get("file_days_old", file_days_old)
                  _entry = {
                      "name":          _fname,
                      "url":           f_url,
                      "repo":          full_name,
                      "file":          f_path,
                      "platform":      _platform_res,
                      "added":         existing_feeds[_fname]["added"] if not _is_new and _fname in existing_feeds else now_day,
                      "last_checked":  now_day,
                      "ip_count":      len(f_ips),
                      "ip_fingerprint": _entry_fingerprint,
                      "overlap_pct":   round(_entry_overlap_pct * 100, 1),
                      "fp_rate":       round(_entry_fp * 100, 2),
                      "rep_score":     rep_score,
                      "stars":         stars,
                      "days_old":      days_old,
                      "file_days_old": _entry_file_days,
                      "search_sources": meta.get("sources", []),
                      "hq":            False,
                  }
                  if _platform_res == "gitlab":
                      _entry["gl_id"]            = _res["gl_id"]
                      _entry["gl_default_branch"] = _res["gl_branch"]
                  approved_feeds[_fname] = _entry
                  if _is_new:
                      all_new_ips.update(f_ips)
                  else:
                      all_known_ips.update(f_ips)
                  for _ip in f_ips:
                      ip_auto_feed_count[_ip] = ip_auto_feed_count.get(_ip, 0) + 1
                  evaluation_log.append({
                      "repo":        full_name,
                      "result":      "APPROVED",
                      "feed_name":   _fname,
                      "ips":         len(f_ips),
                      "new_feed":    _is_new,
                      "overlap_pct": round(_entry_overlap_pct * 100, 1),
                      "fp_rate":     round(_entry_fp * 100, 2),
                      "stars":       stars,
                      "platform":    _platform_res,
                  })
                  print(f"  ✅ ANGENOMMEN als '{_fname}' ({len(f_ips)} IPs, "
                        f"{'NEU' if _is_new else 'bekannt'}, {_platform_res.upper()})")
                  return True

              # Hauptdatei registrieren (kein Suffix – bleibt rückwärtskompatibel)
              _register_feed(raw_url, best_file["path"], ips)

              # Extra-Dateien registrieren mit Dateiname-Stem als Suffix
              for _ef in extra_files:
                  _stem = re.sub(r'[^a-z0-9_]', '_',
                                 _ef["file"].split("/")[-1].rsplit(".", 1)[0].lower())
                  _register_feed(
                      _ef["url"], _ef["file"], _ef["ips"],
                      f_name_suffix=_stem, metrics=_ef,
                  )

          # ── Schritt 6: seen_db aktualisieren ──────────────────────────────
          SOURCE_LABEL = "auto_feed_discovery"
          ingested_new  = 0
          ingested_seen = 0

          for ip in list(all_new_ips | all_known_ips):
              auto_count = ip_auto_feed_count.get(ip, 1)
              if ip in db:
                  try:
                      if not isinstance(db[ip], dict):
                          db[ip] = {
                              "first":             now_day,
                              "last":              "2000-01-01",
                              "hq":                False,
                              "feeds":             [SOURCE_LABEL],
                              "hq_feed_names":     [],
                              "hq_feeds":          0,
                              "today_count":       0,
                              "today_hq":          False,
                              "days_seen":         0,
                              "auto_today_count":  auto_count,
                          }
                          ingested_new += 1
                          continue
                      existing_f = set(db[ip].get("feeds", []))
                      if SOURCE_LABEL not in existing_f:
                          db[ip]["feeds"] = sorted(existing_f | {SOURCE_LABEL})
                      db[ip]["auto_today_count"] = auto_count
                      ingested_seen += 1
                  except Exception as _corrupt:
                      print(f"WARN: Korrupter seen_db-Eintrag {ip}: {_corrupt}", file=sys.stderr)
                      continue
              else:
                  db[ip] = {
                      "first":             now_day,
                      "last":              "2000-01-01",
                      "hq":                False,
                      "feeds":             [SOURCE_LABEL],
                      "hq_feed_names":     [],
                      "hq_feeds":          0,
                      "today_count":       0,
                      "today_hq":          False,
                      "days_seen":         0,
                      "auto_today_count":  auto_count,
                  }
                  ingested_new += 1

          # Expiry – identisch zu update_combined_blacklist.yml
          # FIX AUDIT-E-002 (2026-07-12): Vergleichs-Semantik exakt an den
          # Merged-Cleanup-Pass in update_combined_blacklist.yml angeglichen.
          # Vorher: datetime-Vergleich MIT Uhrzeit (last_seen < now-180d).
          # last/first stehen in der seen_db als reine Datumsstrings
          # (Mitternacht UTC); der Cutoff trug dagegen die Cron-Uhrzeit
          # (So 04:37/07:23/11:47 UTC). Effekt: eine IP mit last exakt
          # 180 Tage zurueck wurde HIER bereits am Tag 180 entfernt,
          # waehrend combined sie per String-'<' erst am Tag 181 entfernt
          # (2026-01-13 < 2026-01-13 ist False). Der woechentliche
          # auto_feed_discovery-Lauf loeschte solche IPs also bis zu ~24h
          # frueher als jeder combined-Lauf – gleiche Konstanten (der
          # EXPIRY_DAYS-Konsistenz-Check im workflow_health_checker sieht
          # nur die Zahlen), aber abweichende Grenzfall-Semantik.
          # Jetzt: identischer lexikographischer ISO-Datums-Vergleich wie
          # in combined (verlustfrei aequivalent zu geparsten Dates,
          # siehe FIX PERF-EXPIRY dort); strptime entfaellt komplett.
          EXPIRY_DAYS           = 180
          WATCHLIST_EXPIRY_DAYS = 30
          cutoff    = now - timedelta(days=EXPIRY_DAYS)
          cutoff_wl = now - timedelta(days=WATCHLIST_EXPIRY_DAYS)
          cutoff_str    = cutoff.strftime("%Y-%m-%d")
          cutoff_wl_str = cutoff_wl.strftime("%Y-%m-%d")
          to_expire = set()
          for ip in list(db.keys()):
              try:
                  entry      = db[ip]
                  last_str   = safe_get_date(entry, "last")
                  first_str  = safe_get_date(entry, "first", last_str)
                  if last_str == "2000-01-01":
                      if first_str < cutoff_wl_str:
                          to_expire.add(ip)
                  else:
                      if last_str < cutoff_str:
                          to_expire.add(ip)
              except Exception:
                  to_expire.add(ip)
          for ip in to_expire:
              db.pop(ip, None)

          print(f"\nseen_db: +{ingested_seen} bestätigt | +{ingested_new} neu eingetragen | "
                f"{len(to_expire)} abgelaufen | Gesamt: {len(db)} IPs")

          # ── Schritt 7: seen_db speichern ──────────────────────────────────
          write_json_atomic(DB_FILE, db, separators=(",", ":"))

          # ── Deduplizierung: identische URLs / gleiche Repo+Datei entfernen ──
          # Ursache: Discovery-Runs über mehrere Wochen können dasselbe Repo
          # mehrfach unter verschiedenen Namen aufnehmen (_v2, _v3 Suffixe).
          # Kriterien (Priorität):
          #   1. Gleiche URL → exakter Duplikat → älteren behalten (früheres "added")
          #   2. Gleiche (repo, file) → inhaltlich identisch → gleiche Logik
          # Bei Gleichstand: längerer Name ist der jüngere Duplikat → entfernen.
          _dedup_by_url  = {}   # url → feed_name des Originals
          _dedup_by_file = {}   # (repo, file) → feed_name des Originals
          _dedup_removed = []

          for _fn, _fd in list(approved_feeds.items()):
              _url  = _fd.get("url", "")
              _repo = _fd.get("repo", "")
              _file = _fd.get("file", "")
              _added = _fd.get("added", "9999-99-99")

              _dup_key_url  = _url
              _dup_key_file = (_repo, _file)

              _existing_url  = _dedup_by_url.get(_dup_key_url)
              _existing_file = _dedup_by_file.get(_dup_key_file) if _dup_key_file[1] else None
              _existing = _existing_url or _existing_file

              if _existing and _existing in approved_feeds:
                  _existing_added = approved_feeds[_existing].get("added", "9999-99-99")
                  # Älteren (früher hinzugefügten) behalten, jüngeren entfernen
                  if _added <= _existing_added:
                      # Aktueller Eintrag ist älter oder gleich → entfernen, Neueres behalten
                      del approved_feeds[_fn]
                      _dedup_removed.append(f"{_fn} (Duplikat von {_existing})")
                  else:
                      # Aktueller Eintrag ist neuer → Altes ersetzen
                      del approved_feeds[_existing]
                      _dedup_removed.append(f"{_existing} (Duplikat von {_fn})")
                      _dedup_by_url[_dup_key_url]  = _fn
                      if _dup_key_file[1]:
                          _dedup_by_file[_dup_key_file] = _fn
              else:
                  _dedup_by_url[_dup_key_url] = _fn
                  if _dup_key_file[1]:
                      _dedup_by_file[_dup_key_file] = _fn

          # Content-Dedup nach echtem Inhalt (Fingerprint der IP-Menge).
          # Ersetzt den alten (repo, ip_count)-Dedup, der schon bei zufaellig
          # gleicher IP-ZAHL verschiedene Dateien kollabierte (z.B. cbuijs
          # plain.black.ipcidr vs ip4cidr, beide 127.705 IPs aber anderer Inhalt)
          # und damit einen Loesch-/Wiederfind-Kreislauf ausloeste.
          # Jetzt werden nur Feeds mit BYTE-GENAU identischer IP-Menge
          # zusammengefasst (gleicher ip_fingerprint = SHA1 der sortierten IPs).
          # Unterschied auch nur in EINER IP → andere Fingerprints → beide bleiben.
          # Feeds ohne Fingerprint (0 IPs / Alt-Eintraege ohne Feld) werden
          # uebersprungen, damit sie nicht faelschlich zusammenfallen.
          # Der Loop-Schutz im Extra-Scan (oben) verhindert, dass ein hier
          # entfernter Duplikat im naechsten Lauf wieder aufgenommen wird.
          _seen_fp = {}   # ip_fingerprint → behaltener feed_name
          # Reihenfolge: aeltestes "added" zuerst (das bleibt erhalten); bei
          # gleichem Datum kuerzerer Name (Original ohne _v2-Suffix) zuerst.
          for _fn, _fd in sorted(
                  approved_feeds.items(),
                  key=lambda x: (x[1].get("added", "9999-99-99"), len(x[0]))):
              if _fn not in approved_feeds:
                  continue
              _fp = _fd.get("ip_fingerprint", "")
              if not _fp:
                  continue
              _orig = _seen_fp.get(_fp)
              if _orig and _orig in approved_feeds and _orig != _fn:
                  del approved_feeds[_fn]
                  _dedup_removed.append(
                      f"{_fn} (identische IP-Liste wie {_orig})")
              else:
                  _seen_fp[_fp] = _fn

          if _dedup_removed:
              print(f"\nDeduplizierung: {len(_dedup_removed)} Duplikat(e) entfernt:")
              for _d in _dedup_removed:
                  print(f"  🗑 {_d}")
          else:
              print("\nDeduplizierung: keine Duplikate gefunden")

          # ── Schritt 8: Report ──────────────────────────────────────────────
          new_approved = [e for e in evaluation_log if e["result"] == "APPROVED"]
          new_rejected = [e for e in evaluation_log if e["result"] == "REJECTED"]

          _gl_rejected = sum(1 for e in new_rejected if e.get("platform") == "gitlab")

          # NEU v4: Reject-Gruende aggregieren, damit erkennbar ist wo Kandidaten
          # verloren gehen. Gruppen leiten sich aus den reason-Strings in
          # _evaluate_one ab. Was nicht zuordenbar ist landet in "Sonstige".
          def _categorize_reason(reason):
              r = reason or ""
              if r.startswith("Zu alt:"):
                  return "Repo zu alt (>30d)"
              if r.startswith("IP-Datei"):
                  return "IP-Datei veraltet (>30d)"
              # FIX REASON-MISMATCH (2026-07-31): War exakter Vergleich
              # (r == "Keine IP-Datei"), matchte aber nie den tatsaechlichen
              # Grund "Keine IP-Datei (Name/Inhalt)" aus _evaluate_one
              # (Content-Sniff-Reject). Dadurch landete der haeufigste
              # Ablehnungsgrund im Report faelschlich unter "Sonstige" statt
              # hier aufzutauchen. startswith() matcht beide Varianten
              # (Alt-Cache-Eintraege "Keine IP-Datei" ohne Suffix UND die
              # aktuelle Variante mit Suffix).
              if r.startswith("Keine IP-Datei"):
                  return "Keine IP-Datei im Repo"
              if r == "Download-Fehler":
                  return "Download fehlgeschlagen"
              if r.startswith("Größe:"):
                  return f"Falsche Größe (<{MIN_FEED_IPS} / >{MAX_FEED_IPS:,} IPs)"
              if r.startswith("FP-Rate:"):
                  return "False-Positive-Rate zu hoch (>5%)"
              if r.startswith("Overlap zu gering:"):
                  return "Overlap mit HQ-Feeds zu gering (<20%)"
              if r.startswith("Klon-Verdacht:"):
                  return "Klon-Verdacht (Overlap >95%)"
              if r.startswith("Format:"):
                  return "Format-Qualität zu niedrig (<30% IP-Zeilen)"
              return "Sonstige"

          from collections import Counter as _Counter
          _reject_reasons = _Counter(_categorize_reason(e.get("reason", "")) for e in new_rejected)

          # Selektions-Diagnostik: wieviele der EVAL-Kandidaten waren bereits in
          # rejected_repos und wurden gar nicht erst getestet. _sorted_candidates
          # ist die finale Eval-Liste vor _evaluate_one. existing_repo_set
          # enthaelt Repos die bereits approved sind.
          _skipped_already_rejected = sum(
              1 for k, v in _sorted_candidates
              if k in existing_rejected
              or (v.get("platform") == "gitlab" and f"gitlab:{v.get('gl_path','')}" in existing_rejected)
          )
          _skipped_already_approved = sum(
              1 for k, v in _sorted_candidates if k in existing_repo_set
          )
          # Ein Repo kann mehrere Feed-Dateien erzeugen. Daher duerfen
          # APPROVED-Logeintraege nicht mit abgelehnten Repos addiert werden.
          # _eval_results enthaelt exakt ein Ergebnis je wirklich bewertetem Repo.
          _evaluated_repo_results = [r for r in _eval_results if r is not None]
          _actually_evaluated_repos = len(_evaluated_repo_results)
          _approved_repo_count = sum(
              1 for r in _evaluated_repo_results if r.get("action") == "approve"
          )
          _rejected_repo_count = sum(
              1 for r in _evaluated_repo_results if r.get("action") == "reject"
          )

          lines = []
          lines.append("# Auto Feed Discovery – Report")
          lines.append(f"**Aktualisiert:** {now_str}\n")
          lines.append("---")
          lines.append("## Zusammenfassung\n")
          lines.append("| Metrik | Wert |")
          lines.append("|---|---|")
          lines.append(f"| Kandidaten gesamt | **{len(candidate_repos)}** |")
          lines.append(f"| davon GitHub (Topics+Code) | **{sum(1 for v in candidate_repos.values() if v.get('platform','github')=='github')}** |")
          lines.append(f"| davon GitLab | **{_gitlab_unique}** |")
          lines.append(f"| davon Awesome-Lists | **{_awesome_found}** |")
          lines.append(f"| Tools/Libraries vor Eval gefiltert | **{_tool_filtered_count}** |")
          lines.append(f"| davon Hard-Reject (awesome-Liste etc.) | **{_hard_reject_count}** |")
          lines.append(f"| EVAL-Kandidaten (nach Stratifizierung) | **{len(_sorted_candidates)}** |")
          lines.append(f"| davon bereits rejected (übersprungen) | **{_skipped_already_rejected}** |")
          lines.append(f"| davon bereits approved (übersprungen) | **{_skipped_already_approved}** |")
          lines.append(f"| tatsächlich evaluierte Repositories | **{_actually_evaluated_repos}** |")
          lines.append(f"| davon angenommene Repositories | **{_approved_repo_count}** |")
          lines.append(f"| davon abgelehnte Repositories | **{_rejected_repo_count}** |")
          # Post-Dedup-Zähler: approved_feeds enthält den finalen Stand nach Deduplizierung.
          # evaluation_log-basierte Zähler würden Duplikate doppelt zählen.
          _post_dedup_new_feeds = [
              f for f in approved_feeds.values()
              if f.get("added") == now_day and f["name"] not in existing_feeds
          ]
          _post_dedup_new = len(_post_dedup_new_feeds)
          _post_dedup_refetch = sum(1 for f in approved_feeds.values()
                                    if f.get("last_checked") == now_day
                                    and f["name"] in existing_feeds)
          _gl_approved = sum(
              1 for f in _post_dedup_new_feeds if f.get("platform") == "gitlab"
          )
          _aw_approved = sum(
              1 for f in _post_dedup_new_feeds
              if any("awesome:" in s for s in f.get("search_sources", []))
          )
          lines.append(f"| Neu angenommene Feed-Dateien | **{_post_dedup_new}** |")
          lines.append(f"| davon aus GitLab | **{_gl_approved}** |")
          lines.append(f"| davon aus Awesome-Lists | **{_aw_approved}** |")
          lines.append(f"| Bestehende Feed-Dateien aktualisiert | **{_post_dedup_refetch}** |")
          lines.append(f"| Abgelehnte Repositories (dieser Run) | **{_rejected_repo_count}** |")
          lines.append(f"| davon GitLab abgelehnt | **{_gl_rejected}** |")
          lines.append(f"| Feeds gesamt (aktiv) | **{len(approved_feeds)}** |")
          lines.append(f"| IPs in seen_db bestätigt | **{ingested_seen}** |")
          lines.append(f"| Neue IPs eingetragen | **{ingested_new}** |")
          lines.append(f"| seen_db gesamt | **{len(db):,}** |")
          lines.append(f"| HQ-Referenz-IPs (6 Quellen) | **{len(hq_ref_ips)}** |")

          # Reject-Gruende-Tabelle (nur wenn was passiert ist)
          if _reject_reasons:
              lines.append("\n---")
              lines.append("## 📊 Reject-Gründe (dieser Run)\n")
              lines.append("| Grund | Anzahl |")
              lines.append("|---|---|")
              for _reason, _count in _reject_reasons.most_common():
                  lines.append(f"| {_reason} | **{_count}** |")

          if new_approved:
              lines.append("\n---")
              lines.append("## ✅ Angenommene Feeds\n")
              lines.append("| Feed | Repo | Plattform | IPs | Overlap | FP-Rate | Stars | Status |")
              lines.append("|---|---|---|---|---|---|---|---|")
              for e in new_approved:
                  status = "🆕 NEU" if e["new_feed"] else "🔄 Update"
                  _pl = e.get("platform", "github").upper()
                  _repo_url = (f"https://gitlab.com/{e['repo']}"
                               if _pl == "GITLAB"
                               else f"https://github.com/{e['repo']}")
                  lines.append(
                      f"| `{e['feed_name']}` | [{e['repo']}]({_repo_url}) | "
                      f"{_pl} | {e['ips']:,} | {e['overlap_pct']}% | "
                      f"{e['fp_rate']}% | {e['stars']} | {status} |"
                  )

          if new_rejected:
              lines.append("\n---")
              lines.append("## ❌ Abgelehnte Repos\n")
              lines.append("| Repo | Plattform | Grund |")
              lines.append("|---|---|---|")
              for e in new_rejected:
                  _pl = e.get("platform", "github").upper()
                  lines.append(f"| `{e['repo']}` | {_pl} | {e['reason']} |")

          if approved_feeds:
              lines.append("\n---")
              lines.append("## 📋 Alle aktiven Auto-Feeds\n")
              lines.append("| Feed | Plattform | IPs | Overlap | Stars | Hinzugefügt |")
              lines.append("|---|---|---|---|---|---|")
              for feed in sorted(approved_feeds.values(),
                                 key=lambda x: x.get("rep_score", 0), reverse=True):
                  _pl = feed.get("platform", "github").upper()
                  lines.append(
                      f"| `{feed['name']}` | {_pl} | {feed['ip_count']:,} | "
                      f"{feed['overlap_pct']}% | {feed.get('stars', 0)} | {feed['added']} |"
                  )

          lines.append(f"\n---\n*Generiert: {now_str}*")

          write_text_atomic("reports/auto_feed_discovery_report.md", "\n".join(lines))
          print("reports/auto_feed_discovery_report.md geschrieben")

          # ── Schritt 9: state/auto_discovered_feeds.json speichern ───────────────
          if len(candidate_repos) == 0 and len(existing_feeds) > 0:
              _msg = (f"GitHub/GitLab-Suche lieferte 0 Kandidaten – behalte bestehende "
                      f"state/auto_discovered_feeds.json ({len(existing_feeds)} Feeds)")
              print(f"::warning file=auto_feed_discovery.yml::{_msg}")
              print(f"WARNUNG: {_msg}")
              sys.exit(1)

          MIN_APPROVED_FEEDS = 10
          if len(approved_feeds) < MIN_APPROVED_FEEDS:
              _msg = (f"Nur {len(approved_feeds)} aktive Feeds (< {MIN_APPROVED_FEEDS}) – "
                      f"Discovery-Ausfall vermutet, behalte bestehende state/auto_discovered_feeds.json")
              print(f"::warning file=auto_feed_discovery.yml::{_msg}")
              print(f"WARNUNG: {_msg}")
              sys.exit(1)

          new_feeds_count = len(approved_feeds) - len(existing_feeds)

          # FIX REJECTED-CAP: rejected_repos-Set auf max. 3000 begrenzen.
          MAX_REJECTED = 3000
          if len(rejected_repos) > MAX_REJECTED:
              this_run_rejected = {e["repo"] for e in evaluation_log if e["result"] == "REJECTED"}
              relevant_rejected = (rejected_repos & set(candidate_repos.keys())) | this_run_rejected | set(KNOWN_REPOS)
              trimmed = len(rejected_repos) - len(relevant_rejected)
              rejected_repos = relevant_rejected
              # Meta-Dict konsistent halten - nur Eintraege fuer noch aktive Rejects behalten
              rejected_meta = {k: v for k, v in rejected_meta.items() if k in rejected_repos}
              print(f"rejected_repos getrimmt: {trimmed} veraltete Einträge entfernt, "
                    f"{len(rejected_repos)} behalten (MAX_REJECTED={MAX_REJECTED})")

          output = {
              "updated":             now_str,
              "total_feeds":         len(approved_feeds),
              "new_this_run":        new_feeds_count,
              "rejected_repos":      sorted(rejected_repos),
              "rejected_repos_meta": rejected_meta,
              "content_sniff_state_version": CONTENT_SNIFF_STATE_VERSION,
              "feeds":               list(approved_feeds.values()),
          }
          write_json_atomic(AUTO_FILE, output, indent=2, ensure_ascii=False)

          EOF

      - name: Save seen_db Cache
        if: always() && steps.idempotency.outputs.already_ran != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: seen_db.json
          key: netshield-seen-db-afd-save-${{ github.run_id }}

      - name: Commit
        if: always() && steps.idempotency.outputs.already_ran != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # FIX STATE-SUBDIR-NOLOSS: alte Root-Version NUR entfernen, wenn die
          # neue state/-Version existiert. Sonst – wenn der Discovery-Guard
          # (Schritt 9) per sys.exit(1) abbricht, BEVOR state/auto_discovered_feeds.json
          # geschrieben wurde – wuerde die Root-Datei geloescht OHNE Ersatz und
          # die Feed-Liste waere aus dem Arbeitsbaum weg (nur ueber Git-History
          # rekonstruierbar). Kopplung an Existenz schliesst genau dieses Loch.
          if [ -e state/auto_discovered_feeds.json ]; then
            git rm -q --ignore-unmatch auto_discovered_feeds.json 2>/dev/null || true
          fi
          # FIX SUBDIR-MIGRATION: alte Root-Version entfernen, sobald dieser
          # Workflow die neue reports///logs/-Version committet (atomar im
          # selben Commit). Idempotent: --ignore-unmatch nach 1. Lauf.
          git rm -q --ignore-unmatch auto_feed_discovery_report.md 2>/dev/null || true
          # FIX MISSING-STATE-GUARD: Nur existierende Dateien stagen. Wenn der
          # Discovery-Guard (Schritt 9, sys.exit(1) bei < MIN_APPROVED_FEEDS)
          # zuschlaegt, wird state/auto_discovered_feeds.json bewusst NICHT
          # geschrieben. Solange unter state/ noch keine committete Version liegt
          # (SUBDIR-Migration nicht abgeschlossen), bricht ein unbedingtes
          # 'git add state/...' mit exit 128 ab ("pathspec did not match") und
          # verhindert genau das vom if:always() beabsichtigte Committen des
          # Ausfall-Reports. Existenz-Check loest das; 'git diff --staged
          # --quiet' unten faengt den "nichts zu committen"-Fall sauber ab.
          for _f in state/auto_discovered_feeds.json reports/auto_feed_discovery_report.md; do
            [ -e "$_f" ] && git add "$_f"
          done
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Auto Feed Discovery: $(date -u '+%Y-%m-%d %H:%M') UTC"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs state/auto_discovered_feeds.json \
                  reports/auto_feed_discovery_report.md 2>/dev/null || true
                git add state/auto_discovered_feeds.json \
                  reports/auto_feed_discovery_report.md 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi
