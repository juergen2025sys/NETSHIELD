          # Root-Cause-Befund: Bei sort=updated dominieren dieselben, staendig
          # aktiven Top-100-Repos jede Woche das Ergebnis - neue/weniger
          # aktive Repos mit demselben Topic (Platz 101+) wurden NIE erreicht,
