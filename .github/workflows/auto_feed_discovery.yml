          #   1. Skip wenn bereits genug Kandidaten vorhanden (>300)
          #   2. MAX_WAIT_SECONDS für Code-Search = 0 → sofortiger Skip bei 429,
          #      kein langes Warten das den Timeout auffrisst
          #   3. Circuit-Breaker auf 2 statt 5 reduziert – beim ersten Doppel-429
          #      sofort abbrechen statt 5× 65s zu warten
          #   4. Nur 1 Worker statt 2 – verhindert parallele 429-Bursts
          CODE_SEARCH_CANDIDATE_THRESHOLD = 300
          import threading as _threading
          _cs_skip_lock = _threading.Lock()
