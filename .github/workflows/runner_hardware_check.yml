name: Runner Hardware Check

# Zweck: Liest die Hardware-Ausstattung des GitHub-Actions-Runners aus
# (CPU, RAM, Disk, Netzwerk) und fuehrt ein paar einfache Benchmarks durch,
# um die tatsaechliche Leistung zu pruefen (nicht nur die Spezifikation).
# Nuetzlich um zu verifizieren, welchen Runner-Typ man tatsaechlich bekommt
# (z.B. Standard 2-Core vs. groesserer Runner) und ob die Performance
# zwischen Laeufen schwankt.

on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: "Benchmarks (CPU/Disk-Speed) zusaetzlich zur reinen Hardware-Auslistung ausfuehren"
        type: boolean
        default: true
  # Optional: woechentlich zur Kontrolle, ob GitHub die Runner-Specs still
  # und leise geaendert hat. Bei Bedarf entfernen oder anpassen.
  schedule:
    - cron: '0 6 * * 1'   # montags 06:00 UTC

permissions:
  contents: read

jobs:
  hardware-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: System- und OS-Info
        run: |
          {
            echo "## System / OS"
            echo '```'
            echo "Hostname: $(hostname)"
            echo "Kernel:   $(uname -srmo)"
            cat /etc/os-release 2>/dev/null | grep -E '^(NAME|VERSION)='
            echo "Uptime:   $(uptime -p 2>/dev/null || uptime)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: CPU-Info
        run: |
          {
            echo "## CPU"
            echo '```'
            echo "Logische Cores (nproc): $(nproc)"
            if command -v lscpu >/dev/null 2>&1; then
              lscpu
            else
              cat /proc/cpuinfo | grep -E 'model name|cpu cores|siblings' | sort -u
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: RAM-Info
        run: |
          {
            echo "## Arbeitsspeicher"
            echo '```'
            free -h
            echo
            echo "Details aus /proc/meminfo:"
            grep -E 'MemTotal|MemFree|MemAvailable|SwapTotal' /proc/meminfo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Disk-Info
        run: |
          {
            echo "## Festplatte / Speicherplatz"
            echo '```'
            df -h
            echo
            echo "Block-Devices:"
            lsblk 2>/dev/null || echo "lsblk nicht verfuegbar"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Netzwerk-Info
        run: |
          {
            echo "## Netzwerk"
            echo '```'
            echo "Interfaces:"
            ip -brief address 2>/dev/null || ifconfig 2>/dev/null || echo "kein ip/ifconfig verfuegbar"
            echo
            echo "Oeffentliche IP (falls erreichbar):"
            curl -s --max-time 5 https://api.ipify.org || echo "nicht ermittelbar"
            echo
            echo "DNS-Resolver:"
            cat /etc/resolv.conf 2>/dev/null | grep -v '^#' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: GPU-Check (falls vorhanden)
        run: |
          {
            echo "## GPU"
            echo '```'
            if command -v lspci >/dev/null 2>&1; then
              lspci | grep -iE 'vga|3d|display' || echo "Keine GPU ueber lspci gefunden"
            else
              echo "lspci nicht verfuegbar"
            fi
            if command -v nvidia-smi >/dev/null 2>&1; then
              nvidia-smi
            else
              echo "nvidia-smi nicht verfuegbar - kein NVIDIA-GPU-Runner"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: CPU-Benchmark (openssl speed)
        if: ${{ inputs.run_benchmarks != false }}
        run: |
          {
            echo "## CPU-Benchmark (openssl speed, SHA256, 3s)"
            echo '```'
            openssl speed -seconds 3 sha256 2>&1 | tail -n 5
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Disk-I/O-Benchmark (dd, sequenziell)
        if: ${{ inputs.run_benchmarks != false }}
        run: |
          {
            echo "## Disk-Benchmark (dd, 512MB sequenzieller Schreibtest)"
            echo '```'
            dd if=/dev/zero of=/tmp/benchmark_testfile bs=1M count=512 conv=fdatasync 2>&1
            rm -f /tmp/benchmark_testfile
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Netzwerk-Speed-Benchmark (Download eines Testfiles)
        if: ${{ inputs.run_benchmarks != false }}
        run: |
          {
            echo "## Netzwerk-Benchmark (Download-Test, ~10MB)"
            echo '```'
            # 10MB Testdatei von einem oeffentlich erreichbaren, in den
            # erlaubten Domains liegenden Host laden und Transferrate messen.
            curl -s -w "\nDownload-Groesse: %{size_download} Bytes\nZeit gesamt: %{time_total}s\nDurchschnitt: %{speed_download} Bytes/s\n" \
              -o /dev/null \
              "https://raw.githubusercontent.com/git/git/master/README.md" \
              || echo "Download fehlgeschlagen (Netzwerk/Domain-Restriction?)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Zusammenfassung
        if: always()
        run: |
          echo "Hardware-Check abgeschlossen. Alle Ergebnisse stehen im Job Summary oben." \
            | tee -a "$GITHUB_STEP_SUMMARY"
