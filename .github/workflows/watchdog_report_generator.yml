name: Watchdog Report Generator

# ══════════════════════════════════════════════════════════════════
# Zweck:
# Sicherstellen, dass netshield_report_generator.yml tatsaechlich zu
# seinem geplanten stuendlichen Cron-Slot (x:30 UTC) laeuft - auch wenn
# GitHub Actions den Schedule-Trigger ueberspringt (bekanntes Verhalten
# bei hoher Last).
#
# WARUM DIESER WATCHDOG (2026-08-29):
# Der Report Generator ist kein Endpunkt, sondern ein VERTEILER. An ihm
# haengen drei nachgelagerte Workflows:
#     netshield_report_generator.yml
#        |- gh workflow run update_bot_detector.yml   (Proxy-Feeds)
#        |- gh workflow run honeypot_monitor.yml
#        '- honigtopf.yml  (per workflow_run, completed)
# Faellt der Generator aus, fallen alle drei mit aus. Von aussen bekommt
# er bisher nur EINEN verlaesslichen Trigger, naemlich aus
# update_confidence_blacklist.yml - und die laeuft nach
# '47 1,4,7,10,13,16,19,22 * * *', also nur alle drei Stunden. Damit
# standen 8 verlaessliche Laeufe pro Tag gegenueber 24 geplanten; der
# Rest hing allein am GitHub-Scheduler.
# Fuer honigtopf.yml gab es bereits einen Watchdog, fuer den Generator
# nicht - obwohl er weiter oben in der Kette steht.
#
# SLOT-DECKUNG (Lehre aus FIX WD-SLOT-DECKUNG in watchdog_honigtopf):
# Der Slot-Waechter rundet die aktuelle Zeit auf den letzten erwarteten
# Slot ab und prueft dessen Alter gegen SLOT_GRACE_MINUTES. Damit ein
# Slot ueberhaupt erzwungen werden KANN, muss mindestens eine Pruefung
# spaeter als (Slot + Grace) und frueher als der naechste Slot liegen.
# Beim Honigtopf-Watchdog war das lange nicht der Fall - zwei von drei
# Slots wurden nie durchgesetzt.
# Hier: Generator-Slot ist x:30, Grace 15 Minuten. Die Pruefung um :48
# liegt 18 Minuten nach dem Slot und damit sicher darueber. Die zweite
# Pruefung um :18 dient als Nachfassen fuer den Slot der VORSTUNDE
# (dann greift die Max-Age-Ebene) und faengt den Fall ab, dass der
# :48-Lauf selbst geschluckt wird.
#
# Zwei Sicherheitsebenen, analog watchdog_honigtopf:
#   1) SLOT-WAECHTER: Wurde der letzte erwartete x:30-Slot bedient?
#   2) MAX-AGE: Liegt der letzte erfolgreiche Lauf laenger zurueck als
#      MAX_AGE_MINUTES? Faengt auch mehrere geschluckte Slots in Folge ab.
# Zusaetzlich: haengende Ghost-Runs (queued/in_progress laenger als
# STUCK_ACTIVE_THRESHOLD_MINUTES) blockieren den Trigger nicht.
# ══════════════════════════════════════════════════════════════════

on:
  schedule:
    # :18 und :48 - versetzt gegen watchdog_combined ('*/15' = :00/:15/:30/:45)
    # und gegen watchdog_honigtopf (:17/:37/:57), damit die Watchdogs nicht
    # gleichzeitig starten.
    - cron: '18,48 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: write    # noetig fuer 'gh workflow run'

concurrency:
  group: watchdog-report-generator
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ZIEL_WORKFLOW: netshield_report_generator.yml
      SLOT_MINUTE: 30              # Cron des Ziels: '30 * * * *'
      SLOT_GRACE_MINUTES: 15       # Puffer, bevor ein Slot als verpasst gilt
      MAX_AGE_MINUTES: 100         # zweite Ebene: absoluter Maximalabstand
      STUCK_ACTIVE_THRESHOLD_MINUTES: 60

    steps:
      - name: Slot pruefen und ggf. nachtriggern
        run: |
          set -e
          set -o pipefail

          # ── 0. Retry-Helper fuer gh-API-Calls ──────────────────────────
          # Faengt transiente gh-API-Aussetzer (z.B. einmaliger HTTP 401) ab,
          # die sonst unter 'set -e' den ganzen Watchdog abbrechen wuerden.
          RETRY_MAX=3
          gh_retry() {
            local attempt=1
            local backoff=5
            local out=""
            local rc=0
            while [ "$attempt" -le "$RETRY_MAX" ]; do
              out=$("$@" 2>/tmp/gh_retry_err) && rc=0 || rc=$?
              if [ "$rc" -eq 0 ]; then
                printf '%s' "$out"
                return 0
              fi
              if [ "$attempt" -eq "$RETRY_MAX" ]; then
                echo "gh_retry: Endgueltig fehlgeschlagen nach ${attempt} Versuchen (exit=${rc})" >&2
                cat /tmp/gh_retry_err >&2
                return "$rc"
              fi
              echo "gh_retry: Versuch ${attempt} fehlgeschlagen (exit=${rc}), neuer Versuch in ${backoff}s" >&2
              sleep "$backoff"
              attempt=$((attempt + 1))
              backoff=$((backoff * 2))
            done
          }

          # ── 1. Letzten erfolgreichen Lauf holen ────────────────────────
          letzter=$(gh_retry gh run list \
            --repo "${{ github.repository }}" \
            --workflow "$ZIEL_WORKFLOW" \
            --status success \
            --limit 1 \
            --json startedAt,updatedAt \
            --jq '.[0] // empty')

          if [ -z "$letzter" ]; then
            echo "Kein erfolgreicher Lauf von $ZIEL_WORKFLOW gefunden - triggere vorsorglich"
            gh_retry gh workflow run "$ZIEL_WORKFLOW" \
              --repo "${{ github.repository }}" --ref main
            echo "Triggered."
            exit 0
          fi

          last_started=$(echo "$letzter" | jq -r '.startedAt')
          last_updated=$(echo "$letzter" | jq -r '.updatedAt')
          echo "Letzter erfolgreicher Report-Generator-Lauf: gestartet $last_started, beendet $last_updated"

          # ── 2. Erwarteten Slot bestimmen ───────────────────────────────
          # Ziel-Cron ist '30 * * * *'. Der letzte erwartete Slot ist x:30
          # der aktuellen Stunde, sofern die aktuelle Minute >= 30 ist -
          # sonst x:30 der VORSTUNDE. Dieser Stundenwechsel-Sonderfall ist
          # hier noetig (anders als beim 20-Minuten-Raster des Honigtopfs,
          # wo 60 glatt teilbar ist).
          now_epoch=$(date -u +%s)
          current_min=$(date -u +%M)
          current_min=$((10#$current_min))   # fuehrende Null entfernen (Oktal-Falle)

          if [ "$current_min" -ge "$SLOT_MINUTE" ]; then
            slot_iso=$(date -u +%Y-%m-%dT%H:$(printf "%02d" "$SLOT_MINUTE"):00Z)
          else
            slot_iso=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:$(printf "%02d" "$SLOT_MINUTE"):00Z)
          fi
          slot_epoch=$(date -u -d "$slot_iso" +%s)
          slot_age_min=$(( (now_epoch - slot_epoch) / 60 ))
          echo "Letzter erwarteter Slot: $slot_iso (vor ${slot_age_min} min)"

          last_started_epoch=$(date -u -d "$last_started" +%s)
          last_updated_epoch=$(date -u -d "$last_updated" +%s)
          stale_min=$(( (now_epoch - last_updated_epoch) / 60 ))

          slot_served=false
          if [ "$last_started_epoch" -ge "$slot_epoch" ] || [ "$last_updated_epoch" -ge "$slot_epoch" ]; then
            slot_served=true
          fi

          # ── 3. Haengende Ghost-Runs beruecksichtigen ───────────────────
          # Ein Lauf, der laenger als STUCK_ACTIVE_THRESHOLD_MINUTES in
          # queued/in_progress haengt, darf den Trigger NICHT blockieren -
          # sonst wartet der Watchdog auf einen Lauf, der nie fertig wird.
          active_json=$(gh_retry gh run list \
            --repo "${{ github.repository }}" \
            --workflow "$ZIEL_WORKFLOW" \
            --limit 20 \
            --json databaseId,status,createdAt \
            --jq '[.[] | select(.status=="in_progress" or .status=="queued")]')
          active=$(echo "$active_json" | jq 'length')
          blockiert=false
          if [ "$active" -gt 0 ]; then
            oldest_created=$(echo "$active_json" | jq -r 'sort_by(.createdAt) | .[0].createdAt')
            oldest_epoch=$(date -u -d "$oldest_created" +%s)
            oldest_age=$(( (now_epoch - oldest_epoch) / 60 ))
            if [ "$oldest_age" -lt "$STUCK_ACTIVE_THRESHOLD_MINUTES" ]; then
              blockiert=true
              echo "$active Lauf/Laeufe aktiv (aeltester seit ${oldest_age}min) - kein Eingriff noetig"
            else
              echo "$active Lauf/Laeufe aktiv, aeltester haengt seit ${oldest_age}min " \
                   "(Schwelle ${STUCK_ACTIVE_THRESHOLD_MINUTES}min) - wird als Ghost gewertet, Trigger nicht blockiert"
            fi
          fi

          # ── 4. Entscheidung ────────────────────────────────────────────
          should_trigger=false
          reason=""
          if [ "$blockiert" = "false" ]; then
            if [ "$slot_served" = "false" ] && [ "$slot_age_min" -ge "$SLOT_GRACE_MINUTES" ]; then
              should_trigger=true
              reason="Slot $slot_iso seit ${slot_age_min}min nicht bedient (Grace: ${SLOT_GRACE_MINUTES}min)"
            elif [ "$stale_min" -ge "$MAX_AGE_MINUTES" ]; then
              should_trigger=true
              reason="Max-Age: letzter erfolgreicher Lauf vor ${stale_min}min (Schwelle ${MAX_AGE_MINUTES}min)"
            elif [ "$slot_served" = "true" ]; then
              echo "Slot $slot_iso wurde bedient - kein Eingriff"
            else
              echo "Slot $slot_iso seit ${slot_age_min}min nicht bedient - noch innerhalb Grace (${SLOT_GRACE_MINUTES}min), warte ab"
            fi
          fi

          # ── 5. Trigger durchfuehren ────────────────────────────────────
          if [ "$should_trigger" = "true" ]; then
            echo "Trigger-Grund: $reason"
            echo "Triggere $ZIEL_WORKFLOW via workflow_dispatch"
            gh_retry gh workflow run "$ZIEL_WORKFLOW" \
              --repo "${{ github.repository }}" --ref main
            echo "Triggered. Die nachgelagerte Kette (Bot-Detector, Honeypot Monitor, Honigtopf) laeuft dadurch mit."
          fi
