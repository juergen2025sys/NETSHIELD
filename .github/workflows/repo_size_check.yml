name: Repo Groesse pruefen

# ============================================================================
# Fragt die aktuelle Repo-Groesse ueber die GitHub-API ab (Feld "size" im
# GET /repos/{owner}/{repo}-Endpunkt, in KB) und schreibt sie in einen
# kurzen Report. Keine Schwellenwerte, keine Warnungen, keine Automatik -
# nur die reine Zahl zum Nachschauen.
#
# Nur per manuellem Trigger (workflow_dispatch) ausfuehrbar - laeuft nicht
# von selbst im Hintergrund.
# ============================================================================

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: netshield-seen-db-writers
  cancel-in-progress: false
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Repo-Groesse abfragen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 << 'EOF'
          import json, os, sys, urllib.request, urllib.error
          sys.path.insert(0, "scripts")
          from netshield_common import write_text_atomic
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          GH_TOKEN = os.environ.get("GH_TOKEN", "").strip()
          REPO = os.environ.get("GITHUB_REPOSITORY", "").strip()
          REPORT_FILE = "reports/repo_size_report.md"
          now_str = (
              datetime.now(timezone.utc)
              .astimezone(ZoneInfo("Europe/Berlin"))
              .strftime("%Y-%m-%d %H:%M %Z") + " (Europe/Berlin)"
          )

          if not REPO:
              print("::error::GITHUB_REPOSITORY nicht gesetzt.")
              sys.exit(1)

          req = urllib.request.Request(
              f"https://api.github.com/repos/{REPO}",
              headers={
                  "Authorization": f"Bearer {GH_TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"::error::GitHub-API-Fehler: HTTP {e.code}")
              sys.exit(1)
          except Exception as e:
              print(f"::error::Abfrage fehlgeschlagen: {e}")
              sys.exit(1)

          size_kb = data.get("size")
          if size_kb is None:
              print("::error::API-Antwort enthaelt kein 'size'-Feld.")
              sys.exit(1)

          # ── Leerungsschutz ────────────────────────────────────────────
          # FIX HEALTH-CHECK (2026-08-08): ein echtes Git-Repo mit dieser
          # Historie/diesen Datenmengen ist niemals nur wenige KB gross -
          # ein verdaechtig kleiner Wert deutet eher auf eine fehlerhafte/
          # unvollstaendige API-Antwort hin (z.B. GitHub liefert 0 waehrend
          # einer internen Neuberechnung) als auf eine echte Grössenaenderung.
          # Lieber keinen Report schreiben als einen irrefuehrenden.
          MIN_SIZE_KB = 100
          if size_kb < MIN_SIZE_KB:
              print(f"::warning::Verdaechtig kleine Groesse ({size_kb} KB < {MIN_SIZE_KB} KB) - "
                    f"vermutlich unvollstaendige API-Antwort. Report wird NICHT geschrieben.")
              sys.exit(0)

          size_mb = size_kb / 1024
          size_gb = size_kb / 1024 / 1024

          print(f"Repo-Groesse: {size_kb:,} KB = {size_mb:,.1f} MB = {size_gb:.2f} GB")

          os.makedirs("reports", exist_ok=True)
          write_text_atomic(REPORT_FILE, (
              "# Repo Groesse\n\n"
              f"Stand: {now_str}\n\n"
              f"**{size_gb:.2f} GB** ({size_mb:,.1f} MB / {size_kb:,} KB)\n\n"
              "Quelle: GitHub-API `GET /repos/{owner}/{repo}` (Feld \"size\"). "
              "Manuell per workflow_dispatch abgefragt.\n"
          ))
          print(f"\nReport geschrieben: {REPORT_FILE}")
          EOF

      - name: Commit and Push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/repo_size_report.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Repo Groesse geprueft: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            for attempt in 1 2 3 4 5; do
              echo "Push-Versuch $attempt..."
              git fetch origin ${GITHUB_REF_NAME}
              git stash --include-untracked 2>/dev/null || true
              if git rebase -X theirs origin/${GITHUB_REF_NAME}; then
                git stash pop 2>/dev/null || true
                if git push origin HEAD:${GITHUB_REF_NAME}; then
                  echo "Push erfolgreich (Versuch $attempt)"
                  exit 0
                fi
              else
                git stash pop 2>/dev/null || true
                git checkout --theirs reports/repo_size_report.md 2>/dev/null || true
                git add reports/repo_size_report.md 2>/dev/null || true
                GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --skip
              fi
              sleep $((attempt * 3))
            done
            echo "FEHLER: Push nach 5 Versuchen fehlgeschlagen"
            exit 1
          fi
